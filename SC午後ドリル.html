// ===== 出題ロジック =====
let quiz = null; // {list, idx, results[], mode, themeId, label}

function pickQuestions(mode, themeId){
  if(mode==="theme"){
    const qs = QUESTIONS.filter(q=>q.theme===themeId);
    // 未解答 → 前回誤答 → 正答率の低い順 に並べ、上位10問をシャッフル
    const rank = q=>{ const s=qStat(q.id); if(s.a===0) return 0; if(s.last===0) return 1; return 2 + s.c/s.a; };
    return shuffle(qs.sort((x,y)=>rank(x)-rank(y)).slice(0,10));
  }
  if(mode==="weak"){
    const wrong = QUESTIONS.filter(q=>{ const s=qStat(q.id); return s.a>0 && (s.last===0 || s.c/s.a<0.6); });
    if(wrong.length===0) return null;
    return shuffle(wrong).slice(0,10);
  }
  // random: テーマの頻出ウェイトで抽選(重複なし)
  const pool=[]; THEMES.forEach(t=>{ QUESTIONS.filter(q=>q.theme===t.id).forEach(q=>{ for(let i=0;i<t.weight;i++) pool.push(q.id); }); });
  const chosen=new Set();
  while(chosen.size<10 && chosen.size<QUESTIONS.length){ chosen.add(pool[Math.floor(Math.random()*pool.length)]); }
  return shuffle([...chosen].map(id=>byId[id]));
}

// 誤答選択肢の差替え(正解は c[0] 固定なので 1〜3 を置換)
(function applyChoiceFix(){
  const targets = [...QUESTIONS, ...[...CASES, ...CASES_FULL].flatMap(c=>c.questions)];
  targets.forEach(q=>{
    const fix = (typeof CHOICE_FIX!=="undefined") && CHOICE_FIX[q.id];
    if(fix && q.a===0 && fix.length===3){ q.c = [q.c[0], ...fix]; }
  });
})();
const ALL_CASES = CASES.concat(CASES_FULL);
const caseById = {}; ALL_CASES.forEach(c=>{ caseById[c.id]=c; c.questions.forEach(q=>byId[q.id]=q); });
const writtenById = {}; WRITTEN_CASES.forEach(c=>{ writtenById[c.id]=c; c.questions.forEach(q=>byId[q.id]=q); });
let timerHandle = null;
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+"分"+String(s).padStart(2,"0")+"秒"; }
function startTimer(){
  stopTimer();
  const el = $("timer");
  el.style.display = "inline-block";
  const tick = ()=>{
    const sec = Math.floor((Date.now()-quiz.startedAt)/1000);
    el.textContent = "経過 " + fmtTime(sec) + " / 目安 " + quiz.minutes + "分";
    el.classList.toggle("over", sec > quiz.minutes*60);
  };
  tick(); timerHandle = setInterval(tick, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } const t=$("timer"); if(t) t.style.display="none"; }

function startCase(caseId){
  const c = caseById[caseId];
  quiz = { list: c.questions, idx:0, results:[], mode:"case", caseId,
           label:(c.long?"本番形式:":"読解:")+c.title, passage:c.body, passageTitle:c.title,
           minutes:c.minutes, long:!!c.long, startedAt:Date.now() };
  renderQuestion();
  show("view-quiz");
  startTimer();
}
function startWritten(caseId){
  const c = writtenById[caseId];
  quiz = { list:c.questions, idx:0, results:[], mode:"written", caseId,
           label:"記述式:"+c.title, passage:c.body, passageTitle:c.title,
           minutes:c.minutes, long:true, written:true, startedAt:Date.now() };
  renderQuestion();
  show("view-quiz");
  startTimer();
}
function startQuiz(mode, themeId){
  const list = pickQuestions(mode, themeId);
  if(!list){ showNotice("弱点として記録された問題がまだありません。まずはテーマ別かランダムで演習しましょう。"); return; }
  const label = mode==="theme"? themeById[themeId].name : mode==="weak"? "弱点復習" : "ランダム10問";
  quiz = { list, idx:0, results:[], mode, themeId, label, startedAt:Date.now() };
  renderQuestion();
  show("view-quiz");
  stopTimer();
}

function renderQuestion(){
  const q = quiz.list[quiz.idx];
  const pb = $("passage-box");
  if(quiz.passage){
    pb.style.display = "block";
    $("passage-title").textContent = "事例:" + quiz.passageTitle;
    if($("passage-body").dataset.caseId !== quiz.caseId){
      $("passage-body").innerHTML = quiz.passage;
      $("passage-body").dataset.caseId = quiz.caseId;
      pb.open = true;
    }
  }else{
    pb.style.display = "none";
    $("passage-body").dataset.caseId = "";
  }
  $("q-theme").textContent = themeById[q.theme].name;
  $("q-counter").textContent = `${quiz.idx+1} / ${quiz.list.length} 問`;
  $("q-no").textContent = `設問 ${quiz.idx+1}`;
  $("q-text").textContent = q.q;
  const dots = $("q-dots"); dots.innerHTML="";
  quiz.list.forEach((_,i)=>{
    const d=document.createElement("span");
    d.className = "dot" + (i===quiz.idx? " now" : i<quiz.results.length? (quiz.results[i].ok? " ok":" ng") : "");
    dots.appendChild(d);
  });
  $("btn-next").style.display = quiz.written? "none" : "";
  if(quiz.written){ renderWritten(q); return; }
  $("written-box").style.display="none";
  $("q-choices").style.display="flex";
  const marks=["ア","イ","ウ","エ"];
  const order = shuffle([0,1,2,3]);
  const box = $("q-choices"); box.innerHTML="";
  order.forEach((ci,i)=>{
    const b=document.createElement("button");
    b.className="choice"; b.type="button"; b.dataset.ci=ci;
    b.innerHTML=`<span class="mark">${marks[i]}</span><span>${q.c[ci]}</span>`;
    b.onclick=()=>answer(ci,b);
    box.appendChild(b);
  });
  $("grade-mark").innerHTML="";
  $("grade-mark").classList.remove("draw");
  $("q-expl").classList.remove("show");
  $("btn-next").disabled = true;
  $("btn-next").textContent = quiz.idx===quiz.list.length-1? "採点結果へ" : "次の問題へ";
}

function renderWritten(q){
  $("q-choices").style.display="none";
  const wb = $("written-box");
  wb.style.display="block";
  const limitLabel = q.limit>0 ? `${q.limit}字以内` : "字数制限なし";
  wb.innerHTML = `
    <label class="w-label" for="w-input">解答欄(${limitLabel})</label>
    <textarea id="w-input" class="w-input" rows="4" placeholder="本文中の根拠を踏まえて解答を記述してください"></textarea>
    <div class="w-meta"><span id="w-count">0 字</span>
      <button type="button" class="link-btn" id="w-hint-btn">ヒントを見る</button></div>
    <div id="w-hint" class="w-hint" style="display:none">${q.hint||""}</div>
    <button type="button" class="btn w-reveal" id="w-reveal">解答を確定して模範解答を見る</button>
    <div id="w-model" class="w-model" style="display:none"></div>`;
  const ta = $("w-input"), cnt = $("w-count");
  ta.addEventListener("input", ()=>{
    const n = ta.value.replace(/\s/g,"").length;
    cnt.textContent = n + " 字";
    cnt.classList.toggle("over", q.limit>0 && n>q.limit);
  });
  $("w-hint-btn").onclick = ()=>{ const h=$("w-hint"); h.style.display = h.style.display==="none"?"block":"none"; };
  $("w-reveal").onclick = ()=>revealWritten(q);
  setTimeout(()=>ta.focus(),50);
}

function revealWritten(q){
  const ta = $("w-input");
  const answerText = ta.value.trim();
  ta.readOnly = true;
  $("w-reveal").style.display = "none";
  const box = $("w-model");
  box.style.display = "block";
  box.innerHTML = `
    <div class="w-sec"><div class="w-sec-t">模範解答</div><div class="w-model-a">${q.model}</div></div>
    <div class="w-sec"><div class="w-sec-t">採点観点(満たせた項目にチェック)</div>
      <div id="w-points">${q.points.map((p,i)=>
        `<label class="w-point"><input type="checkbox" data-i="${i}"><span>${p}</span></label>`).join("")}</div></div>
    <button type="button" class="btn" id="w-grade">自己採点を確定して次へ</button>`;
  $("w-grade").onclick = ()=>gradeWritten(q, answerText);
}

function gradeWritten(q, answerText){
  const boxes = [...document.querySelectorAll("#w-points input")];
  const checked = boxes.filter(b=>b.checked).length;
  const ratio = boxes.length? checked/boxes.length : 0;
  const ok = ratio >= 0.6;
  quiz.results.push({id:q.id, ok, ratio, checked, total:boxes.length, answerText});
  const s = qStat(q.id);
  DATA.q[q.id] = { a:s.a+1, c:s.c+(ok?1:0), last: ok?1:0, at: Date.now() };
  if(!DATA.days.includes(today())) DATA.days.push(today());
  saveData();
  nextQuestion();
}

function answer(ci, btn){
  const q = quiz.list[quiz.idx];
  const ok = ci === q.a;
  document.querySelectorAll("#q-choices .choice").forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.ci)===q.a) b.classList.add(ok && b===btn ? "sel-correct" : "reveal-correct");
  });
  if(!ok) btn.classList.add("sel-wrong");
  // 朱色の採点マーク
  const gm=$("grade-mark");
  gm.innerHTML = ok
    ? `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 A38 38 0 1 1 49.9 12"/></svg>`
    : `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M22 22 L78 78 M78 22 L22 78"/></svg>`;
  gm.classList.add("draw");
  // 解説
  $("q-verdict").textContent = ok? "正解 ○" : "不正解 ✕";
  $("q-verdict").className = "verdict " + (ok? "ok":"ng");
  $("q-expl-body").textContent = q.e;
  $("q-src").textContent = q.s? "出題傾向:"+q.s : "";
  $("q-expl").classList.add("show");
  $("btn-next").disabled=false;
  // 記録
  quiz.results.push({id:q.id, ok});
  const s = qStat(q.id);
  DATA.q[q.id] = { a:s.a+1, c:s.c+(ok?1:0), last: ok?1:0, at: Date.now() };
  if(!DATA.days.includes(today())) DATA.days.push(today());
  saveData();
  $("btn-next").focus();
}

function nextQuestion(){
  if(quiz.idx < quiz.list.length-1){ quiz.idx++; renderQuestion(); }
  else finishQuiz();
}
function quitQuiz(){
  stopTimer();
  if(quiz.results.length>0) recordSession();
  goHome();
}
function recordSession(){
  DATA.sessions.push({ date: today(), label: quiz.label,
    score: quiz.results.filter(r=>r.ok).length, total: quiz.results.length });
  if(DATA.sessions.length>200) DATA.sessions = DATA.sessions.slice(-200);
  saveData();
}
function finishQuiz(){
  stopTimer();
  recordSession();
  const score = quiz.results.filter(r=>r.ok).length, total = quiz.results.length;
  $("r-score").textContent = score; $("r-total").textContent = total;
  const pct = score/total*100;
  $("r-msg").textContent = quiz.long ? (pct>=60? "本番であれば合格ラインです。誤答の設問は本文の根拠箇所を確認しておきましょう。" : "本文の根拠箇所と解説を照合し、日を空けて同じ事例を解き直すと伸びます。") :
    quiz.mode==="case" && pct<100 ? "本文の該当箇所と解説を照らし合わせて読み直すと定着します。" :
    pct===100? "全問正解。この調子で次のテーマへ。" :
    pct>=60? "合格ライン(60%)クリア。誤答の解説を読み直しておきましょう。" :
    "合格ラインまであと少し。弱点復習モードで反復しましょう。";
  const elapsed = Math.floor((Date.now()-quiz.startedAt)/1000);
  let detail = `モード:${quiz.label} ｜ 所要 ${fmtTime(elapsed)}`;
  if(quiz.minutes) detail += `(目安 ${quiz.minutes}分)`;
  detail += ` ｜ 通算学習日数 ${DATA.days.length}日`;
  $("r-detail").textContent = detail;
  const pl = $("r-passline");
  if(quiz.long){
    pl.style.display="block";
    pl.innerHTML = `<div class="pl-bar"><div class="pl-fill ${pct>=60?"pass":"fail"}" style="width:${pct}%"></div><div class="pl-mark"></div></div>
      <div class="pl-note">得点率 ${Math.round(pct)}%${pct>=60? " — 合格ライン(60%)到達" : " — 合格ラインまであと "+Math.ceil(0.6*total-score)+"問"}</div>`;
  }else{ pl.style.display="none"; }
  if(quiz.written){
    const wr2 = $("r-wrong");
    wr2.innerHTML = `<h3>解答の振り返り</h3>` + quiz.results.map((r,i)=>{
      const q = byId[r.id];
      return `<div class="wrong-item" style="border-left-color:${r.ok?"var(--ok)":"var(--shu)"}">
        <div class="qq">設問${i+1}(観点 ${r.checked}/${r.total})</div>
        <div style="margin:4px 0"><span style="color:var(--ink-soft)">自分の解答:</span> ${r.answerText? r.answerText.replace(/</g,"&lt;") : "(未記入)"}</div>
        <div class="aa">模範解答: ${q.model}</div></div>`;
    }).join("");
    show("view-result");
    return;
  }
  const wrong = quiz.results.filter(r=>!r.ok);
  const wr = $("r-wrong");
  wr.innerHTML = wrong.length? `<h3>誤答の振り返り</h3>` + wrong.map(r=>{
    const q=byId[r.id];
    return `<div class="wrong-item"><div class="qq">${q.q}</div><div class="aa">正解:${q.c[q.a]}</div></div>`;
  }).join("") : "";
  show("view-result");
}
function retrySame(){
  if(quiz.mode==="written") startWritten(quiz.caseId);
  else if(quiz.mode==="case") startCase(quiz.caseId);
  else startQuiz(quiz.mode, quiz.themeId);
}

let resetArmed = false;
async function resetData(){
  const btn = document.querySelector(".danger-zone .link-btn");
  if(!resetArmed){ resetArmed = true; btn.textContent = "本当に削除する(もう一度押すと確定)"; btn.style.color = "var(--shu)";
    setTimeout(()=>{ resetArmed=false; btn.textContent="成績データをリセット"; btn.style.color=""; }, 4000); return; }
  resetArmed = false;
  DATA = { q:{}, sessions:[], days:[] };
  try{ await store.del(); }catch(e){}
  btn.textContent = "成績データをリセット"; btn.style.color="";
  renderHome();
}
function showNotice(msg){
  let n = document.getElementById("notice");
  if(!n){ n = document.createElement("div"); n.id="notice";
    n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:.8rem;max-width:90%;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.25)";
    document.body.appendChild(n); }
  n.textContent = msg; n.style.display="block";
  clearTimeout(n._t); n._t = setTimeout(()=>{ n.style.display="none"; }, 3500);
}

// ===== 起動 =====
window.addEventListener("error", (e)=>{
  const el = document.getElementById("boot-error");
  if(el){ el.style.display="block"; el.textContent = "エラーが発生しました: " + (e.message || e.error); }
});
(async ()=>{
  try{
    await loadData(); renderHome();
    if(store.name === "memory") showNotice("このブラウザでは成績を保存できないため、今回の結果は画面を閉じると消えます。");
  }catch(err){
    const el = document.getElementById("boot-error");
    if(el){ el.style.display="block"; el.textContent = "起動に失敗しました: " + err.message; }
  }
})();

</script>
</body>
