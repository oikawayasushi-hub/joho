    "httpsの部分はファイル名を表している。",
    "www.example.co.jpは通信の暗号化方式を表している。",
    "URLのすべての部分は自由に省略しても必ず同じページが表示される。"],
 a:0,
 e:"URLは「スキーム://ドメイン名/パス」の構造。co.jpは日本の企業を表す属性型ドメインの例。httpsなら通信がTLSで暗号化される。フィッシング対策としてドメイン名を正しく読み取る力も重要。"},
{id:"n22", f:"network", t:"クライアントサーバ方式", d:2,
 q:"クライアントサーバ方式に関する説明として最も適当なものを選べ。",
 c:["サービスを提供するサーバと、サービスを要求して利用するクライアントに役割を分けてやり取りする方式である。",
    "すべてのコンピュータが対等な立場で直接データを交換する方式である。",
    "サーバとは人間の管理者のことを指す。",
    "クライアントサーバ方式では、サーバは1台のクライアントとしか通信できない。"],
 a:0,
 e:"Webの閲覧は、ブラウザ（クライアント）がWebサーバに要求（リクエスト）を送り、サーバが応答（レスポンス）を返す典型的なクライアントサーバ方式。対等な端末どうしが直接やり取りする方式はピアツーピア（P2P）方式という。"},
{id:"n23", f:"network", t:"クラウドサービス", d:2,
 q:"クラウドサービスに関する説明として最も適当なものを選べ。",
 c:["データやソフトウェアを事業者のサーバ上に置き、インターネット経由で利用する形態で、複数端末からのアクセスや共同編集がしやすい。",
    "クラウドとは、自分のパソコンの中だけにデータを保存する方式である。",
    "クラウドに保存したデータは、事業者の障害や規約変更の影響を一切受けない。",
    "クラウドサービスの利用にインターネット接続は不要である。"],
 a:0,
 e:"クラウドはネットワーク越しに計算資源やストレージを利用する形態。どこからでもアクセスできる利便性の一方、障害・情報漏えい・サービス終了などのリスクもあり、重要データのバックアップやパスワード管理が利用の前提となる。"},
{id:"n24", f:"network", t:"通信速度の計算", d:3,
 q:"通信速度 100 Mbps の回線で、500 MB のファイルをダウンロードするのに理論上かかる時間として最も近いものを選べ。（1バイト＝8ビットとし、その他の遅延は考えない）",
 c:["5秒","40秒","80秒","400秒"],
 a:1,
 e:"500MB = 500 × 8 = 4000Mビット。4000 ÷ 100 = 40秒。通信速度の単位bps（ビット/秒）とファイルサイズの単位B（バイト）の換算（×8）を忘れるのが最頻出のミス。「5秒」はまさに換算忘れの答え。"},
{id:"n25", f:"network", t:"転送データ量の計算", d:3,
 q:"20 Mbps の通信速度で10秒間データを送り続けたとき、送れるデータ量として正しいものを選べ。",
 c:["25 MB","200 MB","2.5 MB","1600 MB"],
 a:0,
 e:"20Mbps × 10秒 = 200Mビット。バイトに直すと 200 ÷ 8 = 25MB。bps→バイトの変換は「÷8」。実際の通信では制御情報や再送により理論値より遅くなる（転送効率）ことも問われる。"},
{id:"n26", f:"network", t:"bpsの意味", d:1,
 q:"通信速度の単位「bps」の意味として正しいものを選べ。",
 c:["1秒間に転送できるビット数","1秒間に転送できるバイト数","1分間に転送できる文字数","通信ケーブルの長さ"],
 a:0,
 e:"bpsはbits per second（ビット毎秒）。1Mbpsなら1秒間に100万ビット。バイトではなくビットである点が重要で、データ量の計算では8で割ってバイトに直す必要がある。"},
{id:"n27", f:"network", t:"デジタル署名", d:3,
 q:"デジタル署名によって確認できることの組合せとして最も適当なものを選べ。",
 c:["送信者が本人であること（なりすましでないこと）と、内容が途中で改ざんされていないこと。",
    "通信の速度と、データの圧縮率。",
    "受信者の氏名と住所。",
    "送信したデータが必ず相手に届くこと。"],
 a:0,
 e:"デジタル署名は、送信者が自分の秘密鍵で署名し、受信者が送信者の公開鍵で検証する仕組み。本人性（署名できるのは秘密鍵を持つ本人だけ）と完全性（改ざんされていないこと）を確認できる。暗号化（機密性）とは目的が異なる点に注意。"},
{id:"n28", f:"network", t:"電子証明書と認証局", d:3,
 q:"認証局（CA）の役割として最も適当なものを選べ。",
 c:["公開鍵がその組織・サイトのものであることを電子証明書によって保証する第三者機関である。",
    "インターネットの通信速度を認定する機関である。",
    "Webサイトのデザインの品質を審査する機関である。",
    "パスワードを一括して保管・配布する機関である。"],
 a:0,
 e:"公開鍵暗号では「その公開鍵は本当に本物か」が問題になる。信頼できる第三者である認証局が電子証明書を発行して公開鍵の正当性を保証する。ブラウザの鍵マークはサーバ証明書の検証に成功したことを示している。"},
{id:"n29", f:"network", t:"共通鍵の数", d:3,
 q:"共通鍵暗号方式で、10人がそれぞれ他の9人全員と互いに秘密の通信をしたい。相手ごとに異なる鍵を使うとき、必要な鍵の総数として正しいものを選べ。",
 c:["10個","45個","90個","100個"],
 a:1,
 e:"必要な鍵はペアの数だけあるので 10 × 9 ÷ 2 = 45個（組合せ nC2 = n(n−1)/2）。人数が増えると鍵の数が急増するのが共通鍵方式の弱点で、公開鍵方式なら各自が鍵ペアを持つだけで済む（10人なら20個）。"},
{id:"n30", f:"network", t:"HTTPSの仕組み", d:2,
 q:"WebサイトのURLが「https://」で始まりブラウザに鍵マークが表示されているとき、保証されることとして最も適当なものを選べ。",
 c:["ブラウザとサーバの間の通信が暗号化されており、途中での盗聴や改ざんが困難であること。",
    "そのサイトに書かれている情報の内容がすべて真実であること。",
    "そのサイトで買い物をしても絶対に詐欺に遭わないこと。",
    "そのサイトの運営者が優良企業であると国が認定したこと。"],
 a:0,
 e:"HTTPSは通信経路の暗号化（TLS）を意味し、盗聴・改ざん・なりすましサーバ対策になる。ただし「通信が安全」であって「内容が真実」「運営者が善良」の保証ではない。フィッシングサイトもhttpsを使うことがあるため、鍵マークだけで安心してはいけない。"},
{id:"n31", f:"network", t:"VPN", d:3,
 q:"VPN（Virtual Private Network）の説明として最も適当なものを選べ。",
 c:["公衆のネットワーク上に暗号化された仮想的な専用回線を作り、安全に通信する技術である。",
    "通信速度を必ず2倍にする技術である。",
    "コンピュータウイルスを自動的に駆除する技術である。",
    "物理的な専用ケーブルを各家庭に敷設するサービスである。"],
 a:0,
 e:"VPNはインターネットなどの共用ネットワーク上に、暗号化により仮想的な専用線（トンネル)を構築する技術。テレワークで社内ネットワークに安全に接続する用途や、公衆Wi-Fi利用時の保護などに使われる。"},
{id:"n32", f:"network", t:"データベースの構造", d:1,
 q:"関係データベースの構造に関する説明として最も適当なものを選べ。",
 c:["データを行（レコード）と列（フィールド）からなる表（テーブル）の形で管理する。",
    "データをすべて1つの長い文章として保存する。",
    "データを画像として撮影して保存する。",
    "表どうしを関連付けることはできない。"],
 a:0,
 e:"関係データベース（リレーショナルデータベース）は表形式でデータを管理し、複数の表を共通の項目で関連付け（結合）できる。行がレコード（1件分のデータ）、列がフィールド（項目）という用語の対応も確実に。"},
{id:"n33", f:"network", t:"データベースの操作", d:3,
 q:"関係データベースの操作のうち、「条件に合う行だけを取り出す操作」と「特定の列だけを取り出す操作」の名称の組合せとして正しいものを選べ。",
 c:["行の取り出し＝選択、列の取り出し＝射影","行の取り出し＝射影、列の取り出し＝選択","行の取り出し＝結合、列の取り出し＝選択","行の取り出し＝選択、列の取り出し＝結合"],
 a:0,
 e:"選択（selection）＝条件に合う行を取り出す、射影（projection）＝必要な列を取り出す、結合（join）＝複数の表を共通項目でつなぐ。3つの基本操作の区別は定番の出題ポイント。"},
{id:"n34", f:"network", t:"排他制御", d:3,
 q:"座席予約システムで、同じ座席を2人が同時に予約しようとしたときに二重予約を防ぐ仕組みとして最も適当なものを選べ。",
 c:["一方の処理中はデータをロックし、他方の処理を待たせる排他制御を行う。",
    "先に画面を開いた人を優先し、特に何の制御も行わない。",
    "二重予約が起きてから、あとで手作業で修正すればよい。",
    "予約データを2つ作成して両方の客に販売する。"],
 a:0,
 e:"複数の利用者が同じデータを同時に更新すると矛盾が生じるため、処理中はデータをロックして他の処理を待たせる排他制御が必要。銀行口座やチケット販売など、実際のシステムに不可欠な仕組みとして文脈問題で出題される。"},
{id:"n35", f:"network", t:"CSV形式", d:1,
 q:"CSV形式のファイルに関する説明として最も適当なものを選べ。",
 c:["データをカンマで区切って並べた形式で、表計算ソフトやデータベースなど異なるソフト間でのデータ交換によく使われる。",
    "画像を保存するための形式である。",
    "音声を圧縮して保存するための形式である。",
    "特定の1つのソフトでしか開けない形式である。"],
 a:0,
 e:"CSV（Comma-Separated Values）は「値をカンマで区切る」シンプルなテキスト形式。構造が単純でソフトを問わず扱えるため、オープンデータの公開やデータ分析の入力形式として広く使われる。"},
{id:"n36", f:"network", t:"データクレンジング", d:2,
 q:"収集したアンケートデータに「東京都」「東京」「tokyo」という表記が混在していた。分析前に行うべき処理として最も適当なものを選べ。",
 c:["同じ意味の表記を統一する（表記ゆれの解消）などのデータクレンジングを行う。",
    "表記が多様なほうが情報量が多いので、そのまま集計する。",
    "3種類の表記をそれぞれ別の都市として集計する。",
    "データをすべて削除して分析を中止する。"],
 a:0,
 e:"表記ゆれ・重複・入力ミス・欠損などを整える前処理をデータクレンジングという。前処理をせずに集計すると「東京」が3つの別カテゴリに分かれて誤った結果になる。実際の分析では前処理が作業時間の大半を占めるともいわれる。"},
{id:"n37", f:"network", t:"質的データと量的データ", d:2,
 q:"質的データと量的データの分類として正しいものを選べ。",
 c:["血液型や好きな教科は質的データ、身長やテストの得点は量的データである。",
    "血液型は量的データ、身長は質的データである。",
    "数字で表されたデータはすべて量的データである（例：出席番号）。",
    "質的データは平均値を計算するのに適している。"],
 a:0,
 e:"質的データはカテゴリを表すデータ（血液型・性別・好きな教科）、量的データは数量を表すデータ（身長・得点・気温）。出席番号や電話番号は数字でも大小や演算に意味がないため質的データ。データの種類によって適切なグラフや統計量が変わる。"},
{id:"n38", f:"network", t:"尺度水準", d:3,
 q:"データの尺度に関する説明として最も適当なものを選べ。",
 c:["温度（℃）は目盛りの間隔に意味がある間隔尺度、身長は0が「無い」を意味し比率にも意味がある比例尺度である。",
    "アンケートの「満足・やや満足・不満」は比例尺度である。",
    "血液型は順序尺度である。",
    "名義尺度のデータでは平均値を計算するのが最も適切である。"],
 a:0,
 e:"尺度は4種類：名義尺度（血液型：分類のみ）、順序尺度（満足度：順序に意味）、間隔尺度（摂氏温度：間隔に意味、0は任意）、比例尺度（身長・重さ：0が原点で比率に意味）。尺度によって使える統計処理（平均・比率など）が異なる。"},
{id:"n39", f:"network", t:"ヒストグラム", d:2,
 q:"ヒストグラムに関する説明として最も適当なものを選べ。",
 c:["量的データをいくつかの階級に分け、各階級の度数を柱の面積（高さ）で表した図で、分布の形（山の位置や偏り）を把握できる。",
    "2つの変数の関係を点の散らばりで表した図である。",
    "データの時間的な変化を線で結んで表した図である。",
    "全体に占める割合を扇形で表した図である。"],
 a:0,
 e:"ヒストグラムは度数分布表をグラフ化したもので、分布の形（単峰か二峰か、左右の偏り、外れ値）を視覚的に捉えられる。散布図（2変数の関係）、折れ線（推移）、円グラフ（割合）との使い分けを整理しよう。"},
{id:"n40", f:"network", t:"代表値の性質", d:2,
 q:"平均値・中央値・最頻値に関する説明として最も適当なものを選べ。",
 c:["平均値は外れ値の影響を受けやすく、中央値は外れ値の影響を受けにくい。",
    "中央値は外れ値の影響を最も受けやすい代表値である。",
    "平均値・中央値・最頻値は、どんなデータでも必ず同じ値になる。",
    "最頻値は量的データにしか使えない。"],
 a:0,
 e:"平均値はすべての値を使うため極端な値に引っ張られる。中央値は順位の真ん中なので外れ値に頑健。最頻値は最も多く現れる値で質的データにも使える。分布が偏っているときにどの代表値が適切かを問う問題が頻出。"},
{id:"n41", f:"network", t:"代表値の選択", d:3,
 q:"ある集団の年収データには、一部の極端に高い値が含まれている。この集団の「典型的な年収」を示す代表値として最も適当なものを選べ。",
 c:["中央値","平均値","最大値","合計値"],
 a:0,
 e:"年収のように右に裾を引く分布では、少数の高額所得者に平均値が引っ張られて実感より高くなる。順位の真ん中である中央値のほうが「典型的な値」を表しやすい。実際、日本の世帯所得は平均値より中央値のほうがかなり低い。"},
{id:"n42", f:"network", t:"標準偏差", d:2,
 q:"標準偏差に関する説明として最も適当なものを選べ。",
 c:["データが平均値のまわりにどれくらい散らばっているかを表す指標で、値が大きいほど散らばりが大きい。",
    "データの最大値と最小値の差のことである。",
    "データの中で最も多く出現する値のことである。",
    "標準偏差が大きいほど、データは平均値の近くに集中している。"],
 a:0,
 e:"標準偏差は散らばり（ばらつき）の指標。平均が同じ2クラスでも、標準偏差が大きいクラスは得点がばらつき、小さいクラスは平均付近に集中している。最大値−最小値は「範囲」、最も多い値は「最頻値」。"},
{id:"n43", f:"network", t:"四分位数", d:2,
 q:"四分位数に関する説明として最も適当なものを選べ。",
 c:["データを小さい順に並べて4等分する位置の値で、第2四分位数は中央値と一致する。",
    "第1四分位数はデータの最小値のことである。",
    "第3四分位数はデータ全体の平均値である。",
    "四分位範囲は最大値から最小値を引いた値である。"],
 a:0,
 e:"第1四分位数（Q1）は下から25%、第2四分位数（Q2）＝中央値、第3四分位数（Q3）は75%の位置の値。四分位範囲IQR = Q3 − Q1は中央の50%の広がりを表し、外れ値の影響を受けにくい散らばりの指標。箱ひげ図の箱がこの範囲。"},
{id:"n44", f:"network", t:"箱ひげ図の比較", d:3,
 q:"A組とB組の小テストの箱ひげ図を比べたところ、中央値は同じだが、A組の箱（四分位範囲）はB組より明らかに長かった。この読み取りとして最も適当なものを選べ。",
 c:["中央値付近の水準は同程度だが、A組のほうが得点の散らばりが大きい。",
    "A組のほうが全員の得点が高い。",
    "B組のほうが得点の散らばりが大きい。",
    "A組とB組の得点分布は完全に同じである。"],
 a:0,
 e:"箱の長さ＝四分位範囲は中央の50%の散らばりを表す。中央値が同じで箱が長いA組は、得点がより広く散らばっている。複数の箱ひげ図を並べて分布を比較させる問題は、本試験・模試を通じて最頻出の題材の一つ。"},
{id:"n45", f:"network", t:"クロス集計", d:3,
 q:"アンケートで「学年（1年・2年）」×「賛否（賛成・反対）」のクロス集計表を作った。1年は賛成60人・反対40人、2年は賛成30人・反対20人だった。この読み取りとして最も適当なものを選べ。",
 c:["賛成の割合は1年60%、2年60%で、学年による賛否の傾向の違いは見られない。",
    "賛成者数は1年のほうが多いので、1年のほうが賛成の割合も高い。",
    "2年は人数が少ないので、集計から除外すべきである。",
    "この表からは割合を計算することはできない。"],
 a:0,
 e:"1年の賛成割合は60/100 = 60%、2年は30/50 = 60%で同じ。人数（実数）の比較と割合の比較を区別することがクロス集計読み取りの最重要ポイント。母数が違う集団は割合に直して比べる。"},
{id:"n46", f:"network", t:"疑似相関", d:2,
 q:"「アイスクリームの売上が多い日は水難事故も多い」という相関が見られた。この解釈として最も適当なものを選べ。",
 c:["気温という第3の要因が両方に影響している可能性が高く、アイスクリームが事故の原因とはいえない。",
    "アイスクリームを食べると水難事故に遭いやすくなることが証明された。",
    "水難事故が増えるとアイスクリームが売れるようになる因果関係がある。",
    "相関があるのだから、アイスクリームの販売を規制すれば事故は減る。"],
 a:0,
 e:"暑い日はアイスも売れ、泳ぐ人も増えて事故も増える。「気温」という共通の要因（交絡因子）による見かけの相関を疑似相関という。「相関≠因果」の代表例として、ほぼすべての模試・参考書で扱われる最重要概念。"},
{id:"n47", f:"network", t:"時系列データ", d:3,
 q:"日ごとの気温データのように時間の順に記録されたデータの変化の傾向を、細かい変動をならして見やすくする方法として最も適当なものを選べ。",
 c:["移動平均（連続する数日分の平均を順にとる）を計算してグラフにする。",
    "データを大きい順に並べ替えてから折れ線グラフにする。",
    "日付をすべて削除して集計する。",
    "円グラフにして割合を見る。"],
 a:0,
 e:"移動平均は「直近n日間の平均」を毎日計算してつなぐ手法で、日々の細かい変動をならして長期的な傾向を見やすくする。時系列データを大きさ順に並べ替えると時間の情報が失われる点にも注意。"},
{id:"n48", f:"network", t:"誤解を招くグラフ", d:2,
 q:"縦軸が90から100の範囲だけを表示した棒グラフで、95と97の差が非常に大きく見えた。この読み取りの注意点として最も適当なものを選べ。",
 c:["縦軸の一部だけを表示すると差が誇張されて見えるため、軸の目盛りや原点を確認して実際の差を判断する。",
    "グラフで大きく見える差は、実際にも必ず大きな差である。",
    "棒グラフの見た目の印象がすべてであり、軸の数値は確認しなくてよい。",
    "縦軸を省略したグラフを作ることは法律で禁止されている。"],
 a:0,
 e:"軸の省略・3D表現・目盛り間隔の操作などで、グラフは実際以上の差があるような印象を与えられる。グラフを読むときは必ず軸の範囲と目盛りを確認する。広告や報道のグラフを批判的に読む力もデータリテラシーの一部。"},
{id:"n49", f:"network", t:"標本調査", d:2,
 q:"全校生徒1000人の意識を調べるために100人を選んで調査したい。標本の選び方として最も適当なものを選べ。",
 c:["全校生徒から無作為（ランダム）に100人を選ぶ。",
    "調査がしやすい自分のクラスの友人100人を選ぶ。",
    "図書室にいた読書好きの生徒100人を選ぶ。",
    "回答したい人だけがSNSで自由に回答する形式にする。"],
 a:0,
 e:"標本が母集団の縮図になるよう無作為抽出するのが原則。友人・特定の場所・自発的回答者に偏った標本では、結果が母集団の傾向からずれる（標本の偏り・選択バイアス）。調査結果を見るときも「誰にどう聞いたか」の確認が重要。"},
{id:"n50", f:"network", t:"アンケート設計", d:2,
 q:"アンケートの質問文として最も適当なものを選べ。",
 c:["「学校の昼休みの長さについてどう思いますか」と中立的に尋ねる。",
    "「昼休みが短すぎて困っている人が多いですが、あなたも延長に賛成ですよね？」と尋ねる。",
    "「常識のある人なら賛成するはずの昼休み延長に、あなたは賛成ですか」と尋ねる。",
    "1つの質問文の中で「昼休みの長さと部活動と宿題の量」についてまとめて尋ねる。"],
 a:0,
 e:"回答を特定の方向に誘導する質問（誘導質問）や、複数の論点を1問に詰め込む質問（ダブルバーレル質問）は正確なデータを得られない。中立的で1問1論点の質問文が原則。データの質は収集段階で決まる。"},
{id:"n51", f:"network", t:"全数調査と標本調査", d:2,
 q:"全数調査と標本調査に関する説明として最も適当なものを選べ。",
 c:["国勢調査のように全員を調べるのが全数調査、視聴率調査のように一部を調べて全体を推定するのが標本調査である。",
    "視聴率は全世帯のテレビをすべて調べた全数調査である。",
    "標本調査の結果は、標本の選び方によらず常に母集団と完全に一致する。",
    "全数調査は標本調査より常に手軽で低コストである。"],
 a:0,
 e:"全数調査は正確だが費用・時間が膨大（国勢調査は5年に1度）。標本調査は一部から全体を推定する方法で、無作為抽出が前提。標本調査には誤差が伴うが、適切に設計すれば実用上十分な精度が得られる。"},
{id:"n52", f:"network", t:"オープンデータ", d:1,
 q:"オープンデータに関する説明として最も適当なものを選べ。",
 c:["国や自治体などが公開する、誰でも利用・再配布できるデータのことで、アプリ開発や地域課題の分析などに活用されている。",
    "特定の企業の社員だけが閲覧できる社外秘データのことである。",
    "有料で購入しなければ利用できないデータのことである。",
    "個人のスマートフォンの中にある写真データのことである。"],
 a:0,
 e:"オープンデータは機械判読しやすい形式（CSVなど）で公開され、二次利用が認められたデータ。人口統計・気象・防災・交通などのデータが公開されており、探究活動のデータソースとしても有用。"},
{id:"n53", f:"network", t:"テキストマイニング", d:2,
 q:"アンケートの自由記述回答を分析する「テキストマイニング」の説明として最も適当なものを選べ。",
 c:["文章を単語に分割して出現頻度や単語どうしの関係を分析し、大量のテキストから傾向や特徴を見つけ出す手法。",
    "文章をすべて手作業で書き写す作業のこと。",
    "文章を暗号化して読めなくする技術のこと。",
    "画像から鉱物を発見する技術のこと。"],
 a:0,
 e:"テキストマイニングでは、頻出語の集計やワードクラウドによる可視化、共起（一緒に使われる語）の分析などを行う。数値化しにくい自由記述から傾向を引き出せる。探究活動やレビュー分析の文脈で出題される。"},
{id:"n54", f:"network", t:"散布図の読み取り", d:2,
 q:"散布図で、点が全体として右下がりに直線的に分布しているとき、相関係数の値として最も適当なものを選べ。",
 c:["−0.8","0.8","0","1.2"],
 a:0,
 e:"右下がり＝負の相関なので相関係数は負。直線的にはっきり分布していれば絶対値は大きく、−0.8程度が妥当。相関係数は−1から1の範囲しかとらないため1.2はあり得ない。散布図の形と相関係数の対応は毎年のように問われる。"},
{id:"n55", f:"network", t:"回帰直線による予測", d:2,
 q:"回帰直線「y = 2x + 10」が得られた。x = 15 のときの y の予測値として正しいものを選べ。",
 c:["40","32","25","300"],
 a:0,
 e:"y = 2 × 15 + 10 = 40。回帰直線は散布図の傾向を直線で近似したもので、xからyを予測できる。ただし予測はデータの範囲内での傾向に基づくものであり、範囲外への外挿や因果関係の断定には注意が必要。"},
{id:"n56", f:"network", t:"欠損値の扱い", d:3,
 q:"アンケートデータの一部の項目が未回答（欠損値）だった場合の扱いとして最も適当なものを選べ。",
 c:["欠損のある行を除外する、他の値から補完するなどの方針を決め、どう処理したかを分析結果とともに明記する。",
    "欠損値には気づかなかったことにして、そのまま計算する。",
    "欠損値はすべて0として集計すれば、必ず正しい結果になる。",
    "欠損が1つでもあれば、調査全体が無効になるので必ず全データを破棄する。"],
 a:0,
 e:"欠損値を0として扱うと平均などが大きく歪む。除外か補完かは目的とデータの性質から判断し、処理方法を明記して分析の再現性・透明性を保つ。欠損の扱いを問う問題は共通テスト系のデータ分析問題で頻出。"},
{id:"n57", f:"network", t:"中央値の計算", d:2,
 q:"データ [2, 3, 5, 7, 100] の中央値として正しいものを選べ。",
 c:["5","23.4","7","3"],
 a:0,
 e:"小さい順に並べた真ん中（5個中3番目）は5。ちなみに平均値は117÷5 = 23.4で、外れ値100に大きく引っ張られている。中央値と平均値の違いを実感できる典型例。データの個数が偶数のときは中央2つの平均をとる。"},
{id:"n58", f:"network", t:"IPアドレスの表記", d:2,
 q:"IPv4アドレスの表記として正しいものを選べ。",
 c:["192.168.1.1","192.168.1.256","300.168.1.1","192.168.1"],
 a:0,
 e:"IPv4は32ビットを8ビットずつ4つに区切り、それぞれを0〜255の10進数で表しピリオドでつなぐ。8ビットの最大値は255なので、256や300を含む表記はあり得ない。4組そろっていない表記も誤り。"},
{id:"n59", f:"network", t:"情報システム", d:1,
 q:"コンビニエンスストアのPOSシステムに関する説明として最も適当なものを選べ。",
 c:["商品が売れた時点で「何が・いつ・いくつ売れたか」を記録し、そのデータを在庫管理や品ぞろえの改善に活用する仕組みである。",
    "商品の値段を自動的に毎日2倍にするシステムである。",
    "レジの現金を数えるためだけのシステムで、データは一切記録されない。",
    "POSシステムのデータは収集されるだけで、経営には活用されない。"],
 a:0,
 e:"POS（販売時点情報管理）システムは、販売データを収集・分析して発注・在庫管理・商品開発に生かす情報システムの代表例。天気や時間帯と売上の関係分析など、データ活用の文脈でよく出題される。"},
{id:"n60", f:"network", t:"分析結果の伝え方", d:2,
 q:"探究活動でデータ分析の結果を発表するときの姿勢として最も適当なものを選べ。",
 c:["データの出典・収集方法・分析手順を示し、分かったことと言えないこと（限界）を区別して報告する。",
    "自分の仮説に有利なデータだけを選んで見せる。",
    "出典や調査方法は示さず、結論だけを断定的に述べる。",
    "グラフの軸を操作して、差が大きく見えるように加工して見せる。"],
 a:0,
 e:"信頼される分析報告の条件は、再現可能性（出典・方法の明示）と誠実さ（限界の明示、チェリーピッキングをしない）。「このデータから言えるのはここまで」という限界の認識は、共通テストの会話文形式の問題でもよく問われる観点。"},

{id:"psg1-1", f:"passage", t:"総合問題：お化け屋敷の待ち時間予測", d:2, setId:"psg1",
 passageTitle:"文化祭のお化け屋敷 待ち時間シミュレーション",
 passage:"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、来場者の待ち時間を減らすため、入場の様子をシミュレーションでモデル化することにした。1人のお客が入場してから退場するまでの所要時間は平均5分とし、お客は一定の間隔ではなくランダムな間隔で到着すると仮定して、乱数を使ったプログラムを作成した。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。",
 q:"このシミュレーションのように、偶然の要素（お客の到着間隔のばらつき）を乱数によって再現するモデルを何というか。",
 c:["確率的モデル","確定的モデル","物理モデル","静的モデル"],
 a:0,
 e:"偶然の要素を乱数で表現するモデルは確率的モデル。対して、式や規則だけで結果が一意に決まるモデルは確定的モデルという。待ち行列や到着間隔のようにばらつきがある現象は確率的モデルで扱うのが適切。"},
{id:"psg1-2", f:"passage", t:"総合問題：お化け屋敷の待ち時間予測", d:2, setId:"psg1",
 passageTitle:"文化祭のお化け屋敷 待ち時間シミュレーション",
 passage:"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、来場者の待ち時間を減らすため、入場の様子をシミュレーションでモデル化することにした。1人のお客が入場してから退場するまでの所要時間は平均5分とし、お客は一定の間隔ではなくランダムな間隔で到着すると仮定して、乱数を使ったプログラムを作成した。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。",
 q:"2人は次に、お客の到着間隔（分）を「整数(乱数()*5)+1」という式で表すことにした。この式が返す値の範囲として正しいものを選べ。",
 c:["1以上5以下の整数","0以上5以下の整数","1以上6以下の整数","0以上4以下の整数"],
 a:0,
 e:"乱数()は0以上1未満なので、乱数()*5は0以上5未満。整数()で切り捨てると0〜4の整数になり、+1して1〜5の整数となる。サイコロの目のシミュレーション（1〜6を作る式）と同じ考え方。"},
{id:"psg1-3", f:"passage", t:"総合問題：お化け屋敷の待ち時間予測", d:3, setId:"psg1",
 passageTitle:"文化祭のお化け屋敷 待ち時間シミュレーション",
 passage:"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、来場者の待ち時間を減らすため、入場の様子をシミュレーションでモデル化することにした。1人のお客が入場してから退場するまでの所要時間は平均5分とし、お客は一定の間隔ではなくランダムな間隔で到着すると仮定して、乱数を使ったプログラムを作成した。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。",
 q:"シミュレーションを1回だけでなく、条件を変えずに1000回繰り返して待ち時間の平均を求めた場合の利点として最も適当なものを選べ。",
 c:["乱数を使った試行のばらつきの影響が小さくなり、より安定した（信頼できる）平均的な傾向を推定できる。","1000回繰り返せば、待ち時間は毎回必ず完全に同じ値になる。","繰り返す回数を増やすほど、実際の待ち時間そのものが短くなる。","繰り返し回数を増やしても、結果の信頼性は1回の試行と変わらない。"],
 a:0,
 e:"乱数を使うシミュレーションは1回ごとの結果にばらつきがあるが、試行回数を増やすほど平均的な傾向（大数の法則）に近づき、結果の信頼性が高まる。回数を増やしても現実の待ち時間そのものが変化するわけではない点に注意。"},
{id:"psg2-1", f:"passage", t:"総合問題：リサイクル量のデータ分析", d:2, setId:"psg2",
 passageTitle:"クラス対抗ペットボトル回収コンテストのデータ分析",
 passage:"環境委員会は、1週間のペットボトル回収本数を1組・2組・3組で競うコンテストを行った。あわせて、各クラスの「1人あたりの回収本数」と「環境委員会主催のポスター掲示に費やした時間（分）」を記録し、両者の関係を散布図に表したところ、右上がりの分布となり、相関係数は0.82であった。また、3クラスの回収本数の分布を箱ひげ図で比較したところ、2組は他の2クラスより中央値は同程度だが、ひげと箱の長さが明らかに長く、ばらつきが大きいことが分かった。",
 q:"「ポスター掲示時間」と「1人あたりの回収本数」の相関係数が0.82であったことの解釈として最も適当なものを選べ。",
 c:["強い正の相関があり、ポスター掲示時間が長いクラスほど回収本数が多い傾向が見られるが、この結果だけでポスター掲示が回収本数増加の直接の原因であるとは断定できない。","相関係数が1ではないため、両者にはまったく関係がないといえる。","ポスター掲示時間を増やせば、回収本数が増えることが実験的に証明された。","相関係数が0.82なので、ポスター掲示時間と回収本数は反比例の関係にある。"],
 a:0,
 e:"0.82は1に近く強い正の相関を示すが、相関は因果を意味しない。クラスの環境意識の高さなど別の要因が両方に影響している可能性（疑似相関）も排除できないため、断定は避けるべき。"},
{id:"psg2-2", f:"passage", t:"総合問題：リサイクル量のデータ分析", d:2, setId:"psg2",
 passageTitle:"クラス対抗ペットボトル回収コンテストのデータ分析",
 passage:"環境委員会は、1週間のペットボトル回収本数を1組・2組・3組で競うコンテストを行った。あわせて、各クラスの「1人あたりの回収本数」と「環境委員会主催のポスター掲示に費やした時間（分）」を記録し、両者の関係を散布図に表したところ、右上がりの分布となり、相関係数は0.82であった。また、3クラスの回収本数の分布を箱ひげ図で比較したところ、2組は他の2クラスより中央値は同程度だが、ひげと箱の長さが明らかに長く、ばらつきが大きいことが分かった。",
 q:"2組の箱ひげ図で「ひげと箱の長さが明らかに長い」ことから読み取れることとして最も適当なものを選べ。",
 c:["2組は生徒間で回収本数のばらつきが大きく、一部の生徒が非常に多く（または少なく）回収した可能性がある。","2組は全員がほぼ同じ本数を回収した。","2組の中央値は他のクラスより大幅に高い。","箱ひげ図からはばらつきの大きさを読み取ることはできない。"],
 a:0,
 e:"箱ひげ図の箱（四分位範囲）とひげ（最小値〜最大値の範囲）が長いほど、データの散らばりが大きいことを示す。中央値が同程度でも散らばりが違えば、クラス内の取り組みに差がある可能性が読み取れる。"},
{id:"psg2-3", f:"passage", t:"総合問題：リサイクル量のデータ分析", d:3, setId:"psg2",
 passageTitle:"クラス対抗ペットボトル回収コンテストのデータ分析",
 passage:"環境委員会は、1週間のペットボトル回収本数を1組・2組・3組で競うコンテストを行った。あわせて、各クラスの「1人あたりの回収本数」と「環境委員会主催のポスター掲示に費やした時間（分）」を記録し、両者の関係を散布図に表したところ、右上がりの分布となり、相関係数は0.82であった。また、3クラスの回収本数の分布を箱ひげ図で比較したところ、2組は他の2クラスより中央値は同程度だが、ひげと箱の長さが明らかに長く、ばらつきが大きいことが分かった。",
 q:"この分析結果をもとに来年のコンテストで「全クラスにポスター掲示の時間を長く取るよう義務付ける」という施策を決定した。この判断に対する指摘として最も適当なものを選べ。",
 c:["相関関係から直接因果関係を断定しており、ポスター掲示以外の要因（呼びかけの内容や委員の人数など）の影響を検証しないまま施策化するのは早計である。","相関係数が0.82もあるので、この施策決定は完全に正しく、再検討の余地はない。","散布図と箱ひげ図の両方を使っているので、分析手法に問題はまったくない。","データに基づいているので、この施策に反対する意見は科学的に誤りである。"],
 a:0,

/* ====== アプリ本体 ====== */
const LS_KEY = "joho1_records_v1";
let store = loadStore();
let quiz = null; // {ids:[], idx, correct, fieldKey, answered}

function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {q:{}, sessions:[]};
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
}
function recordAnswer(qid, ok){
  if(!store.q[qid]) store.q[qid] = {c:0, w:0};
  ok ? store.q[qid].c++ : store.q[qid].w++;
  saveStore();
}
function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function show(id){
  ["view-home","view-quiz","view-result","view-stats"].forEach(v=>{
    document.getElementById(v).classList.toggle("hidden", v!==id);
  });
  window.scrollTo(0,0);
}
function goHome(){ show("view-home"); }

function startQuiz(fieldKey){
  let pool;
  if(fieldKey==="mix"){
    pool = shuffle(QUESTIONS.filter(q=>CORE_FIELDS.includes(q.f))).slice(0,12);
  }else{
    pool = shuffle(QUESTIONS.filter(q=>q.f===fieldKey)).slice(0,10);
  }
  beginSession(pool.map(q=>q.id), fieldKey);
}
function startPassageMode(){
  const ids = QUESTIONS.filter(q=>q.f==="passage").map(q=>q.id);
  beginSession(ids, "passage");
}
function startReview(){
  const wrongIds = Object.keys(store.q).filter(id=>store.q[id].w > store.q[id].c);
  if(wrongIds.length===0){
    alert("復習対象の問題がありません。まずは分野別演習に挑戦しましょう！");
    return;
  }
  beginSession(shuffle(wrongIds).slice(0,12), "review");
}
function beginSession(ids, fieldKey){
  quiz = {ids, idx:0, correct:0, fieldKey, results:[]};
  show("view-quiz");
  renderQuestion();
}
function currentQ(){
  return QUESTIONS.find(q=>q.id===quiz.ids[quiz.idx]);
}
function renderQuestion(){
  const q = currentQ();
  const n = quiz.ids.length;
  document.getElementById("prog-bar").style.width = ((quiz.idx)/n*100)+"%";
  document.getElementById("prog-num").textContent = `${quiz.idx+1} / ${n} 問`;
  const f = FIELDS[q.f];
  const diffLabel = ["","基礎","標準","発展"][q.d];
  document.getElementById("q-meta").innerHTML =
    `<span class="tag" style="background:${f.color}20; color:${f.color};">${f.name}</span>`+
    `<span class="tag">${q.t}</span><span class="tag diff${q.d}">${diffLabel}</span>`;
  document.getElementById("q-passage").innerHTML = q.passage ? `<div class="passage-box"><div class="passage-title">${escapeHtml(q.passageTitle||"設定")}</div>${q.passage}</div>` : "";
  document.getElementById("q-text").textContent = q.q;
  document.getElementById("q-code").innerHTML = q.code ? `<pre class="code">${escapeHtml(q.code)}</pre>` : "";
  document.getElementById("q-chart").innerHTML = q.chart ? `<div class="chart-box">${q.chart}</div>` : "";
  // 選択肢シャッフル
  const order = shuffle(q.c.map((_,i)=>i));
  quiz.order = order;
  const box = document.getElementById("q-choices");
  box.innerHTML = "";
  order.forEach((origIdx, pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="mark">${"①②③④⑤⑥"[pos]}</span>${escapeHtml(q.c[origIdx])}`;
    b.onclick = ()=>answer(origIdx, b);
    box.appendChild(b);
  });
  document.getElementById("q-judge").innerHTML = "";
  document.getElementById("q-expl").innerHTML = "";
  document.getElementById("btn-next").classList.add("hidden");
}
function answer(origIdx, btn){
  const q = currentQ();
  const ok = origIdx === q.a;
  const buttons = document.querySelectorAll("#q-choices .choice");
  buttons.forEach((b,pos)=>{
    b.disabled = true;
    if(quiz.order[pos]===q.a) b.classList.add("reveal");
  });
  btn.classList.add(ok ? "sel-ok" : "sel-ng");
  if(ok) quiz.correct++;
  quiz.results.push({id:q.id, ok});
  recordAnswer(q.id, ok);
  document.getElementById("q-judge").innerHTML =
    `<div class="judge ${ok?"ok":"ng"}">${ok?"正解！":"不正解…"}</div>`;
  document.getElementById("q-expl").innerHTML =
    `<div class="expl"><strong>【解説】</strong>\n${escapeHtml(q.e)}</div>`;
  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = quiz.idx === quiz.ids.length-1 ? "結果を見る" : "次の問題へ";
  nextBtn.classList.remove("hidden");
}
function nextQuestion(){
  if(quiz.idx < quiz.ids.length-1){
    quiz.idx++;
    renderQuestion();
  }else{
    finishQuiz();
  }
}
function finishQuiz(){
  const n = quiz.ids.length;
  const rate = Math.round(quiz.correct/n*100);
  store.sessions.push({d:Date.now(), f:quiz.fieldKey, n, c:quiz.correct});
  saveStore();
  document.getElementById("res-score").textContent = `${quiz.correct} / ${n} 問正解（${rate}%）`;
  document.getElementById("res-msg").textContent =
    rate>=90 ? "素晴らしい！本番でも通用する実力です。" :
    rate>=70 ? "よくできています。間違えた問題を復習して仕上げましょう。" :
    rate>=50 ? "基礎は身についています。解説をよく読んで弱点を潰しましょう。" :
    "焦らなくて大丈夫。解説を読んでから弱点復習モードで解き直しましょう。";
  const wrong = quiz.results.filter(r=>!r.ok);
  let html = "";
  if(wrong.length){
    html += `<h3 style="font-size:.95rem; margin-bottom:6px;">間違えた問題のテーマ</h3><ul class="weak-list">`;
    wrong.forEach(r=>{
      const q = QUESTIONS.find(x=>x.id===r.id);
      html += `<li>${FIELDS[q.f].name}：${escapeHtml(q.t)}</li>`;
    });
    html += `</ul><p class="stat-note">「弱点復習モード」でこれらの問題を解き直せます。</p>`;
  }else{
    html = `<p style="text-align:center;">全問正解です！🎉</p>`;
  }
  document.getElementById("res-detail").innerHTML = html;
  show("view-result");
}
function retrySame(){
  if(quiz.fieldKey==="review") startReview();
  else if(quiz.fieldKey==="passage") startPassageMode();
  else startQuiz(quiz.fieldKey);
}
function quitQuiz(){
  if(confirm("演習を中断してホームに戻りますか？（ここまでの解答は記録されています）")) goHome();
}
function showStats(){
  const body = document.getElementById("stats-body");
  const totalAns = Object.values(store.q).reduce((s,r)=>s+r.c+r.w, 0);
  if(totalAns===0){
    body.innerHTML = `<p style="color:var(--sub); font-size:.9rem; margin-top:8px;">まだ記録がありません。演習を始めましょう！</p>`;
    show("view-stats");
    return;
  }
  let html = `<h3 style="font-size:.95rem; margin:12px 0 4px;">分野別の正答率</h3>`;
  Object.keys(FIELDS).forEach(fk=>{
    let c=0, w=0;
    QUESTIONS.filter(q=>q.f===fk).forEach(q=>{
      const r = store.q[q.id];
      if(r){c+=r.c; w+=r.w;}
    });
    const total = c+w;
    const rate = total ? Math.round(c/total*100) : 0;
    const col = FIELDS[fk].color;
    html += `<div class="bar-row"><div class="lbl"><span>${FIELDS[fk].name}</span><span>${total? rate+"%（"+c+"/"+total+"）" : "未演習"}</span></div><div class="bar"><span style="width:${rate}%; background:${col};"></span></div></div>`;
  });
  // 弱点テーマ
  const topicStat = {};
  QUESTIONS.forEach(q=>{
    const r = store.q[q.id];
    if(!r) return;
    const key = FIELDS[q.f].name+"｜"+q.t;
    if(!topicStat[key]) topicStat[key]={c:0,w:0};
    topicStat[key].c+=r.c; topicStat[key].w+=r.w;
  });
  const weak = Object.entries(topicStat)
    .map(([k,v])=>({k, rate:v.c/(v.c+v.w), n:v.c+v.w}))
    .filter(x=>x.rate<0.6)
    .sort((a,b)=>a.rate-b.rate)
    .slice(0,8);
  html += `<h3 style="font-size:.95rem; margin:16px 0 4px;">重点復習テーマ（正答率60%未満）</h3>`;
  if(weak.length){
    html += `<ul class="weak-list">`+weak.map(x=>`<li>${escapeHtml(x.k)}（正答率 ${Math.round(x.rate*100)}%）</li>`).join("")+`</ul>`;
  }else{
    html += `<p style="font-size:.88rem; color:var(--sub);">正答率60%未満のテーマはありません。この調子！</p>`;
  }
  html += `<p class="stat-note">記録はこのブラウザ内に保存されます（累計解答数：${totalAns}）。</p>`;
  body.innerHTML = html;
  show("view-stats");
}
function resetRecords(){
  if(confirm("これまでの成績記録をすべて削除します。よろしいですか？")){
    store = {q:{}, sessions:[]};
    saveStore();
    alert("記録をリセットしました。");
  }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
