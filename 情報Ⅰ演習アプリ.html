iddle\" font-size=\"10\" fill=\"#1e2a3a\">16</text><rect x=\"276\" y=\"153.84615384615384\" width=\"50\" height=\"46.15384615384615\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"301\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">40〜50</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"301\" y=\"149.84615384615384\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">8</text><rect x=\"330\" y=\"176.92307692307693\" width=\"50\" height=\"23.076923076923077\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">50〜60</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"172.92307692307693\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">4</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">滞在時間（分）</text></svg>","q":"滞在時間が10分以上20分未満の利用者の相対度数として正しいものを選べ。","c":["0.25","0.20","20","0.30"],"a":0,"e":"相対度数＝その階級の度数÷全体の人数。20÷80 = 0.25。人数（度数）そのものと相対度数（割合）を混同しないこと。相対度数を使うと、全体の人数が違う集団どうしでも分布を比較できる。"},{"id":"ex7-3","f":"exam","t":"本番形式：クロス集計表の読み取り","d":3,"setId":"ex7","pts":[5],"passage":"学年別の利用目的をクロス集計表（表1）にまとめた。\n\n表1　学年×利用目的（人）\n　　　　自習　読書　その他　計\n1年　　20　　12　　8　　　40\n2年　　12　　 9　　4　　　25\n3年　　 5　　 8　　2　　　15","q":"表1から読み取れることとして最も適当なものを選べ。","c":["自習の割合は1年（50%）が3年（約33%）より高く、逆に読書の割合は3年（約53%）が1年（30%）より高い。","自習の人数は1年（20人）が3年（5人）より多いので、自習の割合も学年に関係なく必ず1年が高いとは限らないとは言えない。","3年の利用者数が最も少ないので、3年は読書にも自習にもまったく関心がないと結論できる。","この表からは各学年の利用者の合計人数を読み取ることはできない。"],"a":0,"e":"割合で比べると、自習：1年20/40=50%、3年5/15≒33%。読書：1年12/40=30%、3年8/15≒53%。合計人数が学年で違うため、人数の比較ではなく割合の比較が必要になる。クロス集計表では「行ごとの割合」に直して読むのが基本。"},{"id":"ex7-4","f":"exam","t":"本番形式：調査の進め方（二つ選べ）","d":3,"setId":"ex7","pts":[5],"m":2,"passage":"Jさんはこの調査結果をもとに、図書室の座席配置の見直しを提案しようとしている。","q":"Jさんの調査・分析の進め方として適当なものを、次のうちから二つ選べ。","c":["1日だけの調査では偶然の影響がありうるので、曜日を変えて複数回調査し、傾向が安定しているか確かめる。","座席配置を変えた後にも同じ方法で調査を行い、変更前後のデータを比較して効果を確かめる。","調査結果が予想と違っていた場合は、予想に合うように一部のデータを書き換えてから提案をまとめる。","回答してくれた人に個人が特定できる氏名を書かせて、誰がどう答えたかを掲示板で公表する。"],"a":[0,1],"e":"複数回の調査による傾向の確認と、施策前後の比較による効果検証はいずれも適切。データの書き換えは分析の偽装であり、氏名の公表はプライバシーの侵害。調査倫理とPDCAの両面を問う。"},{"id":"ex7-5","f":"exam","t":"本番形式：代表値の選択","d":3,"setId":"ex7","pts":[5],"passage":"Jさんは滞在時間の「代表的な値」を報告に載せたい。ヒストグラム（図1）の分布は、20〜30分を山として長時間側に裾を引いた形をしている。","chart":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">図書室の滞在時間（80人）</text><line x1=\"55\" y1=\"200\" x2=\"385\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"55\" y1=\"40\" x2=\"55\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"204\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">0</text><line x1=\"52\" y1=\"200\" x2=\"58\" y2=\"200\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"157.84615384615384\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">8</text><line x1=\"52\" y1=\"153.84615384615384\" x2=\"58\" y2=\"153.84615384615384\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"111.6923076923077\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">16</text><line x1=\"52\" y1=\"107.6923076923077\" x2=\"58\" y2=\"107.6923076923077\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"65.53846153846155\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">24</text><line x1=\"52\" y1=\"61.53846153846155\" x2=\"58\" y2=\"61.53846153846155\" stroke=\"#94a3b8\"/><rect x=\"60\" y=\"153.84615384615384\" width=\"50\" height=\"46.15384615384615\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">0〜10</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"149.84615384615384\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">8</text><rect x=\"114\" y=\"84.61538461538461\" width=\"50\" height=\"115.38461538461539\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"139\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">10〜20</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"139\" y=\"80.61538461538461\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">20</text><rect x=\"168\" y=\"61.53846153846155\" width=\"50\" height=\"138.46153846153845\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"193\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">20〜30</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"193\" y=\"57.53846153846155\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">24</text><rect x=\"222\" y=\"107.6923076923077\" width=\"50\" height=\"92.3076923076923\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"247\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">30〜40</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"247\" y=\"103.6923076923077\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">16</text><rect x=\"276\" y=\"153.84615384615384\" width=\"50\" height=\"46.15384615384615\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"301\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">40〜50</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"301\" y=\"149.84615384615384\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">8</text><rect x=\"330\" y=\"176.92307692307693\" width=\"50\" height=\"23.076923076923077\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">50〜60</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"172.92307692307693\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">4</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">滞在時間（分）</text></svg>","q":"この分布で滞在時間の代表値を選ぶ際の考え方として最も適当なものを選べ。","c":["長時間側に裾を引く分布では平均値が一部の長時間利用者に引っ張られて大きめに出るため、中央値も合わせて確認するのがよい。","統計の世界では代表値として常に平均値を使うことがルールとして定められており、中央値を報告に載せることは認められていない。","最頻値・中央値・平均値は、どんな分布でも必ず同じ値になるので、どれを使っても報告の内容は変わらない。","裾を引いた分布では代表値そのものが存在しないため、数値の報告はあきらめて印象だけを述べるしかない。"],"a":0,"e":"外れ値や裾の長い分布では平均値は裾の方向に引っ張られる。中央値は外れ値の影響を受けにくい。3つの代表値はふつう一致せず、分布の形に応じて適切なものを選ぶ（または併記する）のが正しい姿勢。"},{"id":"ex8-1","f":"exam","t":"本番形式：音のデータ量","d":2,"setId":"ex8","pts":[4],"passageTitle":"第2問形式：校内放送のデジタル録音","passage":"放送委員のLさんは、お昼の校内放送で流すアナウンスをデジタル録音することになった。録音の設定は、標本化周波数44,100Hz、量子化ビット数16ビット、ステレオ（2チャンネル）である。録音した音声は編集ソフトで無音部分を削除し、必要に応じて圧縮してから保存する。","q":"この設定で1秒間録音したときのデータ量として最も近いものを選べ。（1KB=1000Bとする）","c":["約176KB","約88KB","約1.4MB","約22KB"],"a":0,"e":"44,100回/秒 × 16ビット × 2チャンネル = 1,411,200ビット。8で割ってバイトに直すと176,400B≒176KB。88KBはモノラル（1チャンネル）の場合、1.4MBはビットのままバイトに直し忘れた値。"},{"id":"ex8-2","f":"exam","t":"本番形式：標本化周波数の変更","d":2,"setId":"ex8","pts":[4],"passage":"Lさんは、データ量を減らすために標本化周波数を44,100Hzから22,050Hzに下げることを検討している。","q":"標本化周波数を半分に下げた場合の説明として最も適当なものを選べ。","c":["1秒あたりに記録する標本の数が半分になりデータ量は半分になるが、高い音の波形を正確に記録しにくくなる。","音の大きさを表す段階の数が半分になるため、小さな音量の変化が記録できなくなるがデータ量は変わらない。","データ量も音質もまったく変わらず、記録にかかる時間だけがちょうど半分に短縮される。","標本の数が半分になると音の高さそのものが1オクターブ下がって記録されてしまう。"],"a":0,"e":"標本化周波数は1秒あたりに波形を測る回数。半分にすればデータ量も半分だが、記録できる音の周波数の上限（約：標本化周波数の半分）も下がり、高音の再現性が落ちる。音の大きさの段階数を決めるのは量子化ビット数のほう。"},{"id":"ex8-3","f":"exam","t":"本番形式：量子化ビット数の変更","d":2,"setId":"ex8","pts":[4],"passage":"次にLさんは、量子化ビット数を16ビットから8ビットに下げた場合についても考えた。","q":"量子化ビット数を16ビットから8ビットに下げた場合の説明として最も適当なものを選べ。","c":["音の大きさを表す段階数が65,536段階から256段階に減り、データ量は半分になるが、微妙な音量の変化が失われやすくなる。","1秒あたりに記録する標本の数が半分になってしまうため、音の高さの情報が失われて、データ量も元のちょうど4分の1になる。","段階数は変わらないが、記録できる録音時間の上限だけがちょうど半分になる。","8ビットに下げると段階数が16分の1の4,096段階になり、音質はほとんど変化しない。"],"a":0,"e":"量子化ビット数nのとき段階数は2のn乗。16ビット=65,536段階、8ビット=256段階。ビット数が半分になればデータ量も半分だが、音量の分解能が粗くなる。標本の数（時間方向）を決めるのは標本化周波数。"},{"id":"ex8-4","f":"exam","t":"本番形式：音声の圧縮","d":3,"setId":"ex8","pts":[3],"passage":"Lさんは、編集後の音声をMP3形式（非可逆圧縮）で保存すると、データ量が元の約10分の1になることを知った。","q":"MP3のような非可逆圧縮の説明として最も適当なものを選べ。","c":["人間の耳に聞こえにくい成分を削ることで高い圧縮率を実現しており、展開しても元の波形は完全には復元されない。","圧縮したファイルを展開すると元の波形が完全に復元されるので、何度圧縮と展開を繰り返しても音質は劣化しない。","音の波形を10分の1の時間に縮めて再生する仕組みなので、圧縮後は再生速度が10倍になる。","圧縮できるのは無音部分だけなので、無音を含まない音声のデータ量はまったく減らない。"],"a":0,"e":"非可逆圧縮は、知覚されにくい情報を削ってデータ量を大きく減らす方式。完全復元はできないが、音楽配信などでは実用上十分な品質が保てる。完全復元が必要な文書やプログラムには可逆圧縮を使う、という使い分けが重要。"},{"id":"ex9-1","f":"exam","t":"本番形式：プッシュ型とプル型","d":2,"setId":"ex9","pts":[4],"passageTitle":"第2問形式：防災情報の伝達と情報デザイン","passage":"生徒会のPさんは、地域の防災訓練に合わせて「災害時の情報伝達」について調べ、発表することになった。災害時には、緊急速報メールのように送り手から自動的に届く伝え方と、自治体のWebサイトのように受け手が自分から取りに行く伝え方が組み合わせて使われている。また、避難所の案内表示には言葉のちがう人や子どもにも伝わる工夫が求められる。","q":"「緊急速報メール」と「自治体のWebサイト」の伝え方の違いの説明として最も適当なものを選べ。","c":["緊急速報メールは送り手から受け手へ自動的に届くプッシュ型、Webサイトは受け手が必要なときに取りに行くプル型である。","緊急速報メールは受け手が申請しないと一切届かないプル型、Webサイトは全員に強制表示されるプッシュ型である。","どちらも受け手の操作がなければ情報が得られないプル型であり、伝わる速さにも違いはまったくない。","どちらも送り手が個人を特定して1人ずつ電話をかける方式であり、多人数への一斉伝達には向かない。"],"a":0,"e":"プッシュ型は送り手起点で自動的に届く（緊急速報メール、テレビの速報）。プル型は受け手起点で取りに行く（Webサイト、掲示板）。緊急性の高い一報はプッシュ型、詳しい情報の確認はプル型、と役割が異なる。"},{"id":"ex9-2","f":"exam","t":"本番形式：ピクトグラムの利点","d":2,"setId":"ex9","pts":[4],"passage":"Pさんは、避難所の案内表示に非常口マークのようなピクトグラム（絵記号）が使われている理由を考えた。","q":"案内表示にピクトグラムを使う利点として最も適当なものを選べ。","c":["情報を抽象化して図形で表すことで、言語や年齢のちがいをこえて、直感的に意味を伝えやすくなる。","文章よりも多くの詳細な情報を一度に正確に伝えられるため、説明文が一切不要になる。","デザインが統一されていない独自の絵柄ほど注目を集めるので、施設ごとに全く違う絵にする効果がある。","ピクトグラムは日本語を読める人にしか意味が伝わらないが、印刷コストが安いという利点がある。"],"a":0,"e":"ピクトグラムは情報の抽象化により、言語に依存せず直感的に伝える情報デザインの代表例。ただし細かい内容までは伝えられないため文章との併用が前提。規格化・統一されているからこそ誰にでも同じ意味で伝わる。"},{"id":"ex9-3","f":"exam","t":"本番形式：複数メディアと冗長性","d":3,"setId":"ex9","pts":[4],"passage":"調べてみると、同じ避難情報が、緊急速報メール・防災無線・テレビ・SNS・Webサイトなど複数の手段で重ねて発信されていることが分かった。","q":"同じ情報を複数の手段で重ねて発信する理由として最も適当なものを選べ。","c":["停電や回線の混雑などで一部の手段が使えなくなっても情報が届くように、あえて重複（冗長性）を持たせている。","手段ごとに内容の違う情報を流すことで、受け手ごとに異なる行動をとらせることを目的としている。","同じ情報を何度も見せることで広告収入を増やすことが、防災情報発信の主な目的だからである。","複数の手段を使うと情報の内容が自動的に正確になるため、発信前の確認作業が不要になるからである。"],"a":0,"e":"災害時は特定の通信手段が使えなくなることがある。複数の経路で同じ情報を流す冗長性により、どれかが途絶えても伝達が維持される。パリティビットやバックアップと同じ「冗長性で障害に備える」という情報技術の共通の考え方。"},{"id":"ex9-4","f":"exam","t":"本番形式：災害時のデマへの対処","d":3,"setId":"ex9","pts":[3],"passage":"過去の災害では、SNS上で「動物園からライオンが逃げた」といった虚偽の投稿が拡散し、混乱を招いた事例があったことも分かった。","q":"災害時にSNSで流れてくる情報への向き合い方として最も適当なものを選べ。","c":["善意の拡散でもデマを広げてしまうことがあるため、自治体や報道機関などの一次情報で確認できるまで安易に転載しない。","緊急時は一刻を争うので、真偽を確かめる前に、目にした情報をできるだけ多くの人へ即座に転送するのがよい。","画像が添付されている投稿は加工の可能性がないので、画像付きの情報だけは無条件で信用して拡散してよい。","SNSの情報はすべて虚偽なので、災害時にはSNSを一切見ずに情報を遮断するのが唯一の正しい行動である。"],"a":0,"e":"デマ拡散の多くは「善意の共有」から起こる。発信元の確認（自治体・報道などの一次情報）と、確認できるまで拡散しない姿勢が基本。SNSには救助要請など有用な情報もあるため全否定も誤り。真偽の見極めと行動の自制がポイント。"},{"id":"ex10-1","f":"exam","t":"本番形式：校内ネットワークの設計","d":2,"setId":"ex10","pts":[5],"passageTitle":"第4問形式：校内ネットワークの設計","passage":"情報部のRさんは、校内のネットワークが授業中に遅くなる問題について、先生（T）と調べることにした。\n\nR：同じ時間に多くの端末が動画を見ると、表示に時間がかかるようになります。\nT：ネットワークでは、データを小さなまとまりに分けて送っています。この仕組みの利点から確認しましょう。\n\n校内では、各教室のアクセスポイントがスイッチングハブを経由してルータに接続され、そこから外部の回線につながっている。回線の実効速度は 100 Mbps である。","q":"インターネットで使われているパケット交換方式の利点として最も適当なものを選べ。","c":["データを小さく分割して送るため、1本の回線を複数の通信で共有でき、回線を効率よく利用できる。","通信する2者の間の回線を通信中ずっと占有するため、他の通信の影響をまったく受けずに済む。","データを分割せずに一つの大きなまとまりのまま送るので、送信の手続きが単純で高速になる。","送信先の情報を持たずに送れるため、宛先を指定する手間が省けて通信量を大きく削減できる。"],"a":0,"e":"パケット交換は、データを小さなパケットに分けて送り、回線を多数の通信で共有する方式。回線を占有する回線交換方式に比べ利用効率が高い。各パケットには宛先情報（ヘッダ）が付き、経路上で転送される。"},{"id":"ex10-2","f":"exam","t":"本番形式：通信時間の計算","d":2,"setId":"ex10","pts":[5],"passage":"回線の実効速度は 100 Mbps である。ここで 1 Mbps は 1 秒間に 1,000,000 ビットを送れる速さを表す。Rさんは 50 MB（メガバイト）の動画ファイルを転送するのにかかる時間を見積もることにした。1 MB = 1,000,000 B、1 B = 8 ビットとする。","q":"この動画ファイルの転送にかかる時間として最も近いものを選べ。","c":["約4秒","約0.5秒","約40秒","約2秒"],"a":0,"e":"50 MB = 50×1,000,000×8 = 400,000,000 ビット。100 Mbps = 100,000,000 ビット/秒なので、400,000,000÷100,000,000 = 4秒。バイトとビットの換算（×8）を忘れると0.5秒と誤る、頻出の計算パターン。"},{"id":"ex10-3","f":"exam","t":"本番形式：ネットワーク機器の役割","d":2,"setId":"ex10","pts":[5],"passage":"校内では、各教室のアクセスポイントがスイッチングハブを経由してルータに接続され、そこから外部の回線につながっている。","q":"ルータの役割の説明として最も適当なものを選べ。","c":["異なるネットワークどうしを接続し、宛先のアドレスを見てパケットを次に送る経路を選ぶ。","電波を電気信号に変換して、無線の端末を有線のネットワークに接続する働きだけを担う。","同じネットワーク内の機器に対して、届いたデータをすべての機器へ一律に配る働きを担う。","通信内容を暗号化して、外部から内容を読み取られないようにすることだけを目的とする。"],"a":0,"e":"ルータはネットワーク間を接続し、IPアドレスをもとに経路選択（ルーティング）を行う機器。届いたデータを全ポートに流すのはリピータハブ、宛先を見て必要なポートだけに送るのがスイッチングハブ、無線と有線をつなぐのがアクセスポイント。"},{"id":"ex10-4","f":"exam","t":"本番形式：改善策の検討（二つ選べ）","d":3,"setId":"ex10","pts":[5],"m":2,"passage":"Rさんは、授業中にネットワークが遅くなる問題への対策を先生と検討している。","q":"この問題への対応として適当なものを、次のうちから二つ選べ。","c":["時間帯ごとの通信量を測定し、混雑がいつ・どこで起きているのかをデータで確かめる。","授業で使う教材を事前に端末へ保存しておき、同時に大量の通信が発生しないようにする。","回線の速度は契約で決まっていて変えられないので、遅くなる時間帯は使用をあきらめる。","特定の生徒の通信が原因だと決めつけて、その生徒の端末だけを校内網から切り離す。"],"a":[0,1],"e":"原因を測定データで特定することと、通信の集中そのものを減らす工夫はいずれも適切。あきらめる対応は問題解決になっておらず、根拠なく個人を原因と決めつけて排除するのは不適切。"},{"id":"ex10-5","f":"exam","t":"本番形式：帯域と同時利用の考察","d":3,"setId":"ex10","pts":[5],"passage":"測定の結果、1台が動画を視聴すると平均して 4 Mbps を使うことが分かった。実効速度 100 Mbps の回線に、40台の端末が同時に動画を視聴する場合を考える。","q":"この状況の説明として最も適当なものを選べ。","c":["必要な通信量は 160 Mbps で回線の容量を超えるため、1台あたりの速度が落ちて再生が滞りやすくなる。","必要な通信量は 160 Mbps だが、回線は必要に応じて自動的に速度を上げるので問題は起こらない。","必要な通信量は 4 Mbps のままなので、端末が何台に増えても回線の混雑は発生しない。","端末が増えるほど1台あたりに割り当てられる速度も増えるため、40台のほうがむしろ快適になる。"],"a":0,"e":"4 Mbps×40台 = 160 Mbps で、回線の 100 Mbps を超える。容量を超えると1台あたりの実効速度が下がり、動画が止まりやすくなる（輻輳）。回線速度は契約上の上限で、自動的には増えない。"},{"id":"ex11-1","f":"exam","t":"本番形式：オンライン申請の安全性","d":2,"setId":"ex11","pts":[5],"passageTitle":"第4問形式：オンライン申請システムのセキュリティ","passage":"生徒会のWさんの学校では、行事の参加申込をWebで受け付けるオンライン申請システムを導入することになった。氏名やクラスなどの個人情報を扱うため、通信内容が第三者に読み取られたり、なりすましで申請されたりしないようにする必要がある。\n\nW：申込ページのURLが https で始まっていれば安全だと聞きました。\nT：まず、その仕組みが何を守っているのかを正確に理解しておきましょう。","q":"通信が https で行われていることが保証する内容として最も適当なものを選べ。","c":["通信の内容が暗号化され、経路の途中で第三者に読み取られにくくなっていること。","そのWebサイトに掲載されている情報の内容が、すべて真実であると保証されていること。","そのWebサイトを運営している組織が、法律に違反していないと保証されていること。","送信したデータが途中で失われることなく、必ず相手に届くと保証されていること。"],"a":0,"e":"httpsは通信の暗号化（およびサーバの身元確認）を提供する。掲載内容の真偽や運営者の合法性、確実な到達を保証するものではない。「暗号化されている＝内容が正しい」ではない点が頻出の誤解。"},{"id":"ex11-2","f":"exam","t":"本番形式：公開鍵暗号の仕組み","d":3,"setId":"ex11","pts":[5],"passage":"Tさんは、申請システムで使われている公開鍵暗号について説明した。公開鍵暗号では、対になる2つの鍵を用い、一方の鍵で暗号化したものは他方の鍵でしか復号できない。","q":"Wさんが個人情報を学校のサーバへ安全に送るとき、暗号化と復号に使う鍵の組合せとして正しいものを選べ。","c":["サーバの公開鍵で暗号化し、サーバの秘密鍵で復号する。","サーバの秘密鍵で暗号化し、サーバの公開鍵で復号する。","Wさんの公開鍵で暗号化し、Wさんの秘密鍵で復号する。","Wさんの秘密鍵で暗号化し、サーバの秘密鍵で復号する。"],"a":0,"e":"受信者だけが読めるようにするには、受信者（サーバ）の公開鍵で暗号化する。復号できるのは対応する秘密鍵を持つサーバだけ。公開鍵は誰に配ってもよく、鍵の受け渡しの問題が起きにくいのが利点。逆向き（秘密鍵で暗号化）はデジタル署名の仕組み。"},{"id":"ex11-3","f":"exam","t":"本番形式：デジタル署名","d":3,"setId":"ex11","pts":[5],"passage":"学校からの返信メールには、デジタル署名が付けられることになった。","q":"デジタル署名によって確認できることとして最も適当なものを選べ。","c":["送信者が確かにその本人であることと、内容が途中で改ざんされていないこと。","メールの内容が第三者にまったく読まれていないことと、盗聴が起きていないこと。","メールが送信されてから受信されるまでに経由した通信経路のすべての記録。","そのメールに書かれた内容が事実であることと、約束が必ず守られること。"],"a":0,"e":"デジタル署名は、送信者の秘密鍵で署名し受信者が公開鍵で検証することで、本人性（なりすましでない）と非改ざん性を確認する仕組み。内容の秘匿は暗号化の役割であり、署名そのものは内容を隠さない。"},{"id":"ex11-4","f":"exam","t":"本番形式：運用上の対策（二つ選べ）","d":3,"setId":"ex11","pts":[5],"m":2,"passage":"Wさんは、システムを安全に運用するための決まりを考えることにした。","q":"運用上の対策として適当なものを、次のうちから二つ選べ。","c":["管理者のアカウントに二段階認証を設定し、パスワードだけで入れないようにする。","申請データを閲覧できる担当者を決め、必要のない人がアクセスできないようにする。","引き継ぎを楽にするため、管理者のIDとパスワードを生徒会の共有ノートに書いておく。","申請が集まったデータは、分析に役立ちそうなので卒業後もすべて保存し続ける。"],"a":[0,1],"e":"二段階認証とアクセス権の制限はいずれも基本的で有効な対策。認証情報の共有メモへの記載は漏えいの原因になり、個人情報を目的を超えて保存し続けることも適切ではない（不要になったら消去する）。"},{"id":"ex11-5","f":"exam","t":"本番形式：障害への備えの考察","d":3,"setId":"ex11","pts":[5],"passage":"申請の締切日に、システムが一時的に応答しなくなる障害が起きた。原因は、締切直前にアクセスが集中したことだった。","q":"この経験をふまえた対応として最も適当なものを選べ。","c":["締切前の集中を見込んで期間に余裕を持たせ、紙の申込など代替手段も用意しておく。","障害はサーバの性能不足が唯一の原因なので、より高性能な機材の購入だけを要求する。","締切直前のアクセスは利用者の責任なので、システム側では特に何も対策を行わない。","同じ障害の再発を防ぐため、オンライン申請を廃止してすべて口頭での受付に戻す。"],"a":0,"e":"アクセス集中は予見できる事象なので、期間の設計や代替手段（冗長性）の用意で影響を和らげられる。原因を一つに決めつけた機材購入のみの対応や、利用者の責任にして放置する対応、便益ごと廃止する対応はいずれも適切さを欠く。"},{"id":"ex12-1","f":"exam","t":"本番形式：サイコロゲームのシミュレーション","d":3,"setId":"ex12","type":"bank","pts":[4,4,4,4,4],"passageTitle":"第3問形式：サイコロゲームのシミュレーション（語群穴埋め）","passage":"生徒（S）と先生（T）が、サイコロを使ったゲームをプログラムで再現しようとしている。\n\nT：出た目を足していき、合計が20以上になったら終了、というゲームです。何回振れば終わるかを調べましょう。\nS：サイコロの目はばらばらなので、乱数を使えばいいですね。\nT：そうです。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数です。この2つで1から6までの整数が作れます。\nS：図1ができました。次は、1回だけでは結果がばらつくので、たくさん試して平均を出したいです。\nT：では図2のように、同じ手順を何度も繰り返して平均を求めましょう。","code":"【図1】\n(01) kaisu = 0\n(02) goukei = 0\n(03) goukei < 20 の間繰り返す：\n(04) 　　me = 整数(乱数() * 6) +【 カ 】\n(05) 　　goukei = goukei +【 キ 】\n(06) 　　kaisu = kaisu +【 ク 】\n(07) 表示する(kaisu, \" 回で合計 \", goukei)\n\n【図2】\n(08) sikou = 1000\n(09) sokei = 0\n(10) i を 1 から【 ケ 】まで 1 ずつ増やしながら繰り返す：\n(11) 　　（図1の(01)〜(06)を実行して kaisu を求める）\n(12) 　　sokei = sokei + kaisu\n(13) heikin = sokei /【 コ 】\n(14) 表示する(heikin)","q":"図1・図2のプログラムの空欄【カ】〜【コ】に当てはまるものを、語群から一つずつ選べ。同じものを繰り返し選んでもよい。","bank":["0","1","6","me","kaisu","goukei","sikou","乱数()"],"blanks":[{"label":"カ","a":1},{"label":"キ","a":3},{"label":"ク","a":1},{"label":"ケ","a":6},{"label":"コ","a":6}],"e":"【カ】整数(乱数()*6)は0〜5を返すので、1を足して1〜6にする。【キ】合計には出た目 me を加える。【ク】回数のカウンタは1ずつ増やす。【ケ】試行回数は sikou 回。【コ】平均は合計を試行回数 sikou で割る。乱数を使ったシミュレーションの典型的な骨格。"},{"id":"ex12-2","f":"exam","t":"本番形式：乱数の範囲の理解","d":3,"setId":"ex12","pts":[3],"passage":"「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。","code":"(04) 　　me = 整数(乱数() * 6) +【 カ 】","q":"空欄【カ】を正しく埋めたとき、(04)の me に入りうる値として正しいものを選べ。","c":["1 以上 6 以下の整数","0 以上 6 以下の整数","1 以上 7 以下の整数","0 以上 5 以下の整数"],"a":0,"e":"乱数()は0以上1未満なので、6倍すると0以上6未満。整数()で切り捨てると0〜5の整数になり、1を足して1〜6。「6を含むか」「0を含むか」の境界を正しく詰められるかを問う、シミュレーション問題の頻出ポイント。"},{"id":"ex12-3","f":"exam","t":"本番形式：試行回数の意味の考察","d":3,"setId":"ex12","pts":[2],"passage":"Sさんが図2を sikou = 10 で実行したところ、実行するたびに平均が 5.4、6.1、5.7 と変化した。次に sikou = 1000 で実行すると、平均はほぼ 5.7 前後で安定した。","q":"この結果の説明として最も適当なものを選べ。","c":["試行回数を増やすほど偶然のばらつきの影響が小さくなり、結果が真の値に近づいていくから。","試行回数を増やすとプログラムの計算が正確になり、乱数の誤差そのものが取り除かれるから。","試行回数と結果の安定性には関係がなく、たまたま同じ値が続いただけの偶然であるから。","試行回数が1000を超えると乱数が同じ値ばかりを返すようになり、変化しなくなるから。"],"a":0,"e":"乱数を使ったシミュレーションでは、試行回数を増やすほど平均が安定し、期待値に近づく（大数の法則）。乱数の性質が変わるわけでも、計算精度が上がるわけでもない。「何回試すか」がシミュレーションの信頼性を決める、という理解が問われる。"},{"id":"ex13-1","f":"exam","t":"本番形式：モンテカルロ法による円周率の推定","d":3,"setId":"ex13","type":"bank","pts":[4,4,4,4,4],"passageTitle":"第3問形式：乱数を使った円周率の推定（語群穴埋め）","passage":"生徒（U）と先生（T）が、乱数を使って円周率を求める方法を試している。\n\nT：1辺の長さが1の正方形を考えます。その中に、原点を中心とする半径1の四分円が入っています。\nU：正方形の面積は1、四分円の面積は π/4 ですね。\nT：そのとおり。正方形の中にランダムに点を打つと、四分円の内側に入る点の割合が面積の比、つまり π/4 に近づきます。\nU：点が四分円の内側にあるかどうかは、原点からの距離で判定できます。座標(x, y)が内側にあるのは x²+y² が1以下のときです。\nT：では図1のプログラムを完成させましょう。「乱数()」は0以上1未満の小数をランダムに返します。","code":"【図1】\n(01) atari = 0\n(02) n = 10000\n(03) i を 1 から n まで 1 ずつ増やしながら繰り返す：\n(04) 　　x = 乱数()\n(05) 　　y =【 カ 】\n(06) 　　もし x * x + y * y【 キ 】1 ならば：\n(07) 　　　　atari = atari +【 ク 】\n(08) pi =【 ケ 】* atari /【 コ 】\n(09) 表示する(pi)","q":"図1のプログラムの空欄【カ】〜【コ】に当てはまるものを、語群から一つずつ選べ。同じものを繰り返し選んでもよい。","bank":["1","2","4","n","x","乱数()","＜=","＞"],"blanks":[{"label":"カ","a":5},{"label":"キ","a":6},{"label":"ク","a":0},{"label":"ケ","a":2},{"label":"コ","a":3}],"e":"【カ】y座標もx座標とは独立にランダムに決める必要があるので、あらためて乱数()を呼び出す。ここでxを選ぶとy=xとなり、点が対角線上にしか並ばず正しく推定できない。【キ】四分円の内側は x²+y² が1以下なので ＜=。【ク】当たりのカウンタは1ずつ増やす。【ケ】【コ】割合 atari/n が π/4 に近づくので、π ≒ 4×atari/n。"},{"id":"ex13-2","f":"exam","t":"本番形式：試行回数と精度","d":3,"setId":"ex13","pts":[3],"passage":"Uさんが n の値を変えて実行したところ、n=100 では 3.0〜3.3 の間で大きく変動し、n=10000 では 3.13〜3.15 程度に収まった。","q":"この結果の説明として最も適当なものを選べ。","c":["点の数を増やすほど割合が面積比に近づくため、推定の精度が上がりばらつきが小さくなるから。","点の数を増やすとプログラムが円周率の正しい値を参照するようになり、誤差が消えるから。","点の数と推定の精度には関係がなく、n=10000 のときにたまたま近い値が出ただけだから。","点を10000個打つと、円周率を小数点以下10桁まで正確に求めることができるようになるから。"],"a":0,"e":"モンテカルロ法では、試行数を増やすほど「内側に入る割合」が真の面積比に近づき、推定値が安定する。ただし精度の向上はゆるやかで、桁数を1つ増やすには試行数を大幅に増やす必要がある。10000個で10桁の精度は得られない。"},{"id":"ex13-3","f":"exam","t":"本番形式：シミュレーションの適用範囲","d":3,"setId":"ex13","pts":[2],"passage":"Tさんは「乱数を使ったこの手法は、円周率以外にも応用できる」と説明した。","q":"乱数を用いたシミュレーションが有効な場面として最も適当なものを選べ。","c":["偶然の要素が結果に影響し、数式で正確に解くことが難しい現象の傾向を調べたいとき。","計算式が確定していて、答えが一つに決まる問題を、誤差なく厳密に解きたいとき。","過去に一度も起きたことがない現象について、確実に起こる未来を言い当てたいとき。","手元にデータがまったくない状態で、事実に基づいた正確な統計を作り出したいとき。"],"a":0,"e":"確率的モデルによるシミュレーションは、待ち行列や交通量など、偶然の要素を含み数式で解きにくい現象の傾向をつかむのに向く。厳密解が求まる問題には解析的な計算が適し、シミュレーションは未来を言い当てる魔法でもデータの代用でもない。"},{"id":"x14","f":"programming","t":"論理回路（AND・OR・NOT）","d":2,"q":"入力A、Bに対する出力が次の真理値表のようになる論理回路として正しいものを選べ。\n\nA=0,B=0 → 0 ／ A=0,B=1 → 1 ／ A=1,B=0 → 1 ／ A=1,B=1 → 1","c":["OR回路（論理和）","AND回路（論理積）","NOT回路（否定）","NAND回路（否定論理積）"],"a":0,"e":"どちらか一方でも1なら1になるのがOR（論理和）。AND（論理積）は両方1のときだけ1。NOTは入力1つに対して0と1を反転させる。NANDはANDの出力を反転させるので、両方1のときだけ0になる。"},{"id":"x15","f":"programming","t":"排他的論理和（XOR）","d":3,"q":"XOR回路（排他的論理和）の説明として最も適当なものを選べ。","c":["2つの入力が異なるときだけ1を出力し、同じときは0を出力する回路である。","2つの入力がどちらも1のときだけ1を出力し、それ以外は0を出力する回路である。","2つの入力のうち少なくとも一方が1であれば、常に1を出力する回路である。","入力の値にかかわらず、常に決まった1つの値だけを出力し続ける回路である。"],"a":0,"e":"XORは入力が異なるとき1、同じとき0。「同じかどうかの判定」に使え、同じ値で2回XORすると元に戻る性質から簡易な暗号化にも利用される。半加算器では和の桁がXOR、繰り上がりがANDで作られる。"},{"id":"x16","f":"programming","t":"半加算器の真理値表","d":3,"q":"1桁の2進数A、Bを足す半加算器について、A=1、B=1 のときの出力（和S、繰り上がりC）として正しいものを選べ。","c":["S=0、C=1","S=1、C=0","S=1、C=1","S=0、C=0"],"a":0,"e":"1+1は2進法で「10」なので、和の桁S=0、繰り上がりC=1。SはXOR（入力が異なるとき1）、CはAND（両方1のとき1）で作られる。A=0,B=1のときはS=1,C=0となる。"},{"id":"x17","f":"programming","t":"NAND回路","d":3,"q":"NAND回路（否定論理積）の出力が0になる入力の組合せとして正しいものを選べ。","c":["A=1、B=1 のときだけ0になる。","A=0、B=0 のときだけ0になる。","A と B が異なるときだけ0になる。","入力にかかわらず、常に0になる。"],"a":0,"e":"NANDはANDの出力をNOTで反転したもの。ANDは両方1のときだけ1なので、NANDは両方1のときだけ0になる。NANDだけを組み合わせるとAND・OR・NOTのすべてを作れるため、実際の集積回路で広く使われる。"},{"id":"x18","f":"programming","t":"論理回路の組合せ","d":3,"q":"入力A、BをAND回路に入れ、その出力をNOT回路に通した。この回路全体の出力が1になる入力の組合せとして正しいものを選べ。","c":["A=0、B=1 のとき（およびA、Bの少なくとも一方が0のとき）","A=1、B=1 のとき（両方がそろって1のときだけ出力が1になる）","A=0、B=0 のとき（両方がそろって0のときだけ出力が1になる）","入力の値にかかわらず、常に出力は1のまま変化しない"],"a":0,"e":"ANDの出力は両方1のときだけ1で、それをNOTで反転するので、両方1のときだけ0、それ以外は1になる（これがNAND）。回路を段階的にたどって出力を求める練習として、真理値表を書き出して確認するとよい。"},{"id":"s61","f":"society","t":"個人情報保護法","d":2,"q":"個人情報取扱事業者の義務として最も適当なものを選べ。","c":["取得した個人情報の利用目的をできる限り特定し、本人に通知または公表する。","取得した個人情報は、事業に有用であれば目的を定めずに自由に活用してよい。","個人情報の漏えいが起きても、被害が小さければ本人への連絡は不要である。","本人から開示を求められても、企業の判断で常に拒否することができる。"],"a":0,"e":"個人情報保護法は利用目的の特定と通知・公表を求めている。漏えい時には本人への通知や個人情報保護委員会への報告が必要な場合があり、本人には開示・訂正・利用停止を求める権利がある。"},{"id":"s62","f":"society","t":"産業財産権","d":2,"q":"産業財産権に含まれないものを選べ。","c":["著作権","特許権","意匠権","商標権"],"a":0,"e":"産業財産権は特許権・実用新案権・意匠権・商標権の4つで、特許庁への出願と登録が必要。著作権は知的財産権のうち著作物を守る権利で、創作した時点で自動的に発生する（無方式主義）点が大きく異なる。"},{"id":"s63","f":"society","t":"クリエイティブ・コモンズ","d":2,"q":"クリエイティブ・コモンズ・ライセンス（CCライセンス）の説明として最も適当なものを選べ。","c":["著作者が「この条件を守れば使ってよい」と意思表示するための仕組みである。","著作権を完全に放棄して、作品を法的な保護の対象外にする手続きである。","有料で著作物を販売するときにだけ使える、料金徴収のための仕組みである。","国が著作物を審査して品質を認定するために設けた公的な制度である。"],"a":0,"e":"CCライセンスは、著作権を保持したまま利用条件（表示BY・非営利NC・改変禁止ND・継承SA）を明示する仕組み。権利放棄ではなく、条件を守れば許諾を個別に取らずに使える点が利点。"},{"id":"s64","f":"society","t":"デジタルデバイド","d":2,"q":"デジタルデバイドの説明として最も適当なものを選べ。","c":["情報通信技術を利用できる人とできない人との間に生じる格差のことである。","デジタル機器が故障して使えなくなり、データが失われてしまう現象である。","デジタル情報を複数の装置に分散して保存し、安全性を高める技術である。","デジタル信号をアナログ信号に変換するときに生じる誤差のことである。"],"a":0,"e":"デジタルデバイドは、地域・年齢・経済状況などによって情報通信技術の利用機会や活用能力に差が生じ、受けられる恩恵に格差が生まれる問題。公共施設での支援や使いやすい設計などで解消が図られている。"},{"id":"s65","f":"society","t":"情報の信ぴょう性","d":2,"q":"インターネット上の情報を評価する方法として最も適当なものを選べ。","c":["発信者が誰かを確かめ、複数の独立した情報源と照らし合わせて確認する。","更新日時が新しい情報であれば、内容の確認をしなくても信頼してよい。","デザインが整っていて広告が少ないサイトであれば、内容は常に正確である。","多くの人が共有している情報は、それだけで正しさが証明されたといえる。"],"a":0,"e":"情報の評価では、発信者（誰が）・根拠（何をもとに）・日付（いつ）・目的（なぜ）を確認し、複数の独立した情報源でクロスチェックする。見た目や共有数は正確さの根拠にならない。"},{"id":"s66","f":"society","t":"生成AIの利用","d":2,"q":"生成AIを学習やレポート作成で使うときの姿勢として最も適当なものを選べ。","c":["出力に誤りが含まれる前提で、必ず根拠となる情報を自分で確認してから使う。","出力された文章は完成品なので、そのまま自分の作品として提出してよい。","AIが出力した内容は学習データに基づくので、必ず事実に一致している。","AIに入力した内容はどこにも残らないので、他人の個人情報も自由に入力できる。"],"a":0,"e":"生成AIはもっともらしい誤り（ハルシネーション）を出力することがあるため、事実確認が欠かせない。また入力内容が学習や運用に使われる可能性があるため、他人の個人情報や機密情報の入力は避ける。"},{"id":"s67","f":"society","t":"問題解決の評価","d":2,"q":"問題解決の過程における「評価」の役割として最も適当なものを選べ。","c":["実行した結果を目標と照らして確かめ、次の改善につなげるために行う。","計画どおりに実行できたことを確認して、そこで取り組みを終えるために行う。","失敗の責任が誰にあるかを明らかにして、担当者を決めるために行う。","評価は計画を立てる前に一度だけ行い、実行後には行わないものである。"],"a":0,"e":"問題解決はPDCA（計画→実行→評価→改善）のように循環する。評価は結果と目標のずれを確認し、原因を分析して次の計画に生かす工程で、責任追及のためのものではない。"},{"id":"s68","f":"society","t":"著作権の保護期間","d":3,"q":"日本における著作権（著作財産権）の保護期間の原則として正しいものを選べ。","c":["著作者の死後70年","著作者の死後30年","公表から10年","著作者が生きている間だけ"],"a":0,"e":"2018年の法改正で、原則として著作者の死後70年に延長された（改正前は50年）。保護期間が満了した著作物はパブリックドメインとなり、誰でも自由に利用できる。なお著作者人格権は一身専属的な権利である。"},{"id":"s69","f":"society","t":"情報セキュリティポリシー","d":3,"q":"組織の情報セキュリティポリシーの役割として最も適当なものを選べ。","c":["守るべき情報資産と対策の方針を組織として定め、全員が従う基準を示す。","技術的な対策だけを列挙し、人の行動に関する取り決めは対象外とする。","経営者だけが読む文書であり、一般の従業員に共有する必要はない。","一度策定すれば、環境が変わっても見直す必要がまったくない文書である。"],"a":0,"e":"情報セキュリティポリシーは、基本方針・対策基準・実施手順からなり、技術面と人的な運用面の両方を対象とする。全構成員に周知し、脅威や環境の変化に応じて定期的に見直すことが重要。"},{"id":"s70","f":"society","t":"ソーシャルエンジニアリング","d":2,"q":"ソーシャルエンジニアリングの手口に当たるものとして最も適当なものを選べ。","c":["情報システム部門の担当者を装って電話をかけ、パスワードを聞き出す。","通信を暗号化する鍵の候補を、コンピュータで片端から試して解読する。","公開されたソフトウェアの脆弱性を突いて、サーバに不正に侵入する。","大量の通信を集中させて、サーバを応答できない状態に追い込む。"],"a":0,"e":"ソーシャルエンジニアリングは、技術ではなく人の心理や行動の隙を突いて情報を得る手口。なりすまし電話、肩越しののぞき見、ごみ箱あさりなどがある。総当たり攻撃・不正侵入・DoS攻撃は技術的な攻撃。"},{"id":"s71","f":"society","t":"個人情報と匿名加工情報","d":3,"q":"個人情報を統計的に活用するための適切な扱いとして最も適当なものを選べ。","c":["特定の個人を識別できないよう加工し、復元もできない状態にして利用する。","氏名だけを削除すれば、住所や生年月日はそのまま残して公開してよい。","本人の同意があれば、加工をせずそのままの形で第三者に販売してよい。","統計に使う目的であれば、収集の段階で目的を伝えなくても問題ない。"],"a":0,"e":"匿名加工情報は、特定の個人を識別できず、かつ元の個人情報を復元できないように加工したもの。氏名の削除だけでは他の項目の組合せで個人を特定できる場合があり不十分。収集時の目的明示も必要。"},{"id":"s72","f":"society","t":"情報格差への配慮","d":2,"q":"だれもが使える公共の情報サービスを設計するときの配慮として最も適当なものを選べ。","c":["文字の拡大や読み上げに対応させ、多言語やふりがなの表示も選べるようにする。","最新の機器でしか動かない設計にして、利用者に機器の買い替えを促す。","操作を複雑にして、慣れた人だけが効率よく使えるように設計する。","情報はすべて画像として掲載し、文字データを含めないようにする。"],"a":0,"e":"アクセシビリティへの配慮として、文字サイズの変更、読み上げソフトへの対応、多言語・やさしい日本語の併記などがある。文字を画像化すると読み上げも検索もできなくなるため避ける。"},{"id":"d61","f":"digital","t":"標本化定理","d":3,"q":"音の標本化について、記録できる音の周波数の上限の説明として最も適当なものを選べ。","c":["標本化周波数の約半分までの周波数の音を記録することができる。","標本化周波数と同じ周波数までの音を、そのまま記録することができる。","標本化周波数の2倍までの周波数の音を記録することができる。","標本化周波数とは無関係に、どんな高さの音でも記録することができる。"],"a":0,"e":"標本化定理により、記録できるのは標本化周波数の半分未満の周波数まで。音楽CDが44.1kHzなのは、人の可聴域の上限約20kHzをカバーするため。これを超える音は正しく再現できず折り返し雑音の原因になる。"},{"id":"d62","f":"digital","t":"ランレングス圧縮","d":3,"q":"「AAAABBBCCCCCC」をランレングス法で圧縮した結果として正しいものを選べ。","c":["A4B3C6","ABC","A4B4C4","AAAABBBCCCCCC"],"a":0,"e":"ランレングス法は「同じ文字が何個続くか」を記録する可逆圧縮。Aが4個、Bが3個、Cが6個なのでA4B3C6。13文字が6文字になる。同じ値が連続するデータ（塗りつぶし画像やFAXなど）に有効だが、連続の少ないデータでは効果が薄い。"},{"id":"d63","f":"digital","t":"圧縮率の計算","d":2,"q":"元のデータ量が2.5MBのファイルを圧縮したところ0.5MBになった。圧縮率（圧縮後÷圧縮前）として正しいものを選べ。","c":["20％","25％","50％","80％"],"a":0,"e":"0.5÷2.5 = 0.2 = 20％。5分の1に圧縮されたことになる。なお「圧縮率」は文脈によって「どれだけ小さくなったか（80％削減）」を指す場合もあるので、問題文の定義を確認する習慣が大切。"},{"id":"d64","f":"digital","t":"可逆圧縮と非可逆圧縮","d":2,"q":"可逆圧縮を使うべきデータとして最も適当なものを選べ。","c":["プログラムのソースコードや表計算のデータなど、1ビットの違いも許されないもの","スマートフォンで撮影して友人に送るだけの、日常的な記念写真の画像データなど","動画配信サービスで視聴するだけの、長時間の映像データ","通話中の音声のように、その場で聞き取れれば十分な音のデータ"],"a":0,"e":"可逆圧縮は完全に元に戻せるため、1ビットでも変わると意味が壊れるプログラムや文書、表データに使う。画像・音声・動画は多少の情報が失われても知覚されにくいので、圧縮率の高い非可逆圧縮が向く。"},{"id":"d65","f":"digital","t":"文字コードとバイト数","d":2,"q":"UTF-8において、日本語のひらがな1文字が占めるバイト数として最も適当なものを選べ。","c":["3バイト","1バイト","2バイト","4バイト"],"a":0,"e":"UTF-8は可変長で、ASCII互換の英数字は1バイト、ひらがな・カタカナ・漢字の多くは3バイト、絵文字などは4バイトになる。日本語1文字＝2バイトはShift_JISやEUC-JPの場合で、文字コードにより異なる。"},{"id":"d66","f":"digital","t":"色の表現とビット数","d":2,"q":"1画素あたり24ビットのフルカラーで表現できる色数として正しいものを選べ。","c":["約1677万色","256色","65536色","24色"],"a":0,"e":"RGB各8ビットで24ビット。2の24乗＝16,777,216で約1677万色。8ビットなら256色、16ビットなら65536色（ハイカラー）。ビット数が増えるほど表現できる色は増えるがデータ量も増える。"},{"id":"d67","f":"digital","t":"解像度とデータ量","d":3,"q":"画像の縦横の画素数をどちらも2倍にしたとき、データ量はもとの何倍になるか。","c":["4倍","2倍","8倍","変わらない"],"a":0,"e":"画素数は縦×横なので、縦2倍・横2倍で総画素数は4倍になり、データ量も4倍。3倍にすれば9倍。面積で効いてくるため、解像度を上げるとデータ量は急激に増える点に注意する。"},{"id":"d68","f":"digital","t":"アナログとデジタル","d":2,"q":"アナログ情報をデジタル化する利点として最も適当なものを選べ。","c":["複製や伝送を繰り返しても品質が劣化せず、加工や検索も容易になる。","元の情報が持つ連続的な値を、まったく失うことなく完全に保存できる。","データ量が必ず小さくなるため、保存に必要な装置が不要になる。","一度記録すると変更できなくなるため、改ざんを完全に防止できる。"],"a":0,"e":"デジタル化の利点は劣化しない複製・伝送、加工や検索の容易さ、異なる種類の情報の統合。一方で標本化・量子化の際に必ず誤差が生じ、元の連続量を完全には保存できない（これが欠点でもある）。"},{"id":"d69","f":"digital","t":"情報デザインの構造化","d":2,"q":"多くの情報をわかりやすく伝えるための「構造化」の工夫として最も適当なものを選べ。","c":["内容を意味のまとまりに分け、見出しをつけて階層をはっきりさせる。","すべての情報を同じ大きさの文字で、区切らずに一続きに並べる。","重要な部分だけを強調し、それ以外の情報はすべて削除してしまう。","情報の順序を毎回変えて、読み手が飽きないように工夫する。"],"a":0,"e":"構造化は、情報を意味のまとまりに分け、見出しや階層、順序で関係を示す工夫。ほかに抽象化（ピクトグラムなど）、可視化（グラフや図）がある。一続きの文章は読み手の負担が大きい。"},{"id":"d70","f":"digital","t":"インフォグラフィックス","d":2,"q":"インフォグラフィックスの説明として最も適当なものを選べ。","c":["数値や関係をグラフや図・イラストで表し、直感的に理解できるようにしたもの。","文章をできるだけ多く詰め込み、情報量の多さを重視して作った資料のこと。","写真を芸術的に加工して、見た人の感情を動かすことだけを目的とした作品。","印刷物に使う専用の文字書体を、新しく設計する仕事のことを指す。"],"a":0,"e":"インフォグラフィックスは、データや情報を視覚的に表現して直感的な理解を助ける手法。可視化の一種で、正確さを保ちながら伝わりやすさを高めることが目的。装飾のための誇張は避ける。"},{"id":"d71","f":"digital","t":"ユーザビリティ","d":2,"q":"Webサイトのユーザビリティを高める工夫として最も適当なものを選べ。","c":["現在位置がわかる表示をつけ、どのページからでも目的の情報にたどり着けるようにする。","ページごとにメニューの位置と配色をそれぞれ変えて、変化に富んだ画面構成にする。","1つのページにすべての情報を詰め込み、リンクをできるだけ減らす。","操作に慣れが必要な独自の仕組みを取り入れ、常連の利用者を優遇する。"],"a":0,"e":"ユーザビリティは使いやすさの度合い。一貫したレイアウト、現在位置の明示（パンくずリスト）、わかりやすいラベル、明確なフィードバックなどが基本。一貫性を欠く設計は利用者を迷わせる。"},{"id":"d72","f":"digital","t":"２進法と16進法","d":2,"q":"2進法の「11010110」を16進法で表したものとして正しいものを選べ。","c":["D6","C6","B6","E6"],"a":0,"e":"4桁ずつ区切って1101と0110。1101は13でD、0110は6。よってD6。16進法は2進法の4桁をちょうど1桁で表せるため、長いビット列を短く読みやすく書ける。"},{"id":"d73","f":"digital","t":"２進法の加算","d":2,"q":"2進法の「1011」と「0110」を足した結果として正しいものを選べ。","c":["10001","10101","1101","11101"],"a":0,"e":"1011は11、0110は6で、合計17。17を2進法にすると10001。筆算では1+1=10（0を書いて1繰り上げ）として桁ごとに計算する。桁数が1つ増える繰り上がりに注意。"},{"id":"d74","f":"digital","t":"動画のデータ量","d":3,"q":"1フレーム0.5MBの画像を、毎秒30フレームで10秒間記録したときのデータ量として正しいものを選べ。","c":["150MB","15MB","300MB","5MB"],"a":0,"e":"0.5MB×30フレーム×10秒 = 150MB。動画のデータ量は「1フレームのデータ量×フレームレート×時間」で求まる。実際の動画はフレーム間の差分をとるなどの圧縮を行うため、これよりずっと小さくなる。"},{"id":"d75","f":"digital","t":"量子化誤差","d":3,"q":"量子化を行うときに必ず生じる誤差についての説明として最も適当なものを選べ。","c":["連続的な値を決まった段階に近似するため、元の値との差が必ず生じる。","記録する装置が故障している場合にだけ生じるので、修理すればなくせる。","量子化ビット数を増やすと誤差は大きくなり、音質は必ず悪化していく。","誤差は圧縮のときにだけ生じるもので、量子化そのものでは生じない。"],"a":0,"e":"量子化は連続量を有限の段階に割り当てる操作なので、必ず近似による誤差（量子化誤差）が生じる。ビット数を増やせば段階が細かくなり誤差は小さくなるが、ゼロにはならない。"},{"id":"d76","f":"digital","t":"メタデータ","d":2,"q":"写真データに付随するメタデータ（Exif情報）の説明として最も適当なものを選べ。","c":["撮影日時・機種・位置情報などが記録されており、公開時には注意が必要である。","画像の色を鮮やかにするための補正データで、削除すると画像が表示できない。","写真の著作権者が国に登録した情報で、変更や削除は法律で禁止されている。","画像を圧縮するための計算式が記録された部分で、閲覧者には見えない。"],"a":0,"e":"Exifには撮影日時・カメラ機種・設定に加えGPSによる位置情報が含まれることがあり、そのまま公開すると自宅や行動範囲が特定される恐れがある。SNS投稿前に削除する設定が推奨される。"},{"id":"d77","f":"digital","t":"ビットとバイト","d":2,"q":"1.5KB（キロバイト）は何ビットか。1KB=1000B、1B=8ビットとする。","c":["12000ビット","1500ビット","1200ビット","12ビット"],"a":0,"e":"1.5KB = 1500バイト。1バイト=8ビットなので1500×8 = 12000ビット。通信速度はbps（ビット毎秒）、記憶容量はB（バイト）で表すことが多く、8倍の差を意識して換算する。"},{"id":"d78","f":"digital","t":"色の三原色","d":2,"q":"ディスプレイでの色の表現について、正しい説明を選べ。","c":["光の三原色（赤・緑・青）を混ぜ、重ねるほど明るくなる加法混色である。","色の三原色（シアン・マゼンタ・黄）を混ぜ、重ねるほど暗くなる減法混色である。","赤・青・黄の3色を混ぜることで、すべての色を表現する仕組みである。","色は1色ずつしか表示できず、混ぜて中間色を作ることはできない。"],"a":0,"e":"ディスプレイは光の三原色RGBによる加法混色で、3色すべてを最大にすると白になる。プリンタはインクの色の三原色CMY（＋黒K）による減法混色で、重ねるほど暗くなる。"},{"id":"d79","f":"digital","t":"パリティビット","d":3,"q":"偶数パリティで「1011010」にパリティビットを付加するとき、付加するビットとして正しいものを選べ。","c":["0","1","2","付加しない"],"a":0,"e":"1の個数は1,1,1,1で4個。偶数パリティは1の総数を偶数に保つので、すでに偶数の4個なら0を付加する。パリティビットは1ビットの誤りを検出できるが、訂正はできず、2ビット同時の誤りは見逃す。"},{"id":"d80","f":"digital","t":"フォントと可読性","d":2,"q":"資料の可読性を高める書体の使い方として最も適当なものを選べ。","c":["本文は読みやすい書体で統一し、強調は太さやサイズの変化で表す。","1ページの中でできるだけ多くの種類の書体を使い、変化をつける。","本文もすべて装飾的な書体にして、資料全体の印象を華やかにする。","文字の間隔と行の間隔をできるだけ詰めて、余白をなくして配置する。"],"a":0,"e":"書体は原則1〜2種類に絞り、強調はウェイトやサイズ、色で行う。適切な字間・行間と余白は読みやすさを大きく左右する。装飾的な書体は見出しなど短い箇所に限って使う。"},{"id":"p61","f":"programming","t":"シミュレーションのモデル","d":2,"q":"確定的モデルと確率的モデルの違いの説明として最も適当なものを選べ。","c":["確定的モデルは同じ条件なら常に同じ結果になり、確率的モデルは乱数を使うため結果がばらつく。","確定的モデルは乱数を使って結果を求め、確率的モデルは数式だけで結果を一つに定める。","どちらも同じ結果しか出さないので、実際には区別する意味がまったくない。","確率的モデルは結果がばらつくため、シミュレーションには使ってはいけない。"],"a":0,"e":"物体の落下のように法則で結果が定まるのが確定的モデル。レジの待ち行列や天候のように偶然が絡むものは確率的モデルで、乱数を使い何度も試行して傾向を調べる。"},{"id":"p62","f":"programming","t":"乱数の範囲","d":2,"q":"「乱数()」が0以上1未満の小数を返すとき、1以上10以下の整数を作る式として正しいものを選べ。","c":["整数(乱数() * 10) + 1","整数(乱数() * 10)","整数(乱数() * 11) + 1","整数(乱数() * 9) + 1"],"a":0,"e":"乱数()×10は0以上10未満。整数()で切り捨てると0〜9になり、+1で1〜10。上限が含まれるかどうかを必ず境界で確かめること。掛ける数は「作りたい値の個数」になる。"},{"id":"p63","f":"programming","t":"待ち行列のシミュレーション","d":3,"q":"レジの待ち行列をシミュレーションで調べる利点として最も適当なものを選べ。","c":["実際に店舗で試さなくても、条件を変えたときの影響を安全かつ低コストに調べられる。","実際に試すよりも必ず正確な結果が得られるので、実測はまったく不要になる。","乱数を使うので、将来その店で起きることを確実に言い当てることができる。","一度実行すれば結果が確定するため、繰り返し試行する必要がまったくない。"],"a":0,"e":"シミュレーションは、実際に試すのが困難・危険・高コストな場合に、条件を変えた比較検討を可能にする。ただしモデルは現実の単純化なので、結果は傾向の把握にとどまり、実測による検証が欠かせない。"},{"id":"p64","f":"programming","t":"モデル化の目的","d":2,"q":"モデル化を行う目的として最も適当なものを選べ。","c":["対象の本質的な要素だけを取り出して単純化し、扱いやすくして分析するため。","対象のあらゆる要素をもれなく再現し、現実とまったく同じものを作るため。","対象を実物より複雑にすることで、専門家にしか扱えないようにするため。","対象の見た目を美しく整えて、鑑賞するための作品に仕上げるため。"],"a":0,"e":"モデル化は目的に応じて必要な要素だけを取り出し、他を捨てて単純化する。何を残し何を捨てるかは目的次第で、現実の完全な再現を目指すものではない。図的・数式・物理モデルなどの表現方法がある。"},{"id":"p65","f":"programming","t":"線形探索の比較回数","d":2,"q":"要素が50個並んだ配列を線形探索するとき、目的の値が見つかるまでの最大の比較回数として正しいものを選べ。","c":["50回","25回","10回","1回"],"a":0,"e":"線形探索は先頭から順に調べるので、最後の要素にあるか存在しない場合に最大n回（この場合50回）。平均では約n/2回。整列されていれば二分探索が使え、50個なら最大6回程度で済む。"},{"id":"p66","f":"programming","t":"交換ソート","d":3,"q":"配列 [5, 3, 8, 1] に対して、隣り合う要素を比較して大きいほうを右へ送る操作を配列の左端から右端まで1回行った結果として正しいものを選べ。","c":["[3, 5, 1, 8]","[3, 5, 8, 1]","[1, 3, 5, 8]","[5, 3, 1, 8]"],"a":0,"e":"5と3を比較して交換→[3,5,8,1]、5と8はそのまま、8と1を交換→[3,5,1,8]。1回の走査で最大値8が右端に確定する。これを繰り返すのがバブルソートで、n個ならn−1回の走査で整列が完了する。"},{"id":"p67","f":"programming","t":"変数の値の追跡","d":2,"q":"次のプログラムを実行したとき、表示される値として正しいものを選べ。","code":"(1) a = 2\n(2) b = 3\n(3) a = a + b\n(4) b = a - b\n(5) 表示する(a, \"と\", b)","c":["5と2","2と3","5と3","3と2"],"a":0,"e":"(3)でa = 2+3 = 5。(4)ではこの新しいaを使うのでb = 5−3 = 2。よって「5と2」。代入は右辺を計算してから左辺に入れる操作であり、更新後の値が以降で使われる点に注意する。"},{"id":"p68","f":"programming","t":"二重の繰り返し","d":3,"q":"次のプログラムで「*」は合計何個表示されるか。","code":"(1) i を 1 から 3 まで 1 ずつ増やしながら繰り返す：\n(2) 　　j を 1 から 4 まで 1 ずつ増やしながら繰り返す：\n(3) 　　　　表示する(\"*\")","c":["12個","7個","4個","3個"],"a":0,"e":"外側が3回、そのたびに内側が4回動くので3×4 = 12個。二重ループの実行回数は掛け算になる。内側の繰り返し回数が外側の変数に依存する場合は、1回ずつ足し合わせて求める。"},{"id":"p69","f":"programming","t":"関数の利点","d":2,"q":"プログラムを関数に分けて書くことの利点として最も適当なものを選べ。","c":["同じ処理を何度も書かずに済み、修正するときも1か所を直せばよくなる。","プログラム全体の行数が必ず増えるので、内容が詳しく伝わるようになる。","関数にすると実行速度が必ず10倍になるため、処理時間が大幅に短くなる。","関数を使うと変数名を考える必要がなくなり、名前の重複が起こらなくなる。"],"a":0,"e":"関数化は、処理のまとまりに名前をつけて再利用できるようにする仕組み。重複がなくなり、修正箇所が1か所にまとまるため保守しやすい。処理内容を隠して全体の見通しをよくする効果もある。"},{"id":"p70","f":"programming","t":"配列の走査","d":2,"q":"次のプログラムを実行したとき、表示される値として正しいものを選べ。","code":"(1) Data = [4, 7, 2, 9, 5]\n(2) kosu = 0\n(3) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(4) 　　もし Data[i] ＞ 4 ならば：\n(5) 　　　　kosu = kosu + 1\n(6) 表示する(kosu)","c":["3","2","4","5"],"a":0,"e":"4より大きいのは7、9、5の3個（4自身は「＞4」を満たさない）。条件を「＞=4」にすると4も数えられて4個になる。境界の値を含むかどうかで結果が変わる典型例。"},{"id":"p71","f":"programming","t":"論理回路の組合せ","d":3,"q":"入力A、Bについて、NOT回路でAを反転させた値とBをAND回路に入れたとき、出力が1になる組合せとして正しいものを選べ。","c":["A=0、B=1","A=1、B=1","A=1、B=0","A=0、B=0"],"a":0,"e":"NOTでAが反転するので、Aが0のとき1になる。ANDは両方1のときだけ1なので、A=0かつB=1のときだけ出力1。回路は入力側から順に値を書き込んでたどると確実に解ける。"},{"id":"p72","f":"programming","t":"真理値表の読み取り","d":3,"q":"入力A、Bに対する出力が「A=0,B=0→1／A=0,B=1→0／A=1,B=0→0／A=1,B=1→0」となる回路として正しいものを選べ。","c":["NOR回路（否定論理和）","NAND回路（否定論理積）","XOR回路（排他的論理和）","AND回路（論理積）"],"a":0,"e":"ORは少なくとも一方が1なら1。その出力を反転したNORは、両方0のときだけ1になる。NANDは両方1のときだけ0、XORは異なるとき1。真理値表は出力が1（または0）になる行の特徴で見分ける。"},{"id":"p73","f":"programming","t":"論理演算と条件式","d":2,"q":"「xが0未満、または100より大きいとき」を表す条件式として正しいものを選べ。","c":["x ＜ 0 or x ＞ 100","x ＜ 0 and x ＞ 100","x ＞ 0 or x ＜ 100","not(x ＜ 0 or x ＞ 100)"],"a":0,"e":"「または」はorで結ぶ。andにすると0未満かつ100より大きい値が必要になり、そのような値は存在しないので条件は決して成立しない。範囲外を表す条件はorで書く点を押さえる。"},{"id":"p74","f":"programming","t":"アルゴリズムの表現","d":2,"q":"アルゴリズムを表現する方法として適当でないものを選べ。","c":["表計算ソフトのセルに数値だけを入力し、手順を書かずに保存する。","フローチャート（流れ図）で処理の流れを図として表す。","日本語の文章で手順を順番に箇条書きにする。","プログラミング言語を使ってプログラムとして記述する。"],"a":0,"e":"アルゴリズムは手順の表現なので、流れ図・箇条書き・擬似言語・プログラムなど複数の方法で書ける。数値だけを保存しても手順は表現されない。同じアルゴリズムを別の方法で表せることが重要。"},{"id":"p75","f":"programming","t":"シミュレーション結果の解釈","d":3,"q":"乱数を使ったシミュレーションを1回だけ実行して得た結果の扱い方として最も適当なものを選べ。","c":["1回の結果は偶然に大きく左右されるため、何度も実行して傾向を確かめる。","1回でもプログラムが正しければ、その結果をそのまま結論として採用してよい。","結果が予想と違った場合は、予想に合う結果が出るまで実行を繰り返す。","乱数を使った結果はすべて信用できないので、シミュレーションは使わない。"],"a":0,"e":"確率的モデルは実行のたびに結果が変わるため、多数回の試行の平均や分布で判断する。都合のよい結果が出るまで繰り返して採用するのは、結論をゆがめる不適切な扱い方である。"},{"id":"p76","f":"programming","t":"デバッグの方法","d":2,"q":"思ったとおりに動かないプログラムの原因を探す方法として最も適当なものを選べ。","c":["途中の変数の値を表示させ、どこから想定と違うのかを順に確かめる。","エラーが出た行をすべて削除して、動くようになるまで短くしていく。","プログラムを最初からすべて書き直し、原因は特定せずに作り直す。","動かない原因はコンピュータ側にあるので、機器の再起動だけを繰り返す。"],"a":0,"e":"デバッグでは、途中経過を表示して想定と実際が食い違う地点を絞り込むのが基本。処理を小さく分けて確認する、テストデータを変えて挙動を比べる、といった方法も有効。原因の特定を飛ばした書き直しは再発しやすい。"},{"id":"p77","f":"programming","t":"探索アルゴリズムの前提","d":3,"q":"二分探索を使うために必要な前提として正しいものを選べ。","c":["データがあらかじめ大きさの順に並んでいること。","データの個数が必ず偶数個であること。","データがすべて異なる値であること。","データが100個以上あること。"],"a":0,"e":"二分探索は中央の値と比べて探索範囲を半分に絞るため、整列済みであることが必須。整列されていなければ線形探索を使うか、先に整列する。個数の偶奇や重複の有無、規模は前提条件ではない。"},{"id":"p78","f":"programming","t":"フローチャートの記号","d":2,"q":"フローチャートで、条件によって処理の流れが分かれることを表す記号として正しいものを選べ。","c":["ひし形","長方形","平行四辺形","だ円"],"a":0,"e":"ひし形は判断（分岐）を表し、条件の真偽で流れが分かれる。長方形は処理、平行四辺形は入出力、だ円は開始と終了を表す。記号の意味を覚えると流れ図の読み取りが速くなる。"},{"id":"n61","f":"network","t":"共通鍵暗号と公開鍵暗号","d":3,"q":"共通鍵暗号方式の特徴として最も適当なものを選べ。","c":["暗号化と復号に同じ鍵を使い、処理は速いが鍵を安全に渡す方法が課題になる。","暗号化と復号に異なる鍵を使うため、鍵を相手に渡す必要がまったくない。","鍵を公開してよいので、通信相手が増えても必要な鍵の数は変わらない。","処理に時間がかかるため、大量のデータの暗号化には向いていない。"],"a":0,"e":"共通鍵暗号は同じ鍵で暗号化・復号し高速だが、鍵の受け渡し（鍵配送問題）と、相手ごとに鍵が必要で数が増える点が課題。公開鍵暗号は鍵配送を解決するが処理が遅く、両者を組み合わせるのが一般的。"},{"id":"n62","f":"network","t":"ハイブリッド暗号","d":3,"q":"SSL/TLSなどで共通鍵暗号と公開鍵暗号を組み合わせて使う理由として最も適当なものを選べ。","c":["公開鍵暗号で共通鍵を安全に渡し、その後は高速な共通鍵暗号で本文をやり取りするため。","公開鍵暗号のほうが処理が速いので、大量のデータをすべて公開鍵暗号で送るため。","2種類使うと暗号の強度が単純に2倍になり、解読が不可能になるため。","法律で2種類以上の暗号方式を使うことが義務づけられているため。"],"a":0,"e":"公開鍵暗号は鍵配送の問題を解決できるが処理が遅い。そこで最初に公開鍵暗号で共通鍵を安全に共有し、以後の大量のデータは高速な共通鍵暗号で暗号化する。互いの短所を補う組合せである。"},{"id":"n63","f":"network","t":"IPアドレスとドメイン名","d":2,"q":"DNSの役割として最も適当なものを選べ。","c":["ドメイン名をIPアドレスに変換し、目的のサーバに接続できるようにする。","IPアドレスを暗号化して、通信の内容を第三者から守る働きをする。","パケットの経路を選び、次にどの機器へ送るかを決める働きをする。","Webページの内容を解釈して、画面に表示する働きをする。"],"a":0,"e":"DNS（Domain Name System）はドメイン名とIPアドレスを対応づける仕組み。人が覚えやすい名前で通信できるようにする。経路選択はルータ、ページの表示はブラウザの役割。"},{"id":"n64","f":"network","t":"パケットのヘッダ","d":2,"q":"パケットに付加されるヘッダに含まれる情報として最も適当なものを選べ。","c":["送信元と宛先のアドレス、そのパケットが何番目かを示す番号など。","そのパケットを開くために必要な、利用者のパスワードの情報。","通信料金を計算するための、契約者の氏名と住所の情報。","送信者が使っている機器の製造番号と購入日の情報。"],"a":0,"e":"ヘッダには宛先・送信元アドレス、順序番号、誤り検出用の情報などが含まれる。受信側はこれを使ってパケットを正しい順序に組み立て直す。パスワードや個人情報が入るわけではない。"},{"id":"n65","f":"network","t":"プロトコルの役割","d":2,"q":"プロトコルが必要な理由として最も適当なものを選べ。","c":["異なる機器やソフトウェアどうしが、共通の手順に従うことで通信できるようにするため。","通信の速度を機器ごとに変えることで、性能の高い機器を優先して通信させるため。","通信内容を必ず暗号化して、第三者に読まれないようにするため。","1台の機器が同時に複数の通信を行えないように制限するため。"],"a":0,"e":"プロトコルは通信の約束事。同じ手順に従うことで、メーカーや機種、OSが違っても通信できる。HTTP、TCP/IP、SMTPなど役割ごとに定められ、階層に分けて組み合わせて使われる。"},{"id":"n66","f":"network","t":"データの尺度","d":3,"q":"「学年（1年・2年・3年）」のようなデータの尺度として正しいものを選べ。","c":["順序尺度（順序に意味はあるが、間隔には意味がない）","名義尺度（区別のためだけで、順序に意味はない）","間隔尺度（目盛りの間隔が等しく、0が絶対的でない）","比例尺度（0が絶対的で、比にも意味がある）"],"a":0,"e":"学年は「1年＜2年＜3年」と順序に意味があるが、差が等間隔とは限らないので順序尺度。血液型や性別は名義尺度、気温や西暦は間隔尺度、身長や金額は比例尺度。尺度により使える集計方法が変わる。"},{"id":"n67","f":"network","t":"代表値の選択","d":2,"q":"外れ値の影響を受けにくい代表値として最も適当なものを選べ。","c":["中央値","平均値","合計値","最大値"],"a":0,"e":"中央値は値を並べたときの真ん中なので、極端に大きい（小さい）値があっても位置がほとんど動かない。平均値はすべての値を計算に使うため外れ値に引っ張られる。年収や地価の分析で中央値が使われるのはこのため。"},{"id":"n68","f":"network","t":"回帰直線の意味","d":3,"q":"散布図に引かれた回帰直線の説明として最も適当なものを選べ。","c":["点全体の傾向を最もよく表すように引いた直線で、予測の目安に使える。","すべての点を必ず通るように引いた直線で、どの点も直線上に乗る。","最も大きい値と最も小さい値の2点だけを結んで引いた直線である。","散布図の中心を通る、常に傾き1の直線として定義されている。"],"a":0,"e":"回帰直線は各点との誤差が最小になるように引く直線（最小二乗法）。傾向を表し予測の目安になるが、すべての点を通るわけではなく、データの範囲外への当てはめ（外挿）は信頼性が下がる。"},{"id":"n69","f":"network","t":"相関係数の範囲","d":2,"q":"相関係数がとりうる値の範囲として正しいものを選べ。","c":["−1以上1以下","0以上1以下","−100以上100以下","制限はなく、どんな値もとりうる"],"a":0,"e":"相関係数rは−1≦r≦1。1に近いほど強い正の相関、−1に近いほど強い負の相関、0に近いと相関が弱い。絶対値が大きいほど直線的な関係が強いが、曲線的な関係は捉えられない点に注意。"},{"id":"n70","f":"network","t":"データのクレンジング","d":2,"q":"収集したデータの前処理（クレンジング）で行うこととして最も適当なものを選べ。","c":["表記のゆれを統一し、明らかな入力ミスや重複した行を取り除く。","仮説に合わない値をすべて削除して、都合のよいデータだけを残す。","欠損した値には適当な数値を入れて、必ず全項目を埋めてから分析する。","分析に時間がかかるので、データの半分を無作為に捨ててから始める。"],"a":0,"e":"クレンジングは表記ゆれの統一、重複・明らかな誤りの除去、欠損値の適切な扱いなど、分析できる形に整える作業。仮説に合わない値を恣意的に削除するのは分析の偽装にあたる。"},{"id":"n71","f":"network","t":"クロス集計","d":3,"q":"人数の異なる2つのグループを比較するときの集計方法として最も適当なものを選べ。","c":["それぞれのグループ内での割合に直してから比較する。","人数の多いグループの値をそのまま使い、少ないほうは無視する。","両方のグループの人数を同じにするため、多いほうから無作為に削る。","人数の差は考えず、回答した人数の絶対値だけで比較する。"],"a":0,"e":"母数が異なる集団の比較は、行ごとの割合（相対度数）に直すのが基本。人数の絶対値で比べると、単に人数が多いグループが常に多く見えてしまい、傾向を読み誤る。"},{"id":"n72","f":"network","t":"無作為抽出","d":2,"q":"標本調査で無作為抽出を行う理由として最も適当なものを選べ。","c":["特定の性質を持つ人に偏らないようにして、母集団の傾向を正しく推定するため。","調査に協力してくれそうな人をあらかじめ選んでおき、全体の回答率を高めるため。","調査する人数を減らして、集計にかかる時間を短くするため。","調査する側の予想に近い結果が得られるようにするため。"],"a":0,"e":"無作為抽出は、母集団のすべての要素が等しい確率で選ばれるようにする方法。偏った選び方をすると、標本をいくら増やしても母集団の姿を正しく反映しない（選択バイアス）。"},{"id":"n73","f":"network","t":"オープンデータ","d":2,"q":"オープンデータの説明として最も適当なものを選べ。","c":["だれもが自由に利用・再配布でき、機械で読み取りやすい形式で公開されたデータ。","公開はされているが、閲覧のみが許され、加工や再配布は禁止されたデータ。","特定の企業の社員だけが業務のために利用できる、社外秘のデータ。","個人情報を含んだまま公開されている、匿名化されていないデータ。"],"a":0,"e":"オープンデータは、自由な利用・再配布が認められ、機械判読に適した形式（CSVなど）で公開されるデータ。国や自治体の統計が代表例で、二次利用によって新たな価値を生むことが期待されている。"},{"id":"n74","f":"network","t":"データベースの主キー","d":2,"q":"関係データベースにおける主キーの説明として最も適当なものを選べ。","c":["表の各行を一意に識別できる項目で、重複や空欄があってはならない。","表の中で最も件数が多い項目のことで、検索を速くするために設定する。","他の表と共有される項目で、必ず氏名を設定することになっている。","データを並べ替えるときに使う項目で、後から自由に変更してよい。"],"a":0,"e":"主キーは各行を一意に特定する項目で、重複値やNULL（空欄）は許されない。氏名は同姓同名がありうるため不適切で、学籍番号や商品コードのような一意の値を使う。他の表を参照する項目は外部キーという。"},{"id":"n75","f":"network","t":"ネットワークの構成","d":2,"q":"クライアントサーバシステムの説明として最も適当なものを選べ。","c":["サービスを提供するサーバに、複数のクライアントが要求を出して応答を受け取る。","すべての機器が対等で、サーバを置かずに直接データをやり取りする方式である。","1台のサーバが1台のクライアントとだけ、専用回線で通信する方式である。","クライアントがすべての処理を行い、サーバはデータを保存しない方式である。"],"a":0,"e":"クライアントサーバ方式では、サーバが機能やデータを集中管理し、多数のクライアントの要求に応える。管理しやすい反面、サーバが停止すると影響が大きい。すべての機器が対等な方式はピアツーピア。"},{"id":"n76","f":"network","t":"通信の誤り検出","d":3,"q":"通信の途中で生じた誤りに備える仕組みの説明として最も適当なものを選べ。","c":["あらかじめ余分な情報（冗長性）を付けておき、受信側で誤りを検出・訂正する。","送信するデータ量をあらかじめ減らすことで、誤りが起こる確率をゼロにする。","誤りが起きたパケットは自動的に消え、受信側では何も起こらない。","誤りは受信側でしか起こらないので、送信側では対策の必要がない。"],"a":0,"e":"パリティビット、チェックサム、誤り訂正符号などは、余分な情報を付けて誤りを検出したり訂正したりする。QRコードの一部が汚れても読めるのも同じ考え方。通信路の誤りをゼロにはできない。"},{"id":"n77","f":"network","t":"IoT","d":2,"q":"IoT（Internet of Things）の説明として最も適当なものを選べ。","c":["家電やセンサなど、さまざまな「もの」がネットワークにつながり情報をやり取りする仕組み。","インターネット上の情報を検索して、必要なページを探し出すための技術である。","複数の人が同時に同じ文書を編集できるようにする、共同作業のための仕組みである。","インターネットの通信内容をすべて記録して保存しておく制度のことである。"],"a":0,"e":"IoTは、機器やセンサがネットワークにつながって情報を収集・交換し、自動制御や分析に活用される仕組み。大量のデータ（ビッグデータ）の源となる一方、セキュリティやプライバシーの課題も生む。"},{"id":"n78","f":"network","t":"ビッグデータ","d":2,"q":"ビッグデータの特徴として最も適当なものを選べ。","c":["量が多く、種類が多様で、発生や更新の速度が速いという特徴を持つ。","量が多いだけで、すべて同じ形式の数値データに統一されている。","少数の専門家だけが作成した、正確さの保証された小規模なデータである。","分析しなくても、集めた時点で自動的に価値が生まれるデータである。"],"a":0,"e":"ビッグデータは量（Volume）・多様性（Variety）・速度（Velocity）で特徴づけられる。テキストや画像などの非構造化データも含む。集めるだけでは価値にならず、分析して意思決定に生かして初めて意味を持つ。"},{"id":"n79","f":"network","t":"箱ひげ図と四分位数","d":3,"q":"箱ひげ図の「箱」が表す範囲として正しいものを選べ。","c":["第1四分位数から第3四分位数までで、データのおよそ中央半分が含まれる。","最小値から最大値までで、すべてのデータが含まれる範囲を表す。","平均値を中心として、標準偏差の分だけ左右に広げた範囲を表す。","中央値のみを表しており、範囲としての意味は持っていない。"],"a":0,"e":"箱はQ1からQ3までで、その幅が四分位範囲。データのおよそ真ん中50％が入る。箱の中の線は中央値、ひげは（外れ値を除いた）最小・最大まで伸びる。箱が長いほどばらつきが大きい。"},{"id":"n80","f":"network","t":"時系列データの読み取り","d":2,"q":"月ごとの売上を折れ線グラフで表すときの注意点として最も適当なものを選べ。","c":["縦軸の目盛りの始まりを確認する。0から始まっていないと変化が大きく見える。","値の大きい順に並べ替えてから描くと、変化の傾向がわかりやすくなる。","線を曲線で滑らかにつなぐと、実際の測定値より正確な値が読み取れる。","折れ線グラフでは目盛りの間隔を自由に変えても、印象は変わらない。"],"a":0,"e":"縦軸を途中から始めると小さな変化が大きく見える。時系列データは時間順に並べることに意味があり、値の順に並べ替えると変化の傾向が失われる。軸の設定はグラフの印象を大きく左右する。"}];
</script>
<script>
/* ===== アプリ本体 v3 ===== */
const LS_KEY="joho1_records_v1", FOLD_KEY="joho1_fold_v1";
let store=loadStore(), quiz=null, timerId=null;
let state={screen:"home", guideChapter:1};

function loadStore(){ try{const s=JSON.parse(localStorage.getItem(LS_KEY)); return (s&&s.q)?s:{q:{},sessions:[]};}catch(e){return {q:{},sessions:[]};} }
function saveStore(){ try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){} }
function loadFold(){ try{return JSON.parse(localStorage.getItem(FOLD_KEY))||{};}catch(e){return {};} }
function saveFold(f){ try{localStorage.setItem(FOLD_KEY,JSON.stringify(f));}catch(e){} }
function isFolded(k){ const f=loadFold(); return f[k]===true; }
function toggleFold(k){ const f=loadFold(); f[k]=!f[k]; saveFold(f); render(); }
function recordAnswer(id,ok){ if(!store.q[id])store.q[id]={c:0,w:0}; if(ok)store.q[id].c++; else store.q[id].w++; saveStore(); }
function shuffle(a){const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]];} return r;}
function qById(id){ return QUESTIONS.find(q=>q.id===id); }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

/* ---- 大問の定義（情報Ⅰ 共通テストの構成に対応） ---- */
const DAIMON={
 1:{name:"第1問 小問集合", icon:"📝", pt:"20点", fields:["society","digital","programming","network"], maxD:2},
 2:{name:"第2問 情報デザイン・デジタル化", icon:"🎨", pt:"30点", fields:["society","digital"]},
 3:{name:"第3問 プログラミング", icon:"💻", pt:"25点", fields:["programming"]},
 4:{name:"第4問 データ活用・ネットワーク", icon:"📊", pt:"25点", fields:["network","graph"]}
};
function daimonPool(d){
  const info=DAIMON[d];
  return QUESTIONS.filter(q=>info.fields.includes(q.f) && !q.setId && (!info.maxD||q.d<=info.maxD));
}
function daimonRate(d){
  let c=0,w=0;
  daimonPool(d).forEach(q=>{const r=store.q[q.id]; if(r){c+=r.c; w+=r.w;}});
  return (c+w)===0?null:Math.round(c/(c+w)*100);
}
/* ---- セット（会話文・本番形式） ---- */
function allSets(){
  const ids=[...new Set(QUESTIONS.filter(q=>q.setId).map(q=>q.setId))];
  return ids.map(sid=>{
    const qs=QUESTIONS.filter(q=>q.setId===sid);
    const head=qs[0];
    const d = head.f==="exam" ? (["ex3","ex8","ex9"].includes(sid)?2:(["ex1","ex4","ex5","ex12","ex13"].includes(sid)?3:4)) : (head.f==="passage"?2:2);
    return {id:sid, title:(head.passageTitle||head.t).replace(/^第\d問形式：/,""), d, n:qs.length,
            img:qs.some(q=>q.chart), kind:head.f==="exam"?"本番形式":"会話文", qs};
  }).sort((a,b)=>a.d-b.d||a.id.localeCompare(b.id));
}
function setDone(sid){
  const qs=QUESTIONS.filter(q=>q.setId===sid);
  let c=0,w=0; qs.forEach(q=>{const r=store.q[q.id]; if(r){c+=r.c;w+=r.w;}});
  return (c+w)===0?null:Math.round(c/(c+w)*100)+"%";
}
/* ---- 苦手リスト・習熟段階 ---- */
function wrongList(){ return QUESTIONS.filter(q=>{const r=store.q[q.id]; return r&&r.w>r.c;}).sort((a,b)=>store.q[b.id].w-store.q[a.id].w); }
function clearWrong(){ if(confirm("苦手リストをすべて消去します。よろしいですか？")){ Object.keys(store.q).forEach(k=>{const r=store.q[k]; if(r.w>r.c) delete store.q[k];}); saveStore(); render(); } }
function clearStats(){ if(confirm("これまでの記録をすべて消去します。よろしいですか？")){ store={q:{},sessions:[]}; saveStore(); render(); } }
function totalStat(){ let t=0,o=0; Object.values(store.q).forEach(r=>{t+=r.c+r.w; o+=r.c;}); return {t,o}; }
function skillStage(){ const t=totalStat().t; return t<60?0:(t<200?1:2); }
const STAGE_NAME=["基礎固め","標準演習","実践レベル"];
const STAGE_DESC=["基礎・標準問題を中心に出題","標準・発展問題を中心に出題","発展問題と本番形式を中心に出題"];
const STAGE_NEXT=["60問解くと標準演習に進みます","200問解くと実践レベルに進みます","最高段階です。本番形式で仕上げましょう"];

/* ===== 出題傾向と対策 ===== */
const GUIDES=[
{title:"第1問 小問集合", icon:"📝", badge:"配点 20点",
 sections:[

/* ===== 出題モード ===== */
function startMode(mode,arg){
  if(mode==="mock"){ startMock(); return; }
  let ids=[], label=mode;
  if(mode==="wrong"){ ids=wrongList().slice(0,20).map(q=>q.id); }
  else if(mode==="daily"){
    const st=skillStage();
    const lv=st===0?[1,2]:(st===1?[2,3]:[3]);
    let pool=QUESTIONS.filter(q=>lv.includes(q.d)&&!q.setId);
    if(st===2) pool=pool.concat(QUESTIONS.filter(q=>q.f==="exam"));
    ids=shuffle(pool).slice(0,5).map(q=>q.id);
  }
  else if(mode==="daimon"){
    const pool=daimonPool(arg);
    const pick=(d,n)=>shuffle(pool.filter(q=>q.d===d)).slice(0,n);
    let sel=[...pick(1,4),...pick(2,4),...pick(3,2)];
    if(sel.length<10) sel=sel.concat(shuffle(pool.filter(q=>!sel.includes(q))).slice(0,10-sel.length));
    ids=sel.sort((a,b)=>a.d-b.d).map(q=>q.id);
    label="daimon"+arg;
  }
  else if(mode==="set"){ ids=QUESTIONS.filter(q=>q.setId===arg).map(q=>q.id); }
  else if(mode==="standard"){ ids=shuffle(QUESTIONS.filter(q=>q.d===2&&!q.setId)).slice(0,20).map(q=>q.id); }
  else if(mode==="challenge"){ ids=shuffle(QUESTIONS.filter(q=>q.d===3)).slice(0,15).map(q=>q.id); }
  else if(mode==="mix"){ ids=shuffle(QUESTIONS).slice(0,12).map(q=>q.id); }
  else if(mode==="test30"){
    const p=d=>shuffle(QUESTIONS.filter(q=>q.d===d&&!q.setId));
    ids=[...p(1).slice(0,10),...p(2).slice(0,14),...p(3).slice(0,6)].map(q=>q.id);
  }
  if(!ids.length){ alert("出題できる問題がありません。"); return; }
  beginSession(ids,label);
}
function beginSession(ids,label){
  quiz={ids,idx:0,correct:0,fieldKey:label,results:[],start:Date.now()};
  showQuizScreen(); startTimer(); renderQuestion();
}
function startMock(){
  if(!confirm("共通テスト模試を開始します。\n・制限時間60分／100点満点\n・第1問(20点)＋第2問(30点)＋第3問(25点)＋第4問(25点)\n・残り時間が0になると自動的に採点されます。\nよろしいですか？")) return;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const sidP2=pick(["ex3","ex8","ex9"]), sidP3=pick(["ex1","ex4","ex5","ex12","ex13"]), sidP4=pick(["ex2","ex6","ex7","ex10","ex11"]);
  const small=shuffle(QUESTIONS.filter(q=>["society","digital","network"].includes(q.f)&&q.d<=2&&!q.m&&!q.type&&!q.setId)).slice(0,8);
  const psgIds=[...new Set(QUESTIONS.filter(q=>q.f==="passage").map(q=>q.setId))];
  const psgSid=pick(psgIds);
  const psg=QUESTIONS.filter(q=>q.f==="passage"&&q.setId===psgSid).slice(0,3);
  const sec=[
    {name:"第1問（小問集合）",max:20,ids:small.map(q=>q.id),ptsEach:2.5},
    {name:"第2問（情報デザイン・デジタル化）",max:30,ids:[...QUESTIONS.filter(q=>q.setId===sidP2).map(q=>q.id),...psg.map(q=>q.id)],psgPts:5},
    {name:"第3問（プログラミング）",max:25,ids:QUESTIONS.filter(q=>q.setId===sidP3).map(q=>q.id)},
    {name:"第4問（データ活用・ネットワーク）",max:25,ids:QUESTIONS.filter(q=>q.setId===sidP4).map(q=>q.id)}
  ];
  quiz={ids:sec.flatMap(s=>s.ids),idx:0,correct:0,fieldKey:"mock",results:[],mock:true,sections:sec,points:0,secPoints:sec.map(()=>0),start:Date.now(),limit:3600};
  showQuizScreen(); startTimer(); renderQuestion();
}
function showQuizScreen(){
  document.getElementById("app").innerHTML=`
    <div id="timer-area"></div>
    <div class="card">
      <div class="progress"><span id="prog-bar" style="width:0%"></span></div>
      <div class="pnum" id="prog-num"></div>
      <div class="elapsed" id="elapsed"></div>
      <div id="q-section"></div><div id="q-passage"></div>
      <div class="meta" id="q-meta"></div><div class="qtext" id="q-text"></div>
      <div id="q-code"></div><div id="q-chart"></div>
      <div class="choices" id="q-choices"></div><div id="q-bank"></div><div id="q-gradebtn"></div>
      <div id="q-judge"></div><div id="q-expl"></div>
      <div class="toolbar">
        <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">次の問題へ</button>
        <button class="btn btn-ghost" onclick="quitQuiz()">中断してホームへ</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function mockSectionOf(i){ let n=0; for(let s=0;s<quiz.sections.length;s++){ n+=quiz.sections[s].ids.length; if(i<n) return s; } return quiz.sections.length-1; }
function currentQ(){ return qById(quiz.ids[quiz.idx]); }

/* ---- タイマー ---- */
function startTimer(){
  stopTimer();
  const a=document.getElementById("timer-area");
  if(quiz.mock&&a) a.innerHTML=`<div class="timerbar" id="tbar"><span>共通テスト模試（100点満点）</span><span class="tm" id="tval">60:00</span></div>`;
  timerId=setInterval(tick,500); tick();
}
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }
function tick(){
  if(!quiz) return;
  const sec=Math.floor((Date.now()-quiz.start)/1000);
  const el=document.getElementById("elapsed");
  if(el&&!quiz.mock) el.textContent="経過時間 "+fmt(sec);
  if(quiz.mock){
    const rem=quiz.limit-sec, tv=document.getElementById("tval"), tb=document.getElementById("tbar");
    if(tv) tv.textContent=fmt(Math.max(0,rem));
    if(tb&&rem<=300) tb.classList.add("warn");
    if(rem<=0){ alert("試験時間が終了しました。ここまでの解答で採点します。"); finishQuiz(); }
  }
}
/* ---- 設問描画 ---- */
function renderQuestion(){
  const q=currentQ(), n=quiz.ids.length;
  document.getElementById("prog-bar").style.width=(quiz.idx/n*100)+"%";
  document.getElementById("prog-num").textContent=(quiz.idx+1)+" / "+n;
  const f=FIELDS[q.f]||{name:q.f}, dl=["","基礎","標準","発展"][q.d]||"";
  document.getElementById("q-section").innerHTML = quiz.mock?`<span class="sec-label">${quiz.sections[mockSectionOf(quiz.idx)].name}／配点 ${quiz.sections[mockSectionOf(quiz.idx)].max}点</span>`:"";
  document.getElementById("q-passage").innerHTML = q.passage?`<div class="passage-box"><div class="passage-title">${escapeHtml(q.passageTitle||"設定")}</div>${escapeHtml(q.passage)}</div>`:"";
  let m=`<span class="tag">${escapeHtml(f.name)}</span><span class="tag">${escapeHtml(q.t)}</span><span class="tag diff${q.d}">${dl}</span>`;
  if(q.m) m+=`<span class="tag" style="background:#ede9fe;color:#6d28d9;">${q.m}つ選ぶ</span>`;
  if(q.type==="bank") m+=`<span class="tag" style="background:#fce7f3;color:#be185d;">語群穴埋め</span>`;
  document.getElementById("q-meta").innerHTML=m;
  document.getElementById("q-text").innerHTML=escapeHtml(q.q).replace(/(適当でないもの|誤っているもの)/g,'<span class="negword">$1</span>');
  document.getElementById("q-code").innerHTML=q.code?`<pre class="code">${escapeHtml(q.code)}</pre>`:"";
  document.getElementById("q-chart").innerHTML=q.chart?`<div class="chart-box">${q.chart}</div>`:"";
  document.getElementById("q-judge").innerHTML=""; document.getElementById("q-expl").innerHTML="";
  document.getElementById("btn-next").classList.add("hidden");
  const box=document.getElementById("q-choices"), bank=document.getElementById("q-bank"), gb=document.getElementById("q-gradebtn");
  box.innerHTML=""; bank.innerHTML=""; gb.innerHTML="";
  if(q.type==="bank"){ renderBank(q,bank,gb); return; }
  const order=shuffle(q.c.map((_,i)=>i)); quiz.order=order;
  const marks=["ア","イ","ウ","エ","オ"];
  if(q.m){
    quiz.msel=new Set();
    order.forEach((oi,pos)=>{ const b=document.createElement("button"); b.className="choice";
      b.innerHTML=`<span class="mark">${marks[pos]}</span>`+escapeHtml(q.c[oi]); b.onclick=()=>toggleMulti(oi,b,q); box.appendChild(b); });
    const g=document.createElement("button"); g.className="btn btn-primary grade-btn"; g.id="btn-grade"; g.disabled=true;
    g.textContent="採点する"; g.onclick=()=>gradeMulti(q); gb.appendChild(g);
  }else{
    order.forEach((oi,pos)=>{ const b=document.createElement("button"); b.className="choice";
      b.innerHTML=`<span class="mark">${marks[pos]}</span>`+escapeHtml(q.c[oi]); b.onclick=()=>answerSingle(oi,b,q); box.appendChild(b); });
  }
}
function answerSingle(oi,btn,q){
  document.querySelectorAll("#q-choices .choice").forEach((b,i)=>{ b.disabled=true; if(quiz.order[i]===q.a) b.classList.add("reveal"); });
  btn.classList.add(oi===q.a?"sel-ok":"sel-ng");
  afterGrade(q,oi===q.a);
}
function toggleMulti(oi,btn,q){
  if(quiz.msel.has(oi)){ quiz.msel.delete(oi); btn.classList.remove("msel"); }
  else if(quiz.msel.size<q.m){ quiz.msel.add(oi); btn.classList.add("msel"); }
  document.getElementById("btn-grade").disabled=(quiz.msel.size!==q.m);
}
function gradeMulti(q){
  const A=new Set(q.a);
  const ok=quiz.msel.size===A.size&&[...quiz.msel].every(i=>A.has(i));
  document.querySelectorAll("#q-choices .choice").forEach((b,i)=>{ b.disabled=true; const oi=quiz.order[i];
    if(A.has(oi)) b.classList.add("m-hit"); else if(quiz.msel.has(oi)) b.classList.add("m-miss"); });
  document.getElementById("btn-grade").disabled=true;
  afterGrade(q,ok);
}
function renderBank(q,bank,gb){
  quiz.bankFill=q.blanks.map(()=>null); quiz.bankActive=0;
  const nums=["⓪","①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
  let h=`<div>`;
  q.blanks.forEach((b,i)=>{ h+=`<div class="blank-row"><span class="blank-lbl">${escapeHtml(b.label)}</span><button class="blank-slot" id="slot-${i}" onclick="setActiveBlank(${i})">タップして選択</button></div>`; });
  h+=`</div><div class="section-label">語群（同じものを繰り返し選んでもよい）</div><div class="bank-grid">`;
  q.bank.forEach((o,i)=>{ h+=`<button class="bank-chip" onclick="pickBank(${i})"><span class="mk">${nums[i]}</span>${escapeHtml(o)}</button>`; });
  h+=`</div>`; bank.innerHTML=h; updateBlankUI(q);
  const g=document.createElement("button"); g.className="btn btn-primary grade-btn"; g.id="btn-grade"; g.disabled=true;
  g.textContent="採点する"; g.onclick=()=>gradeBank(q); gb.appendChild(g);
}
function setActiveBlank(i){ if(quiz.graded)return; quiz.bankActive=i; updateBlankUI(currentQ()); }
function pickBank(oi){
  if(quiz.graded)return;
  const q=currentQ(); quiz.bankFill[quiz.bankActive]=oi;
  const nx=quiz.bankFill.findIndex(v=>v===null);
  quiz.bankActive=nx===-1?quiz.bankActive:nx;
  updateBlankUI(q);
  document.getElementById("btn-grade").disabled=quiz.bankFill.some(v=>v===null);
}
function updateBlankUI(q){
  const nums=["⓪","①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
  q.blanks.forEach((b,i)=>{ const el=document.getElementById("slot-"+i), v=quiz.bankFill[i];
    el.className="blank-slot"+(v!==null?" filled":"")+(i===quiz.bankActive?" active":"");
    el.textContent=v!==null?nums[v]+" "+q.bank[v]:"タップして選択"; });
}
function gradeBank(q){
  quiz.graded=true;
  const nums=["⓪","①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
  let ok=0;
  q.blanks.forEach((b,i)=>{ const el=document.getElementById("slot-"+i), hit=quiz.bankFill[i]===b.a;
    if(hit)ok++; el.className="blank-slot filled "+(hit?"b-ok":"b-ng");
    if(!hit) el.textContent+="（正解："+nums[b.a]+" "+q.bank[b.a]+"）"; });
  document.getElementById("btn-grade").disabled=true;
  afterGrade(q,ok===q.blanks.length,ok);
}
function afterGrade(q,ok,bankOK){
  quiz.graded=true; recordAnswer(q.id,ok); if(ok)quiz.correct++;
  let pts=0;
  if(quiz.mock){
    const s=mockSectionOf(quiz.idx), sec=quiz.sections[s];
    if(q.blanks){ q.blanks.forEach((b,i)=>{ if(quiz.bankFill[i]===b.a) pts+=q.pts[i]; }); }
    else if(sec.ptsEach) pts=ok?sec.ptsEach:0;
    else if(q.pts) pts=ok?q.pts[0]:0;
    else if(sec.psgPts&&q.f==="passage") pts=ok?sec.psgPts:0;
    quiz.points+=pts; quiz.secPoints[s]+=pts;
  }
  quiz.results.push({id:q.id,ok,pts});
  let msg=ok?"正解！":"不正解…";
  if(q.blanks&&!ok) msg=`不正解…（${bankOK} / ${q.blanks.length} 空欄正解）`;
  if(quiz.mock) msg+="　+"+pts+"点";
  document.getElementById("q-judge").innerHTML=`<div class="judge ${ok?"ok":"ng"}">${msg}</div>`;
  document.getElementById("q-expl").innerHTML=`<div class="expl">${escapeHtml(q.e)}</div>`;
  const nb=document.getElementById("btn-next");
  nb.classList.remove("hidden");
  nb.textContent=(quiz.idx===quiz.ids.length-1)?"結果を見る":"次の問題へ";
}
function nextQuestion(){ quiz.graded=false; if(quiz.idx<quiz.ids.length-1){ quiz.idx++; renderQuestion(); } else finishQuiz(); }
function quitQuiz(){ if(confirm("演習を中断してホームに戻りますか？（ここまでの解答は記録されます）")) goHome(); }

function finishQuiz(){
  stopTimer();
  const n=quiz.ids.length, used=Math.floor((Date.now()-quiz.start)/1000);
  const wrong=quiz.results.filter(r=>!r.ok);
  let h=`<div class="card">`;
  if(quiz.mock){
    const tot=Math.round(quiz.points*10)/10;
    let j;
    if(tot>=80) j="合格圏の得点力です。時間配分を保ちつつ発展問題の精度を上げましょう。";
    else if(tot>=70) j="7割を確保できています。第3問の失点を減らせば8割が見えます。";
    else if(tot>=50) j="基礎は固まっています。第2問・第4問の取りこぼしを減らすのが次の課題です。";
    else j="まずは「大問別演習」で第1問・第2問を固めましょう。傾向と対策のページも読んでみてください。";
    h+=`<h2 style="text-align:center">共通テスト模試 結果</h2><div class="score-big">${tot} / 100点</div>
      <table class="ptable"><tr><th>大問</th><th>得点</th><th>配点</th></tr>`;
    quiz.sections.forEach((s,i)=>{ h+=`<tr><td>${s.name}</td><td>${Math.round(quiz.secPoints[i]*10)/10}</td><td>${s.max}</td></tr>`; });
    h+=`</table><div class="mockjudge">所要時間：${fmt(used)} ／ 制限60:00<br>${j}</div>`;
  }else{
    const rate=Math.round(quiz.correct/n*100);
    let msg;
    if(rate===100) msg="全問正解！素晴らしい理解度です。";
    else if(rate>=80) msg="よくできています。間違えた問題を確認しておきましょう。";
    else if(rate>=60) msg="あと一歩。解説を読み直して「苦手だけ復習」で潰しましょう。";
    else msg="基礎から確認しましょう。解説を読んでからもう一度挑戦を。";
    h+=`<h2 style="text-align:center">結果</h2><div class="score-big">${quiz.correct} / ${n}問正解（${rate}%）</div>
      <div class="score-sub">${msg}（所要時間 ${fmt(used)}）</div>`;
  }
  if(wrong.length){
    h+=`<h3 style="font-size:.95rem;margin:16px 0 6px;">間違えた問題（苦手リストに登録済み）</h3><ul class="weak-list">`;
    wrong.forEach(r=>{ const q=qById(r.id); h+=`<li>${escapeHtml((FIELDS[q.f]||{name:q.f}).name)}｜${escapeHtml(q.t)}</li>`; });
    h+=`</ul>`;
  }
  h+=`<div class="toolbar" style="justify-content:center;">
    <button class="btn btn-primary" onclick="retrySame()">もう一度</button>
    <button class="btn btn-ghost" onclick="goHome()">ホームへ</button></div></div>`;
  document.getElementById("app").innerHTML=h;
  window.scrollTo(0,0);
}
function retrySame(){
  if(quiz.mock){ startMock(); return; }
  beginSession(shuffle(quiz.ids.slice()),quiz.fieldKey);
}
render();
</script>
