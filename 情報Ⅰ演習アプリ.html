許諾が必要。CDの購入は私的利用の範囲を認めるもので、公開の許諾ではない。フリーの楽曲や利用許諾を得た音源を使うのが安全。"},{"id":"psg6-2","f":"passage","t":"総合問題：学校紹介動画の配信","d":2,"setId":"psg6","passageTitle":"文化祭の学校紹介動画をネット配信する","passage":"広報班のGさんは、文化祭で流す3分間の学校紹介動画を制作し、卒業生や地域の人にも見てもらえるよう動画共有サイトで公開することにした。動画にはBGMとして市販の楽曲を使い、在校生へのインタビューや校舎の映像を含めている。公開にあたり、Gさんは著作権や個人情報の観点で問題がないか、顧問の先生と確認している。","q":"在校生へのインタビュー映像を公開する際の配慮として最も適当なものを選べ。","c":["映っている生徒本人（未成年の場合は保護者も）に、撮影内容と公開範囲を説明して同意を得る。","撮影に応じてくれた時点でインターネット公開にも同意したものとみなせるので、改めての確認は不要である。","顔にモザイクをかければ、本人への説明や同意は一切必要ない。","校内で撮影した映像なので、誰の同意も得ずに公開してよい。"],"a":0,"e":"インタビュー映像の公開は肖像権・プライバシーに関わる。撮影への協力と公開への同意は別であり、公開範囲（学内か、広く一般公開か）まで説明して同意を得るべき。未成年者の場合は保護者の同意も重要になる。"},{"id":"psg6-3","f":"passage","t":"総合問題：学校紹介動画の配信","d":2,"setId":"psg6","passageTitle":"文化祭の学校紹介動画をネット配信する","passage":"広報班のGさんは、文化祭で流す3分間の学校紹介動画を制作し、卒業生や地域の人にも見てもらえるよう動画共有サイトで公開することにした。動画にはBGMとして市販の楽曲を使い、在校生へのインタビューや校舎の映像を含めている。公開にあたり、Gさんは著作権や個人情報の観点で問題がないか、顧問の先生と確認している。","q":"校舎の映像を撮影・公開する際に、意図せず個人情報やプライバシーの問題が生じうる例として最も適当なものを選べ。","c":["背景に、生徒の名前と顔写真が貼られた掲示物や、名簿・時間割などが映り込んでしまう。","個人を特定できるものが何も写っておらず、校舎の外観だけがはっきりと映っている。","青空と校門だけが映っている。","誰もいない廊下の映像が映っている。"],"a":0,"e":"建物自体の映像は通常問題にならないが、背景に個人が特定できる掲示物（名前つきの表彰・名簿・顔写真など）が映り込むと、意図せず個人情報を公開してしまう。公開前に背景に不要な個人情報が映っていないか確認することが大切。"},{"id":"psg7-1","f":"passage","t":"総合問題：購買データの分析と活用","d":2,"setId":"psg7","passageTitle":"購買部の売上データを分析して品ぞろえを見直す","passage":"購買部の運営を手伝うHさんは、1か月分の販売記録（商品名・販売日時・数量）のデータを使って、売れ行きの傾向を分析することにした。データは表計算ソフトで管理されており、各行が1件の販売を表している。Hさんは、時間帯ごとの売上や、天気と売上の関係を調べて、仕入れの改善に役立てようとしている。","q":"分析を始める前に、Hさんはデータに「商品名の表記ゆれ（例：『メロンパン』と『めろんぱん』）」や「数量が空欄の行」があることに気づいた。まず行うべき処理として最も適当なものを選べ。","c":["表記を統一し、空欄（欠損値）の扱いを決めるなど、データを整えるデータクレンジングを行う。","表記ゆれや空欄はそのままにして、すぐに集計を始める。","気づいた問題のある行は、理由を確認せずすべて削除する。","分析に使うデータは多ければ多いほどよいので、明らかな入力ミスの行もそのまま残して分析する。"],"a":0,"e":"分析の前に、表記ゆれの統一や欠損値・重複・入力ミスの処理を行うデータクレンジングが必要。表記ゆれを放置すると同じ商品が別扱いで集計され、誤った結果になる。空欄も除外か補完か方針を決めてから分析する。"},{"id":"psg7-2","f":"passage","t":"総合問題：購買データの分析と活用","d":3,"setId":"psg7","passageTitle":"購買部の売上データを分析して品ぞろえを見直す","passage":"購買部の運営を手伝うHさんは、1か月分の販売記録（商品名・販売日時・数量）のデータを使って、売れ行きの傾向を分析することにした。データは表計算ソフトで管理されており、各行が1件の販売を表している。Hさんは、時間帯ごとの売上や、天気と売上の関係を調べて、仕入れの改善に役立てようとしている。","q":"Hさんは「気温」と「アイスの売上個数」の関係を調べ、相関係数0.75という強い正の相関を得た。この結果の活用のしかたとして最も適当なものを選べ。","c":["気温が高い日にアイスの仕入れを増やす一つの根拠にできるが、他の要因（曜日やイベント等）の影響も考え、実際に試して結果を検証する。","相関係数が0.75と高いので、気温の上昇こそがアイス売上増加の唯一かつ確実な原因であると断定してよい。他の要因を調べる必要はない。","相関があるので、気温を人工的に上げればアイスが売れると結論づける。","相関係数が1ではないため、気温と売上には何の関係もないと判断する。"],"a":0,"e":"強い正の相関は仕入れ判断の参考になるが、相関は因果を保証しない。曜日・イベント・天気など他の要因も影響しうるため、仮説として仕入れを調整し、結果を検証する（PDCA）姿勢が適切。相関だけで断定も否定もしない。"},{"id":"psg7-3","f":"passage","t":"総合問題：購買データの分析と活用","d":2,"setId":"psg7","passageTitle":"購買部の売上データを分析して品ぞろえを見直す","passage":"購買部の運営を手伝うHさんは、1か月分の販売記録（商品名・販売日時・数量）のデータを使って、売れ行きの傾向を分析することにした。データは表計算ソフトで管理されており、各行が1件の販売を表している。Hさんは、時間帯ごとの売上や、天気と売上の関係を調べて、仕入れの改善に役立てようとしている。","q":"時間帯ごとの売上個数の合計を比較し、どの時間帯に売上が集中しているかを視覚的に示すのに最も適したグラフを選べ。","c":["時間帯を横軸、売上個数を縦軸にした棒グラフ","全商品の売上構成比を示す円グラフ","2つの商品の相関を示す散布図","1件ごとの販売を点で示す箱ひげ図"],"a":0,"e":"時間帯という項目ごとの売上の大小を比較するには棒グラフが適する。円グラフは構成比、散布図は2変数の関係、箱ひげ図は分布のばらつきを見るのに適しており、目的に応じてグラフを選ぶことが重要。"},{"id":"psg8-1","f":"passage","t":"総合問題：出席確認プログラムの改善","d":2,"setId":"psg8","passageTitle":"委員会の出席を記録するプログラム","passage":"Iさんは、委員会の出席状況を記録するプログラムを作っている。委員20人の氏名は配列 Namae に、出席なら1・欠席なら0を記録する配列 Shusseki に、それぞれ同じ順番（同じ添字）で対応させて格納している。Iさんは、出席者の人数を数えたり、欠席者の氏名を表示したりする機能を追加しようとしている。","q":"出席者（Shussekiの値が1）の人数を数えるには、どのようなプログラムの考え方を使えばよいか、最も適当なものを選べ。","c":["カウント用の変数を0で初期化し、配列を先頭から順に調べ、値が1の要素に出会うたびに変数へ1を加える。","カウント用の変数を1で初期化しておき、条件に合う要素を見つけるたびに値を2倍していく。2倍にすれば速く数えられる。","配列の最後の要素の値だけを見れば、出席者数が分かる。","配列の要素数がそのまま出席者数になる。"],"a":0,"e":"条件を満たす要素の個数を数えるには、0で初期化したカウンタを用意し、条件（値が1）を満たすたびに1を加える「カウント」の手法を使う。配列の要素数（20）は委員全体の人数であり、出席者数とは異なる。"},{"id":"psg8-2","f":"passage","t":"総合問題：出席確認プログラムの改善","d":3,"setId":"psg8","passageTitle":"委員会の出席を記録するプログラム","passage":"Iさんは、委員会の出席状況を記録するプログラムを作っている。委員20人の氏名は配列 Namae に、出席なら1・欠席なら0を記録する配列 Shusseki に、それぞれ同じ順番（同じ添字）で対応させて格納している。Iさんは、出席者の人数を数えたり、欠席者の氏名を表示したりする機能を追加しようとしている。","q":"欠席者の氏名を表示する次のプログラムの空欄【ア】に入るものとして正しいものを選べ。（添字は0から始まる）","code":"i を 0 から 19 まで 1 ずつ増やしながら繰り返す：\n　　もし 【ア】 ならば：\n　　　　表示する(Namae[i])","c":["Shusseki[i] == 0","Shusseki[i] == 1","Namae[i] == 0","i == 0"],"a":0,"e":"欠席は Shusseki の値が0で表される。添字iの委員が欠席かどうかは Shusseki[i] == 0 で判定し、真ならその氏名 Namae[i] を表示する。NamaeとShussekiが同じ添字で対応していることを利用している。出席者を表示したいなら==1にする。"},{"id":"psg8-3","f":"passage","t":"総合問題：出席確認プログラムの改善","d":2,"setId":"psg8","passageTitle":"委員会の出席を記録するプログラム","passage":"Iさんは、委員会の出席状況を記録するプログラムを作っている。委員20人の氏名は配列 Namae に、出席なら1・欠席なら0を記録する配列 Shusseki に、それぞれ同じ順番（同じ添字）で対応させて格納している。Iさんは、出席者の人数を数えたり、欠席者の氏名を表示したりする機能を追加しようとしている。","q":"出席人数を数えたところ、実際より少なく表示された。原因として考えられるものとして最も適当なものを選べ。","c":["繰り返しの範囲が「0から18まで」になっているなど、最後の委員（添字19）が数えられていない可能性がある。","複数の値をまとめて扱う配列を使っているため、この方法で正しい人数を数えることは原理的に不可能である。","出席人数を数えるにはコンピュータの性能が足りないため。","氏名の配列 Namae が存在するため、出席者を数えられない。"],"a":0,"e":"添字0〜19の20人を数えるには繰り返しを0から19まで回す必要がある。範囲を「0から18まで」にすると最後の1人が数えられず、人数が1少なくなる。このような範囲の1つのずれ（オフバイワンエラー）は頻出のバグで、範囲の見直しが有効。"},{"id":"psg9-1","f":"passage","t":"総合問題【発展】：得点集計プログラムの追跡","d":3,"setId":"psg9","passageTitle":"6人の得点を処理するプログラム（発展）","passage":"Jさんは、6人の小テストの得点を配列 Tensu = [58, 72, 90, 45, 80, 63] に格納し、平均点を求めたうえで「平均点以上の人数」を数えるプログラムを作っている。以下の3問は、このプログラムの各段階について順に考えるものである。","q":"【設問1】まず、6人の平均点を求めよ。","c":["68点","72点","63点","408点"],"a":0,"e":"合計は 58+72+90+45+80+63 = 408。平均は 408 ÷ 6 = 68点。この平均点68を次の設問で使う。"},{"id":"psg9-2","f":"passage","t":"総合問題【発展】：得点集計プログラムの追跡","d":3,"setId":"psg9","passageTitle":"6人の得点を処理するプログラム（発展）","passage":"Jさんは、6人の小テストの得点を配列 Tensu = [58, 72, 90, 45, 80, 63] に格納し、平均点を求めたうえで「平均点以上の人数」を数えるプログラムを作っている。以下の3問は、このプログラムの各段階について順に考えるものである。","q":"【設問2】設問1で求めた平均点以上（平均点と同じ点を含む）の得点をとった人は何人か。","c":["3人","2人","4人","6人"],"a":0,"e":"平均点68以上なのは 72・90・80 の3人（58・45・63は68未満）。設問1で求めた平均点68を基準に数える点が、前の設問とつながっている。"},{"id":"psg9-3","f":"passage","t":"総合問題【発展】：得点集計プログラムの追跡","d":3,"setId":"psg9","passageTitle":"6人の得点を処理するプログラム（発展）","passage":"Jさんは、6人の小テストの得点を配列 Tensu = [58, 72, 90, 45, 80, 63] に格納し、平均点を求めたうえで「平均点以上の人数」を数えるプログラムを作っている。以下の3問は、このプログラムの各段階について順に考えるものである。","q":"【設問3】Jさんは「平均点以上」を数えるつもりが、条件を『Tensu[i] ＞ heikin』（平均点より大きい）と書いてしまった。今回のデータでの結果と、この誤りが問題になる場合の説明として最も適当なものを選べ。","c":["今回はちょうど平均点(68)と同じ人がいないため結果は3人のままだが、ちょうど平均点に等しい人がいるデータではその人が数えられず、本来より少なくなる。","今回のデータには平均点と同じ得点の人が含まれているため、正しい人数より1人多く数えてしまい、結果は4人と表示される。","比較演算子は『＞』でも『＞=』でも条件の意味に実質的な違いはなく、どんなデータに対しても実行結果は必ず同じになるので、境界に等しい値のことを気にする必要はまったくない。","『＞=』にすると平均点より低い人まで数えてしまうことになり、表示される人数が大幅に増えて全員が数えられてしまう。"],"a":0,"e":"今回のデータには得点がちょうど68の人がいないため『＞』でも『＞=』でも結果は3人で同じ。しかし、ちょうど平均点に等しい人がいる場合、『＞』ではその人が数から漏れ、本来より少なくなる。境界値（等しい場合）を含めるかどうかは頻出の落とし穴で、設問1・2の具体例を踏まえて考える発展問題。"},{"id":"psg10-1","f":"passage","t":"総合問題【発展】：得点データの四分位分析","d":3,"setId":"psg10","passageTitle":"9人の得点の四分位数と分布（発展）","passage":"あるテストを受けた9人の得点を小さい順に並べると、20, 30, 40, 50, 60, 70, 80, 90, 100 であった。以下の3問は、このデータの散らばりと分布の形を順に分析するものである。四分位数は、中央値を除いた下位・上位それぞれのデータの中央値として求めるものとする。","q":"【設問1】このデータの中央値（第2四分位数）を求めよ。","c":["60","50","70","55"],"a":0,"e":"データは9個なので、小さい順に5番目の値が中央値。20,30,40,50,【60】,70,80,90,100 より中央値は60。この位置を基準に、次の設問で下位・上位を分ける。"},{"id":"psg10-2","f":"passage","t":"総合問題【発展】：得点データの四分位分析","d":3,"setId":"psg10","passageTitle":"9人の得点の四分位数と分布（発展）","passage":"あるテストを受けた9人の得点を小さい順に並べると、20, 30, 40, 50, 60, 70, 80, 90, 100 であった。以下の3問は、このデータの散らばりと分布の形を順に分析するものである。四分位数は、中央値を除いた下位・上位それぞれのデータの中央値として求めるものとする。","q":"【設問2】第1四分位数と第3四分位数を求め、四分位範囲（IQR）を答えよ。","c":["50","40","35","85"],"a":0,"e":"中央値60を除くと、下位は20,30,40,50でその中央値（第1四分位数）は(30+40)÷2=35、上位は70,80,90,100でその中央値（第3四分位数）は(80+90)÷2=85。四分位範囲は 85−35=50。設問1で中央値の位置を決めたことが前提になっている。"},{"id":"psg10-3","f":"passage","t":"総合問題【発展】：得点データの四分位分析","d":3,"setId":"psg10","passageTitle":"9人の得点の四分位数と分布（発展）","passage":"あるテストを受けた9人の得点を小さい順に並べると、20, 30, 40, 50, 60, 70, 80, 90, 100 であった。以下の3問は、このデータの散らばりと分布の形を順に分析するものである。四分位数は、中央値を除いた下位・上位それぞれのデータの中央値として求めるものとする。","q":"【設問3】このデータの平均値を求め、設問1の中央値との関係から分布の形を判断せよ。","c":["平均値も60で中央値と一致し、左右対称に近い分布と考えられる。","平均値は60より大きく、右に大きく裾を引いた分布である。","平均値は中央値より小さく、左に裾を引いた分布である。","平均値は求められない。"],"a":0,"e":"合計は 20+30+40+50+60+70+80+90+100=540、平均は 540÷9=60。設問1で求めた中央値60と平均値60が一致することから、このデータは左右対称に近い分布と判断できる。平均値と中央値の大小関係が分布の偏りを示すという知識を、実際の計算結果に当てはめる発展問題。"},{"id":"psg11-1","f":"passage","t":"総合問題【発展】：動画配信のデータ通信量","d":3,"setId":"psg11","passageTitle":"動画視聴のデータ通信量の見積り（発展）","passage":"Kさんは、ビットレート 5 Mbps の動画を視聴したときのデータ通信量を見積もっている。以下の3問は、通信量と月のデータ上限との関係を順に考えるものである。計算では 1バイト＝8ビット、1GB＝1024MB とする。","q":"【設問1】この動画を10分間（600秒）視聴すると、通信量は約何MBか。","c":["約375MB","約3000MB","約750MB","約47MB"],"a":0,"e":"5Mビット/秒 × 600秒 = 3000Mビット。バイトに直すと 3000 ÷ 8 = 375MB。この375MBを次の設問で使う。単位（ビット→バイト）の換算を忘れて3000MBとしないよう注意。"},{"id":"psg11-2","f":"passage","t":"総合問題【発展】：動画配信のデータ通信量","d":3,"setId":"psg11","passageTitle":"動画視聴のデータ通信量の見積り（発展）","passage":"Kさんは、ビットレート 5 Mbps の動画を視聴したときのデータ通信量を見積もっている。以下の3問は、通信量と月のデータ上限との関係を順に考えるものである。計算では 1バイト＝8ビット、1GB＝1024MB とする。","q":"【設問2】1か月に使えるデータ通信量の上限が 3GB のとき、設問1の10分視聴を最大で何回まで行えるか。","c":["8回","9回","16回","4回"],"a":0,"e":"3GB = 3×1024 = 3072MB。設問1より1回あたり375MBなので、3072 ÷ 375 ≒ 8.19。上限を超えられないので切り捨てて最大8回。前問の375MBを使い、割り算の商を切り捨てる（9回だと超過する）2段階の処理。"},{"id":"psg11-3","f":"passage","t":"総合問題【発展】：動画配信のデータ通信量","d":3,"setId":"psg11","passageTitle":"動画視聴のデータ通信量の見積り（発展）","passage":"Kさんは、ビットレート 5 Mbps の動画を視聴したときのデータ通信量を見積もっている。以下の3問は、通信量と月のデータ上限との関係を順に考えるものである。計算では 1バイト＝8ビット、1GB＝1024MB とする。","q":"【設問3】画質を落としてビットレートを半分の 2.5 Mbps にすると、同じ上限 3GB で視聴できる回数はどう変わるか。","c":["1回あたりの通信量が半分になるため、視聴できる回数は約2倍の16回になる。","ビットレートを変えても通信量は変わらないので、回数も8回のままである。","画質を落とすと回数も半分の約4回に減る。","回数は約4倍の32回になる。"],"a":0,"e":"ビットレートが半分になると1回あたりの通信量も半分（約187.5MB）になる。3072 ÷ 187.5 ≒ 16.4 より最大16回で、設問2の8回のおよそ2倍。通信量と視聴回数が反比例することを、前問の結果と結びつけて理解する発展問題。画質とデータ量のトレードオフの実例でもある。"},{"id":"x1","f":"digital","t":"浮動小数点数","d":3,"q":"コンピュータでの実数の表現に関する説明として最も適当なものを選べ。","c":["浮動小数点数は、数値を「符号・仮数・指数」の組で表すことで、非常に大きな数から小さな数まで幅広く表現できる方式である。","浮動小数点数を使えば、0.1のようなどんな10進小数でも2進法で誤差なく完全に正確に表現することができる。","固定小数点数は小数点の位置が数値ごとに移動する方式で、浮動小数点数は小数点の位置が常に固定されている方式である。","浮動小数点数で表現できる数値の範囲は整数型よりも常に狭いため、大きな数の計算には整数型を使う必要がある。"],"a":0,"e":"浮動小数点数は符号・仮数・指数の組み合わせで実数を表し、広い範囲の数を扱える。ただし0.1のように2進法で無限小数になる値は正確に表せず、丸め誤差が生じる。固定小数点は小数点の位置が固定、浮動小数点は指数によって実質的に移動する（名前と逆に覚えないよう注意）。"},{"id":"x2","f":"digital","t":"ビットシフトと計算","d":2,"q":"2進法の「00001101」（10進法の13）を左に2ビットシフトし、あふれがないものとする。得られる値の説明として最も適当なものを選べ。","c":["「00110100」となり、10進法では52。左シフト1回で値が2倍になるため、2回で4倍になる。","「00000011」となり、10進法では3。左シフトは値を4分の1にする働きを持つ演算である。","「00110100」となり、10進法では26。左シフトを2回行うと元の値はちょうど2倍になる。","「01000011」となり、10進法では67。シフト演算では左端のビットが右端に回り込むからである。"],"a":0,"e":"左シフト1ビットは2倍、nビットで2のn乗倍。13×4=52で、2進表現は00110100。右シフトは逆に2分の1（整数では切り捨て）。シフト演算は乗除算を高速に行う手段として使われる。"},{"id":"x3","f":"digital","t":"チェックディジット","d":2,"q":"バーコードや学籍番号などの末尾に付けられる「チェックディジット」の役割として最も適当なものを選べ。","c":["他の桁の数字から一定の計算式で求めた数字を付加しておき、読み取りや入力の誤りを検出できるようにする。","番号を暗号化して第三者に内容を知られないようにするための、復号の鍵となる数字である。","データを圧縮して桁数を減らし、バーコード全体の印刷面積を小さくするために付ける数字である。","商品の価格を直接表しており、レジではこの数字を読み取ってそのまま合計金額を計算している。"],"a":0,"e":"チェックディジットは他の桁から計算で導いた検査用の数字。読み取った番号から同じ計算をして一致しなければ誤りと分かる（誤り検出）。パリティビットと同じ発想で、暗号化や圧縮とは別の仕組み。"},{"id":"x4","f":"programming","t":"アルゴリズムと計算量","d":3,"q":"整列済みの100万件のデータから目的の値を探す場合について、最も適当な説明を選べ。","c":["二分探索なら最大でも約20回の比較で探せるが、線形探索では最悪100万回の比較が必要になり、データ量が増えるほど差は大きく開く。","線形探索も二分探索も、データ量が2倍になれば比較回数も必ずちょうど2倍になるため、どちらを使っても効率はまったく同じである。","二分探索の比較回数はデータ量に正比例して増えていくため、100万件では最悪でも約50万回の比較が必要になる。","探索アルゴリズムの効率はコンピュータの性能だけで決まるので、最新の機種を使えばどんな探し方でも同じ時間で終わる。"],"a":0,"e":"二分探索は1回の比較で候補が半分になるため、比較回数は約log₂n回。2の20乗≒105万なので100万件でも約20回で済む。線形探索はデータ量に比例（最悪n回）。アルゴリズムの選択そのものが処理時間を大きく左右し、機械の性能では埋められない差になる。"},{"id":"x5","f":"programming","t":"全加算器","d":3,"q":"2進数の筆算で「下の桁からの繰り上がり」も含めた1桁分の加算を行う回路（全加算器）の説明として最も適当なものを選べ。","c":["2つの半加算器とOR回路を組み合わせて作ることができ、3つの入力（2つの数と下位からの繰り上がり）を処理する。","1つのAND回路だけで作ることができ、入力は2つの数のみで、繰り上がりの入力は受け取らない構造になっている。","半加算器とまったく同じ回路であり、名前が違うだけで入力の数も出力の数も完全に同一のものである。","10進数の加算を直接行うための回路であり、2進数の計算にはより単純な別の専用回路が使われている。"],"a":0,"e":"全加算器は入力3つ（A、B、下位からの繰り上がりC）を受け、和と繰り上がりを出力する。半加算器2つとORゲートで構成できる。半加算器は繰り上がり入力を受けない点が違い。これを桁数分つなぐと多桁の加算器になる。"},{"id":"x6","f":"network","t":"データベースの正規化","d":3,"q":"「注文表」に顧客の氏名・住所を毎回記録していたところ、同じ顧客の住所が行によって食い違う問題が起きた。データベース設計の観点から最も適当な対処を選べ。","c":["顧客情報を別の「顧客表」に分けて顧客番号で参照するようにし、同じ情報を重複して持たない構造（正規化）にする。","住所の食い違いはデータベースでは避けられない現象なので、印刷時に人間の目で毎回確認して修正することにする。","注文表の行数を減らすために古い注文データを削除すれば、住所の食い違いという問題は根本から解決できる。","すべての表を1つの巨大な表に統合し、あらゆる情報を1行にまとめて記録するように設計を変更する。"],"a":0,"e":"同じ情報の重複記録は、更新漏れによる矛盾（更新時異状）の原因になる。表を適切に分割し、顧客情報は顧客表に1か所だけ持たせて主キー（顧客番号）で参照するのが正規化の考え方。重複をなくすことで矛盾や無駄を防げる。"},{"id":"x7","f":"network","t":"分散と標準偏差","d":2,"q":"データのばらつきを表す「分散」と「標準偏差」の関係として最も適当なものを選べ。","c":["分散は各データの平均からの差（偏差）を2乗して平均した値であり、その正の平方根が標準偏差である。","標準偏差を2乗すると必ず平均値になり、分散は平均値から中央値を引いた差として計算される値である。","分散はデータの最大値から最小値を引いた範囲のことであり、標準偏差はその半分の値として定義される。","分散と標準偏差はどちらもデータの中心の位置を表す代表値であり、ばらつきの大きさとは関係がない。"],"a":0,"e":"分散＝偏差の2乗の平均。標準偏差＝分散の平方根（√分散）。単位が元のデータと同じになるため、実際のばらつきの解釈には標準偏差がよく使われる。どちらも値が大きいほどばらつきが大きい。"},{"id":"x8","f":"network","t":"WebAPI","d":2,"q":"天気予報アプリが気象情報サービスの「WebAPI」を利用してデータを取得している。WebAPIの説明として最も適当なものを選べ。","c":["プログラムから決められた形式でリクエストを送ると、サービス側がデータ（JSONなど）を返してくれる、ソフトウェア同士の連携の窓口である。","Webページの見た目やレイアウトを記述するための言語であり、人間が画面上で情報を読みやすくするために使われるものである。プログラム同士の連携とは関係がない。","コンピュータウイルスの侵入を防ぐための防御プログラムの名称であり、外部との通信をすべて遮断する働きを持つ。","アプリを高速化するための圧縮技術の一種であり、通信するデータをすべて画像に変換して送る仕組みである。"],"a":0,"e":"WebAPIは、プログラムがネットワーク経由で機能やデータを利用するための取り決め（窓口）。決まった形式のリクエストに対しJSONなどの形式で応答が返る。地図・天気・翻訳など多くのサービスがAPIを公開しており、それらを組み合わせて新しいサービスを作れる。"},{"id":"x9","f":"digital","t":"プロトタイプと評価","d":2,"q":"文化祭の案内アプリを開発する際、完成前に紙で画面の試作品（プロトタイプ）を作って利用者に試してもらった。この進め方の利点として最も適当なものを選べ。","c":["完成前の早い段階で使いにくい点や誤解される点を発見でき、大きな手戻りを防ぎながら設計を改善できる。","紙の試作品を作った時点で開発は完了したことになるので、その後のプログラム作成の工程は不要になる。","利用者に試してもらうと必ず高い評価が得られるため、開発チームのやる気を高める効果だけを目的に行う。","試作品の評価を行うと設計を変更できなくなるため、最初の案のまま完成させることが保証される。"],"a":0,"e":"プロトタイプは、作っては試し、評価をもとに改善する反復的な設計のための試作品。完成後に問題が見つかると修正コストが大きいため、早い段階で利用者の反応を確かめることに意味がある。低コストな紙のプロトタイプ（ペーパープロトタイピング）もよく使われる。"},{"id":"x10","f":"digital","t":"カラーユニバーサルデザイン","d":2,"q":"色の見え方が異なる人にも伝わる資料を作るための配慮（カラーユニバーサルデザイン）として最も適当なものを選べ。","c":["赤と緑のような区別しにくい配色を避け、色だけでなく形・模様・ラベルの違いでも情報を区別できるようにする。","使う色の数をできるだけ増やして鮮やかにすれば、どんな見え方の人にも必ず区別できるようになる。","色の情報はすべて取り除いて白黒だけで作ることが、唯一の正しい配慮の方法として定められている。","重要な部分は赤色の文字だけで示すことが、すべての人に最も伝わりやすい方法として推奨されている。"],"a":0,"e":"色覚の多様性に配慮するには、判別しにくい配色（赤と緑など）を避けるとともに、色以外の手がかり（形・線種・模様・文字ラベル）を併用することが重要。色数を増やすことや赤だけで強調することは、かえって伝わりにくくなる場合がある。"},{"id":"x11","f":"society","t":"AI・機械学習と社会","d":2,"q":"機械学習を使ったAIの判断について、社会的な課題として最も適当な説明を選べ。","c":["学習に使ったデータに偏りがあると、AIの判断にも偏り（バイアス）が生じ、特定の人々に不利益を与えるおそれがある。","AIは人間が作ったデータを一切使わずに判断するため、人間社会の偏見の影響を受けることは原理的にありえない。","AIの判断は常に100%正確であることが保証されているので、人間が結果を確認する必要はまったくない。","機械学習には学習用のデータが不要であり、プログラムを書いた瞬間からあらゆる問題を正しく判断できる。"],"a":0,"e":"機械学習は大量のデータから規則性を学ぶため、データの偏りがそのまま判断の偏りになる（例：採用AIが過去の偏った採用実績を学習する）。AIの出力を人間が検証する姿勢と、学習データの質への注意が求められる。"},{"id":"x12","f":"network","t":"標本の大きさと誤差","d":3,"q":"全校生徒1000人の意識を調べるため標本調査を行う。標本の大きさ（人数）と結果の関係として最も適当なものを選べ。","c":["標本を無作為に選ぶことを前提とすれば、標本の人数を増やすほど結果は母集団の傾向に近づき、誤差は小さくなる傾向がある。","標本は10人でも1000人でも結果の信頼性はまったく同じなので、手間の少ない10人で調査するのが常に最善である。","仲のよい友人だけを標本に選んでも、人数さえ多ければ全校生徒の傾向を偏りなく正確に表すことができる。","標本調査の誤差は標本の選び方や人数とは無関係に決まっており、調査する側が減らすことは不可能である。"],"a":0,"e":"無作為抽出を前提とすると、標本が大きいほど標本誤差は小さくなる。ただし選び方に偏りがあれば（友人だけ等）、人数を増やしても偏りは消えない。「無作為に選ぶこと」と「十分な人数」の両方が大切。"},{"id":"x13","f":"programming","t":"エラーの種類とデバッグ","d":2,"q":"プログラムの誤り（エラー）に関する説明として最も適当なものを選べ。","c":["文法エラーは実行前に発見されやすいが、論理エラーはプログラムが動作してしまうため、結果を検証しないと気づきにくい。","論理エラーがあるプログラムは必ず起動した直後に停止するので、動き続けるプログラムに誤りは存在しない。","文法エラーは実行しても画面に何も表示されないだけなので、放置してもプログラムの動作には影響しない。","エラーの原因を探す作業は開発の最後に一度だけまとめて行うものであり、途中で何度も動作を確認するのは時間の無駄である。"],"a":0,"e":"文法エラー（構文の誤り）は実行前に検出されることが多いが、論理エラーはプログラムが「動くのに結果が違う」ため発見が難しい。テストデータで結果を検証し、途中経過を表示するなどして少しずつ確認する（デバッグ）姿勢が重要。"},{"id":"m1","f":"society","t":"個人情報の取り扱い（二つ選べ）","d":2,"m":2,"q":"個人情報の取り扱いとして適当なものを、次のうちから二つ選べ。","c":["アンケートを実施する際は、収集する目的をあらかじめ示し、目的の範囲内でのみ利用する。","不要になった個人情報を含む書類は、シュレッダーにかけるなど復元できない形で廃棄する。","本人の同意があってもなくても、集めた名簿は希望する企業へ自由に販売してよい。","個人情報は企業の財産なので、流出しても本人に通知する必要はまったくない。"],"a":[0,1],"e":"目的の明示と目的内利用、復元不可能な形での廃棄はいずれも適切な取り扱い。本人の同意のない第三者提供は原則として認められず、漏えい時には本人への通知や国への報告が求められる場合がある。"},{"id":"m2","f":"society","t":"SNSの利用（適当でないもの）","d":2,"neg":true,"q":"SNSの利用に関する記述のうち、適当でないものを一つ選べ。","c":["投稿をあとから削除しても、他の人の保存や転載によって情報がインターネット上に残り続けることがある。","位置情報付きの写真の投稿は、自宅や行動範囲の特定につながるおそれがある。","一度インターネットに公開した情報は、本人が削除すれば世界中から完全に消し去ることができる。","実名でも匿名でも、投稿内容によっては法的な責任を問われることがある。"],"a":2,"e":"公開された情報は複製・転載により拡散し、完全な削除は事実上不可能（デジタルタトゥー）。削除しても残り続ける前提で発信を考える必要がある。他の3つはいずれも正しい記述。"},{"id":"m3","f":"digital","t":"圧縮（適当でないもの）","d":2,"neg":true,"q":"データの圧縮に関する記述のうち、適当でないものを一つ選べ。","c":["ZIP形式などの可逆圧縮では、展開すると元のデータを完全に復元することができる。","JPEGなどの非可逆圧縮は、人間が気づきにくい情報を削ることで高い圧縮率を実現している。","プログラムのファイルを非可逆圧縮すると一部の情報が失われるため、正しく動作しなくなるおそれがある。","どんなデータであっても、圧縮を繰り返せばデータ量を限りなく0に近づけることができる。"],"a":3,"e":"圧縮には理論的な限界があり、既に圧縮されたデータを再圧縮してもほとんど小さくならない（かえって大きくなることもある）。可逆圧縮は完全復元が可能で、文書やプログラムに使う。非可逆圧縮は画像・音声・動画向き。"},{"id":"m4","f":"digital","t":"デジタル化の特徴（二つ選べ）","d":2,"m":2,"q":"情報をデジタル化することの特徴として適当なものを、次のうちから二つ選べ。","c":["複製しても品質が劣化せず、元のデータと同じものを何個でも作ることができる。","文字・音・画像などの異なる種類の情報を、同じ0と1の列として統一的に扱える。","デジタル化した情報は編集や加工が一切できなくなるため、内容の改ざんを完全に防止できる。","デジタルデータはアナログよりも必ずデータ量が小さくなるため、保存装置はほとんど不要になる。"],"a":[0,1],"e":"劣化しない複製と、多様な情報の統一的な扱い（統合）はデジタル化の代表的な特徴。一方でデジタルデータは容易に編集・加工でき、高品質なデータほど容量は大きくなるため、後半2つは誤り。"},{"id":"m5","f":"programming","t":"アルゴリズム（適当でないもの）","d":2,"neg":true,"q":"アルゴリズムに関する記述のうち、適当でないものを一つ選べ。","c":["同じ問題を解くアルゴリズムでも、手順の工夫によって処理の速さに大きな差が生じることがある。","アルゴリズムは、順次・分岐（選択）・繰返し（反復）の3つの制御構造の組み合わせで表現できる。","フローチャートやプログラムなど、同じアルゴリズムを異なる方法で表現することができる。","正しいアルゴリズムは1つの問題に対して常にただ1通りしか存在せず、それ以外の手順はすべて誤りである。"],"a":3,"e":"1つの問題に対して正しいアルゴリズムは複数存在しうる（例：整列にはバブルソート、選択ソートなど多数）。その中から効率や分かりやすさで選ぶことが大切。他の3つは正しい記述。"},{"id":"m6","f":"network","t":"安全な通信（二つ選べ）","d":2,"m":2,"q":"インターネットを安全に利用するための行動として適当なものを、次のうちから二つ選べ。","c":["個人情報を入力するページでは、URLが「https」で始まり、通信が暗号化されていることを確認する。","公衆無線LANでは、暗号化されていないアクセスポイントでの重要な情報のやり取りを避ける。","ソフトウェアの更新通知は動作が不安定になる原因なので、通知が来てもすべて無視し続けるほうが安全である。","知らない差出人から届いた添付ファイルは、内容を確かめるためにまず開いてみるのがよい。"],"a":[0,1],"e":"httpsの確認と、暗号化されていない公衆無線LANでの重要情報のやり取り回避はいずれも適切。更新の放置は脆弱性を残す危険な行動で、不審な添付ファイルを開くのはマルウェア感染の典型的な原因。"},{"id":"m7","f":"network","t":"相関と因果（適当でないもの）","d":3,"neg":true,"q":"相関関係と因果関係に関する記述のうち、適当でないものを一つ選べ。","c":["2つの量に強い相関があっても、その間に直接の因果関係があるとは限らない。","第3の要因が2つの量の両方に影響して、見かけ上の相関（疑似相関）が生じることがある。","相関係数が1に近ければ、一方が他方の原因であることが数学的に証明されたことになる。","因果関係を確かめるには、相関の確認に加えて、他の要因の影響を除いた検討が必要である。"],"a":2,"e":"相関係数はあくまで直線的な関係の強さを表す指標で、どれほど1に近くても因果関係の証明にはならない。因果を主張するには、時間的な前後関係や第3の要因の検討などが別途必要になる。"},{"id":"m8","f":"society","t":"許諾が不要な利用（二つ選べ）","d":3,"m":2,"q":"著作権者の許諾を得なくても著作物を利用できる場合として適当なものを、次のうちから二つ選べ。","c":["購入した音楽CDを、自分だけで聴くために自分のスマートフォンに取り込む（私的使用のための複製）。","他人の論文の一部を、出典を明示し主従関係などの要件を満たした上で自分のレポートに引用する。","映画館で上映中の映画をスマートフォンで録画し、家族が見られるように動画サイトへ投稿する。","人気漫画の全ページをスキャンして、誰でも読めるように自分のWebサイトで公開する。"],"a":[0,1],"e":"私的使用のための複製（30条）と、要件を満たした引用（32条）は許諾不要の代表例。映画の盗撮は法律で明確に禁止され、漫画の全ページ公開は複製権・公衆送信権の侵害となる。"},{"id":"ex1-1","f":"exam","t":"本番形式：貸出データの集計プログラム","d":3,"setId":"ex1","type":"bank","pts":[4,4,4,4,4],"passageTitle":"第3問形式：貸出データの集計プログラム（語群穴埋め）","passage":"図書委員のSさんは、先生（T）と一緒に、図書室の貸出データを分析するプログラムを作ることにした。\n\nT：まず、ジャンルごとの先月の貸出冊数を配列にまとめてみましょう。配列 Kasidasi には、添字0から順に「文学・科学・歴史・芸術・スポーツ」の貸出冊数が入っています。\nS：Kasidasi = [12, 25, 8, 17, 25] ですね。どのジャンルが一番借りられたのかをプログラムで求めたいです。\nT：最大値を探す典型的なアルゴリズムが使えますよ。まず先頭の要素を仮の最大値とし、残りの要素を順に比べて、より大きい値が見つかったら最大値と、その場所（添字）を更新していきます。図1のプログラムの空欄を埋めて完成させてください。なお、要素数(配列)はその配列の要素の個数を返す関数です。\nS：できました。実行すると「科学 が最多で 25 冊」と表示されました。\nT：いいですね。次に、貸出冊数が全ジャンルの平均より多いジャンルがいくつあるかも数えてみましょう。図2のプログラムです。","code":"(01) Kasidasi = [12, 25, 8, 17, 25]\n(02) Genre = [\"文学\", \"科学\", \"歴史\", \"芸術\", \"スポーツ\"]\n(03) saidai = Kasidasi[0]\n(04) basho = 0\n(05) i を 1 から【 カ 】まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし Kasidasi[i]【 キ 】saidai ならば：\n(07) 　　　　saidai = Kasidasi[i]\n(08) 　　　　basho =【 ク 】\n(09) 表示する(Genre[basho], \" が最多で \", saidai, \" 冊\")\n\n【図2】\n(10) gokei = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　gokei = gokei +【 ケ 】\n(13) heikin = gokei / 5\n(14) kosu = 0\n(15) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(16) 　　もし Kasidasi[i] > heikin ならば：\n(17) 　　　　kosu = kosu +【 コ 】\n(18) 表示する(kosu)","q":"図1・図2のプログラムの空欄【カ】〜【コ】に当てはまるものを、語群から一つずつ選べ。同じものを繰り返し選んでもよい。","bank":["1","3","4","i","basho","Kasidasi[i]","＞","＞="],"blanks":[{"label":"カ","a":2},{"label":"キ","a":6},{"label":"ク","a":3},{"label":"ケ","a":5},{"label":"コ","a":0}],"e":"【カ】要素数が5なので添字は0〜4。iは1から4まで（=要素数−1）。【キ】「＞」なら最初に現れた最大値を保持する。【ク】最大値が見つかった位置は現在の添字i。【ケ】合計にはKasidasi[i]を加える。【コ】個数を数えるカウンタは1ずつ増やす。合計は87、平均17.4で、これを超えるのは25と25の2つ。"},{"id":"ex1-2","f":"exam","t":"本番形式：実行結果の追跡","d":3,"setId":"ex1","pts":[3],"passage":"図書委員のSさんは、先生（T）と一緒に、図書室の貸出データを分析するプログラムを作ることにした。\n\nT：まず、ジャンルごとの先月の貸出冊数を配列にまとめてみましょう。配列 Kasidasi には、添字0から順に「文学・科学・歴史・芸術・スポーツ」の貸出冊数が入っています。\nS：Kasidasi = [12, 25, 8, 17, 25] ですね。どのジャンルが一番借りられたのかをプログラムで求めたいです。\nT：最大値を探す典型的なアルゴリズムが使えますよ。まず先頭の要素を仮の最大値とし、残りの要素を順に比べて、より大きい値が見つかったら最大値と、その場所（添字）を更新していきます。図1のプログラムの空欄を埋めて完成させてください。なお、要素数(配列)はその配列の要素の個数を返す関数です。\nS：できました。実行すると「科学 が最多で 25 冊」と表示されました。\nT：いいですね。次に、貸出冊数が全ジャンルの平均より多いジャンルがいくつあるかも数えてみましょう。図2のプログラムです。","code":"(01) Kasidasi = [12, 25, 8, 17, 25]\n(02) Genre = [\"文学\", \"科学\", \"歴史\", \"芸術\", \"スポーツ\"]\n(03) saidai = Kasidasi[0]\n(04) basho = 0\n(05) i を 1 から【 カ 】まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし Kasidasi[i]【 キ 】saidai ならば：\n(07) 　　　　saidai = Kasidasi[i]\n(08) 　　　　basho =【 ク 】\n(09) 表示する(Genre[basho], \" が最多で \", saidai, \" 冊\")\n\n【図2】\n(10) gokei = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　gokei = gokei +【 ケ 】\n(13) heikin = gokei / 5\n(14) kosu = 0\n(15) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(16) 　　もし Kasidasi[i] > heikin ならば：\n(17) 　　　　kosu = kosu +【 コ 】\n(18) 表示する(kosu)","q":"空欄を正しく埋めた図2のプログラムを実行したとき、(18)で表示される値として正しいものを選べ。","c":["1","2","3","4"],"a":1,"e":"合計は 12+25+8+17+25=87、平均は 87÷5=17.4。平均より多いのは 25（科学）と 25（スポーツ）の2ジャンルなので、kosu は 2 になる。直前の空欄の理解を前提に結果を追跡する、本番と同じ連動型の問い。"},{"id":"ex1-3","f":"exam","t":"本番形式：条件式の違いの考察","d":3,"setId":"ex1","pts":[2],"passage":"図書委員のSさんは、先生（T）と一緒に、図書室の貸出データを分析するプログラムを作ることにした。\n\nT：まず、ジャンルごとの先月の貸出冊数を配列にまとめてみましょう。配列 Kasidasi には、添字0から順に「文学・科学・歴史・芸術・スポーツ」の貸出冊数が入っています。\nS：Kasidasi = [12, 25, 8, 17, 25] ですね。どのジャンルが一番借りられたのかをプログラムで求めたいです。\nT：最大値を探す典型的なアルゴリズムが使えますよ。まず先頭の要素を仮の最大値とし、残りの要素を順に比べて、より大きい値が見つかったら最大値と、その場所（添字）を更新していきます。図1のプログラムの空欄を埋めて完成させてください。なお、要素数(配列)はその配列の要素の個数を返す関数です。\nS：できました。実行すると「科学 が最多で 25 冊」と表示されました。\nT：いいですね。次に、貸出冊数が全ジャンルの平均より多いジャンルがいくつあるかも数えてみましょう。図2のプログラムです。","code":"(01) Kasidasi = [12, 25, 8, 17, 25]\n(02) Genre = [\"文学\", \"科学\", \"歴史\", \"芸術\", \"スポーツ\"]\n(03) saidai = Kasidasi[0]\n(04) basho = 0\n(05) i を 1 から【 カ 】まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし Kasidasi[i]【 キ 】saidai ならば：\n(07) 　　　　saidai = Kasidasi[i]\n(08) 　　　　basho =【 ク 】\n(09) 表示する(Genre[basho], \" が最多で \", saidai, \" 冊\")\n\n【図2】\n(10) gokei = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　gokei = gokei +【 ケ 】\n(13) heikin = gokei / 5\n(14) kosu = 0\n(15) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(16) 　　もし Kasidasi[i] > heikin ならば：\n(17) 　　　　kosu = kosu +【 コ 】\n(18) 表示する(kosu)","q":"図1の【キ】を「＞=」に変えて実行した場合の説明として最も適当なものを選べ。","c":["最大値25は変わらないが、同じ25でも後に現れる「スポーツ」が表示されるようになる。","「＞」のときとまったく同じで、先に現れる「科学」が表示される。条件式の違いは結果に影響しない。","最大値の判定そのものができなくなり、実行するとエラーが発生して停止する。","最大値が2番目に大きい17に変わってしまい、「芸術」が表示されるようになる。"],"a":0,"e":"「＞=」だと同じ値でも更新が起こるため、等しい最大値が複数あるときは最後に現れたもの（添字4のスポーツ）が残る。「＞」なら最初のもの（科学）が残る。最大値25自体は変わらない。境界条件の違いが結果に与える影響を問う、共通テスト頻出の考察。"},{"id":"ex2-1","f":"exam","t":"本番形式：散布図の読み取り","d":2,"setId":"ex2","pts":[5],"passageTitle":"第4問形式：ドリンク販売数のデータ分析","passage":"生徒会のMさんは、学校の売店で販売しているスポーツドリンクの仕入れ数を見直すため、6月の15日分について「その日の最高気温」と「販売数」を記録し、散布図（図1）を作成した。また、販売数を平日と休日に分けて箱ひげ図（図2）にまとめた。散布図のデータについて回帰直線を求めたところ、およそ y = 2x + 8（x：最高気温℃、y：販売数）となり、相関係数は 0.93 であった。Mさんはこれらの結果をもとに、来月の仕入れ計画を検討することにした。","chart":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">最高気温とドリンク販売数（15日分）</text><line x1=\"60\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"93.33333333333334\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">20</text><line x1=\"93.33333333333334\" y1=\"197\" x2=\"93.33333333333334\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"176.66666666666669\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">25</text><line x1=\"176.66666666666669\" y1=\"197\" x2=\"176.66666666666669\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"260\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">30</text><line x1=\"260\" y1=\"197\" x2=\"260\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"343.33333333333337\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">35</text><line x1=\"343.33333333333337\" y1=\"197\" x2=\"343.33333333333337\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"204\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">40</text><line x1=\"57\" y1=\"200\" x2=\"63\" y2=\"200\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"154\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">55</text><line x1=\"57\" y1=\"150\" x2=\"63\" y2=\"150\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"104\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">70</text><line x1=\"57\" y1=\"100\" x2=\"63\" y2=\"100\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"54\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">85</text><line x1=\"57\" y1=\"50\" x2=\"63\" y2=\"50\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">最高気温（℃）</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"16\" y=\"120\" font-size=\"11\" fill=\"#5b6b7d\" transform=\"rotate(-90 16 120)\" text-anchor=\"middle\">販売数（本）</text><circle cx=\"93.3\" cy=\"166.7\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"110.0\" cy=\"173.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"126.7\" cy=\"150.0\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"143.3\" cy=\"160.0\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"160.0\" cy=\"140.0\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"176.7\" cy=\"143.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"193.3\" cy=\"126.7\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"210.0\" cy=\"133.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"226.7\" cy=\"116.7\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"243.3\" cy=\"106.7\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"260.0\" cy=\"113.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"276.7\" cy=\"93.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"293.3\" cy=\"100.0\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"310.0\" cy=\"83.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/><circle cx=\"326.7\" cy=\"73.3\" r=\"4\" fill=\"#2563eb\" opacity=\".8\"/></svg>","q":"図1の散布図から読み取れることとして最も適当なものを選べ。","c":["最高気温が高い日ほど販売数が多い傾向がはっきりしており、強い正の相関があると読み取れる。","最高気温が高い日ほど販売数が少なくなる傾向があり、2つの量には強い負の相関があると読み取れる。","点が全体に散らばっていて特定の傾向は見られないため、気温と販売数はほぼ無相関であると読み取れる。","気温が25℃を超えた日だけ販売数が急に0になっており、途中で関係が途切れていると読み取れる。"],"a":0,"e":"点は右上がりに直線的に並んでおり、相関係数0.93という値とも一致する強い正の相関。散布図の形状（右上がり・右下がり・ばらばら）と相関の正負・強弱を対応づけるのは頻出。"},{"id":"ex2-2","f":"exam","t":"本番形式：回帰直線による予測","d":2,"setId":"ex2","pts":[5],"passage":"生徒会のMさんは、学校の売店で販売しているスポーツドリンクの仕入れ数を見直すため、6月の15日分について「その日の最高気温」と「販売数」を記録し、散布図（図1）を作成した。また、販売数を平日と休日に分けて箱ひげ図（図2）にまとめた。散布図のデータについて回帰直線を求めたところ、およそ y = 2x + 8（x：最高気温℃、y：販売数）となり、相関係数は 0.93 であった。","q":"回帰直線 y = 2x + 8 を使って、最高気温が30℃と予想される日の販売数を見積もると何本になるか。","c":["68本","60本","38本","76本"],"a":0,"e":"y = 2×30 + 8 = 68本。回帰直線は傾向にもとづく「見積もり」であり、必ず68本売れるという保証ではない点、またデータの範囲（20〜34℃）から大きく外れた気温への当てはめ（外挿）は精度が落ちる点にも注意。"},{"id":"ex2-3","f":"exam","t":"本番形式：箱ひげ図の比較","d":3,"setId":"ex2","pts":[5],"passage":"販売数を平日と休日に分けてまとめた箱ひげ図（図2）を見て、MさんとNさんが話し合っている。\nM：平日と休日では、ずいぶん様子が違うね。\nN：仕入れ数も曜日で変えたほうがよさそうだ。","chart":"<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">曜日別のドリンク販売数の分布（本）</text><line x1=\"81.42857142857143\" y1=\"55\" x2=\"124.28571428571428\" y2=\"55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"188.57142857142856\" y1=\"55\" x2=\"252.85714285714286\" y2=\"55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"81.42857142857143\" y1=\"47\" x2=\"81.42857142857143\" y2=\"63\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"252.85714285714286\" y1=\"47\" x2=\"252.85714285714286\" y2=\"63\" stroke=\"#475569\" stroke-width=\"1.5\"/><rect x=\"124.28571428571428\" y=\"41\" width=\"64.3\" height=\"28\" fill=\"#0ea5e9\" opacity=\".55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"158.57142857142856\" y1=\"41\" x2=\"158.57142857142856\" y2=\"69\" stroke=\"#1e2a3a\" stroke-width=\"2.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"59\" text-anchor=\"end\" font-size=\"12\" fill=\"#1e2a3a\">平日</text><line x1=\"145.71428571428572\" y1=\"115\" x2=\"201.42857142857142\" y2=\"115\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"270\" y1=\"115\" x2=\"338.57142857142856\" y2=\"115\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"145.71428571428572\" y1=\"107\" x2=\"145.71428571428572\" y2=\"123\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"338.57142857142856\" y1=\"107\" x2=\"338.57142857142856\" y2=\"123\" stroke=\"#475569\" stroke-width=\"1.5\"/><rect x=\"201.42857142857142\" y=\"101\" width=\"68.6\" height=\"28\" fill=\"#f59e0b\" opacity=\".55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"235.71428571428572\" y1=\"101\" x2=\"235.71428571428572\" y2=\"129\" stroke=\"#1e2a3a\" stroke-width=\"2.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"119\" text-anchor=\"end\" font-size=\"12\" fill=\"#1e2a3a\">休日</text><line x1=\"60\" y1=\"150\" x2=\"380\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"81.42857142857143\" y1=\"147\" x2=\"81.42857142857143\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"81.42857142857143\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">30</text><line x1=\"145.71428571428572\" y1=\"147\" x2=\"145.71428571428572\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"145.71428571428572\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">45</text><line x1=\"210\" y1=\"147\" x2=\"210\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">60</text><line x1=\"274.2857142857143\" y1=\"147\" x2=\"274.2857142857143\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"274.2857142857143\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">75</text><line x1=\"338.57142857142856\" y1=\"147\" x2=\"338.57142857142856\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"338.57142857142856\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">90</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"185\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">1日の販売数（本）</text></svg>","q":"図2の箱ひげ図から読み取れることとして最も適当なものを選べ。","c":["休日の中央値（66本）は平日の第3四分位数（55本）よりも大きく、休日の半数以上の日は平日の上位4分の1よりも売れている。","平日の最大値（70本）は休日の最大値（90本）より大きく、最も売れた日は平日であったことが箱ひげ図から読み取れる。","平日と休日の四分位範囲はまったく同じ大きさなので、販売数のばらつきの程度は曜日によらず等しいと読み取れる。","箱ひげ図からは平均値が直接読み取れるので、平日の平均は48本、休日の平均は66本であると断定できる。"],"a":0,"e":"休日の中央値66は平日のQ3=55を上回るので、休日の半数以上が平日の上位25%を超える。平日の最大値70＜休日の最大値90。四分位範囲は平日15、休日16で近いが同一ではない。箱ひげ図の中央線は中央値であり平均値ではない。"},{"id":"ex2-4","f":"exam","t":"本番形式：分析の進め方（二つ選べ）","d":3,"setId":"ex2","pts":[5],"m":2,"passage":"Mさんは分析結果をもとに、来月の仕入れ計画についてレポートをまとめることにした。","q":"Mさんのデータ分析の進め方として適当なものを、次のうちから二つ選べ。","c":["回帰直線による見積もりはあくまで傾向にもとづく予測なので、実際の販売数との差を毎週確認し、必要に応じて計画を修正する。","気温以外にも販売数に影響する要因（行事の有無、天候など）がないかを検討し、データを追加して分析する。","相関係数が0.93と十分に高いので、今後は実際の販売数を記録する必要はなく、天気予報の気温だけを見て仕入れ数を決めればよい。","6月の15日分のデータで十分なので、季節が変わっても同じ回帰直線をそのまま使い続けるのがよい。"],"a":[0,1],"e":"予測と実績の差の確認・計画の修正（PDCA）、他の要因の検討とデータの追加はいずれも適切。高い相関があっても記録をやめてよい理由にはならず、季節が変われば関係そのものが変わりうるため同じ式の使い回しは不適切。"},{"id":"ex2-5","f":"exam","t":"本番形式：相関と因果の考察","d":3,"setId":"ex2","pts":[5],"passage":"Nさんが散布図を見て「かき氷の販売数とスポーツドリンクの販売数にも強い正の相関があった」と報告した。","q":"「かき氷の販売数」と「スポーツドリンクの販売数」に強い正の相関が見られた理由の説明として最も適当なものを選べ。","c":["気温という共通の要因が両方の販売数に影響しており、2つの間の直接の因果関係がなくても相関が現れる（疑似相関）と考えられる。","かき氷を食べる行為そのものがドリンクの購買意欲を直接引き起こすことが、相関係数によって数学的に証明されたと考えられる。","相関係数が高いのは単なる計算上の誤りであり、実際には2つの販売数の間に何の関係も存在しないと考えられる。","スポーツドリンクの販売数がかき氷の販売数を直接決定しているという一方向の因果関係が確定したと考えられる。"],"a":0,"e":"暑い日にはかき氷もドリンクも売れる。「気温」という第3の要因（交絡要因）が両方に影響するため、直接の因果がなくても相関が生じる。相関係数の高さは因果の証明にならない、という第4問頻出の考察。"},{"id":"ex3-1","f":"exam","t":"本番形式：画像のデータ量","d":2,"setId":"ex3","pts":[4],"passageTitle":"第2問形式：文化祭ポスターのデジタルデータ","passage":"美術部のKさんは、文化祭のポスターをデジタル画像として制作し、SNSでの告知と印刷の両方に使うことになった。画像は横800画素×縦600画素、1画素あたり24ビット（フルカラー）で作成した。完成した画像を圧縮せずに保存したファイルと、JPEG形式で圧縮したファイルの両方を用意し、用途によって使い分けることにした。また、ポスターには公式サイトへ誘導するためのQRコードを載せる予定である。","q":"この画像を圧縮せずに保存したときのデータ量として最も近いものを選べ。（1KB=1000B、1MB=1000KBとする）","c":["約1.44MB","約480KB","約11.5MB","約0.48MB"],"a":0,"e":"800×600=480,000画素。1画素24ビット=3バイトなので、480,000×3=1,440,000バイト=約1.44MB。ビットとバイトの換算（8ビット=1バイト）を忘れて11.5MBとしないよう注意。"},{"id":"ex3-2","f":"exam","t":"本番形式：圧縮率の計算","d":2,"setId":"ex3","pts":[4],"passage":"KさんがこのポスターをJPEG形式で保存したところ、データ量は360KBになった。","q":"圧縮後のデータ量は圧縮前（1.44MB）のおよそ何％か。最も近いものを選べ。","c":["25％","36％","40％","75％"],"a":0,"e":"360KB ÷ 1440KB = 0.25 = 25％。つまり4分の1に圧縮された。JPEGは人の目に気づかれにくい情報を削る非可逆圧縮のため、高い圧縮率が得られる。"},{"id":"ex3-3","f":"exam","t":"本番形式：QRコードの誤り訂正","d":2,"setId":"ex3","pts":[4],"passage":"印刷したポスターの隅に貼ったQRコードの一部が、掲示中に汚れて欠けてしまった。しかし、スマートフォンで読み取ると正しく公式サイトが表示された。","q":"一部が欠けてもQRコードを正しく読み取れた理由として最も適当なものを選べ。","c":["QRコードには誤り訂正のための冗長なデータがあらかじめ含まれており、一定の割合までの欠損なら元の情報を復元できるから。","スマートフォンが撮影のたびにインターネット上のサーバへ接続し、欠けた部分のデータをその場で取得し直しているから。","QRコードの模様は単なる飾りであり、実際の情報は目に見えない特殊なインクで別の場所に印刷されているから。","読み取りアプリが欠けた部分の内容を過去の統計から推測しており、まったく別のサイトが表示される場合も多いから。"],"a":0,"e":"QRコードは誤り訂正符号（リード・ソロモン符号）により冗長性を持たせており、規格に応じて最大約30％の欠損まで復元できる。パリティビットやチェックディジットと同じ「冗長性で誤りに備える」という考え方の応用例。"},{"id":"ex3-4","f":"exam","t":"本番形式：印刷と解像度","d":3,"setId":"ex3","pts":[3],"passage":"Kさんは同じ画像データを、①SNSでの画面表示用と、②高精細印刷（300dpi＝1インチあたり300画素で印刷）でのA4ポスター用、の両方に使おうとしている。横800画素の画像を印刷したとき、300dpiで印刷できる横幅は 800÷300 ≒ 2.7インチ（約6.8cm）にとどまる。","q":"この状況の説明と対処として最も適当なものを選べ。","c":["800画素のままA4幅（約21cm）に印刷すると1インチあたりの画素数が不足して粗くなるため、印刷用にはより高解像度で作り直すのがよい。","画面表示と印刷で必要な画素数はまったく同じなので、SNS用の画像をそのまま印刷しても品質はまったく変わらない。","印刷サイズを大きくするほど1インチあたりの画素数は自動的に増えていくので、どんな画像でも大きく印刷すればするほど鮮明になっていく。","JPEGで圧縮しさえすれば画素数が自動的に増えるので、圧縮後のファイルを使えば高精細印刷にも十分対応できる。"],"a":0,"e":"印刷幅を広げても画素数は増えないため、大きく印刷するほど1インチあたりの画素数（dpi）は下がり粗くなる。300dpiでA4横21cm（約8.3インチ）に印刷するには約2500画素必要。用途（画面表示か印刷か）に応じて必要な解像度を見積もる、という実践的な考え方。"},{"id":"ex4-1","f":"exam","t":"本番形式：チケット販売の集計プログラム","d":3,"setId":"ex4","type":"bank","pts":[4,4,4,4,4],"passageTitle":"第3問形式：チケット販売の集計プログラム（語群穴埋め）","passage":"文化祭実行委員のEさんは、前売りチケットの販売状況を管理するプログラムを、先生（T）と作っている。\n\nT：5日間の販売数を配列 Uriage にまとめましたね。目標の180枚に何日目で到達したかをプログラムで求めてみましょう。\nE：Uriage = [30, 45, 60, 52, 71] です。1日目から順に足していって、合計が目標に届くまでの日数を数えればいいんですね。\nT：そのとおり。ただし、目標に達したあとの日は数えないように、合計が目標未満のときだけ加算と日数のカウントを行う工夫が必要です（図1）。\nE：なるほど、条件判定を繰返しの中に入れるんですね。ついでに、販売数が50枚以上だった日が何日あるかも数えてみます（図2）。","code":"【図1】\n(01) Uriage = [30, 45, 60, 52, 71]\n(02) mokuhyo = 180\n(03) goukei = 0\n(04) nissu = 0\n(05) i を【 カ 】から 4 まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし goukei【 キ 】mokuhyo ならば：\n(07) 　　　　goukei = goukei +【 ク 】\n(08) 　　　　nissu = nissu +【 ケ 】\n(09) 表示する(nissu, \" 日目で目標達成\")\n\n【図2】\n(10) kaisu = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　もし Uriage[i]【 コ 】50 ならば：\n(13) 　　　　kaisu = kaisu + 1\n(14) 表示する(kaisu)","q":"図1・図2のプログラムの空欄【カ】〜【コ】に当てはまるものを、語群から一つずつ選べ。同じものを繰り返し選んでもよい。","bank":["0","1","4","i","Uriage[i]","goukei","＜","＞="],"blanks":[{"label":"カ","a":0},{"label":"キ","a":6},{"label":"ク","a":4},{"label":"ケ","a":1},{"label":"コ","a":7}],"e":"【カ】配列の先頭（添字0）から調べる。【キ】合計が目標「未満」の日だけ加算するので ＜。【ク】その日の販売数 Uriage[i] を加える。【ケ】日数のカウンタは1ずつ増やす。【コ】「50枚以上」なので ＞=。累計は 30→75→135→187 と増え、4日目で目標を超える。"},{"id":"ex4-2","f":"exam","t":"本番形式：実行結果の追跡","d":3,"setId":"ex4","pts":[3],"passage":"文化祭実行委員のEさんは、前売りチケットの販売状況を管理するプログラムを、先生（T）と作っている。\n\nT：5日間の販売数を配列 Uriage にまとめましたね。目標の180枚に何日目で到達したかをプログラムで求めてみましょう。\nE：Uriage = [30, 45, 60, 52, 71] です。1日目から順に足していって、合計が目標に届くまでの日数を数えればいいんですね。\nT：そのとおり。ただし、目標に達したあとの日は数えないように、合計が目標未満のときだけ加算と日数のカウントを行う工夫が必要です（図1）。\nE：なるほど、条件判定を繰返しの中に入れるんですね。ついでに、販売数が50枚以上だった日が何日あるかも数えてみます（図2）。","code":"【図1】\n(01) Uriage = [30, 45, 60, 52, 71]\n(02) mokuhyo = 180\n(03) goukei = 0\n(04) nissu = 0\n(05) i を【 カ 】から 4 まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし goukei【 キ 】mokuhyo ならば：\n(07) 　　　　goukei = goukei +【 ク 】\n(08) 　　　　nissu = nissu +【 ケ 】\n(09) 表示する(nissu, \" 日目で目標達成\")\n\n【図2】\n(10) kaisu = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　もし Uriage[i]【 コ 】50 ならば：\n(13) 　　　　kaisu = kaisu + 1\n(14) 表示する(kaisu)","q":"空欄を正しく埋めた図1のプログラムを実行したとき、(09)で表示される日数として正しいものを選べ。","c":["4","3","5","2"],"a":0,"e":"累計は 1日目30、2日目75、3日目135 と目標未満が続き、4日目に52を加えて187となり目標180を超える。4日目の加算時点まで nissu が増えるので表示は4。5日目は goukei が既に180以上なので(07)(08)は実行されない。"},{"id":"ex4-3","f":"exam","t":"本番形式：条件判定の役割の考察","d":3,"setId":"ex4","pts":[2],"passage":"文化祭実行委員のEさんは、前売りチケットの販売状況を管理するプログラムを、先生（T）と作っている。\n\nT：5日間の販売数を配列 Uriage にまとめましたね。目標の180枚に何日目で到達したかをプログラムで求めてみましょう。\nE：Uriage = [30, 45, 60, 52, 71] です。1日目から順に足していって、合計が目標に届くまでの日数を数えればいいんですね。\nT：そのとおり。ただし、目標に達したあとの日は数えないように、合計が目標未満のときだけ加算と日数のカウントを行う工夫が必要です（図1）。\nE：なるほど、条件判定を繰返しの中に入れるんですね。ついでに、販売数が50枚以上だった日が何日あるかも数えてみます（図2）。","code":"【図1】\n(01) Uriage = [30, 45, 60, 52, 71]\n(02) mokuhyo = 180\n(03) goukei = 0\n(04) nissu = 0\n(05) i を【 カ 】から 4 まで 1 ずつ増やしながら繰り返す：\n(06) 　　もし goukei【 キ 】mokuhyo ならば：\n(07) 　　　　goukei = goukei +【 ク 】\n(08) 　　　　nissu = nissu +【 ケ 】\n(09) 表示する(nissu, \" 日目で目標達成\")\n\n【図2】\n(10) kaisu = 0\n(11) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(12) 　　もし Uriage[i]【 コ 】50 ならば：\n(13) 　　　　kaisu = kaisu + 1\n(14) 表示する(kaisu)","q":"図1の(06)の条件判定を取り除き、(07)(08)を毎回実行するように変えた場合の説明として最も適当なものを選べ。","c":["目標達成後も日数を数え続けてしまい、nissu は必ず5になって「何日目で達成したか」が分からなくなる。","結果はまったく変わらず、nissu は4のまま表示される。条件判定はプログラムの動作に影響していない。","合計への加算が一度も行われなくなり、nissu は0のままでプログラムは何も表示しなくなる。","繰返しが終了しなくなり、プログラムは無限ループに陥って停止しなくなる。"],"a":0,"e":"条件判定がなければ5日分すべてで加算とカウントが行われ、nissu=5 になる。(06)は「目標達成後は数えない」ための判定であり、これを外すと知りたい情報（達成日）が得られなくなる。条件の役割を考察させる本番型の問い。"},{"id":"ex5-1","f":"exam","t":"本番形式：二分探索プログラム","d":3,"setId":"ex5","type":"bank","pts":[4,4,4,4,4],"passageTitle":"第3問形式：二分探索プログラム（語群穴埋め）","passage":"図書委員のFさんは、昇順に整列された蔵書番号の配列から目的の番号を高速に探す二分探索のプログラムを、先生（T）と作っている。\n\nT：配列 Data = [3, 8, 15, 21, 30, 42, 55] から、mokuteki = 42 を探しましょう。二分探索では、調べる範囲の左端 hidari と右端 migi を管理し、範囲の中央 naka の値と比較して範囲を半分に絞っていきます。\nF：中央の値が目的の値より小さければ右半分に、大きければ左半分に絞るんですね。\nT：そうです。見つかったことを表す変数 mitsuketa も使って、図1のように書けます。「整数(x)」はxの小数点以下を切り捨てる関数です。\nF：完成したら、線形探索と比較して、どれくらい速いのかも確かめてみたいです。","code":"【図1】\n(01) Data = [3, 8, 15, 21, 30, 42, 55]\n(02) mokuteki = 42\n(03) hidari = 0\n(04) migi = 6\n(05) mitsuketa = 0\n(06) mitsuketa == 0 かつ hidari <= migi の間繰り返す：\n(07) 　　naka = 整数((hidari +【 ケ 】) / 2)\n(08) 　　もし Data[naka] == mokuteki ならば：\n(09) 　　　　mitsuketa =【 コ 】\n(10) 　　そうでなくもし Data[naka]【 カ 】mokuteki ならば：\n(11) 　　　　hidari = naka +【 キ 】\n(12) 　　そうでなければ：\n(13) 　　　　migi = naka −【 ク 】\n(14) 表示する(\"見つかった位置：\", naka)","q":"図1のプログラムの空欄【カ】〜【コ】に当てはまるものを、語群から一つずつ選べ。同じものを繰り返し選んでもよい。","bank":["0","1","2","naka","migi","Data[naka]","＜","＞"],"blanks":[{"label":"カ","a":6},{"label":"キ","a":1},{"label":"ク","a":1},{"label":"ケ","a":4},{"label":"コ","a":1}],"e":"【ケ】中央の添字は左端と右端の平均：(hidari+migi)/2。【カ】中央の値が目的より「小さい」（＜）なら答えは右半分にあるので、【キ】hidari を naka+1 に更新。逆なら【ク】migi を naka−1 に。【コ】見つかったら mitsuketa を1にして繰返しを終える。"},{"id":"ex5-2","f":"exam","t":"本番形式：探索過程の追跡","d":3,"setId":"ex5","pts":[3],"passage":"図書委員のFさんは、昇順に整列された蔵書番号の配列から目的の番号を高速に探す二分探索のプログラムを、先生（T）と作っている。\n\nT：配列 Data = [3, 8, 15, 21, 30, 42, 55] から、mokuteki = 42 を探しましょう。二分探索では、調べる範囲の左端 hidari と右端 migi を管理し、範囲の中央 naka の値と比較して範囲を半分に絞っていきます。\nF：中央の値が目的の値より小さければ右半分に、大きければ左半分に絞るんですね。\nT：そうです。見つかったことを表す変数 mitsuketa も使って、図1のように書けます。「整数(x)」はxの小数点以下を切り捨てる関数です。\nF：完成したら、線形探索と比較して、どれくらい速いのかも確かめてみたいです。","code":"【図1】\n(01) Data = [3, 8, 15, 21, 30, 42, 55]\n(02) mokuteki = 42\n(03) hidari = 0\n(04) migi = 6\n(05) mitsuketa = 0\n(06) mitsuketa == 0 かつ hidari <= migi の間繰り返す：\n(07) 　　naka = 整数((hidari +【 ケ 】) / 2)\n(08) 　　もし Data[naka] == mokuteki ならば：\n(09) 　　　　mitsuketa =【 コ 】\n(10) 　　そうでなくもし Data[naka]【 カ 】mokuteki ならば：\n(11) 　　　　hidari = naka +【 キ 】\n(12) 　　そうでなければ：\n(13) 　　　　migi = naka −【 ク 】\n(14) 表示する(\"見つかった位置：\", naka)","q":"空欄を正しく埋めたプログラムで mokuteki = 42 を探すとき、(06)〜(13)の繰返しは何回実行されるか。","c":["2回","1回","3回","6回"],"a":0,"e":"1回目：naka=(0+6)/2=3、Data[3]=21＜42 なので hidari=4。2回目：naka=(4+6)/2=5、Data[5]=42 で一致し mitsuketa=1。よって繰返しは2回。範囲が半分ずつに絞られていく様子を手作業で追跡させる定番の問い。"},{"id":"ex5-3","f":"exam","t":"本番形式：線形探索との効率比較","d":3,"setId":"ex5","pts":[2],"passage":"図書委員のFさんは、昇順に整列された蔵書番号の配列から目的の番号を高速に探す二分探索のプログラムを、先生（T）と作っている。\n\nT：配列 Data = [3, 8, 15, 21, 30, 42, 55] から、mokuteki = 42 を探しましょう。二分探索では、調べる範囲の左端 hidari と右端 migi を管理し、範囲の中央 naka の値と比較して範囲を半分に絞っていきます。\nF：中央の値が目的の値より小さければ右半分に、大きければ左半分に絞るんですね。\nT：そうです。見つかったことを表す変数 mitsuketa も使って、図1のように書けます。「整数(x)」はxの小数点以下を切り捨てる関数です。\nF：完成したら、線形探索と比較して、どれくらい速いのかも確かめてみたいです。","code":"【図1】\n(01) Data = [3, 8, 15, 21, 30, 42, 55]\n(02) mokuteki = 42\n(03) hidari = 0\n(04) migi = 6\n(05) mitsuketa = 0\n(06) mitsuketa == 0 かつ hidari <= migi の間繰り返す：\n(07) 　　naka = 整数((hidari +【 ケ 】) / 2)\n(08) 　　もし Data[naka] == mokuteki ならば：\n(09) 　　　　mitsuketa =【 コ 】\n(10) 　　そうでなくもし Data[naka]【 カ 】mokuteki ならば：\n(11) 　　　　hidari = naka +【 キ 】\n(12) 　　そうでなければ：\n(13) 　　　　migi = naka −【 ク 】\n(14) 表示する(\"見つかった位置：\", naka)","q":"同じ配列から mokuteki = 42 を線形探索（先頭から順に比較）で探した場合、何回目の比較で見つかるか。","c":["6回目","5回目","7回目","2回目"],"a":0,"e":"42は先頭から6番目（添字5）にあるので、線形探索では6回目の比較で見つかる。二分探索の2回と比べると、データ数が増えるほど差はさらに大きくなる（1000件なら最大1000回 対 約10回）。"},{"id":"ex6-1","f":"exam","t":"本番形式：負の相関の読み取り","d":2,"setId":"ex6","pts":[5],"passageTitle":"第4問形式：ホットドリンク販売数のデータ分析","passage":"購買部のGさんは、冬季のホットドリンクの仕入れ数を検討するため、15日分の「最低気温」と「販売数」を記録して散布図（図1）を作った。回帰直線はおよそ y = −3x + 80（x：最低気温℃、y：販売数）、相関係数は −0.91 だった。また、12月と3月の販売数をそれぞれ箱ひげ図（図2）にまとめた。","chart":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">最低気温とホットドリンク販売数（15日分）</text><line x1=\"60\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"77.64705882352942\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">0</text><line x1=\"77.64705882352942\" y1=\"197\" x2=\"77.64705882352942\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"165.88235294117646\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">5</text><line x1=\"165.88235294117646\" y1=\"197\" x2=\"165.88235294117646\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"254.11764705882354\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">10</text><line x1=\"254.11764705882354\" y1=\"197\" x2=\"254.11764705882354\" y2=\"203\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"342.3529411764706\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fi " cy=\"123.6\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"218.8\" cy=\"131.8\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"236.5\" cy=\"134.5\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"254.1\" cy=\"148.2\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"271.8\" cy=\"156.4\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"289.4\" cy=\"159.1\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"307.1\" cy=\"172.7\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/><circle cx=\"324.7\" cy=\"178.2\" r=\"4\" fill=\"#dc2626\" opacity=\".8\"/></svg>","q":"図1の散布図から読み取れることとして最も適当なものを選べ。","c":["最低気温が低い日ほど販売数が多い傾向がはっきりしており、強い負の相関があると読み取れる。","最低気温が低い日ほど販売数も少なくなる傾向があり、2つの量には強い正の相関があると読み取れる。","点の並びに特定の傾向は見られず、気温と販売数の間はほぼ無相関であると読み取れる。","相関係数が負の値なので、このデータには何らかの誤りが含まれていると判断するのが適切である。"],"a":0,"e":"点は右下がりに直線的に並んでおり、相関係数−0.91とも一致する強い負の相関。「気温が低いほど売れる」という向きの関係。相関係数が負であることはデータの誤りを意味しない。"},{"id":"ex6-2","f":"exam","t":"本番形式：回帰直線による予測","d":2,"setId":"ex6","pts":[5],"passage":"回帰直線はおよそ y = −3x + 80（x：最低気温℃、y：販売数）、相関係数は −0.91 だった。","q":"回帰直線を使って、最低気温が10℃と予想される日の販売数を見積もると何本になるか。","c":["50本","110本","30本","77本"],"a":0,"e":"y = −3×10 + 80 = 50本。符号に注意して計算する。負の傾きなので、気温が上がるほど見積もりは減る。"},{"id":"ex6-3","f":"exam","t":"本番形式：箱ひげ図の比較","d":3,"setId":"ex6","pts":[5],"passage":"12月と3月の販売数をそれぞれ箱ひげ図（図2）にまとめた。","chart":"<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">月別のホットドリンク販売数の分布（本）</text><line x1=\"185\" y1=\"55\" x2=\"220\" y2=\"55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"290\" y1=\"55\" x2=\"335\" y2=\"55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"185\" y1=\"47\" x2=\"185\" y2=\"63\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"335\" y1=\"47\" x2=\"335\" y2=\"63\" stroke=\"#475569\" stroke-width=\"1.5\"/><rect x=\"220\" y=\"41\" width=\"70.0\" height=\"28\" fill=\"#dc2626\" opacity=\".55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"260\" y1=\"41\" x2=\"260\" y2=\"69\" stroke=\"#1e2a3a\" stroke-width=\"2.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"59\" text-anchor=\"end\" font-size=\"12\" fill=\"#1e2a3a\">12月</text><line x1=\"85\" y1=\"115\" x2=\"120\" y2=\"115\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"190\" y1=\"115\" x2=\"235\" y2=\"115\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"85\" y1=\"107\" x2=\"85\" y2=\"123\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"235\" y1=\"107\" x2=\"235\" y2=\"123\" stroke=\"#475569\" stroke-width=\"1.5\"/><rect x=\"120\" y=\"101\" width=\"70.0\" height=\"28\" fill=\"#0ea5e9\" opacity=\".55\" stroke=\"#475569\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"101\" x2=\"150\" y2=\"129\" stroke=\"#1e2a3a\" stroke-width=\"2.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"52\" y=\"119\" text-anchor=\"end\" font-size=\"12\" fill=\"#1e2a3a\">3月</text><line x1=\"60\" y1=\"150\" x2=\"380\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"60\" y1=\"147\" x2=\"60\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"60\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">30</text><line x1=\"135\" y1=\"147\" x2=\"135\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"135\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">45</text><line x1=\"210\" y1=\"147\" x2=\"210\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">60</text><line x1=\"285\" y1=\"147\" x2=\"285\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"285\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">75</text><line x1=\"360\" y1=\"147\" x2=\"360\" y2=\"153\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"360\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">90</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"185\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">1日の販売数（本）</text></svg>","q":"図2の箱ひげ図から読み取れることとして最も適当なものを選べ。","c":["12月の中央値（70本）は3月の最大値（65本）より大きく、12月の半数以上の日は3月で最も売れた日よりも売れている。","3月の中央値は12月の中央値より大きく、3月のほうが全体として売れていたことが読み取れる。","12月と3月の箱ひげ図は完全に重なっており、月による販売数の違いはまったく見られない。","箱ひげ図の箱の中の縦線はその月の平均値を表しているので、12月の販売数の平均はちょうど70本ちょうどであったと断定することができる。"],"a":0,"e":"12月の中央値70本は3月の最大値65本を上回るため、12月の半数以上の日が3月のどの日よりも売れている。箱の中の縦線は中央値であり平均値ではない。2つの分布の位置関係を数値で比較する頻出パターン。"},{"id":"ex6-4","f":"exam","t":"本番形式：分析の進め方（二つ選べ）","d":3,"setId":"ex6","pts":[5],"m":2,"passage":"Gさんは分析結果をもとに、来月の仕入れ計画についてまとめることにした。","q":"Gさんのデータ分析の進め方として適当なものを、次のうちから二つ選べ。","c":["回帰直線による見積もりと実際の販売数のずれを記録し続け、ずれが大きくなったら分析をやり直す。","気温以外の要因（曜日、行事の有無など）でも販売数が変わらないかを調べ、必要ならデータ項目を増やす。","相関係数の絶対値が0.9を超えているので、これ以上データを集めることには意味がなく、記録は今日で終了してよい。","冬のデータで求めた回帰直線なので、夏になってもそのまま同じ式を使って仕入れ数を決めるのがよい。"],"a":[0,1],"e":"予測と実績の照合・見直し、他の要因の検討はいずれも適切な進め方。高い相関があっても記録をやめる理由にはならず、季節が変われば気温と販売数の関係自体が変わるため、同じ式の使い回しは不適切。"},{"id":"ex6-5","f":"exam","t":"本番形式：外挿の危険性","d":3,"setId":"ex6","pts":[5],"passage":"Hさんが「夏の最低気温25℃の日にもこの式を当てはめると y = −3×25 + 80 = 5本と予測できる」と発言した。","q":"Hさんの発言に対する指摘として最も適当なものを選べ。","c":["今回のデータは最低気温0〜14℃の範囲のものなので、範囲から大きく外れた25℃への当てはめ（外挿）は信頼できない。","計算結果が5本とプラスの値になっているので、この予測は夏でも十分に信頼できると考えてよい。","回帰直線は一度求めてしまえば、どんな値のxに対しても常に正確な予測を与えてくれるので、Hさんのこの使い方にはまったく問題がない。","相関係数が負なので、この式は気温が高い日にだけ使うことができ、冬の予測には使えない。"],"a":0,"e":"回帰直線はデータが観測された範囲内での傾向を表すもの。範囲外への外挿は、関係そのものが変わっている可能性があり信頼できない（夏はそもそもホットドリンクの需要構造が違う）。計算できることと信頼できることは別、という考察。"},{"id":"ex7-1","f":"exam","t":"本番形式：ヒストグラムの読み取り","d":2,"setId":"ex7","pts":[5],"passageTitle":"第4問形式：図書室の利用調査","passage":"図書委員のJさんは、昼休みの図書室の使われ方を調べるため、利用者80人の滞在時間をヒストグラム（図1）に、学年別の利用目的をクロス集計表（表1）にまとめた。\n\n表1　学年×利用目的（人）\n　　　　自習　読書　その他　計\n1年　　20　　12　　8　　　40\n2年　　12　　 9　　4　　　25\n3年　　 5　　 8　　2　　　15","chart":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">図書室の滞在時間（80人）</text><line x1=\"55\" y1=\"200\" x2=\"385\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"55\" y1=\"40\" x2=\"55\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"204\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">0</text><line x1=\"52\" y1=\"200\" x2=\"58\" y2=\"200\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"157.84615384615384\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">8</text><line x1=\"52\" y1=\"153.84615384615384\" x2=\"58\" y2=\"153.84615384615384\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"111.6923076923077\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">16</text><line x1=\"52\" y1=\"107.6923076923077\" x2=\"58\" y2=\"107.6923076923077\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"65.53846153846155\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">24</text><line x1=\"52\" y1=\"61.53846153846155\" x2=\"58\" y2=\"61.53846153846155\" stroke=\"#94a3b8\"/><rect x=\"60\" y=\"153.84615384615384\" width=\"50\" height=\"46.15384615384615\" fill=\"#7c3aed\" opacity=\".75\" stroke=\"#5b21b6\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">0〜10</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"149.84615384615384\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">8</text><rect x=\"114\" y=\"84.61538461538461  x=\"355\" y=\"216\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5b6b7d\">50〜60</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"172.92307692307693\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1e2a3a\">4</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"220\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">滞在時間（分）</text></svg>","q":"図1のヒストグラムから読み取れることとして最も適当なものを選べ。","c":["最も人数が多い階級は20分以上30分未満であり、分布の山はそこにある。","滞在時間が長い階級ほど人数が多くなっており、60分に近い利用者が最も多い。","すべての階級の人数が等しく、滞在時間には偏りがまったく見られない。","0分以上10分未満の利用者が全体の半数以上を占めている。"],"a":0,"e":"最も高い柱は20〜30分の24人。分布は20〜30分を山として右（長時間側）に裾を引く形。0〜10分は8人で全体80人の1割にすぎない。"},{"id":"ex7-2","f":"exam","t":"本番形式：相対度数の計算","d":2,"setId":"ex7","pts":[5],"passage":"利用者80人の滞在時間をヒストグラム（図1）にまとめた。","chart":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">図書室の滞在時間（80人）</text><line x1=\"55\" y1=\"200\" x2=\"385\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><line x1=\"55\" y1=\"40\" x2=\"55\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"204\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">0</text><line x1=\"52\" y1=\"200\" x2=\"58\" y2=\"200\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"157.84615384615384\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">8</text><line x1=\"52\" y1=\"153.84615384615384\" x2=\"58\" y2=\"153.84615384615384\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"47\" y=\"111.6923076923077\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b7d\">16</text><line x1=\"52\" y1=\"107.6923076923077\" x2=\"58\" y2=\"107.6923076923077\" stroke=\"#94a3b8\"/><text font-family=\"Hiragino Sans,Yu G
