<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報Ⅰ 実力養成演習</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1e2a3a; --sub:#5b6b7d;
    --accent:#2563eb; --accent2:#0ea5e9; --ok:#16a34a; --ng:#dc2626;
    --f1:#e11d48; --f2:#d97706; --f3:#7c3aed; --f4:#0891b2;
    --radius:14px; --shadow:0 2px 10px rgba(30,42,58,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; background:var(--bg); color:var(--ink); line-height:1.7;}
  .wrap{max-width:840px; margin:0 auto; padding:16px 16px 60px;}
  header{background:linear-gradient(135deg,#1d4ed8,#0ea5e9); color:#fff; padding:18px 16px; border-radius:0 0 18px 18px;}
  header h1{font-size:1.25rem;}
  header p{font-size:.85rem; opacity:.9;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-top:16px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}
  .field-btn{border:none; text-align:left; cursor:pointer; border-radius:var(--radius); padding:16px; color:#fff; box-shadow:var(--shadow); transition:transform .1s;}
  .field-btn:active{transform:scale(.98);}
  .field-btn h3{font-size:1.02rem; margin-bottom:4px;}
  .field-btn small{opacity:.92; font-size:.78rem; display:block;}
  .f1{background:linear-gradient(135deg,#e11d48,#f97316);}
  .f2{background:linear-gradient(135deg,#d97706,#eab308);}
  .f3{background:linear-gradient(135deg,#7c3aed,#6366f1);}
  .f4{background:linear-gradient(135deg,#0891b2,#06b6d4);}
  .fmix{background:linear-gradient(135deg,#334155,#64748b);}
  .frev{background:linear-gradient(135deg,#16a34a,#22c55e);}
  .f5{background:linear-gradient(135deg,#059669,#10b981);}
  .f6{background:linear-gradient(135deg,#9333ea,#c026d3);}
  .section-label{font-size:.82rem; font-weight:700; color:var(--sub); margin:18px 0 4px;}
  .toolbar{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn{border:none; cursor:pointer; border-radius:10px; padding:10px 18px; font-size:.95rem; font-weight:600;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:#e8edf5; color:var(--ink);}
  .btn:disabled{opacity:.45; cursor:default;}
  .meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .tag{font-size:.72rem; padding:2px 10px; border-radius:999px; background:#eef2f8; color:var(--sub); font-weight:600;}
  .tag.diff1{background:#dcfce7; color:#15803d;}
  .tag.diff2{background:#fef9c3; color:#a16207;}
  .tag.diff3{background:#fee2e2; color:#b91c1c;}
  .qtext{font-size:1rem; margin-bottom:14px; white-space:pre-wrap;}
  pre.code{background:#0f172a; color:#e2e8f0; padding:14px; border-radius:10px; font-size:.85rem; overflow-x:auto; margin:10px 0 14px; line-height:1.6; font-family:"Consolas","Menlo",monospace;}
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{border:2px solid #dde4ee; background:#fff; border-radius:10px; padding:12px 14px; text-align:left; cursor:pointer; font-size:.95rem; line-height:1.6; transition:border-color .12s;}
  .choice:hover{border-color:var(--accent2);}
  .choice.sel-ok{border-color:var(--ok); background:#f0fdf4;}
  .choice.sel-ng{border-color:var(--ng); background:#fef2f2;}
  .choice.reveal{border-color:var(--ok); background:#f0fdf4;}
  .choice:disabled{cursor:default; color:var(--ink); opacity:1;}
  .choice .mark{font-weight:700; margin-right:8px; color:var(--accent);}
  .judge{font-size:1.05rem; font-weight:700; margin-top:14px;}
  .judge.ok{color:var(--ok);} .judge.ng{color:var(--ng);}
  .expl{background:#f1f5fb; border-left:4px solid var(--accent); padding:12px 14px; border-radius:0 10px 10px 0; margin-top:10px; font-size:.92rem; white-space:pre-wrap;}
  .progress{height:8px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin:12px 0 4px;}
  .progress span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s;}
  .pnum{font-size:.8rem; color:var(--sub); text-align:right;}
  .score-big{font-size:2.4rem; font-weight:800; text-align:center; margin:8px 0;}
  .score-sub{text-align:center; color:var(--sub); font-size:.9rem;}
  .bar-row{margin:10px 0;}
  .bar-row .lbl{display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:3px;}
  .bar{height:12px; background:#e2e8f0; border-radius:999px; overflow:hidden;}
  .bar span{display:block; height:100%; border-radius:999px;}
  .weak-list li{margin:6px 0 6px 18px; font-size:.9rem;}
  .home-link{color:#fff; text-decoration:underline; cursor:pointer; font-size:.85rem;}
  .hidden{display:none;}
  .stat-note{font-size:.8rem; color:var(--sub); margin-top:10px;}
  .nav-top{display:flex; justify-content:space-between; align-items:center;}
  .chart-box{background:#fff; border:1px solid #dde4ee; border-radius:10px; padding:10px; margin:6px 0 14px; overflow-x:auto;}
  .chart-box svg{max-width:100%; height:auto; display:block; margin:0 auto;}
  .chart-box svg text{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;}
  .chart-box table{border-collapse:collapse; margin:4px auto; font-size:.9rem;}
  .chart-box table th, .chart-box table td{border:1px solid #cbd5e1; padding:6px 14px; text-align:center;}
  .chart-box table th{background:#eef2f8;}
  .passage-box{background:#fffbeb; border-left:4px solid #d97706; border-radius:0 10px 10px 0; padding:12px 14px; margin-bottom:14px; font-size:.9rem; white-space:pre-wrap;}
  .passage-title{font-weight:700; font-size:.85rem; color:#b45309; margin-bottom:6px;}
</style>
</head>
<body>
<header>
  <div class="nav-top">
    <div>
      <h1>情報Ⅰ 実力養成演習</h1>
      <p>共通テスト形式のオリジナル問題で弱点を克服しよう</p>
    </div>
    <span class="home-link" onclick="goHome()">ホーム</span>
  </div>
</header>
<div class="wrap">

  <!-- ホーム画面 -->
  <div id="view-home">
    <div class="card">
      <h2 style="font-size:1.05rem;">分野を選んで演習を始めよう</h2>
      <p style="font-size:.85rem; color:var(--sub);">全267問収録（分野別240問＋グラフ読解12問＋長文総合15問）。1回の演習では10問がランダムに出題されます。</p>
      <div class="grid">
        <button class="field-btn f1" onclick="startQuiz('society')"><h3>① 情報社会の問題解決</h3><small>著作権・個人情報・セキュリティ・SNS</small></button>
        <button class="field-btn f2" onclick="startQuiz('digital')"><h3>② 情報デザインとデジタル化</h3><small>2進数・音・画像・圧縮・情報デザイン</small></button>
        <button class="field-btn f3" onclick="startQuiz('programming')"><h3>③ コンピュータとプログラミング</h3><small>プログラム・アルゴリズム・シミュレーション</small></button>
        <button class="field-btn f4" onclick="startQuiz('network')"><h3>④ ネットワークとデータ活用</h3><small>TCP/IP・暗号・データベース・データ分析</small></button>
        <button class="field-btn fmix" onclick="startQuiz('mix')"><h3>全分野ミックス</h3><small>4分野からランダムに12問（本番対策）</small></button>
        <button class="field-btn frev" onclick="startReview()"><h3>弱点復習モード</h3><small>これまで間違えた問題だけを解き直す</small></button>
      </div>
      <div class="section-label">実戦形式トレーニング（NEW）</div>
      <div class="grid">
        <button class="field-btn f5" onclick="startQuiz('graph')"><h3>⑤ グラフ・図表読解</h3><small>棒・折れ線・散布図・箱ひげ図・ヒストグラム等</small></button>
        <button class="field-btn f6" onclick="startPassageMode()"><h3>⑥ 長文総合問題（本番形式）</h3><small>会話文でつながる小問セットを5題・全15問通しで演習</small></button>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="showStats()">成績・弱点分析を見る</button>
        <button class="btn btn-ghost" onclick="resetRecords()">記録をリセット</button>
      </div>
    </div>
  </div>

  <!-- 演習画面 -->
  <div id="view-quiz" class="hidden">
    <div class="card">
      <div class="progress"><span id="prog-bar" style="width:0%"></span></div>
      <div class="pnum" id="prog-num"></div>
      <div id="q-passage"></div>
      <div class="meta" id="q-meta"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-code"></div>
      <div id="q-chart"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-judge"></div>
      <div id="q-expl"></div>
      <div class="toolbar">
        <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">次の問題へ</button>
        <button class="btn btn-ghost" onclick="quitQuiz()">中断してホームへ</button>
      </div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="view-result" class="hidden">
    <div class="card">
      <h2 style="text-align:center; font-size:1.1rem;">演習結果</h2>
      <div class="score-big" id="res-score"></div>
      <div class="score-sub" id="res-msg"></div>
      <div id="res-detail" style="margin-top:14px;"></div>
      <div class="toolbar" style="justify-content:center;">
        <button class="btn btn-primary" onclick="retrySame()">もう一度この分野</button>
        <button class="btn btn-ghost" onclick="goHome()">ホームへ</button>
        <button class="btn btn-ghost" onclick="showStats()">弱点分析</button>
      </div>
    </div>
  </div>

  <!-- 成績画面 -->
  <div id="view-stats" class="hidden">
    <div class="card">
      <h2 style="font-size:1.1rem;">成績・弱点分析</h2>
      <div id="stats-body"></div>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="startReview()">弱点復習を始める</button>
        <button class="btn btn-ghost" onclick="goHome()">ホームへ</button>
      </div>
    </div>
  </div>

</div>
<script>
"use strict";
/* ====== 問題データ ====== */
const FIELDS = {
  society:{name:"① 情報社会の問題解決", cls:"f1", color:"#e11d48"},
  digital:{name:"② 情報デザインとデジタル化", cls:"f2", color:"#d97706"},
  programming:{name:"③ コンピュータとプログラミング", cls:"f3", color:"#7c3aed"},
  network:{name:"④ ネットワークとデータ活用", cls:"f4", color:"#0891b2"},
  graph:{name:"⑤ グラフ・図表読解", cls:"f5", color:"#059669"},
  passage:{name:"⑥ 長文総合問題", cls:"f6", color:"#9333ea"}
};
const CORE_FIELDS = ["society","digital","programming","network"];
const QUESTIONS = [
/* ---- ① 情報社会の問題解決 ---- */
{id:"s1", f:"society", t:"著作権", d:1,
 q:"日本の著作権法に基づく判断として最も適当なものを選べ。",
 c:["友人から借りた市販の音楽CDを自分用に複製し、そのデータをSNSで不特定多数に公開した。これは私的使用のための複製なので問題ない。",
    "授業の課題レポートで他人の文章を引用する際、出典を明示し、自分の文章が主で引用部分が従となるようにした。",
    "インターネット上で公開されている画像は、誰でも自由に使えるように公開されているのだから、許諾なく自分のポスターに使ってよい。",
    "著作権はすべて登録手続きをしなければ発生しない権利である。"],
 a:1,
 e:"引用は、出典の明示、引用部分と自分の文章の区別、主従関係（自分の文章が主）などの要件を満たせば著作権者の許諾なく行える（著作権法32条）。SNSでの公開は私的使用の範囲を超える。ネット上の画像にも著作権はある。著作権は創作した時点で自動的に発生する（無方式主義）。"},
{id:"s2", f:"society", t:"産業財産権", d:2,
 q:"産業財産権に関する説明として最も適当なものを選べ。",
 c:["発明を保護する権利は実用新案権である。",
    "製品のデザイン（形状・模様など）を保護する権利は意匠権である。",
    "商品やサービスのマーク・ロゴを保護する権利は特許権である。",
    "産業財産権は著作権と同様、出願や登録をしなくても自動的に発生する。"],
 a:1,
 e:"産業財産権は4つ：特許権（発明）、実用新案権（物品の構造などの考案）、意匠権（デザイン）、商標権（マーク・ロゴ）。いずれも特許庁への出願・登録が必要（方式主義）で、無方式主義の著作権とは異なる。"},
{id:"s3", f:"society", t:"個人情報", d:1,
 q:"個人情報の保護に関する説明として最も適当なものを選べ。",
 c:["個人情報とは氏名だけを指し、生年月日や住所は含まれない。",
    "人種、信条、病歴などは「要配慮個人情報」とされ、取得には原則として本人の同意が必要である。",
    "一度収集した個人情報は、収集時に示した利用目的以外にも企業が自由に使ってよい。",
    "指紋や顔認識データなどの身体的特徴は個人情報には該当しない。"],
 a:1,
 e:"要配慮個人情報（人種・信条・病歴・犯罪歴など）は不当な差別や不利益につながるおそれがあるため、取得には原則本人の同意が必要。個人情報は氏名・生年月日等の組合せで特定の個人を識別できる情報全般を指し、指紋・顔認識データ等の個人識別符号も含まれる。利用目的外の使用は原則できない。"},
{id:"s4", f:"society", t:"クリエイティブ・コモンズ", d:2,
 q:"クリエイティブ・コモンズ・ライセンス（CCライセンス）で「BY-NC」と表示された作品の利用条件として最も適当なものを選べ。",
 c:["作者名を表示すれば、営利目的でも自由に利用できる。",
    "作者名を表示し、かつ非営利目的であれば利用できる。",
    "いかなる場合も複製・再配布は一切できない。",
    "改変は禁止されているが、営利目的の販売は自由にできる。"],
 a:1,
 e:"CCライセンスの条件は BY（表示：作者名等の表示）、NC（非営利）、ND（改変禁止）、SA（継承：同じライセンスで公開）の組合せ。BY-NCは「作者名を表示し、非営利目的なら利用可」という意味。"},
{id:"s5", f:"society", t:"サイバー犯罪・詐欺", d:1,
 q:"「銀行を名乗るメールが届き、本文中のリンクから偽サイトに誘導されて暗証番号を入力させられる」という手口の名称と、適切な対策の組合せとして最も適当なものを選べ。",
 c:["フィッシング詐欺 ― メール中のリンクは安易に開かず、公式アプリやブックマークからアクセスして確認する。",
    "ワンクリック詐欺 ― 請求画面が表示されたらすぐに料金を支払う。",
    "フィッシング詐欺 ― メールに記載された電話番号に連絡して指示に従う。",
    "DoS攻撃 ― パスワードを紙にメモして保管する。"],
 a:0,
 e:"実在の組織を装って偽サイトに誘導し、認証情報などを盗む手口をフィッシング詐欺という。メール内のリンクや連絡先は偽物の可能性があるため使わず、正規のアプリ・ブックマーク・公式サイトから確認するのが基本対策。"},
{id:"s6", f:"society", t:"認証とパスワード", d:2,
 q:"認証の安全性を高める方法に関する説明として最も適当なものを選べ。",
 c:["二要素認証とは、2つの異なるサービスで同じパスワードを使うことである。",
    "「知識情報（パスワード）」「所持情報（スマートフォン等）」「生体情報（指紋等）」のうち2種類以上を組み合わせる認証を多要素認証という。",
    "パスワードは覚えやすいように、誕生日や名前を使い、すべてのサービスで共通にするのがよい。",
    "生体認証は指紋や顔を使うため、パスワードと組み合わせても安全性は変わらない。"],
 a:1,
 e:"多要素認証は、知識情報・所持情報・生体情報という異なる種類の要素を2つ以上組み合わせる認証方式。1つの要素が漏えいしても突破されにくくなる。パスワードの使い回しや推測されやすい文字列は危険。"},
{id:"s7", f:"society", t:"SNSと情報発信", d:1,
 q:"SNSでの情報発信に関する注意点として最も適当なものを選べ。",
 c:["投稿を削除すれば、その情報がインターネット上から完全に消えることが保証される。",
    "非公開設定にしていれば、投稿内容がスクリーンショット等で拡散されることは絶対にない。",
    "写真に写り込んだ制服・背景や位置情報（ジオタグ）から、自宅や学校が特定されるおそれがある。",
    "匿名アカウントからの投稿であれば、発信者が特定されることはない。"],
 a:2,
 e:"写真の背景・制服・位置情報などから個人が特定される危険がある。一度拡散した情報は完全には消せず（デジタルタトゥー）、非公開でもスクリーンショットで拡散されうる。匿名でも発信者情報開示請求などで特定される場合がある。"},
{id:"s8", f:"society", t:"肖像権・パブリシティ権", d:2,
 q:"肖像権・パブリシティ権に関する説明として最も適当なものを選べ。",
 c:["肖像権は法律の条文に明記された権利ではないが、判例で認められており、無断で他人の姿を撮影・公開すると侵害となる場合がある。",
    "友人の写真は、本人の許可なくSNSに公開しても法的な問題は一切生じない。",
    "パブリシティ権とは、一般人の顔写真が持つ経済的価値を保護する権利である。",
    "有名人は公人なので、その写真を商品の広告に無断で使用してもよい。"],
 a:0,
 e:"肖像権は明文規定はないが判例上認められる権利で、無断撮影・公開は侵害になりうる。パブリシティ権は有名人の氏名・肖像が持つ顧客吸引力（経済的価値）を保護する権利で、広告への無断使用は侵害となる。"},
{id:"s9", f:"society", t:"情報格差", d:1,
 q:"情報機器やインターネットを利用できる人とできない人との間に生じる、得られる情報や機会の格差を表す語として最も適当なものを選べ。",
 c:["デジタルデバイド","メディアリテラシー","テクノストレス","ユビキタス"],
 a:0,
 e:"デジタルデバイド（情報格差）は、年齢・地域・経済状況などによって情報通信技術を利用できる人とできない人の間に生じる格差のこと。メディアリテラシーは情報を批判的に読み解き活用する能力、テクノストレスは情報機器利用による心身のストレス。"},
{id:"s10", f:"society", t:"不正アクセス禁止法", d:2,
 q:"不正アクセス禁止法で禁止されている行為として最も適当なものを選べ。",
 c:["自分のパスワードを忘れないようにパスワード管理アプリに保存する行為",
    "他人のIDとパスワードを本人に無断で使ってサービスにログインする行為",
    "公開されているWebサイトを閲覧する行為",
    "自分のSNSアカウントに強固なパスワードを設定する行為"],
 a:1,
 e:"不正アクセス禁止法は、他人の識別符号（ID・パスワード）を無断で入力してログインする「なりすまし行為」や、セキュリティホールを突いた侵入、他人のID・パスワードを第三者に提供する行為などを禁止している。実際に情報を盗まなくても、無断ログイン自体が犯罪となる。"},
{id:"s11", f:"society", t:"情報の信ぴょう性", d:2,
 q:"インターネット上の情報の信ぴょう性を確認する方法として最も適当なものを選べ。",
 c:["SNSで多くの「いいね」が付いている情報は、内容が正しいと判断してよい。",
    "検索結果の上位に表示されたサイトの情報は、常に信頼できる。",
    "発信元（一次情報かどうか・発信者・日付）を確かめ、複数の異なる情報源を比較して確認する。",
    "友人から送られてきた情報は、善意によるものなのでそのまま拡散してよい。"],
 a:2,
 e:"情報の信ぴょう性は、発信元は誰か、一次情報か、いつの情報か、他の複数の情報源とも一致するか（クロスチェック）で確認する。「いいね」の数や検索順位、善意かどうかは正確さの保証にならない。誤情報の拡散に加担しないことも重要。"},
{id:"s12", f:"society", t:"知的財産権の全体像", d:3,
 q:"高校の文化祭で、クラスの出し物のポスターを作ることになった。知的財産権の観点から最も適当な行動を選べ。",
 c:["人気アニメのキャラクターをそっくりに描いて使う。文化祭は営利目的ではないので、著作権者の許諾は一切不要である。",
    "市販の楽曲を教室でBGMとして流す予定なので、利用条件を確認し、必要に応じて許諾を得る。",
    "プロカメラマンの写真を無断で使うが、撮影者名を書いておけば引用として必ず適法になる。",
    "フリー素材サイトの画像は、利用規約を読まなくてもどんな使い方をしてもよい。"],
 a:1,
 e:"非営利の学校行事でも、著作物の利用が常に自由になるわけではない（授業の過程での利用等、法が認める例外は限定的）。キャラクターの模倣は複製権・翻案権の侵害になりうる。撮影者名を書くだけでは引用の要件（主従関係・必然性等）を満たさない。フリー素材にも利用規約（商用不可・クレジット必須等）がある。"},
{id:"s13", f:"society", t:"著作者人格権", d:2,
 q:"著作者人格権に関する説明として最も適当なものを選べ。",
 c:["著作者人格権には公表権・氏名表示権・同一性保持権があり、他人に譲渡することができない。",
    "著作者人格権は、契約すれば自由に他人に売却できる。",
    "作品を無断で改変されても、著作者人格権の侵害にはならない。",
    "著作者人格権は、作品を公表した後に特許庁に登録して初めて発生する。"],
 a:0,
 e:"著作者の権利は、財産的な「著作権（財産権）」と人格的な「著作者人格権」に分かれる。著作者人格権（公表権・氏名表示権・同一性保持権）は著作者本人だけの権利で譲渡できない。無断改変は同一性保持権の侵害。登録は不要（無方式主義）。"},
{id:"s14", f:"society", t:"著作隣接権", d:3,
 q:"著作隣接権によって保護される者として最も適当な組合せを選べ。",
 c:["小説家・作曲家・画家","実演家（歌手・俳優など）・レコード製作者・放送事業者","発明者・デザイナー","プログラマ・データベース設計者"],
 a:1,
 e:"著作隣接権は、著作物を「伝達する」役割を果たす実演家・レコード製作者・放送事業者などに与えられる権利。小説家や作曲家は著作物の創作者として著作権で保護される。発明者は特許権の対象。"},
{id:"s15", f:"society", t:"著作権の例外規定", d:3,
 q:"学校その他の教育機関における著作物の利用に関する説明として最も適当なものを選べ。",
 c:["授業の過程で使用するためであれば、必要と認められる限度で著作物を複製できる場合があるが、著作権者の利益を不当に害する利用は認められない。",
    "学校であれば、市販の問題集を全ページコピーして生徒全員に配ってもよい。",
    "学校の授業で使う目的なら、どんな著作物でも制限なくインターネットに公開できる。",
    "教育目的での利用の場合、著作者名を表示する必要は一切ない。"],
 a:0,
 e:"著作権法35条により、授業の過程での利用は必要な限度で複製等が認められるが、「著作権者の利益を不当に害する」利用（問題集・ドリルの丸ごとコピーなど）は例外の対象外。公衆への公開や出所明示にもルールがある。"},
{id:"s16", f:"society", t:"著作権の保護期間", d:2,
 q:"日本における著作権（財産権）の保護期間として正しいものを選べ。",
 c:["原則として著作者の死後70年まで","原則として公表後10年まで","著作者が生きている間だけ","永久に保護される"],
 a:0,
 e:"著作権の保護期間は原則として著作者の死後70年（2018年の法改正で50年から延長）。保護期間が過ぎた著作物はパブリックドメインとなり、誰でも自由に利用できる。"},
{id:"s17", f:"society", t:"情報の特性", d:1,
 q:"デジタル情報の特性に関する説明として最も適当なものを選べ。",
 c:["一度インターネット上に発信された情報は複製・拡散されやすく、完全に回収することは難しい（残存性・複製性・伝播性）。",
    "デジタル情報は複製するたびに品質が大きく劣化するので、拡散される心配はない。",
    "情報は物と同じで、誰かに渡すと自分の手元からはなくなる。",
    "デジタル情報は一度削除すればインターネット上から必ず完全に消える。"],
 a:0,
 e:"情報には、消えずに残り続ける「残存性」、簡単に複製できる「複製性」、瞬時に広がる「伝播性」という特性がある。物と違って渡しても手元に残り、劣化せずに複製される。だから発信前に慎重に判断することが重要。"},
{id:"s18", f:"society", t:"マルウェア", d:2,
 q:"感染したコンピュータのファイルを勝手に暗号化し、元に戻すことと引き換えに金銭を要求するマルウェアの名称として正しいものを選べ。",
 c:["ランサムウェア","キーロガー","アドウェア","ボット"],
 a:0,
 e:"ランサム（ransom）は「身代金」の意味。ファイルを暗号化して使えなくし、復元と引き換えに金銭を要求する。対策の基本は、OSやソフトの更新、不審な添付ファイルを開かないこと、そして重要データのバックアップを普段から取っておくこと。"},
{id:"s19", f:"society", t:"マルウェアの種類", d:3,
 q:"マルウェアに関する説明として最も適当なものを選べ。",
 c:["ワームは、便利なソフトウェアを装ってユーザにインストールさせ、裏で不正な動作をする。",
    "トロイの木馬は、ネットワークを通じて自分自身で自己複製しながら感染を広げる。",
    "ワームは他のファイルに寄生せず、ネットワーク経由で自己複製して拡散する。トロイの木馬は有用なソフトを装って侵入する。",
    "スパイウェアは、画面に広告を表示するだけで、情報を外部に送信することはない。"],
 a:2,
 e:"ワーム＝単独で自己複製しネットワークで拡散。トロイの木馬＝有用なソフトを装って侵入し、自己複製はしない。スパイウェアは利用者の情報を密かに収集・送信する。それぞれの「感染・拡散のしかた」の違いを整理しておこう。"},
{id:"s20", f:"society", t:"ソーシャルエンジニアリング", d:2,
 q:"ソーシャルエンジニアリングの例として最も適当なものを選べ。",
 c:["プログラムの脆弱性を突いてサーバに侵入する。",
    "肩越しにパスワードの入力を盗み見たり、管理者になりすまして電話でパスワードを聞き出したりする。",
    "総当たり攻撃でパスワードを解析する。",
    "ウイルスを添付したメールを送信する。"],
 a:1,
 e:"ソーシャルエンジニアリングは、技術ではなく人間の心理や行動の隙を突いて情報を得る手法。ショルダーハッキング（盗み見）、なりすましの電話、ゴミ箱あさり（トラッシング）などが典型例。技術的対策だけでは防げず、一人ひとりの注意が必要。"},
{id:"s21", f:"society", t:"情報セキュリティの3要素", d:2,
 q:"情報セキュリティの3要素「機密性・完全性・可用性」の説明の組合せとして正しいものを選べ。",
 c:["機密性：許可された人だけが情報にアクセスできること／完全性：情報が改ざん・破壊されていないこと／可用性：必要なときにいつでも利用できること",
    "機密性：情報が改ざんされていないこと／完全性：誰でもアクセスできること／可用性：情報を秘密にすること",
    "機密性：システムが高速なこと／完全性：データが大きいこと／可用性：誰でも書き換えられること",
    "機密性：バックアップがあること／完全性：パスワードが長いこと／可用性：暗号化されていること"],
 a:0,
 e:"機密性（Confidentiality）＝許可された人だけがアクセスできる、完全性（Integrity）＝正確で改ざんされていない、可用性（Availability）＝必要なときに使える。3つの頭文字からCIAと呼ばれる。それぞれを高める対策（暗号化・改ざん検知・バックアップ等）と対応させて覚えよう。"},
{id:"s22", f:"society", t:"可用性を高める対策", d:3,
 q:"情報セキュリティの「可用性」を高める対策として最も適当なものを選べ。",
 c:["データを暗号化して第三者に読まれないようにする。",
    "サーバや回線を二重化（冗長化）し、定期的にバックアップを取って障害に備える。",
    "ファイルにアクセス権を設定して閲覧できる人を制限する。",
    "パスワードを複雑にして推測されにくくする。"],
 a:1,
 e:"可用性は「必要なときにシステムやデータを使える」性質。冗長化やバックアップ、無停電電源装置などが対策となる。暗号化やアクセス制限、パスワード強化は主に機密性を高める対策。要素と対策の対応を問う問題は頻出。"},
{id:"s23", f:"society", t:"ソフトウェア更新", d:1,
 q:"OSやアプリケーションのアップデート（更新）を行うべき理由として最も適当なものを選べ。",
 c:["発見されたセキュリティ上の弱点（脆弱性）を修正するプログラムが含まれており、放置すると攻撃の標的になりやすいから。",
    "アップデートをすると通信速度が必ず2倍になるから。",
    "アップデートしないと法律で罰せられるから。",
    "古いバージョンのソフトウェアにはウイルスが感染できないから。"],
 a:0,
 e:"ソフトウェアの脆弱性（セキュリティホール）は日々発見されており、修正プログラムを適用しないと攻撃の入り口になる。OS・アプリ・ウイルス対策ソフトを最新に保つことはセキュリティ対策のもっとも基本的な習慣。"},
{id:"s24", f:"society", t:"ファイアウォール", d:2,
 q:"ファイアウォールの役割として最も適当なものを選べ。",
 c:["ネットワークの内部と外部の境界で通信を監視し、あらかじめ決めたルールに基づいて不正な通信を遮断する。",
    "コンピュータ内のすべてのウイルスを自動的に発見して駆除する。",
    "パスワードを自動的に生成して管理する。",
    "ハードディスクの故障を防止する。"],
 a:0,
 e:"ファイアウォール（防火壁）は、内部ネットワークと外部（インターネット）の間で通信を検査し、許可されていない通信を遮断する仕組み。ウイルスの検出・駆除はウイルス対策ソフトの役割で、両者を組み合わせて多層的に防御する。"},
{id:"s25", f:"society", t:"ワンクリック詐欺", d:1,
 q:"Webサイトのリンクをクリックしただけで「ご登録ありがとうございます。料金30万円をお支払いください」という画面が表示された。対応として最も適当なものを選べ。",
 c:["登録した覚えがなく契約は成立していないので、支払わず、慌てて画面の連絡先に連絡しない。",
    "画面に表示された連絡先に電話して、登録を取り消してもらう。",
    "トラブルを避けるため、ひとまず請求された金額を支払う。",
    "自分の氏名と住所をサイトに送信して事情を説明する。"],
 a:0,
 e:"ワンクリック詐欺では、クリックしただけで契約が成立することは通常なく、支払い義務はない。連絡すると電話番号などの個人情報を相手に渡すことになり、さらなる請求の標的になる。無視が基本で、不安なら消費生活センター等に相談する。"},
{id:"s26", f:"society", t:"チェーンメール・デマ", d:1,
 q:"「このメッセージを10人に転送しないと不幸になる」「災害でライオンが逃げた」といった情報がSNSで回ってきたときの対応として最も適当なものを選べ。",
 c:["善意の注意喚起かもしれないので、とりあえず友人全員に転送する。",
    "真偽を確かめず拡散することは誤情報の被害を広げるため、転送せず、必要なら公的機関などの一次情報を確認する。",
    "多くの人が転送しているようなので、内容は真実だと判断する。",
    "面白い内容なら事実でなくても拡散してよい。"],
 a:1,
 e:"チェーンメールやデマは拡散されること自体が目的・被害となる。過去の災害でも「動物園からライオンが逃げた」というデマ投稿が混乱を招き、投稿者が偽計業務妨害の疑いで逮捕された例がある。拡散する前に一次情報・公式発表を確認する習慣が大切。"},
{id:"s27", f:"society", t:"フィルターバブル", d:2,
 q:"検索エンジンやSNSのアルゴリズムが利用者の好みに合わせて情報を選別することで、自分の興味・関心に合う情報ばかりに囲まれてしまう現象を何というか。",
 c:["フィルターバブル","デジタルデバイド","ファイアウォール","ブレーンストーミング"],
 a:0,
 e:"フィルターバブルは、アルゴリズムによる情報の選別で、泡（バブル）に包まれたように自分好みの情報しか見えなくなる現象。多様な視点に触れにくくなり、考え方が偏るおそれがある。意識的に異なる情報源にあたることが対策になる。"},
{id:"s28", f:"society", t:"エコーチェンバー", d:2,
 q:"「エコーチェンバー現象」の説明として最も適当なものを選べ。",
 c:["SNSなどで自分と似た意見の人ばかりとつながることで、同じ意見が繰り返し反響し、その意見が世の中の多数派・真実であるかのように思い込んでしまう現象。",
    "大量のデータを高速に処理する技術のこと。",
    "音声データを圧縮して保存する技術のこと。",
    "インターネットの通信が混雑して遅くなる現象のこと。"],
 a:0,
 e:"エコーチェンバー（反響室）は、閉じた空間で音が反響するように、同質な意見ばかりが増幅される現象。フィルターバブルとあわせて、SNS時代に意見が偏り分断が進む要因として出題されやすい。異なる立場の情報に意識的に触れることが重要。"},
{id:"s29", f:"society", t:"フェイクニュース対策", d:2,
 q:"フェイクニュースへの対応として最も適当なものを選べ。",
 c:["拡散される前に見た情報ほど新鮮で正確だと考える。",
    "情報の発信元・日付・根拠を確認し、報道機関やファクトチェック機関など複数の情報源と照らし合わせてから判断する。",
    "画像や動画が付いている情報は、証拠があるので必ず信用できる。",
    "感情に強く訴える見出しの記事ほど重要な真実を伝えている。"],
 a:1,
 e:"フェイクニュースは感情を揺さぶる見出しや加工された画像・動画（ディープフェイク含む）を伴うことが多い。発信元と根拠の確認、複数ソースでの照合（クロスチェック）が基本。画像があっても合成・別の出来事の流用の可能性がある。"},
{id:"s30", f:"society", t:"健康への配慮", d:1,
 q:"情報機器を長時間使用するときの健康への配慮として最も適当なものを選べ。",
 c:["定期的に休憩を取り、画面から目を離して遠くを見るなど、目や体への負担を減らす工夫をする。",
    "夜遅くまで明るい画面を見続けても、睡眠に影響はない。",
    "同じ姿勢を長く続けるほうが体への負担は少ない。",
    "画面は目にできるだけ近づけて見るのがよい。"],
 a:0,
 e:"長時間のVDT（画面）作業は眼精疲労・肩こり・睡眠リズムの乱れ（ブルーライトによる影響）などを招く。定期的な休憩、適切な距離と姿勢、就寝前の使用を控えるといった配慮が必要。テクノストレスという心身の不調も知られている。"},
{id:"s31", f:"society", t:"ネットいじめへの対応", d:2,
 q:"SNS上で自分への誹謗中傷の書き込みを見つけたときの対応として最も適当なものを選べ。",
 c:["書き込みのスクリーンショットなど証拠を保存した上で、保護者や教員など信頼できる大人に相談し、必要に応じてサービス運営者に削除を依頼する。",
    "相手に仕返しをするため、相手の悪口を書き込む。",
    "証拠が残ると恥ずかしいので、すぐにすべて削除してもらい誰にも話さない。",
    "気にせず放置していれば、書き込みは自然に消える。"],
 a:0,
 e:"誹謗中傷への対応は、①証拠の保存（日時・URL含む）、②信頼できる大人や相談窓口への相談、③運営者への削除依頼が基本。発信者情報開示請求により投稿者を特定して法的責任を問える場合もある。報復の書き込みは自分も加害者になるため厳禁。"},
{id:"s32", f:"society", t:"誹謗中傷と法", d:2,
 q:"インターネット上の書き込みと法律に関する説明として最も適当なものを選べ。",
 c:["匿名の書き込みでも、事実を示して他人の社会的評価を下げれば名誉毀損罪に、事実を示さない暴言でも侮辱罪に問われる可能性がある。",
    "インターネット上の書き込みは現実世界とは別なので、どんな内容でも罪に問われない。",
    "本名を出さなければ、誰かを中傷しても発信者が特定されることはない。",
    "「みんなが書いているから」自分も同じことを書けば責任は問われない。"],
 a:0,
 e:"ネット上でも名誉毀損罪・侮辱罪は成立し、匿名でもプロバイダへの発信者情報開示請求で特定されうる。侮辱罪は2022年の法改正で厳罰化された。集団で書き込んでも一人ひとりが責任を負う。"},
{id:"s33", f:"society", t:"フィルタリング", d:1,
 q:"18歳未満の青少年が使うスマートフォンのフィルタリングに関する説明として最も適当なものを選べ。",
 c:["フィルタリングは、違法・有害なサイトへのアクセスを制限する仕組みで、法律により携帯電話事業者は青少年の利用時に原則として提供することが求められている。",
    "フィルタリングは通信速度を上げるための機能である。",
    "フィルタリングを設定すると、すべての犯罪被害を100%防ぐことができる。",
    "フィルタリングは大人のスマートフォンには技術的に設定できない。"],
 a:0,
 e:"青少年インターネット環境整備法により、18歳未満の利用者にはフィルタリングの提供が原則義務付けられている。有害サイトへの接触リスクを減らす有効な手段だが万能ではなく、情報モラルの教育と組み合わせることが重要。"},
{id:"s34", f:"society", t:"個人情報の第三者提供", d:3,
 q:"個人情報保護法に基づく、事業者による個人データの取扱いとして最も適当なものを選べ。",
 c:["個人データを第三者に提供する場合、原則としてあらかじめ本人の同意を得る必要がある。",
    "取得した個人データは、本人の同意がなくてもどの企業にでも自由に販売できる。",
    "利用目的は本人に知らせる必要がなく、後からいくらでも変更できる。",
    "個人データが漏えいしても、事業者は誰にも報告する義務はない。"],
 a:0,
 e:"個人データの第三者提供は原則として本人の同意が必要。利用目的の特定・通知（公表）、安全管理措置、漏えい時の個人情報保護委員会への報告・本人通知などが事業者に義務付けられている。"},
{id:"s35", f:"society", t:"匿名加工情報", d:3,
 q:"「匿名加工情報」に関する説明として最も適当なものを選べ。",
 c:["特定の個人を識別できないように加工し、元の個人情報に復元できないようにした情報で、一定のルールのもとで本人の同意なく利活用できる。",
    "氏名を伏せさえすれば、他の情報はそのままでも匿名加工情報になる。",
    "匿名加工情報は作成した企業以外は利用できない。",
    "匿名加工情報を作れば、元の個人情報を自由に公開してよい。"],
 a:0,
 e:"匿名加工情報は、個人を識別できず復元もできないように加工したデータ。ビッグデータとしての利活用（購買傾向の分析など）と個人の権利保護を両立させる制度。氏名を伏せるだけでは、他の項目の組合せから個人が特定されうるため不十分。"},
{id:"s36", f:"society", t:"マイナンバー", d:2,
 q:"マイナンバー（個人番号）の取扱いとして最も適当なものを選べ。",
 c:["マイナンバーは行政手続きの効率化などのための番号であり、法律で定められた目的以外での収集・利用は禁止されているため、むやみに他人に教えない。",
    "マイナンバーは便利な身分証明になるので、SNSのプロフィールに載せてよい。",
    "アルバイト先以外の一般企業やお店から求められたら、必ず教えなければならない。",
    "マイナンバーが他人に知られても、悪用される心配は全くない。"],
 a:0,
 e:"マイナンバーは社会保障・税・災害対策の分野で行政を効率化するための番号。法定された目的以外での収集・保管は禁止されている。勤務先への提出など正当な場面以外で安易に伝えたり、公開したりしてはいけない。"},
{id:"s37", f:"society", t:"Cookieと行動履歴", d:2,
 q:"Webサイトの「Cookie（クッキー）」に関する説明として最も適当なものを選べ。",
 c:["Cookieはブラウザに保存される小さなデータで、ログイン状態の維持などに使われる一方、閲覧履歴に基づく行動ターゲティング広告にも利用される。",
    "Cookieはコンピュータウイルスの一種で、保存されると必ず情報が盗まれる。",
    "Cookieを削除すると、パソコンのハードウェアが故障する。",
    "Cookieは法律で利用が全面的に禁止されている。"],
 a:0,
 e:"CookieはWebサイトがブラウザに保存する小さなデータ。ログイン維持やカートの記憶など利便性に役立つ一方、閲覧行動の追跡や広告表示に使われるためプライバシーの観点から規制・同意確認が広がっている。ウイルスではない。"},
{id:"s38", f:"society", t:"ディープフェイク", d:2,
 q:"AI技術で作られた偽の動画・音声「ディープフェイク」に関する説明として最も適当なものを選べ。",
 c:["本物と見分けがつきにくい偽動画により、なりすましや世論操作、詐欺などに悪用されるおそれがあり、動画であっても内容を鵜呑みにしない姿勢が必要である。",
    "動画は加工が不可能なので、動画で見た情報は必ず真実である。",
    "ディープフェイクは技術的に有名人の顔しか合成できない。",
    "ディープフェイクの作成・拡散は、どんな目的でも合法である。"],
 a:0,
 e:"生成AIの発達で、実在の人物が言っていないことを話す偽動画・音声が容易に作れるようになった。詐欺や名誉毀損、選挙への影響などが問題化している。「動画だから本物」とは言えない時代であり、発信元の確認がいっそう重要。"},
{id:"s39", f:"society", t:"生成AIの利用", d:2,
 q:"学習における生成AIの利用のしかたとして最も適当なものを選べ。",
 c:["AIの出力には誤り（ハルシネーション）や偏りが含まれうることを理解し、内容を自分で検証・裏付けした上で参考として活用する。",
    "AIが生成した文章をそのまま自分のレポートとして提出する。",
    "AIの回答は常に正しいので、事実確認は不要である。",
    "個人情報や試験問題を制限なくAIに入力してよい。"],
 a:0,
 e:"生成AIはもっともらしい誤情報を出力することがある（ハルシネーション）。出典の確認や事実の検証が不可欠で、生成物をそのまま提出することは不正行為にあたりうる。個人情報や秘密情報の入力にも注意が必要。"},
{id:"s40", f:"society", t:"問題解決の手順", d:1,
 q:"情報を活用した問題解決の進め方として最も適当な順序を選べ。",
 c:["問題の明確化 → 情報の収集 → 整理・分析 → 解決策の立案・実行 → 評価・改善",
    "解決策の実行 → 問題の明確化 → 評価 → 情報の収集",
    "情報の収集 → 実行 → 問題の明確化 → 分析",
    "評価 → 解決策の立案 → 問題の明確化 → 情報の収集"],
 a:0,
 e:"問題解決はまず「あるべき姿と現状のギャップ＝問題」を明確にすることから始まり、情報収集、整理・分析、解決策の立案・実行、評価・改善へと進む。評価の結果を次のサイクルに生かす（PDCAサイクル）ことも重要。"},
{id:"s41", f:"society", t:"ブレーンストーミング", d:1,
 q:"アイデアを出し合うブレーンストーミングのルールとして最も適当なものを選べ。",
 c:["他人のアイデアを批判せず、自由奔放な発想を歓迎し、質より量を重視し、他人のアイデアへの便乗・結合も歓迎する。",
    "実現可能な意見だけを発言し、突飛な案はすぐに却下する。",
    "アイデアが出るたびに、その場で欠点を指摘し合う。",
    "発言は一人一回までに制限する。"],
 a:0,
 e:"ブレーンストーミングの4原則は「批判禁止」「自由奔放」「質より量」「結合・便乗の歓迎」。まず量を出し、評価・選別は後の段階で行う。出たアイデアをカードにしてグループ化し整理する手法としてKJ法がある。"},
{id:"s42", f:"society", t:"KJ法・思考の整理", d:2,
 q:"収集した多数の意見やアイデアをカードに書き出し、内容の似ているものをグループにまとめて構造化する手法として最も適当なものを選べ。",
 c:["KJ法","ブレーンストーミング","ロールプレイング","タッチタイピング"],
 a:0,
 e:"KJ法は文化人類学者の川喜田二郎が考案した整理法。カード化→グループ化→見出し付け→図解化の手順で、雑多な情報から構造や本質を見いだす。ブレーンストーミングで出したアイデアの整理によく使われる。"},
{id:"s43", f:"society", t:"PDCAサイクル", d:1,
 q:"PDCAサイクルの各段階の組合せとして正しいものを選べ。",
 c:["Plan（計画）→ Do（実行）→ Check（評価）→ Action（改善）",
    "Plan（計画）→ Design（設計）→ Copy（複製）→ Answer（回答）",
    "Play（遊び）→ Do（実行）→ Change（変更）→ Act（演技）",
    "Print（印刷）→ Delete（削除）→ Create（作成）→ Add（追加）"],
 a:0,
 e:"PDCAは Plan（計画）→ Do（実行）→ Check（評価）→ Action（改善）を繰り返すことで、活動を継続的に改善していく考え方。問題解決や学習計画など幅広く使われる。"},
{id:"s44", f:"society", t:"メディアの特性", d:2,
 q:"メディアの特性に関する説明として最も適当なものを選べ。",
 c:["テレビや新聞などのマスメディアは多数への一方向の伝達が中心だが、インターネットは誰もが発信者になれる双方向のメディアである。",
    "インターネットの情報は、専門機関の審査を必ず経てから公開されている。",
    "新聞やテレビの情報には、発信者の意図や編集が入ることは一切ない。",
    "同じ出来事なら、どのメディアで見ても伝えられる内容は完全に同じである。"],
 a:0,
 e:"マスメディアは「少数の発信者から多数へ」の一方向伝達、インターネットは誰でも発信できる双方向性が特徴。どのメディアの情報にも発信者の意図・取捨選択（編集）が入るため、複数メディアを比較して読み解くメディアリテラシーが必要。"},
{id:"s45", f:"society", t:"一次情報と二次情報", d:2,
 q:"レポート作成時の情報源の扱いとして最も適当なものを選べ。",
 c:["まとめサイトの記述をそのまま信じるのではなく、元になった官公庁の統計や論文など一次情報にさかのぼって確認する。",
    "個人のブログのまとめ記事は、一次情報より常に正確である。",
    "情報源を確認する必要はなく、検索して最初に出てきた情報を使えばよい。",
    "引用元を書くと文章が長くなるので、出典は書かないほうがよい。"],
 a:0,
 e:"一次情報は当事者・調査元が発信するオリジナルの情報（統計、論文、公式発表など）、二次情報はそれを加工・伝達した情報。伝達の過程で誤りや偏りが入り込むため、できる限り一次情報で確認し、出典を明示するのが基本。"},
{id:"s46", f:"society", t:"不正ログインへの対応", d:2,
 q:"自分のSNSアカウントに身に覚えのないログイン通知が届いた。対応として最も適当なものを選べ。",
 c:["直ちにパスワードを変更し、他のサービスで同じパスワードを使っている場合はそれらも変更し、多要素認証を設定する。",
    "様子を見るため、しばらく何もしない。",
    "アカウントを守るため、パスワードを覚えやすい「12345678」に変更する。",
    "通知メールに記載されたリンクから急いでログインして確認する。"],
 a:0,
 e:"不正ログインの疑いがあれば、正規のアプリ・サイトから直ちにパスワードを変更し、使い回しているパスワードも変更、多要素認証を有効化する。通知メール自体がフィッシングの可能性もあるため、メール内のリンクからはアクセスしない。"},
{id:"s47", f:"society", t:"DoS攻撃", d:2,
 q:"Webサーバに大量のアクセスやデータを送りつけて過負荷状態にし、サービスを提供できなくする攻撃の名称として正しいものを選べ。",
 c:["DoS攻撃（DDoS攻撃）","フィッシング","ショルダーハッキング","ランサムウェア"],
 a:0,
 e:"DoS攻撃はサービス不能攻撃。多数のコンピュータ（ボットネット）から一斉に行うものをDDoS攻撃という。情報セキュリティ3要素のうち「可用性」を損なう攻撃の代表例。"},
{id:"s48", f:"society", t:"バックアップ", d:1,
 q:"データのバックアップに関する説明として最も適当なものを選べ。",
 c:["機器の故障・紛失・ランサムウェア被害などに備え、重要なデータは別の場所（外付けドライブやクラウドなど）に定期的に複製しておく。",
    "パソコン本体の同じフォルダ内にコピーを作れば、故障に備えたバックアップとして十分である。",
    "バックアップは一度取れば、その後は二度と取り直す必要がない。",
    "クラウドに保存したデータは絶対に消えないので、他のバックアップは不要である。"],
 a:0,
 e:"バックアップは元のデータと同じ機器・場所に置いては意味が薄い。別媒体・別の場所に、定期的に取ることが基本（複数箇所・複数媒体に保管する「3-2-1ルール」も知られる）。クラウドも障害や誤削除の可能性があり、過信は禁物。"},
{id:"s49", f:"society", t:"「フリー素材」の注意", d:2,
 q:"「フリー素材」と書かれた画像サイトの利用に関する説明として最も適当なものを選べ。",
 c:["「フリー」でも著作権が放棄されているとは限らず、商用利用の可否・クレジット表記・加工の可否などの利用規約を確認してから使う必要がある。",
    "「フリー素材」と書かれていれば、利用規約を読まずにどんな用途にも使ってよい。",
    "フリー素材には著作権が存在しないので、自分の作品として販売してもよい。",
    "フリー素材は加工すれば自分の著作物になるので、元の規約は無効になる。"],
 a:0,
 e:"「フリー」は多くの場合「無料」の意味であり、著作権の放棄ではない。商用利用不可、クレジット必須、再配布禁止などの条件が付いていることが多い。利用規約の確認は素材利用の基本。"},
{id:"s50", f:"society", t:"二次創作と著作権", d:3,
 q:"既存の漫画のキャラクターを使った二次創作に関する説明として最も適当なものを選べ。",
 c:["二次創作は原作者の複製権・翻案権などに関わるため、権利者が公表しているガイドラインの範囲を確認して活動することが望ましい。",
    "二次創作は文化なので、原作者の意向にかかわらず自由に販売できる権利が法律で保障されている。",
    "インターネットに公開しなければ、どんな利用でも著作権とは無関係である。",
    "キャラクターの名前を1文字変えれば、著作権の問題は生じない。"],
 a:0,
 e:"二次創作は原著作物の複製・翻案にあたりうるため、法的には権利者の許諾が必要な場合が多い。近年は権利者が二次創作ガイドラインを公表し、条件付きで認める例が増えている。名前を少し変えても表現が類似していれば侵害になりうる。"},
{id:"s51", f:"society", t:"調査と個人情報", d:2,
 q:"文化祭の企画のためにクラスでアンケートを実施する。個人情報の扱いとして最も適当なものを選べ。",
 c:["利用目的を明示し、収集する項目は必要最小限にとどめ、集計後は決めたルールに従って適切にデータを処分する。",
    "後で何かに使えるかもしれないので、氏名・住所・電話番号などをできるだけ多く集めておく。",
    "集めた回答は個人名付きのまま教室の掲示板に貼り出す。",
    "アンケート用紙は使い終わったらそのままゴミ箱に捨てる。"],
 a:0,
 e:"個人情報の取扱いの基本は「目的の明示」「必要最小限の収集」「安全な管理」「不要になったら適切に廃棄（シュレッダー等）」。学校の活動でも同じ原則が当てはまる。目的外利用や無断公開はトラブルのもと。"},
{id:"s52", f:"society", t:"電子商取引の注意", d:1,
 q:"インターネットショッピングを利用するときの注意として最も適当なものを選べ。",
 c:["事業者の情報（所在地・連絡先）や利用規約・返品条件を確認し、極端に安すぎるサイトや振込先が個人名義の口座などの不審な点がないか確かめる。",
    "値段が安ければ安いほど信頼できるサイトである。",
    "支払いは、相手に確実に届くよう先払いの銀行振込だけを選ぶのがよい。",
    "URLや運営者情報は確認しなくても、デザインがきれいなサイトなら安全である。"],
 a:0,
 e:"偽通販サイトの特徴として、相場より極端に安い、日本語が不自然、連絡先が不明、支払いが個人名義口座への先払いのみ、などがある。特定商取引法に基づく表記の確認や、通信が暗号化されているか（https）の確認も基本。"},
{id:"s53", f:"society", t:"未成年者の契約", d:3,
 q:"18歳未満の高校生がスマートフォンで有料サービスを契約する場合の説明として最も適当なものを選べ。",
 c:["未成年者が法定代理人（親権者）の同意なく行った契約は、原則として取り消すことができるが、年齢を偽って契約した場合などは取り消せないことがある。",
    "未成年者の契約はどんな場合でも一切取り消すことができない。",
    "未成年者でも、契約はすべて自由にでき、保護者の同意は法律上まったく関係ない。",
    "成年年齢は20歳なので、19歳の契約も必ず取り消せる。"],
 a:0,
 e:"民法により、未成年者（18歳未満。2022年から成年年齢は18歳）が親権者の同意なく結んだ契約は原則取り消せる（未成年者取消権）。ただし年齢を偽った場合や小遣いの範囲の取引などは取り消せない。18歳になると取消権がなくなるため契約には一層の注意が必要。"},
{id:"s54", f:"society", t:"炎上への対応", d:2,
 q:"SNSでの「炎上」に関する説明として最も適当なものを選べ。",
 c:["軽い気持ちの投稿でも、不適切な内容は短時間で大量に拡散され、個人の特定や進学・就職への影響など長期的な不利益につながることがある。",
    "炎上しても投稿を削除すれば、拡散された情報もすべて消える。",
    "非公開アカウントや仲間内のグループでの投稿は、絶対に外部へ流出しない。",
    "炎上は有名人にだけ起こる現象で、一般の高校生には関係がない。"],
 a:0,
 e:"不適切投稿（迷惑行為の動画など）は瞬時に拡散され、スクリーンショットで半永久的に残る（デジタルタトゥー）。投稿前に「公開されて困る内容ではないか」を考えることが最大の予防策。仲間内のつもりの投稿が流出した炎上例も多い。"},
{id:"s55", f:"society", t:"なりすまし", d:2,
 q:"SNS上で自分になりすました偽アカウントを発見したときの対応として最も適当なものを選べ。",
 c:["証拠を保存し、SNS運営者に通報して削除を求め、友人らに注意を呼びかけ、必要に応じて信頼できる大人や警察に相談する。",
    "偽アカウントに直接ログインを試みて乗っ取り返す。",
    "腹いせに、相手になりすましたアカウントを自分も作る。",
    "実害が出るまで誰にも知らせず放置する。"],
 a:0,
 e:"なりすましへの正しい対応は、証拠保存→運営者への通報→周囲への注意喚起→（詐欺被害等のおそれがあれば）警察や相談窓口へ。他人のアカウントへの無断ログインは不正アクセス禁止法違反になるため、対抗手段としても行ってはいけない。"},
{id:"s56", f:"society", t:"情報社会の光と影", d:1,
 q:"情報技術の発展がもたらす影響に関する説明として最も適当なものを選べ。",
 c:["生活の利便性が向上する一方で、プライバシー侵害・依存・格差などの新たな問題も生じるため、技術の利点と課題の両面を理解して活用する必要がある。",
    "情報技術の発展には良い影響しかなく、問題は何も生じない。",
    "情報技術には悪い影響しかないので、一切使わないのが正しい。",
    "情報社会の問題はすべて技術だけで解決でき、人間の判断は不要である。"],
 a:0,
 e:"情報社会には利便性・効率化という「光」と、情報格差、プライバシー、ネット依存、セキュリティなどの「影」の両面がある。技術（フィルタリング等）・制度（法律）・個人の意識（情報モラル）を組み合わせて課題に対処する視点が問われる。"},
{id:"s57", f:"society", t:"知的財産権の分類", d:2,
 q:"知的財産権の分類に関する説明として最も適当なものを選べ。",
 c:["知的財産権には、文化的な創作を保護する著作権と、産業の発展に関わる産業財産権（特許権・実用新案権・意匠権・商標権）などがある。",
    "知的財産権とは土地や建物の所有権のことである。",
    "著作権は産業財産権の一種である。",
    "商標権は小説や音楽を保護する権利である。"],
 a:0,
 e:"知的財産権は人間の知的創作活動の成果を保護する権利の総称。文化的創作を守る著作権（無方式主義）と、特許庁への登録が必要な産業財産権4種（方式主義）を大きく区別して整理しておこう。"},
{id:"s58", f:"society", t:"パスワードの管理", d:1,
 q:"パスワードの管理として最も適当なものを選べ。",
 c:["サービスごとに異なる、長く推測されにくいパスワードを設定し、信頼できる方法で管理する。",
    "忘れないように、全サービスで同じパスワードを使い回す。",
    "誕生日や電話番号など、自分に関係のある覚えやすい数字を使う。",
    "パスワードを付箋に書いてパソコンの画面に貼っておく。"],
 a:0,
 e:"パスワードは「長く」「推測されにくく」「使い回さない」が三原則。1つのサービスから漏れたパスワードで他のサービスに侵入されるリスト型攻撃を防ぐため、使い回しは特に危険。パスワード管理ツールの利用も有効。"},
{id:"s59", f:"society", t:"引用の要件", d:2,
 q:"レポートで他人の文章を「引用」するときの要件として適当でないものを選べ。",
 c:["出典（著者名・書名・URL等）を明示する。",
    "引用部分をかぎかっこなどで自分の文章と明確に区別する。",
    "自分の文章が主、引用部分が従という関係を保つ。",
    "読みやすくなるように、引用する文章の内容を自分の言葉に勝手に書き換える。"],
 a:3,
 e:"引用の要件は、出典明示・明確な区別・主従関係・引用の必然性など。引用部分は原文のまま正確に載せるのが原則で、勝手な改変は同一性保持権の侵害にもなりうる。「適当でないもの」を選ぶ問題では設問の指示の読み違いに注意。"},
{id:"s60", f:"society", t:"肖像の撮影と公開", d:2,
 q:"体育祭で撮影した集合写真をSNSに投稿する場合の配慮として最も適当なものを選べ。",
 c:["写っている人に公開の可否を確認し、嫌がる人がいれば投稿しない・顔が分からないよう加工するなどの配慮をする。",
    "自分が撮影した写真なので、写っている人の意向を確認する必要はない。",
    "学校行事の写真は公共性があるため、誰の許可もなく公開してよい。",
    "一度投稿してしまえば、後から削除を求められても応じる必要はない。"],
 a:0,
 e:"撮影者に著作権があっても、写っている人には肖像権・プライバシーがある。公開前に本人の同意を得るのがマナーであり法的にも安全。削除を求められたら誠実に応じるべき。友人間のトラブルの多くはこの確認不足から起こる。"},
/* ---- ② 情報デザインとデジタル化 ---- */
{id:"d1", f:"digital", t:"2進法の変換", d:1,
 q:"10進法の 13 を2進法で表したものとして正しいものを選べ。",
 c:["1011","1101","1110","1001"],
 a:1,
 e:"13 = 8 + 4 + 1 = 2³ + 2² + 2⁰ なので、13 は2進法で 1101。13を2で割っていき、余りを下から読む方法（13→6余り1→3余り0→1余り1→0余り1）でも 1101 が得られる。"},
{id:"d2", f:"digital", t:"2の補数", d:3,
 q:"8ビットの2の補数表現で −6 を表したものとして正しいものを選べ。",
 c:["00000110","11111010","11111001","10000110"],
 a:1,
 e:"+6 = 00000110。2の補数は「ビットを反転して1を足す」：反転→11111001、+1→11111010。これが−6。検算：11111010 + 00000110 = 100000000 となり、8ビットからあふれた分を無視すると0になるので正しい。"},
{id:"d3", f:"digital", t:"16進法", d:2,
 q:"16進法の 2A を10進法で表したものとして正しいものを選べ。",
 c:["32","42","44","26"],
 a:1,
 e:"16進法のAは10を表す。2A = 2×16 + 10 = 42。16進法は0〜9とA〜F（10〜15）の16種類の文字で表し、4ビットが16進数1桁に対応するため、コンピュータの世界で広く使われる。"},
{id:"d4", f:"digital", t:"文字コード", d:2,
 q:"文字コードに関する説明として最も適当なものを選べ。",
 c:["ASCIIコードは、日本語の漢字も含めて世界中のすべての文字を表現できる。",
    "文字化けは、文字を符号化したときの文字コード体系と異なる体系で復号（解釈）したときに起こる。",
    "UTF-8はUnicodeの符号化方式の一つだが、英数字を表すことはできない。",
    "同じ文字であれば、どの文字コード体系でも必ず同じビット列で表される。"],
 a:1,
 e:"文字化けは符号化と復号で異なる文字コード体系を使うことが原因。ASCIIは英数字・記号など128文字のみ（7ビット）。UTF-8はUnicodeの符号化方式で、ASCIIと互換性があり英数字も表せる。同じ文字でも体系が違えばビット列は異なる。"},
{id:"d5", f:"digital", t:"音のデジタル化", d:3,
 q:"音声を標本化周波数 40 kHz、量子化ビット数 16 ビット、モノラル（1チャンネル）でデジタル化するとき、1秒あたりのデータ量として正しいものを選べ。",
 c:["約 80 KB（キロバイト）","約 640 KB","約 40 KB","約 160 KB"],
 a:0,
 e:"1秒あたりの標本数は40,000回。各標本が16ビット＝2バイトなので、40,000 × 2 = 80,000バイト = 約80KB。デジタル化は「標本化（一定間隔で波の高さを取り出す）→量子化（段階値に丸める）→符号化（2進数で表す）」の手順で行う。"},
{id:"d6", f:"digital", t:"画像のデジタル化", d:2,
 q:"横800ピクセル × 縦600ピクセル、24ビットフルカラー（1画素24ビット）の非圧縮画像のデータ量として最も近いものを選べ。",
 c:["約 0.48 MB","約 1.44 MB","約 11.5 MB","約 480 KBの半分"],
 a:1,
 e:"画素数 = 800 × 600 = 480,000。1画素24ビット = 3バイトなので、480,000 × 3 = 1,440,000バイト ≒ 1.44MB。24ビットカラーはRGB各色8ビット（256階調）で約1677万色を表現できる。"},
{id:"d7", f:"digital", t:"ランレングス圧縮", d:3,
 q:"「AAAAABBBCC」という10文字のデータを、「文字＋連続する個数」の形式（例：A5B3C2）で圧縮した。圧縮後のデータ量は圧縮前の何%になるか。1文字も1桁の数字も同じ1文字分のデータ量として計算せよ。",
 c:["40%","50%","60%","70%"],
 a:2,
 e:"圧縮後は「A5B3C2」の6文字。6 ÷ 10 = 0.6 で60%。このように同じデータの連続を「データ＋繰り返し回数」で表す方式をランレングス圧縮といい、元に戻せる可逆圧縮である。連続が少ないデータでは逆にデータ量が増えることもある。"},
{id:"d8", f:"digital", t:"可逆圧縮と非可逆圧縮", d:1,
 q:"圧縮に関する説明として最も適当なものを選べ。",
 c:["JPEGは主に非可逆圧縮を用いる画像形式で、圧縮率を高めると画質が劣化するが、完全に元のデータには戻せない。",
    "非可逆圧縮は、圧縮後のデータを完全に元のデータに戻すことができる。",
    "文章ファイルの圧縮には、内容が一部失われてもよいので非可逆圧縮が適している。",
    "可逆圧縮は非可逆圧縮に比べて、常に圧縮率が高い。"],
 a:0,
 e:"可逆圧縮は完全に元へ戻せる圧縮（ZIP、PNGなど）で、文章やプログラムに必須。非可逆圧縮は人間が知覚しにくい情報を削って圧縮率を高める方式（JPEG、MP3など）で、元には戻せない。一般に非可逆の方が圧縮率を高くできる。"},
{id:"d9", f:"digital", t:"情報デザイン", d:1,
 q:"言語や文化の違いによらず、誰にでも意味が伝わるように単純な図で表現された視覚記号（案内用図記号）を何というか。",
 c:["ピクトグラム","ワイヤーフレーム","インフォグラフィックの凡例","シグニファイア"],
 a:0,
 e:"ピクトグラムは非常口マークやトイレのマークのように、言語に頼らず意味を直感的に伝える図記号。誰もが使いやすいよう配慮するユニバーサルデザインの考え方とも深く関わる。"},
{id:"d10", f:"digital", t:"情報の構造化", d:2,
 q:"情報デザインにおける「情報の構造化」の例として最も適当なものを選べ。",
 c:["Webページの文字をすべて赤色にして目立たせる。",
    "操作手順を、順序に沿って番号付きのステップで示す。",
    "重要な情報ほど小さな文字で書く。",
    "関連のない情報を1つの図にまとめて一度に見せる。"],
 a:1,
 e:"構造化とは、情報の関係性（順序・並列・階層・分岐など）を整理して分かりやすく示すこと。手順を番号付きステップで示すのは「順序」の構造化の典型例。色や文字サイズは「視覚化（強調）」の手法だが、すべて赤にする・重要ほど小さくするのは逆効果。"},
{id:"d11", f:"digital", t:"標本化定理", d:3,
 q:"標本化に関する次の文の空欄に入る語句として最も適当なものを選べ。\n「アナログの波形をもとの信号に含まれる最高周波数の（　）倍を超える標本化周波数で標本化すれば、元の波形を再現できることが知られている。人間の可聴域の上限は約20kHzなので、音楽CDでは44.1kHzという標本化周波数が使われている。」",
 c:["2","4","10","0.5"],
 a:0,
 e:"標本化定理により、元の信号の最高周波数の2倍を超える周波数で標本化すれば元の波形を再現できる。可聴域上限約20kHzの2倍40kHzを上回る44.1kHzがCDで採用されている。"},
{id:"d12", f:"digital", t:"ビットと情報量", d:1,
 q:"64種類の異なる状態を区別して表すために最低限必要なビット数として正しいものを選べ。",
 c:["5ビット","6ビット","7ビット","64ビット"],
 a:1,
 e:"nビットで表せる状態は2ⁿ通り。2⁶ = 64 なので6ビットで64通りを区別できる。5ビットでは2⁵ = 32通りしか表せないので足りない。"},
{id:"d13", f:"digital", t:"2進法の変換", d:1,
 q:"10進法の 26 を2進法で表したものとして正しいものを選べ。",
 c:["11010","10110","11100","10011"],
 a:0,
 e:"26 = 16 + 8 + 2 = 2⁴ + 2³ + 2¹ なので 11010。2で割って余りを下から読む方法：26→13余り0→6余り1→3余り0→1余り1→0余り1 でも 11010。"},
{id:"d14", f:"digital", t:"2進法の変換", d:1,
 q:"2進法の 101101 を10進法で表したものとして正しいものを選べ。",
 c:["43","45","53","37"],
 a:1,
 e:"101101 = 2⁵ + 2³ + 2² + 2⁰ = 32 + 8 + 4 + 1 = 45。各桁の重み（右から1, 2, 4, 8, 16, 32…）に1が立っている桁を足し合わせる。"},
{id:"d15", f:"digital", t:"2進法の加算", d:2,
 q:"2進法の計算 1011 + 110 の結果として正しいものを選べ。",
 c:["10001","1111","10101","11001"],
 a:0,
 e:"10進法に直すと 1011 = 11、110 = 6 で、11 + 6 = 17。17 = 16 + 1 = 10001。2進法のまま筆算する場合は「1 + 1 = 10（桁上がり）」に注意して計算する。"},
{id:"d16", f:"digital", t:"16進法と2進法", d:2,
 q:"16進法の A3 を2進法で表したものとして正しいものを選べ。",
 c:["10100011","10100110","11000011","10010011"],
 a:0,
 e:"16進数1桁は2進数4桁（4ビット）に対応する。A = 10 = 1010、3 = 0011 なので、A3 = 10100011。この「1桁⇔4ビット」の対応を使うと相互変換が速い。"},
{id:"d17", f:"digital", t:"データ量の単位", d:1,
 q:"データ量の単位を小さい順に並べたものとして正しいものを選べ。",
 c:["KB → MB → GB → TB","MB → KB → TB → GB","GB → MB → KB → TB","KB → GB → MB → TB"],
 a:0,
 e:"1KB（キロ）≒10³バイト、1MB（メガ）≒10⁶バイト、1GB（ギガ）≒10⁹バイト、1TB（テラ）≒10¹²バイト。単位が1つ上がるごとに約1000倍（2進接頭辞では1024倍）になる。"},
{id:"d18", f:"digital", t:"ビットとバイト", d:1,
 q:"1バイトに関する説明として正しいものを選べ。",
 c:["1バイトは8ビットであり、256通りの状態を表すことができる。",
    "1バイトは10ビットであり、1024通りの状態を表すことができる。",
    "1バイトは2ビットであり、4通りの状態を表すことができる。",
    "1バイトは16ビットであり、6万通り以上の状態を表すことができる。"],
 a:0,
 e:"1バイト = 8ビット。8ビットで表せる状態は 2⁸ = 256通り（0〜255）。データ量の計算では「ビットで計算してから8で割ってバイトに直す」操作が頻出なので確実に。"},
{id:"d19", f:"digital", t:"情報量の考え方", d:2,
 q:"32人のクラスから代表1人をくじで決める。誰が選ばれたかを2進法の質問（はい/いいえ）だけで特定するには、最低何回の質問が必要か。",
 c:["5回","16回","31回","32回"],
 a:0,
 e:"1回の質問で候補を半分に絞れるので、32 → 16 → 8 → 4 → 2 → 1 と5回で特定できる（2⁵ = 32）。「n通りを区別するには log₂n ビットの情報が必要」という情報量の基本的な考え方。"},
{id:"d20", f:"digital", t:"パリティビット", d:3,
 q:"偶数パリティ方式では、データ中の1の個数が偶数になるようにパリティビットを1ビット付加する。データ「1011001」に付加するパリティビットと、この方式の限界の組合せとして正しいものを選べ。",
 c:["パリティビットは0で、1ビットの誤りは検出できるが、どのビットが誤ったかは分からない。",
    "パリティビットは1で、すべての誤りを自動的に訂正できる。",
    "パリティビットは0で、2ビットの誤りも必ず検出できる。",
    "パリティビットは1で、誤りの検出は一切できない。"],
 a:0,
 e:"「1011001」の1の個数は4個（偶数）なので、偶数を保つためパリティビットは0。パリティチェックは1ビットの誤りを検出できるが、位置は特定できず訂正もできない。また2ビット同時に誤ると1の個数の偶奇が変わらず検出できない。"},
{id:"d21", f:"digital", t:"デジタル化の利点", d:1,
 q:"情報をデジタルで表現する利点として最も適当なものを選べ。",
 c:["文字・音声・画像などの異なる種類の情報を0と1のビット列として統一的に扱え、劣化の少ない複製や編集・伝送がしやすい。",
    "デジタルデータは複製するたびに品質が向上する。",
    "デジタル化するとデータ量が必ずアナログより小さくなる。",
    "デジタルデータは編集や加工が一切できないため、安全である。"],
 a:0,
 e:"デジタル化の利点は、①多様な情報を統一的に扱える、②劣化しにくい複製・伝送、③編集・加工・検索が容易、④圧縮や暗号化などの処理が可能なこと。一方で容易にコピーできることが著作権問題にもつながる。"},
{id:"d22", f:"digital", t:"量子化ビット数", d:2,
 q:"音のデジタル化における量子化ビット数を8ビットから16ビットに増やしたときの変化として最も適当なものを選べ。",
 c:["音の大きさを表す段階が256段階から65536段階に増えて元の波形により近くなるが、データ量は増える。",
    "音の段階数は変わらないが、データ量だけが半分になる。",
    "標本化の回数が2倍になる。",
    "音質が下がり、データ量も減る。"],
 a:0,
 e:"量子化ビット数は波の高さを何段階で表すかを決める。8ビットで2⁸=256段階、16ビットで2¹⁶=65536段階。ビット数を増やすと量子化誤差が小さくなり原音に近づくが、データ量は比例して増える。品質とデータ量はトレードオフの関係。"},
{id:"d23", f:"digital", t:"標本化周波数", d:2,
 q:"音のデジタル化における標本化周波数に関する説明として最も適当なものを選べ。",
 c:["標本化周波数を高くすると、1秒間に波形を取り出す回数が増えて元の波形を忠実に再現しやすくなるが、データ量は増える。",
    "標本化周波数を高くすると、データ量が減る。",
    "標本化周波数は音の大きさを表す段階の数のことである。",
    "標本化周波数はデータ量にも音質にも影響しない。"],
 a:0,
 e:"標本化周波数は1秒あたりの標本（サンプル）を取る回数（単位Hz）。高いほど波形を細かく記録でき高音質だが、データ量は比例して増える。「段階の数」は量子化ビット数の説明であり混同しやすいので注意。"},
{id:"d24", f:"digital", t:"音のデータ量計算", d:3,
 q:"標本化周波数 44100 Hz、量子化ビット数 16 ビット、ステレオ（2チャンネル）の音声1秒分のデータ量として最も近いものを選べ。",
 c:["約 88 KB","約 176 KB","約 706 KB","約 44 KB"],
 a:1,
 e:"44100回 × 16ビット × 2チャンネル = 1,411,200ビット。8で割ってバイトに直すと 176,400バイト ≒ 176KB。これは音楽CDの音質の条件。チャンネル数の掛け忘れ、ビット→バイト変換忘れがよくあるミス。"},
{id:"d25", f:"digital", t:"解像度", d:2,
 q:"画像の解像度に関する説明として最も適当なものを選べ。",
 c:["解像度が高い（画素数が多い）ほどきめ細かい画像になるが、データ量は大きくなる。",
    "解像度を高くすると、データ量は小さくなる。",
    "解像度は色の数を表す値である。",
    "解像度は画像の明るさを表す値である。"],
 a:0,
 e:"解像度は画像のきめ細かさで、画素（ピクセル）の密度や総数で表す。印刷ではdpi（1インチあたりのドット数）を使う。高解像度ほど精細だがデータ量は画素数に比例して増える。色数は階調（ビット数）で決まる。"},
{id:"d26", f:"digital", t:"階調", d:2,
 q:"グレースケール画像で、1画素を8ビットで表すときの階調（明るさの段階数）として正しいものを選べ。",
 c:["8階調","64階調","256階調","1024階調"],
 a:2,
 e:"8ビットで表せるのは2⁸ = 256通りなので256階調（0が黒、255が白）。カラー画像ではRGB各色に8ビットずつ、計24ビットを使うと256³ ≒ 1677万色を表現できる。"},
{id:"d27", f:"digital", t:"光と色の三原色", d:2,
 q:"色の表現に関する説明として最も適当なものを選べ。",
 c:["ディスプレイは光の三原色RGB（赤・緑・青）による加法混色で、プリンタはCMY（シアン・マゼンタ・イエロー）による減法混色で色を表現する。",
    "ディスプレイもプリンタも、同じRGBの減法混色で色を表現する。",
    "RGBをすべて最大の強さで混ぜると黒になる。",
    "CMYのインクをすべて重ねると白になる。"],
 a:0,
 e:"光を重ねるほど明るくなる加法混色（RGB、すべて重ねると白）と、インクを重ねるほど暗くなる減法混色（CMY、すべて重ねると黒に近づく。実際は黒Kを加えたCMYK）を区別する。画面と印刷物で色の見え方が違う原因にもなる。"},
{id:"d28", f:"digital", t:"ラスタとベクタ", d:2,
 q:"画像形式に関する説明として最も適当なものを選べ。",
 c:["ラスタ形式は画素の集まりで表すため拡大するとギザギザが目立つが、ベクタ形式は座標と数式で表すため拡大しても画質が劣化しない。",
    "ベクタ形式は画素の集まりで表現され、拡大するとギザギザになる。",
    "写真の記録にはベクタ形式が最も適している。",
    "ラスタ形式は数式で図形を表すため、写真の表現には使えない。"],
 a:0,
 e:"ラスタ（ビットマップ）形式は画素の集合で、写真に適するが拡大に弱い。ベクタ形式は点の座標と線・面の数式で表し、ロゴや図形に適して拡大しても劣化しない。用途による使い分けが問われる。"},
{id:"d29", f:"digital", t:"動画の仕組み", d:1,
 q:"動画に関する説明として最も適当なものを選べ。",
 c:["動画は静止画（フレーム）を連続して表示することで動きを表現しており、1秒あたりのフレーム数をフレームレート（fps）という。",
    "動画は1枚の画像を引き伸ばして作られている。",
    "フレームレートが低いほど動きが滑らかになる。",
    "動画のデータ量は再生時間の長さとは無関係である。"],
 a:0,
 e:"動画はパラパラ漫画のように静止画を高速で切り替えて表現する。フレームレート（fps: frames per second）が高いほど滑らかだがデータ量は増える。データ量は「1フレームのデータ量 × fps × 秒数」で概算でき、圧縮技術が不可欠。"},
{id:"d30", f:"digital", t:"動画のデータ量", d:3,
 q:"1フレームが 1 MB の画像を、30 fps で10秒間記録した非圧縮動画のデータ量として正しいものを選べ。",
 c:["30 MB","300 MB","3 MB","3 GB"],
 a:1,
 e:"1MB × 30フレーム/秒 × 10秒 = 300MB。非圧縮の動画は膨大なデータ量になるため、実際にはフレーム間の差分だけを記録するなどの圧縮（動画圧縮）が使われている。"},
{id:"d31", f:"digital", t:"圧縮率の計算", d:2,
 q:"400 KB のファイルを圧縮したところ 100 KB になった。圧縮後のデータ量は元の何%か（この値を圧縮率と呼ぶこととする）。",
 c:["25%","40%","75%","4%"],
 a:0,
 e:"100 ÷ 400 = 0.25 で25%。「圧縮率」は問題によって「圧縮後/圧縮前の割合」や「削減された割合（この場合75%）」など定義が異なることがあるため、問題文中の定義を必ず確認して計算することが大切。"},
{id:"d32", f:"digital", t:"ハフマン符号の考え方", d:3,
 q:"文字の出現頻度に応じて符号の長さを変える圧縮法（ハフマン符号など）の考え方として最も適当なものを選べ。",
 c:["出現頻度の高い文字に短いビット列、頻度の低い文字に長いビット列を割り当てることで、全体のデータ量を減らす。",
    "すべての文字に同じ長さのビット列を割り当てる。",
    "出現頻度の高い文字ほど長いビット列を割り当てる。",
    "文字の順番をランダムに並べ替えることで圧縮する。"],
 a:0,
 e:"よく出る文字を短い符号で表せば、全体の平均符号長が短くなりデータ量を削減できる。これは可逆圧縮の代表的な考え方。モールス符号で使用頻度の高いEやTが短い符号なのも同じ発想。"},
{id:"d33", f:"digital", t:"画像ファイル形式", d:2,
 q:"画像ファイル形式に関する説明として最も適当なものを選べ。",
 c:["JPEGは写真向きの非可逆圧縮形式、PNGは可逆圧縮形式で、イラストや透過が必要な画像にも適する。",
    "PNGは非可逆圧縮なので、保存を繰り返すと画質が劣化していく。",
    "JPEGは可逆圧縮なので、何度保存し直しても画質は一切劣化しない。",
    "画像はどの形式で保存してもデータ量と画質は同じである。"],
 a:0,
 e:"JPEGは人間の目立ちにくい情報を削る非可逆圧縮で写真に適するが、保存を繰り返すと劣化が蓄積する。PNGは可逆圧縮で図やロゴ、透過画像に適する。GIFは256色までで簡単なアニメーションに使われる。用途に応じた使い分けが重要。"},
{id:"d34", f:"digital", t:"音声圧縮", d:2,
 q:"MP3などの音声圧縮形式がデータ量を大きく削減できる主な理由として最も適当なものを選べ。",
 c:["人間の耳には聞こえにくい音の成分を取り除く非可逆圧縮を行っているから。",
    "音の高さをすべて半分にして記録しているから。",
    "録音時間を自動的に短くしているから。",
    "同じ音楽を2回続けて記録しているから。"],
 a:0,
 e:"MP3などは人間の聴覚特性（聞こえにくい高周波、直後の小さい音が聞こえにくい現象など）を利用して、知覚されにくい成分を削る非可逆圧縮。音質を大きく損なわずにデータ量を約1/10程度に減らせる。"},
{id:"d35", f:"digital", t:"文字コード表", d:3,
 q:"ASCIIコードでは大文字の A は16進法で 41、B は 42 のように順に並んでいる。E を16進法で表したものとして正しいものを選べ。",
 c:["44","45","46","4A"],
 a:1,
 e:"AからEはアルファベット順に4つ進むので、41 + 4 = 45。文字コード表では文字が規則的に並んでいるため、一部の対応が分かれば他の文字の符号も計算できる。この「表の規則性を使う」問題は共通テストでも出題されている。"},
{id:"d36", f:"digital", t:"Unicode", d:2,
 q:"Unicode（ユニコード）に関する説明として最も適当なものを選べ。",
 c:["世界中の文字を統一的に扱うことを目指した文字コード体系で、UTF-8などの符号化方式が広く使われている。",
    "日本語専用の文字コードで、英語は表現できない。",
    "画像を圧縮するための国際規格である。",
    "Unicodeの登場により、文字化けは技術的に絶対に起こらなくなった。"],
 a:0,
 e:"Unicodeは世界の文字に統一的な番号を割り当てる体系で、絵文字も含まれる。UTF-8はその代表的な符号化方式でWebの標準。ただし異なる符号化方式で解釈すれば文字化けは今でも起こりうる。"},
{id:"d37", f:"digital", t:"誤り訂正", d:2,
 q:"QRコードは一部が汚れたり欠けたりしても正しく読み取れることが多い。その理由として最も適当なものを選べ。",
 c:["データに誤り訂正のための冗長な符号があらかじめ付加されており、一定の割合までの欠損なら元のデータを復元できるから。",
    "カメラが汚れを自動的に物理的に除去しているから。",
    "QRコードは汚れると自動的に新しいコードに変化するから。",
    "読み取りのたびにインターネットから元データを取得しているから。"],
 a:0,
 e:"QRコードには誤り訂正符号（リード・ソロモン符号）が組み込まれており、最大約30%の欠損まで復元できるレベルがある。誤りの「検出」しかできないパリティビットに対し、「訂正」まで可能にするには、より多くの冗長データを付加する必要がある。"},
{id:"d38", f:"digital", t:"アナログとデジタル", d:1,
 q:"アナログとデジタルの違いに関する説明として最も適当なものを選べ。",
 c:["アナログは連続的に変化する量で表現し、デジタルは離散的な（飛び飛びの）値で表現する。",
    "アナログは数値で、デジタルは針の位置で表現する方式である。",
    "デジタルは常にアナログより情報を完全に正確に表現できる。",
    "音や温度は、もともと自然界にデジタルの形で存在している。"],
 a:0,
 e:"自然界の音・光・温度などは連続的なアナログ量。デジタル化では標本化・量子化により離散的な値に変換するため、厳密には元の情報との誤差（量子化誤差）が生じる。「デジタルの方が便利」ではあるが「完全に正確」ではない点に注意。"},
{id:"d39", f:"digital", t:"抽象化", d:2,
 q:"鉄道の路線図は、実際の地形や距離を正確に描く代わりに、駅の順序や乗換えの関係だけを分かりやすく表している。このような情報デザインの手法を何というか。",
 c:["抽象化","暗号化","量子化","標本化"],
 a:0,
 e:"抽象化は、目的に必要な情報だけを残して不要な詳細を省く手法。路線図やピクトグラム、地図記号が代表例。情報デザインの手法は「抽象化」「可視化」「構造化」の3つに整理され、どの手法の例かを問う問題が頻出。"},
{id:"d40", f:"digital", t:"可視化", d:2,
 q:"情報デザインにおける「可視化」の例として最も適当なものを選べ。",
 c:["都道府県別の人口データを棒グラフにして大小関係を一目で分かるようにする。",
    "文章を暗号化して読めないようにする。",
    "ファイルをZIP形式で圧縮する。",
    "Webサイトの全ページを1つの長いページに統合する。"],
 a:0,
 e:"可視化は、数値や関係性など目に見えない情報を、グラフ・図・ダイヤグラムなどで見える形にする手法。データの傾向や構造を直感的に伝えられる。抽象化（捨象して単純化）、構造化（関係を整理）との区別を押さえよう。"},
{id:"d41", f:"digital", t:"アクセシビリティ", d:2,
 q:"Webページのアクセシビリティを高める工夫として最も適当なものを選べ。",
 c:["色の違いだけで情報を区別せず、形や文字の併記でも伝わるようにし、十分なコントラストを確保する。",
    "重要な情報ほど点滅させ、多くの色を使って派手にする。",
    "文字はできるだけ小さくして、1ページの情報量を最大にする。",
    "赤と緑の色の組合せだけですべての情報を区別して表現する。"],
 a:0,
 e:"アクセシビリティは、障害の有無や年齢などにかかわらず誰もが情報を利用できる度合い。色覚の多様性に配慮して「色だけに頼らない」デザイン、十分なコントラスト、読みやすい文字サイズなどが基本。赤と緑の組合せは色覚特性によっては区別しにくい。"},
{id:"d42", f:"digital", t:"ユーザビリティ", d:2,
 q:"「ユーザビリティ」の説明として最も適当なものを選べ。",
 c:["利用者が目的を達成するために、どれだけ効率よく、間違えずに、満足して使えるかという使いやすさの度合い。",
    "システムの処理速度のこと。",
    "画面のデザインの芸術的な美しさのこと。",
    "ソフトウェアの価格の安さのこと。"],
 a:0,
 e:"ユーザビリティは「使いやすさ」。有効性（目的を達成できるか）・効率（少ない手間でできるか）・満足度などで評価される。誰もが使えることを目指すアクセシビリティと、使いやすさのユーザビリティはセットで問われやすい。"},
{id:"d43", f:"digital", t:"シグニファイア", d:3,
 q:"Webページのボタンに影を付けて立体的に見せることで「押せそう」と感じさせるなど、適切な行動を直感的に伝えるデザイン上の手がかりを何というか。",
 c:["シグニファイア","ピクトグラム","ワイヤーフレーム","ストーリーボード"],
 a:0,
 e:"シグニファイアは、どう操作すればよいかを利用者に伝える手がかり（ボタンらしい見た目、取っ手の形、下線付きのリンクなど）。説明書がなくても直感的に使えるデザインは、このような手がかりの工夫で実現される。"},
{id:"d44", f:"digital", t:"図解の使い分け", d:2,
 q:"伝えたい内容と図解の組合せとして最も適当なものを選べ。",
 c:["作業の手順→フローチャート、全体に占める割合→円グラフ、時間による変化→折れ線グラフ、項目間の大小比較→棒グラフ",
    "作業の手順→円グラフ、割合→折れ線グラフ、変化→棒グラフ、比較→フローチャート",
    "どんな内容でも円グラフで表すのが最も分かりやすい",
    "グラフの種類はデザインの好みで選べばよく、内容との対応は考えなくてよい"],
 a:0,
 e:"図解・グラフは伝えたい内容に合わせて選ぶ：手順・流れ→フローチャート、割合→円・帯グラフ、推移→折れ線、大小比較→棒グラフ、2変数の関係→散布図。目的と表現の対応関係は定番の出題ポイント。"},
{id:"d45", f:"digital", t:"Webサイトの構造", d:2,
 q:"Webサイトの情報の組織化に関する説明として最も適当なものを選べ。",
 c:["トップページから大分類・小分類へとたどれる階層構造にし、現在位置が分かるナビゲーションを設けると、利用者が目的の情報を見つけやすい。",
    "すべての情報を1ページに載せ、分類やリンクは設けないほうが親切である。",
    "ページ間のリンクはランダムに張るほうが利用者に発見の楽しみを与えられる。",
    "メニューの項目名は、かっこいい英語の造語にするほど分かりやすくなる。"],
 a:0,
 e:"Webサイトでは情報を階層構造などで整理し、パンくずリストやメニューで現在位置と移動手段を示すのが基本。情報の構造化（階層・順序・並列）と、迷わないためのナビゲーション設計はセットで理解しておこう。"},
{id:"d46", f:"digital", t:"プレゼンテーション", d:1,
 q:"プレゼンテーション用スライドの作り方として最も適当なものを選べ。",
 c:["1枚のスライドには要点を絞って大きな文字で示し、詳細は口頭で補足する。",
    "発表原稿の全文をそのままスライドに小さな文字で貼り付ける。",
    "1枚のスライドにできるだけ多くの情報を詰め込む。",
    "アニメーションや効果音を、内容と関係なくすべてのスライドに付ける。"],
 a:0,
 e:"スライドは「読む資料」ではなく「見せる資料」。1スライド1メッセージ、大きな文字、図解の活用が基本。過剰な装飾やアニメーションはかえって内容の伝達を妨げる。聞き手・目的に合わせた設計（誰に・何を・どう伝えるか）が出発点。"},
{id:"d47", f:"digital", t:"ユニバーサルデザイン", d:1,
 q:"ユニバーサルデザインの例として最も適当なものを選べ。",
 c:["シャンプーの容器の側面にきざみを付け、目を閉じていてもリンスと区別できるようにする。",
    "説明書を専門用語だけで書き、専門家だけが理解できるようにする。",
    "建物の入口を階段だけにして、デザイン性を高める。",
    "文字を極限まで小さくして、情報を詰め込む。"],
 a:0,
 e:"ユニバーサルデザインは、年齢・能力・言語などにかかわらず、できるだけ多くの人が最初から使えるように設計する考え方。シャンプー容器のきざみ、ピクトグラム、自動ドア、多言語案内などが例。特定の人向けの後付けの配慮（バリアフリー）との違いも意識しよう。"},
{id:"d48", f:"digital", t:"文字情報のデータ量", d:2,
 q:"1文字を2バイトで表す文字コードを使って、10,000文字の文書を保存した。文字データのデータ量として正しいものを選べ。",
 c:["約 10 KB","約 20 KB","約 80 KB","約 160 KB"],
 a:1,
 e:"10,000文字 × 2バイト = 20,000バイト ≒ 20KB。文字のデータ量は画像や音声に比べて桁違いに小さい。同じ内容でもメディアによってデータ量が大きく異なることを実感しておこう。"},
{id:"d49", f:"digital", t:"16進法の利用", d:2,
 q:"コンピュータの世界で16進法がよく使われる理由として最も適当なものを選べ。",
 c:["16進数1桁が2進数4桁（4ビット）にちょうど対応するため、長いビット列を短く読み書きできるから。",
    "16進法は人類が最初に発明した記数法だから。",
    "16進法を使うとコンピュータの計算速度が上がるから。",
    "10進法では小数が表現できないから。"],
 a:0,
 e:"2⁴ = 16 なので、4ビットずつ区切ると16進数1桁に対応する。例えば8ビットの「11010110」は「D6」と2文字で書ける。カラーコード（#FF0000など）やMACアドレスの表記に使われている。"},
{id:"d50", f:"digital", t:"2進法から16進法", d:2,
 q:"2進法の 11010110 を16進法で表したものとして正しいものを選べ。",
 c:["D6","C6","D4","B6"],
 a:0,
 e:"4ビットずつ区切って変換する：1101 = 13 = D、0110 = 6。よって D6。逆方向（16進→2進）も同じ対応表で機械的に変換できる。"},
{id:"d51", f:"digital", t:"補数を使う理由", d:3,
 q:"コンピュータが負の数を2の補数で表現する主な利点として最も適当なものを選べ。",
 c:["引き算を「補数を足す」ことで実現でき、足し算の回路だけで加減算を処理できるから。",
    "2の補数を使うと、数値のデータ量が半分になるから。",
    "2の補数で表すと、小数も表現できるようになるから。",
    "負の数をそのまま10進法で記憶できるから。"],
 a:0,
 e:"2の補数表現なら「A − B」を「A + (Bの2の補数)」として計算でき、減算専用の回路が不要になる。また+0と−0の重複がなく、8ビットなら−128〜+127を表せる。ハードウェアを単純にできるのが最大の利点。"},
{id:"d52", f:"digital", t:"オーバーフロー", d:3,
 q:"8ビットの2の補数表現で扱える整数の範囲と、範囲を超えたときに起こる現象の組合せとして正しいものを選べ。",
 c:["−128〜127 で、範囲を超えるとオーバーフローが起こり正しい結果が得られない。",
    "0〜255 で、範囲を超えると自動的に16ビットに拡張される。",
    "−127〜128 で、範囲を超えるとコンピュータが必ず停止する。",
    "−256〜255 で、範囲を超えることは決してない。"],
 a:0,
 e:"8ビットの2の補数では −2⁷ 〜 2⁷−1、つまり−128〜127を表せる。演算結果がこの範囲を超えるとオーバーフローが発生し、例えば127+1が−128になるなど誤った結果になる。ビット数と表現範囲の関係は頻出。"},
{id:"d53", f:"digital", t:"計算誤差", d:3,
 q:"コンピュータの数値計算に関する説明として最も適当なものを選べ。",
 c:["0.1のような10進法の小数は2進法では循環小数になるため正確に表現できず、微小な誤差が生じることがある。",
    "コンピュータの計算には誤差が生じることは絶対にない。",
    "整数の 1 + 1 の計算でも常に誤差が生じる。",
    "誤差はコンピュータの故障が原因なので、修理すれば必ずなくなる。"],
 a:0,
 e:"10進法の0.1は2進法では 0.000110011… と無限に続くため、有限のビット数では打ち切りによる誤差（丸め誤差）が生じる。0.1を10回足しても正確に1にならないことがあるのはこのため。誤差の存在を前提にプログラムを書くことが重要。"},
{id:"d54", f:"digital", t:"カラーコード", d:2,
 q:"Webで色を指定する16進カラーコード #FF0000 が表す色として正しいものを選べ。",
 c:["赤","緑","青","白"],
 a:0,
 e:"カラーコードは #RRGGBB の形式で、R（赤）G（緑）B（青）の強さを16進数2桁（00〜FF、0〜255）ずつで表す。#FF0000は赤が最大で緑・青が0なので赤。#FFFFFFは白、#000000は黒、#00FF00は緑。"},
{id:"d55", f:"digital", t:"フルカラーの色数", d:2,
 q:"RGB各色8ビット、合計24ビットで1画素の色を表すとき、表現できる色の数として最も近いものを選べ。",
 c:["約256色","約6万5千色","約1677万色","約10億色"],
 a:2,
 e:"各色256段階 × 3色で 256³ = 16,777,216 ≒ 約1677万色。これは「フルカラー」と呼ばれ、人間が識別できる色数を上回るとされる。2²⁴を直接計算しても同じ。"},
{id:"d56", f:"digital", t:"圧縮の計算", d:3,
 q:"1.2 MB の画像を圧縮したところ 150 KB になった。データ量は元のおよそ何分の1になったか。",
 c:["約4分の1","約8分の1","約12分の1","約2分の1"],
 a:1,
 e:"1.2MB = 1200KB。1200 ÷ 150 = 8 なので約8分の1。単位をKBまたはMBにそろえてから割り算するのがポイント。JPEGなどの非可逆圧縮ではこの程度の圧縮が実用的に行われている。"},
{id:"d57", f:"digital", t:"標本化・量子化・符号化", d:2,
 q:"音のデジタル化の3つの段階「標本化→量子化→符号化」の説明の組合せとして正しいものを選べ。",
 c:["標本化：一定の時間間隔で波の高さを取り出す／量子化：取り出した値を決められた段階の値に近似する／符号化：段階の値を2進法のビット列で表す",
    "標本化：ビット列に変換する／量子化：時間間隔で取り出す／符号化：段階値に近似する",
    "標本化：音を大きくする／量子化：音を小さくする／符号化：音を消す",
    "標本化：圧縮する／量子化：暗号化する／符号化：復号する"],
 a:0,
 e:"アナログの波形をデジタルにする手順は、①標本化（サンプリング：時間を離散化）、②量子化（振幅を離散化）、③符号化（2進数で表現）。それぞれ「時間方向」「高さ方向」「表現方法」の変換であることを図とセットで理解しよう。"},
{id:"d58", f:"digital", t:"情報デザインの目的", d:1,
 q:"情報デザインの目的として最も適当なものを選べ。",
 c:["情報を受け手に分かりやすく、正確に、効果的に伝えるために、情報を整理し表現を工夫すること。",
    "できるだけ多くの装飾を加えて、見た目を派手にすること。",
    "情報を他人に読み取られないように隠すこと。",
    "データ量を増やして情報を豊かに見せること。"],
 a:0,
 e:"情報デザインの本質は「相手に伝わる」ようにすること。受け手・目的に応じて、抽象化・可視化・構造化などの手法で情報を整理し表現する。装飾はあくまで伝達のための手段であり、目的ではない。"},
{id:"d59", f:"digital", t:"プレゼンの配色", d:2,
 q:"スライドの配色に関する配慮として最も適当なものを選べ。",
 c:["背景と文字に十分な明度差（コントラスト）を付け、強調に使う色は数色に絞る。",
    "1枚のスライドの中でできるだけ多くの色を使うほど、内容が伝わりやすくなる。",
    "背景が濃い青のとき、文字も濃い紺色にすると読みやすい。",
    "色は内容と無関係に、その日の気分で選ぶのがよい。"],
 a:0,
 e:"読みやすさの基本は背景と文字のコントラスト確保。使用する色は基本色＋強調色など少数に絞ると情報の優先度が伝わる。似た明度の組合せ（濃い青地に紺の文字など）は読みにくく、色覚多様性への配慮としても不適切。"},
{id:"d60", f:"digital", t:"代替テキスト", d:2,
 q:"Webページの画像に「代替テキスト（altテキスト）」を設定する主な目的として最も適当なものを選べ。",
 c:["音声読み上げソフトの利用者や画像が表示できない環境でも、画像の内容を文字情報として伝えられるようにするため。",
    "画像の表示速度を2倍にするため。",
    "画像の著作権を自動的に取得するため。",
    "画像の色数を増やすため。"],
 a:0,
 e:"代替テキストは、視覚に障害のある利用者が使うスクリーンリーダー（音声読み上げ）や、通信障害で画像が出ないときに内容を伝える文字情報。Webアクセシビリティの基本的な施策として覚えておこう。"},
/* ---- ③ コンピュータとプログラミング ---- */
{id:"p1", f:"programming", t:"プログラムのトレース（変数）", d:2,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。（共通テスト用プログラム表記）",
 code:"(1) a = 5\n(2) b = 3\n(3) t = a\n(4) a = b\n(5) b = t\n(6) 表示する(a, \"と\", b)",
 c:["5と3","3と5","5と5","3と3"],
 a:1,
 e:"作業用の変数tを使ってaとbの値を交換する典型的な処理。(3)でt=5、(4)でa=3、(5)でb=5となるので「3と5」が表示される。tを使わずに a=b, b=a とすると両方とも3になってしまう点に注意。"},
{id:"p2", f:"programming", t:"繰り返しと合計", d:2,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。",
 code:"(1) gokei = 0\n(2) i を 1 から 10 まで 1 ずつ増やしながら繰り返す：\n(3) 　　gokei = gokei + i\n(4) 表示する(gokei)",
 c:["10","45","55","100"],
 a:2,
 e:"1から10までの整数の合計を求めるプログラム。1+2+…+10 = 55。繰り返しのたびにgokeiにiが加算される「累積」の考え方は、合計・回数のカウントなど多くの場面で使われる基本パターン。"},
{id:"p3", f:"programming", t:"条件分岐", d:2,
 q:"次のプログラムで、x に 7 を入力したときに表示されるものとして正しいものを選べ。",
 code:"(1) x =【外部からの入力】\n(2) もし x % 2 == 0 ならば：\n(3) 　　表示する(\"偶数\")\n(4) そうでなければ：\n(5) 　　表示する(\"奇数\")",
 c:["偶数","奇数","偶数と奇数の両方","何も表示されない"],
 a:1,
 e:"「%」は割り算の余りを求める演算子。7 % 2 = 1 で0ではないため、条件「x % 2 == 0」は偽となり、「そうでなければ」の側が実行されて「奇数」と表示される。余りによる偶奇判定は頻出パターン。"},
{id:"p4", f:"programming", t:"配列", d:2,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。",
 code:"(1) Data = [20, 50, 30, 80, 60]\n(2) 表示する(Data[1] + Data[3])",
 c:["100","130","70","110"],
 a:1,
 e:"共通テスト用プログラム表記では、特に説明がない限り配列の添字は0から始まる。Data[1]は2番目の要素50、Data[3]は4番目の要素80なので、50 + 80 = 130。添字が0始まりであることを忘れると70（20+50）などと誤答しやすい。"},
{id:"p5", f:"programming", t:"最大値を求めるアルゴリズム", d:3,
 q:"配列 Data の最大値を求める次のプログラムの空欄【ア】に入るものとして正しいものを選べ。",
 code:"(1) Data = [43, 76, 22, 91, 58]\n(2) saidai = Data[0]\n(3) i を 1 から 4 まで 1 ずつ増やしながら繰り返す：\n(4) 　　もし 【ア】 ならば：\n(5) 　　　　saidai = Data[i]\n(6) 表示する(saidai)",
 c:["Data[i] ＞ saidai","Data[i] ＜ saidai","Data[i] == saidai","i ＞ saidai"],
 a:0,
 e:"最大値の更新は「現在の最大値saidaiより大きい要素が見つかったら置き換える」という考え方。よってData[i] ＞ saidai が正しい。不等号を逆にすると最小値を求めるプログラムになる。この「暫定値を更新していく」パターンは頻出。"},
{id:"p6", f:"programming", t:"探索アルゴリズム", d:3,
 q:"探索アルゴリズムに関する説明として最も適当なものを選べ。",
 c:["線形探索は、データがあらかじめ整列（ソート）されていないと使えない。",
    "二分探索は、整列済みのデータに対して探索範囲を半分ずつに絞り込む方法で、データ数が多いほど線形探索より比較回数の面で有利になる。",
    "二分探索は整列されていないデータでもそのまま使える。",
    "1000個のデータから線形探索で目的の値を探すとき、比較回数は最大でも10回程度である。"],
 a:1,
 e:"線形探索は先頭から順に比べる方法で整列は不要だが、最大でデータ数と同じ回数（1000個なら最大1000回）の比較が必要。二分探索は整列済みデータ限定だが、範囲を半分ずつに絞るため1000個でも約10回（2¹⁰=1024）で探せる。"},
{id:"p7", f:"programming", t:"論理回路", d:2,
 q:"2つの入力A、Bに対する論理回路の出力について、正しい説明を選べ。",
 c:["AND回路は、AとBの少なくとも一方が1のとき1を出力する。",
    "OR回路は、AとBの両方が1のときだけ1を出力する。",
    "XOR（排他的論理和）回路は、AとBの値が異なるときに1を出力する。",
    "NOT回路は、2つの入力の値をそのまま出力する。"],
 a:2,
 e:"AND（論理積）は両方1のときだけ1、OR（論理和）は少なくとも一方が1なら1、XOR（排他的論理和）は2つの入力が異なるとき1、NOT（否定）は1つの入力を反転する。選択肢のANDとORの説明は互いに逆になっている。"},
{id:"p8", f:"programming", t:"乱数とシミュレーション", d:2,
 q:"「乱数()」は0以上1未満の小数をランダムに返し、「整数(x)」はxの小数点以下を切り捨てる関数である。次の式が返す値の範囲として正しいものを選べ。",
 code:"saikoro = 整数(乱数() * 6) + 1",
 c:["0以上5以下の整数","1以上6以下の整数","1以上7以下の整数","0以上6以下の整数"],
 a:1,
 e:"乱数()は0以上1未満なので、乱数()*6 は0以上6未満。整数()で切り捨てると0〜5の整数になり、+1して1〜6の整数となる。サイコロのシミュレーションの定番表現で、本試験・模試とも頻出。"},
{id:"p9", f:"programming", t:"モデル化", d:2,
 q:"モデル化とシミュレーションに関する説明として最も適当なものを選べ。",
 c:["サイコロの出目やレジの客の到着のように偶然の要素を含む現象を扱うモデルを、確率的モデル（確率モデル）という。",
    "シミュレーションを行えば、現実の結果を常に100%正確に予測できる。",
    "モデル化では、対象のすべての要素を省略せずに取り入れるほどよい。",
    "確定的モデルとは、乱数を用いて偶然の要素を再現するモデルのことである。"],
 a:0,
 e:"偶然の要素を含むモデルが確率的モデル、含まないものが確定的モデル。モデル化は目的に応じて本質的な要素を抜き出し単純化する作業であり、すべてを取り込むわけではない。シミュレーション結果はモデルの仮定に依存するため、予測には限界がある。"},
{id:"p10", f:"programming", t:"関数（プログラム）", d:3,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。「二乗和(a, b)」はaの2乗とbの2乗の和を返す関数として定義されているものとする。",
 code:"(1) x = 3\n(2) y = 4\n(3) kekka = 二乗和(x, y)\n(4) 表示する(kekka)",
 c:["7","12","25","49"],
 a:2,
 e:"二乗和(3, 4) = 3² + 4² = 9 + 16 = 25。関数は「引数を受け取り、処理をして値を返す」仕組みで、共通テストでは問題文中で関数の働きが説明される。説明を正確に読み取って当てはめることが重要。"},
{id:"p11", f:"programming", t:"二重ループ", d:3,
 q:"次のプログラムを実行したとき、「☆」は何回表示されるか。",
 code:"(1) i を 1 から 3 まで 1 ずつ増やしながら繰り返す：\n(2) 　　j を 1 から 4 まで 1 ずつ増やしながら繰り返す：\n(3) 　　　　表示する(\"☆\")",
 c:["7回","12回","3回","4回"],
 a:1,
 e:"外側のループが3回、その各回について内側のループが4回実行されるので、3 × 4 = 12回。二重ループの実行回数は「外側の回数 × 内側の回数」。表・二次元的なデータの処理でよく使われる。"},
{id:"p12", f:"programming", t:"アルゴリズムの効率", d:3,
 q:"整列済みの4096個のデータから二分探索で目的の値を探すとき、比較回数は最大で約何回か。最も適当なものを選べ。",
 c:["約12回","約64回","約2048回","約4096回"],
 a:0,
 e:"二分探索は1回の比較で探索範囲が半分になる。4096 = 2¹² なので、最大でも約12回の比較で探索が終わる。線形探索なら最大4096回必要であり、データ数が大きいほど二分探索の効率のよさが際立つ。"},
{id:"p13", f:"programming", t:"条件付き繰り返し", d:3,
 q:"次のプログラムを実行したとき、最後に表示される値として正しいものを選べ。",
 code:"(1) x = 1\n(2) x ＜= 100 の間繰り返す：\n(3) 　　x = x * 2\n(4) 表示する(x)",
 c:["64","100","128","256"],
 a:2,
 e:"xは1→2→4→8→16→32→64→128と変化する。64のとき条件（64≦100）は真なので繰り返しが続き128になる。128になった時点で条件が偽となりループ終了、128が表示される。「あと1回実行されるか」の境界判断がポイント。"},
{id:"p14", f:"programming", t:"減らしながらの繰り返し", d:1,
 q:"次のプログラムを実行したとき、表示される内容として正しいものを選べ。",
 code:"(1) i を 5 から 1 まで 1 ずつ減らしながら繰り返す：\n(2) 　　表示する(i)",
 c:["5 4 3 2 1 と順に表示される","1 2 3 4 5 と順に表示される","5 だけが表示される","何も表示されない"],
 a:0,
 e:"「減らしながら」の繰り返しでは、iは5, 4, 3, 2, 1と変化し、そのたびに表示される。カウントダウンや配列を後ろからたどる処理で使われる形。増やす場合との向きの違いに注意。"},
{id:"p15", f:"programming", t:"配列の合計（穴埋め）", d:2,
 q:"配列 Data の全要素の合計を求める次のプログラムの空欄【ア】に入るものとして正しいものを選べ。",
 code:"(1) Data = [12, 25, 8, 30, 15]\n(2) gokei = 0\n(3) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(4) 　　【ア】\n(5) 表示する(gokei)",
 c:["gokei = gokei + Data[i]","gokei = Data[i]","gokei = gokei + i","Data[i] = gokei + i"],
 a:0,
 e:"合計を求めるには、累積用の変数gokeiに各要素Data[i]を順に加えていく。「gokei = Data[i]」では上書きされて最後の要素だけが残り、「gokei + i」では添字を足してしまう。累積パターンは全プログラム問題の基礎。"},
{id:"p16", f:"programming", t:"平均値の計算", d:2,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。「要素数(Data)」は配列の要素の個数を返す関数である。",
 code:"(1) Data = [40, 60, 80, 100]\n(2) gokei = 0\n(3) i を 0 から 要素数(Data)−1 まで 1 ずつ増やしながら繰り返す：\n(4) 　　gokei = gokei + Data[i]\n(5) 表示する(gokei / 要素数(Data))",
 c:["60","70","80","280"],
 a:1,
 e:"合計は40+60+80+100 = 280、要素数は4なので、280 ÷ 4 = 70。合計を求めてから個数で割るのが平均の基本手順。ループの範囲を「要素数−1」までとすることで、要素数が変わっても動くプログラムになっている。"},
{id:"p17", f:"programming", t:"最小値を求める", d:2,
 q:"配列 Data の最小値を求める次のプログラムの空欄【ア】に入るものとして正しいものを選べ。",
 code:"(1) Data = [43, 76, 22, 91, 58]\n(2) saisho = Data[0]\n(3) i を 1 から 4 まで 1 ずつ増やしながら繰り返す：\n(4) 　　もし 【ア】 ならば：\n(5) 　　　　saisho = Data[i]\n(6) 表示する(saisho)",
 c:["Data[i] ＜ saisho","Data[i] ＞ saisho","Data[i] == saisho","saisho ＜ Data[0]"],
 a:0,
 e:"最小値は「暫定の最小値saishoより小さい要素が見つかったら更新」する。よってData[i] ＜ saisho。最大値（＞）と最小値（＜）は不等号の向きだけが違う。初期値を先頭要素Data[0]にする点も定番の書き方。"},
{id:"p18", f:"programming", t:"条件を満たす個数", d:2,
 q:"80以上の得点の個数を数える次のプログラムを実行したとき、表示される値として正しいものを選べ。",
 code:"(1) Tokuten = [65, 82, 90, 74, 88, 79]\n(2) kosu = 0\n(3) i を 0 から 5 まで 1 ずつ増やしながら繰り返す：\n(4) 　　もし Tokuten[i] ＞= 80 ならば：\n(5) 　　　　kosu = kosu + 1\n(6) 表示する(kosu)",
 c:["2","3","4","6"],
 a:1,
 e:"80以上の得点は82, 90, 88の3つ。条件を満たすたびにkosuに1を加える「カウント」のパターン。79や74は「80以上」に含まれない点、「＞=」と「＞」の違いに注意。"},
{id:"p19", f:"programming", t:"線形探索（穴埋め）", d:2,
 q:"配列から目的の値 target を探す線形探索プログラムの空欄【ア】に入るものとして正しいものを選べ。",
 code:"(1) Data = [31, 45, 12, 68, 27]\n(2) target = 68\n(3) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(4) 　　もし 【ア】 ならば：\n(5) 　　　　表示する(i, \"番目で発見\")",
 c:["Data[i] == target","Data[i] ＞ target","i == target","Data[target] == i"],
 a:0,
 e:"線形探索は先頭から順に「その要素が探している値と等しいか」を確かめる。よってData[i] == target。等しいかの比較は「==」で、代入の「=」と区別される。このプログラムでは i = 3 のとき68が見つかる。"},
{id:"p20", f:"programming", t:"二分探索のトレース", d:3,
 q:"昇順に整列された配列 [3, 8, 15, 21, 30, 42, 55]（添字0〜6）から二分探索で 42 を探す。最初に添字3の21と比較した後、次に比較される値として正しいものを選べ。",
 c:["30","42","55","8"],
 a:1,
 e:"21 ＜ 42 なので探索範囲は右半分（添字4〜6）に絞られる。その中央は添字5の42で、これが次の比較対象となり発見。比較はわずか2回。中央値と比べて範囲を半分に絞る動きを、添字で正確に追えるようにしよう。"},
{id:"p21", f:"programming", t:"整列（ソート）", d:2,
 q:"隣り合う要素を比較して順序が逆なら交換する操作を繰り返し、配列を整列させるアルゴリズムとして正しいものを選べ。",
 c:["バブルソート（交換法）","二分探索","線形探索","乱数生成"],
 a:0,
 e:"バブルソートは隣接要素の比較・交換を繰り返す基本的な整列アルゴリズム。値が泡（バブル）のように端へ移動していくことが名前の由来。探索（探す）と整列（並べ替える）はアルゴリズムの2大テーマとして区別しよう。"},
{id:"p22", f:"programming", t:"バブルソートのトレース", d:3,
 q:"配列 [5, 3, 8, 1] に対して、先頭から順に隣り合う要素を比較し、左が大きければ交換する操作を右端まで1回行った（1パス）。その後の配列として正しいものを選べ。",
 c:["[3, 5, 1, 8]","[1, 3, 5, 8]","[5, 3, 8, 1]","[3, 5, 8, 1]"],
 a:0,
 e:"5と3→交換[3,5,8,1]、5と8→そのまま、8と1→交換[3,5,1,8]。1パスで最大値8が右端に確定する。全体を整列するにはパスを繰り返す必要がある。1パスで完全に整列すると誤解しないこと。"},
{id:"p23", f:"programming", t:"多分岐のトレース", d:2,
 q:"次のプログラムで、ten に 75 を入力したときに表示されるものとして正しいものを選べ。",
 code:"(1) ten =【外部からの入力】\n(2) もし ten ＞= 80 ならば：\n(3) 　　表示する(\"A\")\n(4) そうでなくもし ten ＞= 60 ならば：\n(5) 　　表示する(\"B\")\n(6) そうでなければ：\n(7) 　　表示する(\"C\")",
 c:["A","B","C","AとBの両方"],
 a:1,
 e:"75は「80以上」ではないので(2)は偽、次の「60以上」は真なのでBが表示される。多分岐では上から順に判定され、最初に真になった分岐だけが実行される。条件の順序を入れ替えると結果が変わることも重要。"},
{id:"p24", f:"programming", t:"論理演算子を使った条件", d:2,
 q:"「xが10以上かつ20以下のとき」に処理を行う条件式として正しいものを選べ。",
 c:["もし x ＞= 10 and x ＜= 20 ならば","もし x ＞= 10 or x ＜= 20 ならば","もし x ＞ 10 and x ＞ 20 ならば","もし not(x ＞= 10) ならば"],
 a:0,
 e:"「かつ」はand。x ＞= 10 or x ＜= 20 はすべての数で真になってしまう（10未満でも後半が真）ため誤り。範囲の条件は「下限 and 上限」の形で書く。andとorの取り違えはバグの定番。"},
{id:"p25", f:"programming", t:"条件式の誤り", d:3,
 q:"「xが1または2のとき」を表す条件式として正しいものを選べ。",
 c:["x == 1 or x == 2","x == 1 or 2","x == (1 or 2)","x = 1 or x = 2"],
 a:0,
 e:"orの両側はそれぞれ完全な条件式でなければならない。「x == 1 or 2」のような日本語的な省略は多くの言語で意図通り動かない。また「=」は代入、「==」が比較。条件式の正しい書き方を問う問題は共通テスト系で頻出。"},
{id:"p26", f:"programming", t:"フラグ変数", d:3,
 q:"次のプログラムの変数 mitsukatta の役割として最も適当なものを選べ。",
 code:"(1) mitsukatta = 0\n(2) i を 0 から 4 まで 1 ずつ増やしながら繰り返す：\n(3) 　　もし Data[i] == target ならば：\n(4) 　　　　mitsukatta = 1\n(5) もし mitsukatta == 0 ならば：\n(6) 　　表示する(\"見つかりませんでした\")",
 c:["探している値が見つかったかどうかの状態を記録する「フラグ」として使われている。",
    "配列の要素数を数えるカウンタとして使われている。",
    "探している値そのものを保存している。",
    "乱数を生成するために使われている。"],
 a:0,
 e:"「見つかった＝1、見つからない＝0」のように、ある状態が起きたかどうかを記録する変数をフラグという。ループ終了後にフラグを調べることで「1回も見つからなかった」ことを判定できる。探索や条件チェックで多用される重要パターン。"},
{id:"p27", f:"programming", t:"うるう年の条件", d:3,
 q:"うるう年は「4で割り切れる年。ただし100で割り切れる年は平年。ただし400で割り切れる年はうるう年」である。西暦 year がうるう年である条件式として正しいものを選べ。",
 c:["(year % 4 == 0 and year % 100 != 0) or year % 400 == 0",
    "year % 4 == 0 and year % 100 == 0 and year % 400 == 0",
    "year % 4 == 0 or year % 100 != 0",
    "year % 400 != 0 and year % 4 == 0 and year % 100 == 0"],
 a:0,
 e:"「4で割り切れ、かつ100で割り切れない」または「400で割り切れる」が正しい条件。2000年はうるう年（400の倍数）、1900年は平年（100の倍数だが400の倍数でない）で検算できる。複数条件をandとorで正しく組み立てる練習に最適な題材。"},
{id:"p28", f:"programming", t:"剰余を使った分岐", d:2,
 q:"次のプログラムを実行したとき、表示される内容として正しいものを選べ。",
 code:"(1) i を 1 から 5 まで 1 ずつ増やしながら繰り返す：\n(2) 　　もし i % 3 == 0 ならば：\n(3) 　　　　表示する(\"○\")\n(4) 　　そうでなければ：\n(5) 　　　　表示する(i)",
 c:["1 2 ○ 4 5","○ 2 3 4 ○","1 2 3 4 5","1 ○ 3 ○ 5"],
 a:0,
 e:"i % 3 == 0 が真になるのはi = 3のときだけ。よって1, 2, ○, 4, 5の順に表示される。剰余（%）で「〜の倍数」を判定するのは頻出パターン。FizzBuzz問題として有名な題材の簡略版。"},
{id:"p29", f:"programming", t:"要素の交換", d:3,
 q:"要素数 n の配列 Data を逆順に並べ替えるとき、先頭から i 番目（添字i）の要素と交換すべき要素の添字として正しいものを選べ。",
 c:["n − 1 − i","n − i","n + i","i − n"],
 a:0,
 e:"添字は0からn−1まで。先頭（添字0）は末尾（添字n−1）と、添字1はn−2と交換する。一般化すると添字iの相手はn−1−i。添字が0始まりであることによる「−1」を忘れるのが典型的ミス。"},
{id:"p30", f:"programming", t:"二次元配列", d:2,
 q:"二次元配列 Data が次のように定義されている。Data[1, 2] の値として正しいものを選べ。（行・列とも添字は0から始まる）",
 code:"Data = [[10, 20, 30],\n        [40, 50, 60],\n        [70, 80, 90]]",
 c:["20","60","80","50"],
 a:1,
 e:"Data[1, 2]は「1行目・2列目」（どちらも0始まり）なので、2番目の行[40, 50, 60]の3番目の要素60。行と列の順序、0始まりの添字という2つの落とし穴がある。表形式データの処理で必須の知識。"},
{id:"p31", f:"programming", t:"関数の引数と戻り値", d:1,
 q:"プログラムにおける「関数」の説明として最も適当なものを選べ。",
 c:["一連の処理をまとめて名前を付けたもので、引数として値を受け取り、処理結果を戻り値として返すことができる。",
    "関数とは変数に別名を付けたものである。",
    "関数は一度呼び出すと二度と使えない。",
    "関数は数学の授業でのみ使われ、プログラムには存在しない。"],
 a:0,
 e:"関数は処理の部品化の仕組み。同じ処理を何度も書かずに済み、プログラムの見通しがよくなる。共通テストでは「問題文中で定義された関数の仕様を読み取って使う」形式が中心なので、引数と戻り値の関係を正確に読む練習をしよう。"},
{id:"p32", f:"programming", t:"関数の入れ子", d:3,
 q:"関数 f(x) は 2*x + 1 を返す。f(f(2)) の値として正しいものを選べ。",
 c:["5","9","11","25"],
 a:2,
 e:"内側から計算する。f(2) = 2×2+1 = 5、次にf(5) = 2×5+1 = 11。関数の中に関数を入れた場合は、内側の戻り値が外側の引数になる。計算の順序を焦らず追うことが大切。"},
{id:"p33", f:"programming", t:"乱数の範囲", d:2,
 q:"「乱数()」は0以上1未満の小数を返し、「整数(x)」は小数点以下を切り捨てる。コイン投げ（表を1、裏を0）をシミュレーションする式として最も適当なものを選べ。",
 c:["整数(乱数() * 2)","整数(乱数()) + 1","乱数() * 2","整数(乱数() * 10)"],
 a:0,
 e:"乱数()*2は0以上2未満なので、切り捨てると0または1がほぼ半々で得られる。整数(乱数())は常に0。乱数()*2のままでは小数。整数(乱数()*10)は0〜9。乱数から目的の範囲の整数を作る式の設計は頻出。"},
{id:"p34", f:"programming", t:"モンテカルロ法", d:3,
 q:"1辺1の正方形内にランダムな点を多数打ち、原点から距離1以内に入った点の割合から円周率を推定する方法に関する説明として最も適当なものを選べ。",
 c:["点の数を増やすほど推定値は円周率の理論値に近づく傾向があるが、毎回の結果は完全には一致しない。",
    "点を10個も打てば、円周率は小数点以下10桁まで正確に求まる。",
    "この方法では乱数を使わない。",
    "点の数を増やすと、推定値は円周率から遠ざかっていく。"],
 a:0,
 e:"乱数を使って確率的に値を推定する手法をモンテカルロ法という。試行回数を増やすほど結果は理論値に近づく（大数の法則）が、乱数を使うため毎回の結果はばらつく。「回数と精度の関係」はシミュレーション問題の核心。"},
{id:"p35", f:"programming", t:"度数集計プログラム", d:3,
 q:"0〜99点の得点を10点刻みで集計する。得点 ten が入ったとき、対応する度数配列 Dosu の添字を求める式として正しいものを選べ。（Dosu[0]が0〜9点、Dosu[9]が90〜99点）",
 c:["ten % 10","整数(ten / 10)","ten * 10","整数(10 / ten)"],
 a:1,
 e:"例えば73点なら整数(73/10) = 7で、70〜79点の階級Dosu[7]に対応する。ten % 10だと一の位（3）になってしまう。除算の商で階級を求め、Dosu[整数(ten/10)]に1を加えるのが度数分布集計の定番パターンで、共通テストでも出題例がある。"},
{id:"p36", f:"programming", t:"制御構造", d:1,
 q:"プログラムの3つの基本的な制御構造の組合せとして正しいものを選べ。",
 c:["順次（上から順に実行）・分岐（条件で処理を選ぶ）・反復（処理を繰り返す）",
    "入力・出力・保存",
    "加算・減算・乗算",
    "圧縮・暗号化・復号"],
 a:0,
 e:"どんな複雑なプログラムも、順次・分岐（選択）・反復（繰り返し）の3構造の組合せで表現できる（構造化プログラミング）。フローチャートでもこの3構造が基本要素となる。"},
{id:"p37", f:"programming", t:"フローチャート", d:1,
 q:"フローチャート（流れ図）で、条件による分岐を表す記号として正しいものを選べ。",
 c:["ひし形","長方形","楕円（端子）","平行四辺形"],
 a:0,
 e:"ひし形＝判断（分岐）、長方形＝処理、楕円＝開始・終了（端子）、平行四辺形＝入出力。記号の意味を問う問題は基本知識として落とせない。"},
{id:"p38", f:"programming", t:"無限ループ", d:2,
 q:"次のプログラムが無限ループになる理由として最も適当なものを選べ。",
 code:"(1) x = 10\n(2) x ＞ 0 の間繰り返す：\n(3) 　　表示する(x)",
 c:["繰り返しの中で x の値が変化しないため、条件 x ＞ 0 が永遠に真のままだから。",
    "x の初期値が10だから。10以外なら必ず終了する。",
    "「表示する」関数は1回しか実行できないから。",
    "条件式に ＞ を使うと必ず無限ループになるから。"],
 a:0,
 e:"条件付きループでは、ループ内で条件に関わる変数を更新しないと永遠に終わらない。(3)の後に「x = x − 1」などの更新処理が必要。「ループが終わる仕組みがあるか」はプログラムを読むときの重要チェックポイント。"},
{id:"p39", f:"programming", t:"デバッグ", d:1,
 q:"プログラムが意図した通りに動かないときの対処として最も適当なものを選べ。",
 c:["途中の変数の値を表示させるなどして、どこで想定と違う動きをしているかを絞り込む。",
    "プログラムをそのまま何度も実行し続ければ、いつか正しく動くようになる。",
    "エラーの原因を調べずに、最初からすべて書き直すのが常に最も効率的である。",
    "エラーメッセージは読まずにすぐ閉じる。"],
 a:0,
 e:"バグ取り（デバッグ）の基本は、エラーメッセージを読む、途中経過を表示して確認する、少しずつ動かして問題箇所を絞り込むこと。値をトレース（追跡）する力は、共通テストのプログラム読解問題そのものでも問われている。"},
{id:"p40", f:"programming", t:"アルゴリズムの性質", d:2,
 q:"アルゴリズムに関する説明として最も適当なものを選べ。",
 c:["同じ問題を解くアルゴリズムは複数存在することがあり、それぞれ処理の速さや手順の数が異なる場合がある。",
    "1つの問題に対してアルゴリズムは1つしか存在しない。",
    "アルゴリズムはコンピュータでしか実行できず、人間の作業手順には応用できない。",
    "アルゴリズムが正しければ、どんな書き方でも処理時間は同じである。"],
 a:0,
 e:"例えば探索には線形探索と二分探索があり、整列にも多くの方法がある。正しさだけでなく効率（比較回数・処理時間）にも差が出る。「どちらのアルゴリズムが何回の比較で済むか」という比較問題が頻出。"},
{id:"p41", f:"programming", t:"探索の比較回数", d:3,
 q:"約100万件の整列済みデータから二分探索で目的の値を探すとき、比較回数は最大で約何回か。最も適当なものを選べ。",
 c:["約20回","約1000回","約10万回","約50万回"],
 a:0,
 e:"2²⁰ = 1,048,576 ≒ 100万なので、最大でも約20回。データが1000倍になっても比較回数は約10回増えるだけ（2¹⁰≒1000）で、これが二分探索の強力さ。線形探索なら最大100万回かかる。"},
{id:"p42", f:"programming", t:"XORの性質", d:3,
 q:"ビットごとの排他的論理和（XOR）に関する説明として最も適当なものを選べ。",
 c:["同じビット列で2回XORを取ると元のビット列に戻るため、簡単な暗号化・復号の仕組みに応用できる。",
    "XORは3つ以上の入力がないと計算できない。",
    "XORの結果は常にすべてのビットが1になる。",
    "XORを1回行うとデータは完全に失われ、二度と復元できない。"],
 a:0,
 e:"A XOR B XOR B = A という性質がある（同じ鍵で2回XORすると元に戻る）。この性質は暗号化やデータのチェックに応用される。2026年共通テスト本試験でも、ビット演算（XORによる画像処理）が大問のテーマになった。"},
{id:"p43", f:"programming", t:"ANDによるマスク処理", d:3,
 q:"8ビットの値 11010110 と 00001111 のビットごとのAND（論理積）を計算した結果として正しいものを選べ。",
 c:["00000110","11010110","00001111","11011111"],
 a:0,
 e:"ANDは両方1の桁だけ1になる。下位4ビットは0110 AND 1111 = 0110、上位4ビットは1101 AND 0000 = 0000。結果は00000110。特定のビットだけを取り出すこの操作を「マスク」といい、画像処理や通信で多用される。"},
{id:"p44", f:"programming", t:"半加算器", d:3,
 q:"1ビットどうしの加算を行う半加算器では、2つの論理回路を組み合わせて「和」と「桁上がり」を求める。その組合せとして正しいものを選べ。",
 c:["和＝XOR回路、桁上がり＝AND回路","和＝AND回路、桁上がり＝OR回路","和＝OR回路、桁上がり＝NOT回路","和＝NOT回路、桁上がり＝XOR回路"],
 a:0,
 e:"1+1＝10（和0、桁上がり1）、1+0＝01（和1、桁上がり0）を考えると、和は「入力が異なるとき1」なのでXOR、桁上がりは「両方1のとき1」なのでAND。論理回路が計算の基礎になっていることを示す代表例。"},
{id:"p45", f:"programming", t:"真理値表の読み取り", d:3,
 q:"2入力A, Bに対し、出力が「A=1かつB=1のときだけ0、それ以外は1」となる論理回路として正しいものを選べ。",
 c:["NAND回路（ANDの出力を反転）","AND回路","OR回路","XOR回路"],
 a:0,
 e:"ANDの真理値表（両方1のときだけ1）をNOTで反転したものがNAND。真理値表から回路を特定する問題は、各回路の出力パターン（AND：両方1で1／OR：どちらか1で1／XOR：異なるとき1）を覚えていれば消去法で解ける。"},
{id:"p46", f:"programming", t:"待ち行列のシミュレーション", d:3,
 q:"文化祭の模擬店で行列ができる様子をシミュレーションで調べたい。適切な進め方として最も適当なものを選べ。",
 c:["客の到着間隔や1人あたりの対応時間を乱数で与えてモデル化し、レジの台数などの条件を変えて行列の長さの変化を比較する。",
    "実際に文化祭を何度も開催して試すのが、最も手軽で低コストである。",
    "シミュレーションは1回だけ実行し、その結果をそのまま結論とする。",
    "行列の長さは常に一定なので、シミュレーションする意味はない。"],
 a:0,
 e:"客の到着はランダム性があるため乱数を使った確率的モデルでシミュレーションする。条件（レジ台数・対応時間）を変えた比較が容易なのがシミュレーションの利点。乱数を使うため複数回実行して傾向を見ることも重要。この題材は模試・本試験で繰り返し出題されている。"},
{id:"p47", f:"programming", t:"確定的モデル", d:2,
 q:"確定的モデルで表現するのが適切な現象として最も適当なものを選べ。",
 c:["一定の年利率で預金が増えていく複利計算","サイコロの出た目","レジに客が到着する間隔","くじ引きの当たりはずれ"],
 a:0,
 e:"複利計算は式が決まれば結果が一意に定まる確定的モデル。サイコロ・客の到着・くじ引きは偶然の要素を含むため確率的モデルで扱う。「偶然の要素を含むか」が判断基準。"},
{id:"p48", f:"programming", t:"シミュレーションの意義", d:1,
 q:"コンピュータシミュレーションが特に有効な場面として最も適当なものを選べ。",
 c:["実物での実験が危険・高コスト・時間がかかりすぎる場合に、モデル上で条件を変えながら安全に何度も試せる。",
    "実物で簡単に何度でも試せる場合には、シミュレーションのほうが常に正確である。",
    "シミュレーションの結果は現実と完全に一致するので、実験は一切不要になる。",
    "シミュレーションは天気予報にだけ使われる技術である。"],
 a:0,
 e:"災害の避難、自動車の衝突、感染症の広がり、天体の運動などは実物実験が困難であり、シミュレーションが威力を発揮する。ただし結果はモデルの仮定に依存するため、現実との誤差を意識して解釈する必要がある。"},
{id:"p49", f:"programming", t:"階乗の計算", d:2,
 q:"次のプログラムを実行したとき、表示される値として正しいものを選べ。",
 code:"(1) seki = 1\n(2) i を 1 から 5 まで 1 ずつ増やしながら繰り返す：\n(3) 　　seki = seki * i\n(4) 表示する(seki)",
 c:["15","24","120","720"],
 a:2,
 e:"seki は 1→1→2→6→24→120 と変化する（1×2×3×4×5 = 120、つまり5の階乗）。合計の累積（初期値0で加算）に対し、積の累積は初期値1で乗算。初期値を0にすると結果が常に0になってしまう点も重要。"},
{id:"p50", f:"programming", t:"整数の除算と剰余", d:2,
 q:"共通テスト用プログラム表記では、整数の除算の商を「÷」、余りを「%」で表す。17 ÷ 5 と 17 % 5 の値の組合せとして正しいものを選べ。",
 c:["商 3、余り 2","商 3.4、余り 0","商 2、余り 3","商 5、余り 17"],
 a:0,
 e:"17 = 5 × 3 + 2 なので商は3、余りは2。整数除算と剰余は、桁の取り出し（123 % 10 = 3）、偶奇判定、周期的な処理など、プログラム問題のあらゆる場面で使われる基本演算。"},
{id:"p51", f:"programming", t:"条件の否定", d:2,
 q:"条件「not(x ＞ 5)」と同じ意味の条件として正しいものを選べ。",
 c:["x ＜= 5","x ＜ 5","x ＞= 5","x != 5"],
 a:0,
 e:"「x ＞ 5 でない」とは「x が5以下」、つまり x ＜= 5。境界値の5自身が含まれるかどうかがポイント（x=5のときx＞5は偽なので、その否定は真）。否定を作るときは不等号の向きだけでなく「=を含むか」も反転する。"},
{id:"p52", f:"programming", t:"ド・モルガンの法則", d:3,
 q:"条件「not(A and B)」と常に同じ結果になる条件として正しいものを選べ。",
 c:["not(A) or not(B)","not(A) and not(B)","A or B","A and B"],
 a:0,
 e:"ド・モルガンの法則：not(A and B) = not(A) or not(B)、not(A or B) = not(A) and not(B)。「両方成り立つ、の否定」は「少なくとも一方が成り立たない」。具体例（A=真, B=偽など）を代入して確かめる習慣をつけると確実。"},
{id:"p53", f:"programming", t:"ループ範囲の誤り", d:3,
 q:"要素数5の配列 Data（添字0〜4）のすべての要素を表示したい。誤りを含むプログラムはどれか。",
 c:["i を 1 から 5 まで 1 ずつ増やしながら繰り返す：　表示する(Data[i])",
    "i を 0 から 4 まで 1 ずつ増やしながら繰り返す：　表示する(Data[i])",
    "i を 0 から 要素数(Data)−1 まで 1 ずつ増やしながら繰り返す：　表示する(Data[i])",
    "i を 4 から 0 まで 1 ずつ減らしながら繰り返す：　表示する(Data[i])"],
 a:0,
 e:"添字は0〜4なので、1から5までのループではData[0]が表示されず、存在しないData[5]にアクセスしてエラーになる。この「1つずれる」誤りはオフバイワンエラーと呼ばれ、プログラムの誤り探し問題の定番。"},
{id:"p54", f:"programming", t:"選択ソートの考え方", d:3,
 q:"「未整列の部分から最小値を探し、未整列部分の先頭の要素と交換する」操作を繰り返して昇順に整列するアルゴリズム（選択ソート）で、[7, 3, 9, 1] に対して1回目の交換を行った後の配列として正しいものを選べ。",
 c:["[1, 3, 9, 7]","[3, 7, 9, 1]","[1, 7, 9, 3]","[3, 1, 7, 9]"],
 a:0,
 e:"最小値1（添字3）を先頭の7（添字0）と交換すると[1, 3, 9, 7]。1回の操作で最小値が先頭に確定する。隣どうしを交換するバブルソートとの動きの違いを、具体例で確かめられるようにしよう。"},
{id:"p55", f:"programming", t:"サイコロ2個のシミュレーション", d:3,
 q:"サイコロを2個振って出た目の和を多数回シミュレーションすると、最も多く出現すると期待される和はどれか。",
 c:["7","6","12","2"],
 a:0,
 e:"和が7になる組合せは(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)の6通りで最多（確率6/36）。和2や12は1通りしかない。シミュレーション回数を増やすと度数分布はこの理論的な確率に近づいていく。理論値とシミュレーション結果の対応を問う問題は頻出。"},
{id:"p56", f:"programming", t:"試行回数と精度", d:2,
 q:"乱数を使ったシミュレーションの試行回数に関する説明として最も適当なものを選べ。",
 c:["試行回数を増やすほど、結果のばらつきは小さくなり理論値に近づく傾向がある。",
    "試行回数は10回程度が最適で、増やすほど不正確になる。",
    "試行回数を増やしても、結果の傾向は全く変わらない。",
    "乱数を使うシミュレーションでは、1回の試行結果がそのまま理論値になる。"],
 a:0,
 e:"確率的シミュレーションでは1回ごとの結果は偶然に左右されるが、回数を増やすと相対度数が理論的な確率に近づく（大数の法則）。「100回と10000回のシミュレーション結果のグラフの違い」を読み取らせる問題がよく出る。"},
{id:"p57", f:"programming", t:"ビットシフト", d:3,
 q:"2進法で表された整数のビット列を左に1桁シフトし、右端に0を入れた（例：0011 → 0110）。この操作は元の数に対してどんな計算をしたことになるか。",
 c:["2倍","2分の1","1を加える","10倍"],
 a:0,
 e:"0011（3）→ 0110（6）のように、左1シフトは2倍にあたる（10進法で左に1桁ずらすと10倍になるのと同じ理屈）。右1シフトは2で割る（切り捨て）ことに相当する。ビット演算とかけ算・わり算の対応は発展問題で問われる。"},
{id:"p58", f:"programming", t:"アルゴリズムの改良", d:2,
 q:"同じ結果を得るプログラムの効率に関する説明として最も適当なものを選べ。",
 c:["処理の順序やアルゴリズムを工夫することで、同じ結果をより少ない繰り返し回数・短い時間で得られることがある。",
    "同じ結果が得られるなら、どんな書き方でも実行時間は必ず同じである。",
    "プログラムの行数が多いほど、実行速度は必ず速くなる。",
    "効率を考える必要があるのはスーパーコンピュータだけである。"],
 a:0,
 e:"例えば1〜100の合計は100回の加算でも求まるが、(1+100)×100÷2の公式なら一度に求まる。探索でも線形と二分で比較回数が大きく違う。「よりよい手順を考える」ことがアルゴリズムを学ぶ目的の一つ。"},
{id:"p59", f:"programming", t:"変数の値の変化", d:2,
 q:"次のプログラムを実行した後の a と b の値の組合せとして正しいものを選べ。",
 code:"(1) a = 2\n(2) b = 5\n(3) a = a + b\n(4) b = a - b",
 c:["a = 7, b = 2","a = 7, b = 5","a = 2, b = 3","a = 7, b = 7"],
 a:0,
 e:"(3)でa = 2+5 = 7。(4)の時点でaはすでに7なので、b = 7−5 = 2。「代入すると変数の値がその時点で書き換わる」ことを踏まえ、上から1行ずつ最新の値で計算するのがトレースの鉄則。実はこの2行で（作業変数なしに）交換の一部ができている。"},
{id:"p60", f:"programming", t:"プログラムと問題解決", d:1,
 q:"プログラミングで問題を解決する手順として最も適当なものを選べ。",
 c:["問題を整理してアルゴリズムを考え、プログラムとして実装し、テストして誤りを修正しながら完成させる。",
    "何も設計せず、思いつくままにコードを書き続けるのが最も確実である。",
    "一度書いたプログラムはテストや修正をしてはいけない。",
    "プログラムが完成したら、動作確認せずにすぐ公開するのがよい。"],
 a:0,
 e:"「問題の分析→アルゴリズムの設計→実装（コーディング）→テスト・デバッグ→改善」という開発の流れが基本。テストで誤りを見つけて直すことは開発の正常な過程であり、設計とテストの重要性は実際の開発でも変わらない。"},
/* ---- ④ ネットワークとデータ活用 ---- */
{id:"n1", f:"network", t:"TCP/IP", d:2,
 q:"インターネットの通信プロトコルに関する説明として最も適当なものを選べ。",
 c:["TCPは、データをパケットに分割して送り、届いたか確認しながら欠けたパケットを再送させるなど、信頼性のある通信を実現する。",
    "IPは、Webページの文字の色やレイアウトを決めるためのプロトコルである。",
    "プロトコルとは、通信ケーブルの素材のことである。",
    "TCPとIPは同じ機能を持つため、どちらか一方だけが使われる。"],
 a:0,
 e:"プロトコルは通信の約束事。IPはIPアドレスを頼りにパケットを宛先まで届ける役割、TCPは分割されたパケットの到達確認・再送・順序の復元など信頼性を担う役割で、両者は階層的に分担して協調動作する（TCP/IP）。"},
{id:"n2", f:"network", t:"DNSとIPアドレス", d:1,
 q:"WebブラウザにURLを入力してからページが表示されるまでの仕組みに関する説明として最も適当なものを選べ。",
 c:["ドメイン名（例：example.com）を対応するIPアドレスに変換する仕組みをDNSという。",
    "IPアドレスとは、Webページの見出しのことである。",
    "DNSは、パスワードを暗号化するための仕組みである。",
    "ドメイン名とIPアドレスの対応は、各自のパソコンの中だけで管理されている。"],
 a:0,
 e:"人間が覚えやすいドメイン名と、機器を識別する数値であるIPアドレスを対応付けるのがDNS（ドメインネームシステム）。ブラウザはまずDNSサーバに問い合わせてIPアドレスを取得し、そのアドレス宛に通信してページのデータを受け取る。"},
{id:"n3", f:"network", t:"パケット交換", d:2,
 q:"パケット交換方式の利点として最も適当なものを選べ。",
 c:["データを分割せず一度に送るため、通信中は回線を独占でき、常に最速で送れる。",
    "データを小さなパケットに分割して送るため、1つの回線を複数の通信で共有でき、一部が失われても失われた部分だけ再送すればよい。",
    "パケットには宛先の情報が含まれないため、通信の秘密が守られる。",
    "すべてのパケットが必ず同じ経路を通るため、途中の機器が故障すると通信は必ず不可能になる。"],
 a:1,
 e:"パケット交換方式では、データを分割して各パケットに宛先などの制御情報を付けて送る。回線を複数の通信で効率よく共有でき、経路を柔軟に選べるため一部の経路の障害にも強く、失われたパケットだけを再送できる。回線を独占するのは回線交換方式。"},
{id:"n4", f:"network", t:"公開鍵暗号", d:3,
 q:"公開鍵暗号方式で、AさんがBさんに秘密のメッセージを送る場合の手順として正しいものを選べ。",
 c:["AさんがAさんの秘密鍵で暗号化し、BさんはAさんの公開鍵で復号する。",
    "AさんがBさんの公開鍵で暗号化し、BさんはBさんの秘密鍵で復号する。",
    "AさんがBさんの秘密鍵で暗号化し、BさんはBさんの公開鍵で復号する。",
    "AさんとBさんがあらかじめ同じ鍵を共有しておき、その鍵で暗号化・復号する。"],
 a:1,
 e:"公開鍵暗号では「受信者の公開鍵で暗号化し、受信者だけが持つ秘密鍵で復号」する。公開鍵は誰でも入手できるが、対応する秘密鍵がなければ復号できない。同じ鍵を事前共有するのは共通鍵暗号方式で、鍵の受け渡し（鍵配送問題）が課題となる。"},
{id:"n5", f:"network", t:"共通鍵暗号とHTTPS", d:3,
 q:"暗号方式に関する説明として最も適当なものを選べ。",
 c:["共通鍵暗号方式は処理が高速だが、通信相手ごとに鍵を安全に共有する必要がある。",
    "公開鍵暗号方式は共通鍵暗号方式より常に処理が高速である。",
    "HTTPSで通信しているWebサイトなら、そのサイトの運営者は絶対に信頼できる。",
    "暗号化された通信では、パスワードを平文（そのままの文字）で送っても第三者に読まれる心配は全くないので、暗号化は不要である。"],
 a:0,
 e:"共通鍵暗号は高速だが鍵配送問題がある。公開鍵暗号は鍵配送問題を解決するが処理が遅い。実際のHTTPS通信では、公開鍵暗号で共通鍵を安全に共有し、その後は高速な共通鍵暗号でデータをやり取りするハイブリッド方式が使われる。HTTPSは通信の暗号化を保証するが、サイト運営者の善意までは保証しない。"},
{id:"n6", f:"network", t:"データベース（主キー）", d:2,
 q:"関係データベースの「主キー」に関する説明として最も適当なものを選べ。",
 c:["主キーは、表の中の各行（レコード）を一意に識別できる項目であり、値の重複や空欄（NULL）があってはならない。",
    "主キーには同じ値が重複して入っていてもよい。",
    "生徒名簿の表では、同姓同名がありうる「氏名」を主キーにするのが最も適切である。",
    "主キーは1つの表に必ず5個以上設定しなければならない。"],
 a:0,
 e:"主キーは各レコードを一意に識別する項目で、重複や空欄は許されない。氏名は同姓同名の可能性があるため主キーに不適切で、生徒番号のような一意の番号を使う。複数の項目を組み合わせて主キーとすることもできる。"},
{id:"n7", f:"network", t:"散布図と相関", d:2,
 q:"ある高校で「1日の学習時間」と「テストの得点」の散布図を作ったところ、相関係数は 0.8 だった。この結果の解釈として最も適当なものを選べ。",
 c:["学習時間と得点の間には強い正の相関があるといえるが、このデータだけで「学習時間を増やせば必ず得点が上がる」という因果関係までは断定できない。",
    "相関係数が0.8なので、学習時間を増やすことが得点上昇の原因であると証明された。",
    "相関係数が1ではないので、学習時間と得点には何の関係もない。",
    "散布図の点は、右下がりに分布しているはずである。"],
 a:0,
 e:"相関係数0.8は強い正の相関を示し、散布図は右上がりの分布になる。ただし相関関係は因果関係を意味しない。第3の要因（例：学習意欲）が両方に影響している可能性（疑似相関）もあるため、因果の断定には追加の検証が必要。"},
{id:"n8", f:"network", t:"相関係数の読み取り", d:2,
 q:"相関係数に関する説明として最も適当なものを選べ。",
 c:["相関係数は −1 から 1 の範囲の値をとり、−1 に近いほど強い負の相関を表す。",
    "相関係数が0のとき、2つの変数の間には完全な正の相関がある。",
    "相関係数は0から100の範囲の値をとる。",
    "相関係数が −0.9 のときより 0.2 のときの方が、相関は強い。"],
 a:0,
 e:"相関係数rは−1 ≦ r ≦ 1。1に近いほど強い正の相関（右上がり）、−1に近いほど強い負の相関（右下がり）、0付近は直線的な相関がほぼないことを示す。強さは絶対値で比べるため、|−0.9| ＞ |0.2| で−0.9の方が強い相関。"},
{id:"n9", f:"network", t:"箱ひげ図", d:3,
 q:"箱ひげ図から読み取れる値として適当でないものを選べ。",
 c:["中央値（第2四分位数）","四分位範囲","最大値・最小値","平均値と標準偏差"],
 a:3,
 e:"箱ひげ図は最小値・第1四分位数・中央値・第3四分位数・最大値の5数要約を表す図。箱の長さが四分位範囲（第3四分位数−第1四分位数）でデータの散らばりを示す。平均値や標準偏差は箱ひげ図からは直接読み取れない（平均値を印で示す流儀もあるが基本の5数には含まれない）。"},
{id:"n10", f:"network", t:"外れ値・欠損値", d:2,
 q:"データの前処理に関する説明として最も適当なものを選べ。",
 c:["アンケート結果の「年齢」の欄に 999 という値があった。他の値から極端に離れた外れ値の可能性があるため、入力ミスかどうかなど原因を確認して扱いを検討する。",
    "外れ値はデータ分析の邪魔になるので、理由を確認せず必ずすべて削除するのがよい。",
    "欠損値（未回答など）が含まれていても、何も処理せずそのまま平均値を計算して問題ない。",
    "外れ値は平均値に影響を与えないので、気にする必要はない。"],
 a:0,
 e:"外れ値は入力ミスの場合もあれば重要な発見の手がかりの場合もあるため、機械的に削除せず原因を確認して対処する。欠損値も除外・補完などの処理方針を決めてから分析する。平均値は外れ値の影響を受けやすく、中央値は受けにくいという性質も頻出。"},
{id:"n11", f:"network", t:"回帰直線", d:3,
 q:"気温とアイスクリームの売上のデータに回帰直線「売上 = 20 × 気温 + 50」（売上：千円、気温：℃）を当てはめた。この式の解釈として最も適当なものを選べ。",
 c:["気温が1℃上がると、売上はおよそ20千円（2万円）増える傾向があると推定できる。",
    "気温が1℃上がると、売上は必ず正確に50千円増える。",
    "この式を使えば、データの範囲から大きく外れた気温（例：100℃）でも売上を正確に予測できる。",
    "回帰直線の傾きが正なので、気温と売上には負の相関がある。"],
 a:0,
 e:"回帰直線の傾き20は「気温が1℃上がると売上が約20千円増える傾向」を表し、50は切片。回帰による予測はあくまで傾向であり、またデータの範囲を大きく外れた値への当てはめ（外挿）は信頼できない。傾きが正なら正の相関。"},
{id:"n12", f:"network", t:"データ分析の手順", d:2,
 q:"「文化祭の来場者数を増やす」ために、データを活用して問題解決を行う手順として最も適当なものを選べ。",
 c:["問題を明確にし、仮説を立て、必要なデータを収集・整理・分析し、結果を解釈して解決策を立て、実行後に評価・改善する。",
    "まず大量のデータをやみくもに集め、目的は分析が終わってから考える。",
    "仮説に合わないデータはすべて捨てて、仮説に合うデータだけで結論を出す。",
    "1回分析して結論が出たら、その後の評価や改善は行う必要がない。"],
 a:0,
 e:"データを活用した問題解決は「問題の明確化→仮説→データの収集・整理・分析→解釈→解決策の実行→評価・改善」というサイクルで進める。目的なくデータを集めたり、都合の悪いデータを恣意的に除外したりするのは適切な分析とはいえない。"},
{id:"n13", f:"network", t:"LANとWAN", d:1,
 q:"LANとWANに関する説明として最も適当なものを選べ。",
 c:["LANは学校や家庭など限られた範囲のネットワークで、WANはLANどうしを広域に結ぶネットワークである。",
    "LANは世界規模のネットワークで、WANは家庭内のネットワークである。",
    "LANとWANは同じものの別名である。",
    "WANはケーブルを使わないネットワークだけを指す。"],
 a:0,
 e:"LAN（Local Area Network）は建物内など限られた範囲、WAN（Wide Area Network）は地理的に離れたLANどうしを結ぶ広域ネットワーク。インターネットは世界中のネットワークを相互接続した「ネットワークのネットワーク」といえる。"},
{id:"n14", f:"network", t:"無線LANの安全な利用", d:2,
 q:"無線LAN（Wi-Fi）の利用に関する説明として最も適当なものを選べ。",
 c:["暗号化されていない公衆Wi-Fiでは通信内容を傍受されるおそれがあるため、個人情報の入力を避けるなどの注意が必要である。",
    "無線LANは電波を使うので、暗号化しなくても通信内容が他人に見られることはない。",
    "自宅の無線LANルータには、パスワード（暗号化キー）を設定しないほうが便利で安全である。",
    "公衆Wi-Fiではどんな通信をしても安全性に問題はない。"],
 a:0,
 e:"無線LANの電波は周囲に届くため、暗号化（WPA2/WPA3など）が不可欠。暗号化されていない公衆Wi-Fiでは通信の傍受や偽アクセスポイントのリスクがあり、ログインや決済などの操作は避けるか、httpsやVPNを利用する。"},
{id:"n15", f:"network", t:"ルータの役割", d:2,
 q:"ルータの役割として最も適当なものを選べ。",
 c:["異なるネットワークどうしを接続し、パケットの宛先IPアドレスを見て適切な経路へ転送する。",
    "Webページの内容を作成する。",
    "文字を画像に変換する。",
    "コンピュータの電源を管理する。"],
 a:0,
 e:"ルータはネットワークの中継機器で、パケットの宛先を見て次にどこへ送るか（経路）を決める。インターネットでは多数のルータがバケツリレーのようにパケットを転送して目的地まで届けている。"},
{id:"n16", f:"network", t:"IPv4とIPv6", d:2,
 q:"IPアドレスに関する説明として最も適当なものを選べ。",
 c:["IPv4のアドレスは32ビットで約43億個だが、インターネットの普及で不足したため、128ビットのIPv6への移行が進められている。",
    "IPv4のアドレスは無限に存在するので、不足することはない。",
    "IPv6はIPv4よりアドレスの数が少ない。",
    "IPアドレスは各国の郵便局が発行している。"],
 a:0,
 e:"IPv4は32ビット（2³² ≒ 43億個）でアドレスが枯渇。IPv6は128ビットで事実上無尽蔵（2¹²⁸個）のアドレスを持つ。IoT機器の増加もあり移行が進む。ビット数と表現できる個数（2ⁿ）の関係はここでも登場する。"},
{id:"n17", f:"network", t:"グローバルIPとプライベートIP", d:3,
 q:"IPアドレスの種類に関する説明として最も適当なものを選べ。",
 c:["インターネット上で一意に割り当てられるグローバルIPアドレスと、家庭や学校のLAN内部で使われるプライベートIPアドレスがある。",
    "すべての機器は世界で唯一のプライベートIPアドレスを持つ。",
    "グローバルIPアドレスは同じものが世界中で何度でも重複して使われる。",
    "プライベートIPアドレスはインターネット上のサーバに直接割り当てられるアドレスである。"],
 a:0,
 e:"グローバルIPアドレスはインターネット全体で一意。プライベートIPアドレスはLAN内でのみ有効で、別のLANでは同じアドレスが使われていてもよい。LAN内の機器はルータのアドレス変換（NAT）を介してインターネットと通信する。"},
{id:"n18", f:"network", t:"ポート番号", d:3,
 q:"ポート番号の役割として最も適当なものを選べ。",
 c:["同じコンピュータ上で動く複数の通信サービス（Web、メールなど）のうち、どのサービス宛の通信かを識別する。",
    "コンピュータの製造番号を表す。",
    "通信ケーブルの差し込み口の物理的な形状を表す。",
    "Webページの表示順位を決める。"],
 a:0,
 e:"IPアドレスが「建物の住所」なら、ポート番号は「部屋番号」にあたる。HTTPは80番、HTTPSは443番など、サービスごとに番号が決まっており、1台のサーバで複数のサービスを同時に提供できる。"},
{id:"n19", f:"network", t:"プロトコルの階層", d:3,
 q:"TCP/IPの階層構造に関する説明として最も適当なものを選べ。",
 c:["通信の機能を階層に分けて分担することで、ある層の技術（例：無線か有線か）が変わっても他の層に影響しにくい柔軟な設計になっている。",
    "すべての通信機能を1つの層にまとめるほうが、変更に強い設計になる。",
    "階層構造はコンピュータの性能を落とすためだけに存在する。",
    "HTTPはIPより下位の層のプロトコルである。"],
 a:0,
 e:"TCP/IPではアプリケーション層（HTTP・SMTPなど）、トランスポート層（TCP）、インターネット層（IP）、ネットワークインタフェース層に役割を分担。層ごとに独立しているため、Wi-Fiでも有線でも同じHTTPが使える。HTTPは最上位のアプリケーション層。"},
{id:"n20", f:"network", t:"メールのプロトコル", d:2,
 q:"電子メールの送信に使われるプロトコルとして正しいものを選べ。",
 c:["SMTP","HTTP","FTP","DNS"],
 a:0,
 e:"メールの送信・転送はSMTP、受信はPOPやIMAPを使う。HTTPはWebページの転送、FTPはファイル転送、DNSは名前解決。「どの場面でどのプロトコルか」の対応は整理して覚えよう。"},
{id:"n21", f:"network", t:"URLの構造", d:2,
 q:"URL「https://www.example.co.jp/news/index.html」に関する説明として最も適当なものを選べ。",
 c:["先頭のhttpsは通信方式（スキーム）を表し、www.example.co.jpがサーバを指すドメイン名、/news/index.htmlがサーバ内のファイルの場所を表す。",
