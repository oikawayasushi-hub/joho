では保証しない。"},{"id":"n6","f":"network","t":"データベース（主キー）","d":2,"q":"関係データベースの「主キー」に関する説明として最も適当なものを選べ。","c":["主キーは、表の中の各行（レコード）を一意に識別できる項目であり、値の重複や空欄（NULL）があってはならない。","主キーには同じ値が重複して入っていてもよい。","生徒名簿の表では、生徒になじみが深く覚えやすい「氏名」の列を主キーにするのが最も適切である。番号より名前が分かりやすい。","主キーは1つの表に必ず5個以上設定しなければならない。"],"a":0,"e":"主キーは各レコードを一意に識別する項目で、重複や空欄は許されない。氏名は同姓同名の可能性があるため主キーに不適切で、生徒番号のような一意の番号を使う。複数の項目を組み合わせて主キーとすることもできる。"},{"id":"n7","f":"network","t":"散布図と相関","d":2,"q":"ある高校で「1日の学習時間」と「テストの得点」の散布図を作ったところ、相関係数は 0.8 だった。この結果の解釈として最も適当なものを選べ。","c":["学習時間と得点の間には強い正の相関があるといえるが、このデータだけで「学習時間を増やせば必ず得点が上がる」という因果関係までは断定できない。","相関係数が0.8と高い値なので、学習時間を増やすことが得点上昇の直接の原因であると証明されたことになる。相関があれば因果があるといえる。","相関係数が1ではないので、学習時間と得点には何の関係もない。","散布図の点は、右下がりに分布しているはずである。"],"a":0,"e":"相関係数0.8は強い正の相関を示し、散布図は右上がりの分布になる。ただし相関関係は因果関係を意味しない。第3の要因（例：学習意欲）が両方に影響している可能性（疑似相関）もあるため、因果の断定には追加の検証が必要。"},{"id":"n8","f":"network","t":"相関係数の読み取り","d":2,"q":"相関係数に関する説明として最も適当なものを選べ。","c":["相関係数は −1 から 1 の範囲の値をとり、−1 に近いほど強い負の相関を表す。","相関係数が0のとき、2つの変数の間には完全な正の相関がある。","相関係数は0から100の範囲の値をとる。","相関係数が −0.9 のときよりも 0.2 のときの方が、2つの変数の間の相関は強いといえる。"],"a":0,"e":"相関係数rは−1 ≦ r ≦ 1。1に近いほど強い正の相関（右上がり）、−1に近いほど強い負の相関（右下がり）、0付近は直線的な相関がほぼないことを示す。強さは絶対値で比べるため、|−0.9| ＞ |0.2| で−0.9の方が強い相関。"},{"id":"n9","f":"network","t":"箱ひげ図","d":3,"q":"箱ひげ図から読み取れる値として適当でないものを選べ。","c":["中央値（第2四分位数）","四分位範囲","最大値・最小値","平均値と標準偏差"],"a":3,"e":"箱ひげ図は最小値・第1四分位数・中央値・第3四分位数・最大値の5数要約を表す図。箱の長さが四分位範囲（第3四分位数−第1四分位数）でデータの散らばりを示す。平均値や標準偏差は箱ひげ図からは直接読み取れない（平均値を印で示す流儀もあるが基本の5数には含まれない）。"},{"id":"n10","f":"network","t":"外れ値・欠損値","d":2,"q":"データの前処理に関する説明として最も適当なものを選べ。","c":["アンケート結果の「年齢」の欄に 999 という値があった。他の値から極端に離れた外れ値の可能性があるため、入力ミスかどうかなど原因を確認して扱いを検討する。","外れ値はデータ分析の邪魔になるので、理由を確認せず必ずすべて削除するのがよい。","欠損値（未回答など）が含まれていても、集計への影響は小さいので、何も処理せずそのまま平均値を計算して問題ない。平均値は欠損の影響を受けないからである。","外れ値は平均値に影響を与えないので、気にする必要はない。"],"a":0,"e":"外れ値は入力ミスの場合もあれば重要な発見の手がかりの場合もあるため、機械的に削除せず原因を確認して対処する。欠損値も除外・補完などの処理方針を決めてから分析する。平均値は外れ値の影響を受けやすく、中央値は受けにくいという性質も頻出。"},{"id":"n11","f":"network","t":"回帰直線","d":3,"q":"気温とアイスクリームの売上のデータに回帰直線「売上 = 20 × 気温 + 50」（売上：千円、気温：℃）を当てはめた。気温15℃の日と25℃の日それぞれの予測売上を求め、その差は何千円か答えよ。","c":["200千円","100千円","250千円","400千円"],"a":0,"e":"第1段階：25℃のとき売上=20×25+50=550千円、15℃のとき売上=20×15+50=350千円。第2段階：差は550−350=200千円。傾き20×気温差10℃=200千円と一気に求めることもでき、傾きが「1℃あたりの変化量」であることの理解につながる。予測はあくまで傾向で、範囲外への外挿は信頼できない点にも注意。"},{"id":"n12","f":"network","t":"データ分析の手順","d":2,"q":"「文化祭の来場者数を増やす」ために、データを活用して問題解決を行う手順として最も適当なものを選べ。","c":["問題を明確にし、仮説を立て、必要なデータを収集・整理・分析し、結果を解釈して解決策を立て、実行後に評価・改善する。","まず大量のデータをやみくもに集め、目的は分析が終わってから考える。","立てた仮説に合わないデータはすべて外れ値として捨て、仮説に合うデータだけを使って結論を導き出す。そのほうが説得力が増す。","1回分析して結論が出たら、その後の評価や改善は行う必要がない。"],"a":0,"e":"データを活用した問題解決は「問題の明確化→仮説→データの収集・整理・分析→解釈→解決策の実行→評価・改善」というサイクルで進める。目的なくデータを集めたり、都合の悪いデータを恣意的に除外したりするのは適切な分析とはいえない。"},{"id":"n13","f":"network","t":"LANとWAN","d":1,"q":"LANとWANに関する説明として最も適当なものを選べ。","c":["LANは学校や家庭など限られた範囲のネットワークで、WANはLANどうしを広域に結ぶネットワークである。","LANは世界規模の広域ネットワークのことで、WANは家庭内や室内の小規模なネットワークのことである。","LANとWANは同じものの別名である。","WANはケーブルを使わないネットワークだけを指す。"],"a":0,"e":"LAN（Local Area Network）は建物内など限られた範囲、WAN（Wide Area Network）は地理的に離れたLANどうしを結ぶ広域ネットワーク。インターネットは世界中のネットワークを相互接続した「ネットワークのネットワーク」といえる。"},{"id":"n14","f":"network","t":"無線LANの安全な利用","d":2,"q":"無線LAN（Wi-Fi）の利用に関する説明として最も適当なものを選べ。","c":["暗号化されていない公衆Wi-Fiでは通信内容を傍受されるおそれがあるため、個人情報の入力を避けるなどの注意が必要である。","無線LANは電波を使うので、暗号化しなくても通信内容が他人に見られることはない。","自宅の無線LANルータには、接続の手間が省けるので、パスワード（暗号化キー）を設定しないほうが便利で安全である。","公衆Wi-Fiではどんな通信をしても安全性に問題はない。"],"a":0,"e":"無線LANの電波は周囲に届くため、暗号化（WPA2/WPA3など）が不可欠。暗号化されていない公衆Wi-Fiでは通信の傍受や偽アクセスポイントのリスクがあり、ログインや決済などの操作は避けるか、httpsやVPNを利用する。"},{"id":"n15","f":"network","t":"ルータの役割","d":2,"q":"ルータの役割として最も適当なものを選べ。","c":["異なるネットワークどうしを接続し、パケットの宛先IPアドレスを見て適切な経路へ転送する。","HTMLなどを解釈して、Webページの内容を作成・表示する。これがDNSの役割である。","文字を画像に変換する。","コンピュータの電源を管理する。"],"a":0,"e":"ルータはネットワークの中継機器で、パケットの宛先を見て次にどこへ送るか（経路）を決める。インターネットでは多数のルータがバケツリレーのようにパケットを転送して目的地まで届けている。"},{"id":"n16","f":"network","t":"IPv4とIPv6","d":2,"q":"IPアドレスに関する説明として最も適当なものを選べ。","c":["IPv4のアドレスは32ビットで約43億個だが、インターネットの普及で不足したため、128ビットのIPv6への移行が進められている。","IPv4のアドレスは事実上無限に存在するので、機器が増えても不足することは起こらない。約43億個という上限は存在しないからである。","IPv6はIPv4よりアドレスの数が少ない。","IPアドレスは各国の郵便局が発行している。"],"a":0,"e":"IPv4は32ビット（2³² ≒ 43億個）でアドレスが枯渇。IPv6は128ビットで事実上無尽蔵（2¹²⁸個）のアドレスを持つ。IoT機器の増加もあり移行が進む。ビット数と表現できる個数（2ⁿ）の関係はここでも登場する。"},{"id":"n17","f":"network","t":"グローバルIPとプライベートIP","d":3,"q":"IPアドレスの種類に関する説明として最も適当なものを選べ。","c":["インターネット上で一意に割り当てられるグローバルIPアドレスと、家庭や学校のLAN内部で使われるプライベートIPアドレスがある。","すべての機器は世界で唯一のプライベートIPアドレスを持つ。","グローバルIPアドレスは同じものが世界中で何度でも重複して使われる。","プライベートIPアドレスは、インターネット上に公開されるサーバに直接割り当てるための専用アドレスである。外部から直接アクセスさせる用途に使う。"],"a":0,"e":"グローバルIPアドレスはインターネット全体で一意。プライベートIPアドレスはLAN内でのみ有効で、別のLANでは同じアドレスが使われていてもよい。LAN内の機器はルータのアドレス変換（NAT）を介してインターネットと通信する。"},{"id":"n18","f":"network","t":"ポート番号","d":3,"q":"ポート番号の役割として最も適当なものを選べ。","c":["同じコンピュータ上で動く複数の通信サービス（Web、メールなど）のうち、どのサービス宛の通信かを識別する。","コンピュータの製造番号を表す。","通信ケーブルをコンピュータに差し込む接続口の物理的な形状の種類を表す番号である。ソフトウェアとは関係がない。","Webページの表示順位を決める。"],"a":0,"e":"IPアドレスが「建物の住所」なら、ポート番号は「部屋番号」にあたる。HTTPは80番、HTTPSは443番など、サービスごとに番号が決まっており、1台のサーバで複数のサービスを同時に提供できる。"},{"id":"n19","f":"network","t":"プロトコルの階層","d":3,"q":"TCP/IPの階層構造に関する説明として最も適当なものを選べ。","c":["通信の機能を階層に分けて分担することで、ある層の技術（例：無線か有線か）が変わっても他の層に影響しにくい柔軟な設計になっている。","すべての通信機能を役割ごとに分割せず1つの層にまとめてしまうほうが、将来の技術の変更や交換に強い設計になる。分けるほうが不便である。","階層構造はコンピュータの性能を落とすためだけに存在する。","HTTPはIPより下位の層のプロトコルである。"],"a":0,"e":"TCP/IPではアプリケーション層（HTTP・SMTPなど）、トランスポート層（TCP）、インターネット層（IP）、ネットワークインタフェース層に役割を分担。層ごとに独立しているため、Wi-Fiでも有線でも同じHTTPが使える。HTTPは最上位のアプリケーション層。"},{"id":"n20","f":"network","t":"メールのプロトコル","d":2,"q":"電子メールの送信に使われるプロトコルとして正しいものを選べ。","c":["SMTP","HTTP","FTP","DNS"],"a":0,"e":"メールの送信・転送はSMTP、受信はPOPやIMAPを使う。HTTPはWebページの転送、FTPはファイル転送、DNSは名前解決。「どの場面でどのプロトコルか」の対応は整理して覚えよう。"},{"id":"n21","f":"network","t":"URLの構造","d":2,"q":"URL「https://www.example.co.jp/news/index.html」に関する説明として最も適当なものを選べ。","c":["先頭のhttpsは通信方式（スキーム）を表し、www.example.co.jpがサーバを指すドメイン名、/news/index.htmlがサーバ内のファイルの場所を表す。","httpsの部分はファイル名を表している。","www.example.co.jpの部分は、この通信で使われる暗号化方式の種類とその強度を表している。組織種別や国を表すドメイン名ではなく、SSLの規格名を示す部分である。","URLのすべての部分は自由に省略しても必ず同じページが表示される。"],"a":0,"e":"URLは「スキーム://ドメイン名/パス」の構造。co.jpは日本の企業を表す属性型ドメインの例。httpsなら通信がTLSで暗号化される。フィッシング対策としてドメイン名を正しく読み取る力も重要。"},{"id":"n22","f":"network","t":"クライアントサーバ方式","d":2,"q":"クライアントサーバ方式に関する説明として最も適当なものを選べ。","c":["サービスを提供するサーバと、サービスを要求して利用するクライアントに役割を分けてやり取りする方式である。","すべてのコンピュータが対等な立場で直接データを交換する方式である。","サーバとは人間の管理者のことを指す。","クライアントサーバ方式では、1台のサーバは同時に1台のクライアントとしか通信することができない。"],"a":0,"e":"Webの閲覧は、ブラウザ（クライアント）がWebサーバに要求（リクエスト）を送り、サーバが応答（レスポンス）を返す典型的なクライアントサーバ方式。対等な端末どうしが直接やり取りする方式はピアツーピア（P2P）方式という。"},{"id":"n23","f":"network","t":"クラウドサービス","d":2,"q":"クラウドサービスに関する説明として最も適当なものを選べ。","c":["データやソフトウェアを事業者のサーバ上に置き、インターネット経由で利用する形態で、複数端末からのアクセスや共同編集がしやすい。","クラウドとは、自分のパソコンの中だけにデータを保存する方式である。","クラウドに保存したデータは事業者側で管理されるため、障害や規約変更などの影響を一切受けることがない。だからバックアップも不要である。","クラウドサービスの利用にインターネット接続は不要である。"],"a":0,"e":"クラウドはネットワーク越しに計算資源やストレージを利用する形態。どこからでもアクセスできる利便性の一方、障害・情報漏えい・サービス終了などのリスクもあり、重要データのバックアップやパスワード管理が利用の前提となる。"},{"id":"n24","f":"network","t":"通信速度の計算","d":3,"q":"通信速度 100 Mbps の回線で 750 MB のファイルをダウンロードする。理論上の所要時間を求め、さらに実際には転送効率が80%（実効速度が理論値の0.8倍）だとすると、実際の所要時間は約何秒か。（1バイト＝8ビット）","c":["約75秒","約60秒","約48秒","約94秒"],"a":0,"e":"第1段階：750MB = 750×8 = 6000Mビット。6000 ÷ 100 = 60秒（理論値）。第2段階：転送効率80%なので実際の時間は 60 ÷ 0.8 = 75秒。単位換算（×8）に加え、効率を「割る」向きに使う2段階の計算。効率を掛けて48秒とするのは誤り。"},{"id":"n25","f":"network","t":"転送データ量の計算","d":3,"q":"通信速度 24 Mbps の回線について、まず1秒間に送れるデータ量をMB単位で求め、次に 600 MB のデータを送るのに理論上かかる時間を求めよ。（1バイト＝8ビット）","c":["毎秒3MBで、600MBには200秒","毎秒3MBで、600MBには80秒","毎秒24MBで、600MBには25秒","毎秒0.3MBで、600MBには300秒"],"a":0,"e":"第1段階：24Mビット/秒 ÷ 8 = 3MB/秒。第2段階：600MB ÷ 3MB/秒 = 200秒。速度の単位をバイトに直してから、データ量を割って時間を求める2段階。毎秒24MBとするのは÷8の忘れ。"},{"id":"n26","f":"network","t":"bpsの意味","d":1,"q":"通信速度の単位「bps」の意味として正しいものを選べ。","c":["1秒間に転送できるビット数","1秒間に転送できるバイト数","1分間に転送できる文字数","通信ケーブルの長さ"],"a":0,"e":"bpsはbits per second（ビット毎秒）。1Mbpsなら1秒間に100万ビット。バイトではなくビットである点が重要で、データ量の計算では8で割ってバイトに直す必要がある。"},{"id":"n27","f":"network","t":"デジタル署名","d":3,"q":"デジタル署名によって確認できることの組合せとして最も適当なものを選べ。","c":["送信者が本人であること（なりすましでないこと）と、内容が途中で改ざんされていないこと。","通信の速度と、データの圧縮率。","受信者の氏名と住所。","送信したデータが途中で失われることなく、必ず相手に届くことを保証すること。それが暗号化の目的である。"],"a":0,"e":"デジタル署名は、送信者が自分の秘密鍵で署名し、受信者が送信者の公開鍵で検証する仕組み。本人性（署名できるのは秘密鍵を持つ本人だけ）と完全性（改ざんされていないこと）を確認できる。暗号化（機密性）とは目的が異なる点に注意。"},{"id":"n28","f":"network","t":"電子証明書と認証局","d":3,"q":"認証局（CA）の役割として最も適当なものを選べ。","c":["公開鍵がその組織・サイトのものであることを電子証明書によって保証する第三者機関である。","インターネットの通信速度を認定する機関である。","Webサイトのデザインや使いやすさの品質を審査して認定する国際機関である。暗号化とは無関係である。","パスワードを一括して保管・配布する機関である。"],"a":0,"e":"公開鍵暗号では「その公開鍵は本当に本物か」が問題になる。信頼できる第三者である認証局が電子証明書を発行して公開鍵の正当性を保証する。ブラウザの鍵マークはサーバ証明書の検証に成功したことを示している。"},{"id":"n29","f":"network","t":"共通鍵の数","d":3,"q":"10人が互いに秘密の通信をする。まず共通鍵暗号方式で相手ごとに異なる鍵を使う場合の鍵の総数を求め、次に公開鍵暗号方式（各自が公開鍵・秘密鍵のペアを持つ）に切り替えた場合、鍵の総数はいくつ減るか。","c":["25個減る","20個減る","45個減る","変わらない"],"a":0,"e":"第1段階：共通鍵方式で必要な鍵はペアの数だけあるので 10×9÷2 = 45個。第2段階：公開鍵方式では各自が鍵ペア（公開鍵・秘密鍵の2個）を持てばよいので 10×2 = 20個。よって 45−20 = 25個減る。鍵管理の負担が公開鍵方式で大きく減ることを2段階の計算で確かめる。"},{"id":"n30","f":"network","t":"HTTPSの仕組み","d":2,"q":"WebサイトのURLが「https://」で始まりブラウザに鍵マークが表示されているとき、保証されることとして最も適当なものを選べ。","c":["ブラウザとサーバの間の通信が暗号化されており、途中での盗聴や改ざんが困難であること。","そのWebサイトに書かれている記事や情報の内容が、すべて真実であると保証されていること。","そのサイトで買い物をしても絶対に詐欺に遭わないこと。","そのサイトの運営者が優良企業であると国が認定したこと。"],"a":0,"e":"HTTPSは通信経路の暗号化（TLS）を意味し、盗聴・改ざん・なりすましサーバ対策になる。ただし「通信が安全」であって「内容が真実」「運営者が善良」の保証ではない。フィッシングサイトもhttpsを使うことがあるため、鍵マークだけで安心してはいけない。"},{"id":"n31","f":"network","t":"VPN","d":3,"q":"VPN（Virtual Private Network）の説明として最も適当なものを選べ。","c":["公衆のネットワーク上に暗号化された仮想的な専用回線を作り、安全に通信する技術である。","通信速度を必ず2倍にする技術である。","コンピュータウイルスを自動的に駆除する技術である。","通信事業者が物理的な専用ケーブルを契約者の各家庭まで個別に敷設するサービスである。"],"a":0,"e":"VPNはインターネットなどの共用ネットワーク上に、暗号化により仮想的な専用線（トンネル)を構築する技術。テレワークで社内ネットワークに安全に接続する用途や、公衆Wi-Fi利用時の保護などに使われる。"},{"id":"n32","f":"network","t":"データベースの構造","d":1,"q":"関係データベースの構造に関する説明として最も適当なものを選べ。","c":["データを行（レコード）と列（フィールド）からなる表（テーブル）の形で管理する。","すべてのデータを区切りのない1つの長い文章としてまとめて保存する。表形式にはしない。","データを画像として撮影して保存する。","表どうしを関連付けることはできない。"],"a":0,"e":"関係データベース（リレーショナルデータベース）は表形式でデータを管理し、複数の表を共通の項目で関連付け（結合）できる。行がレコード（1件分のデータ）、列がフィールド（項目）という用語の対応も確実に。"},{"id":"n33","f":"network","t":"データベースの操作","d":3,"q":"関係データベースの操作のうち、「条件に合う行だけを取り出す操作」と「特定の列だけを取り出す操作」の名称の組合せとして正しいものを選べ。","c":["行の取り出し＝選択、列の取り出し＝射影","行の取り出し＝射影、列の取り出し＝選択","行の取り出し＝結合、列の取り出し＝選択","行の取り出し＝選択、列の取り出し＝結合"],"a":0,"e":"選択（selection）＝条件に合う行を取り出す、射影（projection）＝必要な列を取り出す、結合（join）＝複数の表を共通項目でつなぐ。3つの基本操作の区別は定番の出題ポイント。"},{"id":"n34","f":"network","t":"排他制御","d":3,"q":"座席予約システムで、同じ座席を2人が同時に予約しようとしたときに二重予約を防ぐ仕組みとして最も適当なものを選べ。","c":["一方の処理中はデータをロックし、他方の処理を待たせる排他制御を行う。","先に予約画面を開いた人を優先することにして、特に何の制御も行わない。","二重予約が起きてから、あとで手作業で修正すればよい。","予約データを2つ作成して両方の客に販売する。"],"a":0,"e":"複数の利用者が同じデータを同時に更新すると矛盾が生じるため、処理中はデータをロックして他の処理を待たせる排他制御が必要。銀行口座やチケット販売など、実際のシステムに不可欠な仕組みとして文脈問題で出題される。"},{"id":"n35","f":"network","t":"CSV形式","d":1,"q":"CSV形式のファイルに関する説明として最も適当なものを選べ。","c":["データをカンマで区切って並べた形式で、表計算ソフトやデータベースなど異なるソフト間でのデータ交換によく使われる。","画像を保存するための形式である。","音声を圧縮して保存するための形式である。","特定の1つの表計算ソフトを購入した人でなければ開くことができない専用形式であり、他のソフトとの互換性はまったくない。"],"a":0,"e":"CSV（Comma-Separated Values）は「値をカンマで区切る」シンプルなテキスト形式。構造が単純でソフトを問わず扱えるため、オープンデータの公開やデータ分析の入力形式として広く使われる。"},{"id":"n36","f":"network","t":"データクレンジング","d":2,"q":"収集したアンケートデータに「東京都」「東京」「tokyo」という表記が混在していた。分析前に行うべき処理として最も適当なものを選べ。","c":["同じ意味の表記を統一する（表記ゆれの解消）などのデータクレンジングを行う。","表記が多様なほうがデータの情報量が多くなるので、統一せずそのまま集計する。","3種類の表記をそれぞれ別の都市として集計する。","データをすべて削除して分析を中止する。"],"a":0,"e":"表記ゆれ・重複・入力ミス・欠損などを整える前処理をデータクレンジングという。前処理をせずに集計すると「東京」が3つの別カテゴリに分かれて誤った結果になる。実際の分析では前処理が作業時間の大半を占めるともいわれる。"},{"id":"n37","f":"network","t":"質的データと量的データ","d":2,"q":"質的データと量的データの分類として正しいものを選べ。","c":["血液型や好きな教科は質的データ、身長やテストの得点は量的データである。","血液型は量的データ、身長は質的データである。","数字で表されたデータはすべて量的データである（例：出席番号）。","質的データは平均値を計算するのに適している。"],"a":0,"e":"質的データはカテゴリを表すデータ（血液型・性別・好きな教科）、量的データは数量を表すデータ（身長・得点・気温）。出席番号や電話番号は数字でも大小や演算に意味がないため質的データ。データの種類によって適切なグラフや統計量が変わる。"},{"id":"n38","f":"network","t":"尺度水準","d":3,"q":"データの尺度に関する説明として最も適当なものを選べ。","c":["温度（℃）は目盛りの間隔に意味がある間隔尺度、身長は0が「無い」を意味し比率にも意味がある比例尺度である。","アンケートの「満足・やや満足・不満」は比例尺度である。","血液型は順序尺度である。","血液型のような名義尺度のデータでは、平均値を計算して代表値とするのが最も適切である。数値化すれば計算できる。"],"a":0,"e":"尺度は4種類：名義尺度（血液型：分類のみ）、順序尺度（満足度：順序に意味）、間隔尺度（摂氏温度：間隔に意味、0は任意）、比例尺度（身長・重さ：0が原点で比率に意味）。尺度によって使える統計処理（平均・比率など）が異なる。"},{"id":"n39","f":"network","t":"ヒストグラム","d":2,"q":"ヒストグラムに関する説明として最も適当なものを選べ。","c":["量的データをいくつかの階級に分け、各階級の度数を柱の面積（高さ）で表した図で、分布の形（山の位置や偏り）を把握できる。","2つの変数の間にある関係を、多数の点の散らばり方のようすによって表した図のことである。時間の変化を追うための図ではない。","データの時間的な変化を線で結んで表した図である。","全体に占める割合を扇形で表した図である。"],"a":0,"e":"ヒストグラムは度数分布表をグラフ化したもので、分布の形（単峰か二峰か、左右の偏り、外れ値）を視覚的に捉えられる。散布図（2変数の関係）、折れ線（推移）、円グラフ（割合）との使い分けを整理しよう。"},{"id":"n40","f":"network","t":"代表値の性質","d":2,"q":"平均値・中央値・最頻値に関する説明として最も適当なものを選べ。","c":["平均値は外れ値の影響を受けやすく、中央値は外れ値の影響を受けにくい。","中央値は外れ値の影響を最も受けやすい代表値である。","平均値・中央値・最頻値は、どんなデータでも必ず同じ値になる。","最頻値は量的データにしか使えない。"],"a":0,"e":"平均値はすべての値を使うため極端な値に引っ張られる。中央値は順位の真ん中なので外れ値に頑健。最頻値は最も多く現れる値で質的データにも使える。分布が偏っているときにどの代表値が適切かを問う問題が頻出。"},{"id":"n41","f":"network","t":"代表値の選択","d":3,"q":"7人の年収（万円）が小さい順に 300, 320, 350, 380, 400, 450, 2000 であった。中央値と平均値をそれぞれ求め、この集団の「典型的な年収」を表すのにより適した代表値を選べ。","c":["中央値の380万円（平均値は高額の1人に引っ張られ600万円になるため）","平均値の600万円（すべての世帯の値を計算に反映している代表値であるため）","最大値の2000万円（最も大きい値のため）","平均値と中央値は一致するので、どちらでもよい"],"a":0,"e":"第1段階：中央値は小さい順で4番目の380万円。平均値は合計4200万円÷7=600万円。第2段階：平均値は2000万円という外れ値に引っ張られ実感より高くなるため、順位の真ん中である中央値380万円のほうが典型的な値を表す。2つの代表値を計算し、外れ値の影響を踏まえて選ぶ2段階の判断。"},{"id":"n42","f":"network","t":"標準偏差","d":2,"q":"標準偏差に関する説明として最も適当なものを選べ。","c":["データが平均値のまわりにどれくらい散らばっているかを表す指標で、値が大きいほど散らばりが大きい。","データの最大値と最小値の差のことである。","データの中で最も多く出現する値のことである。","標準偏差が大きいほど、データ全体は平均値のすぐ近くに集中して分布している。ばらつきは小さくなる。"],"a":0,"e":"標準偏差は散らばり（ばらつき）の指標。平均が同じ2クラスでも、標準偏差が大きいクラスは得点がばらつき、小さいクラスは平均付近に集中している。最大値−最小値は「範囲」、最も多い値は「最頻値」。"},{"id":"n43","f":"network","t":"四分位数","d":2,"q":"四分位数に関する説明として最も適当なものを選べ。","c":["データを小さい順に並べて4等分する位置の値で、第2四分位数は中央値と一致する。","第1四分位数はデータの最小値のことである。","第3四分位数はデータ全体の平均値である。","四分位範囲とは、データの最大値から最小値を引いて求めた値のことである。"],"a":0,"e":"第1四分位数（Q1）は下から25%、第2四分位数（Q2）＝中央値、第3四分位数（Q3）は75%の位置の値。四分位範囲IQR = Q3 − Q1は中央の50%の広がりを表し、外れ値の影響を受けにくい散らばりの指標。箱ひげ図の箱がこの範囲。"},{"id":"n44","f":"network","t":"箱ひげ図の比較","d":3,"q":"A組とB組の小テストの箱ひげ図を比べたところ、中央値は同じだが、A組の箱（四分位範囲）はB組より明らかに長かった。この読み取りとして最も適当なものを選べ。","c":["中央値付近の水準は同程度だが、A組のほうが得点の散らばりが大きい。","A組のほうが全員の得点が高い。","B組のほうが得点の散らばりが大きい。","箱の形が似ているので、A組とB組の得点の分布は完全に同じである。"],"a":0,"e":"箱の長さ＝四分位範囲は中央の50%の散らばりを表す。中央値が同じで箱が長いA組は、得点がより広く散らばっている。複数の箱ひげ図を並べて分布を比較させる問題は、本試験・模試を通じて最頻出の題材の一つ。"},{"id":"n45","f":"network","t":"クロス集計","d":3,"q":"アンケートで「学年（1年・2年）」×「賛否（賛成・反対）」のクロス集計表を作った。1年は賛成60人・反対40人、2年は賛成30人・反対20人だった。この読み取りとして最も適当なものを選べ。","c":["賛成の割合は1年60%、2年60%で、学年による賛否の傾向の違いは見られない。","賛成者の人数そのものは1年のほうが多いので、1年のほうが賛成の割合も高いといえる。","2年は人数が少ないので、集計から除外すべきである。","この表からは割合を計算することはできない。"],"a":0,"e":"1年の賛成割合は60/100 = 60%、2年は30/50 = 60%で同じ。人数（実数）の比較と割合の比較を区別することがクロス集計読み取りの最重要ポイント。母数が違う集団は割合に直して比べる。"},{"id":"n46","f":"network","t":"疑似相関","d":2,"q":"「アイスクリームの売上が多い日は水難事故も多い」という相関が見られた。この解釈として最も適当なものを選べ。","c":["気温という第3の要因が両方に影響している可能性が高く、アイスクリームが事故の原因とはいえない。","アイスクリームを食べる行為が原因となって、水難事故に遭いやすくなることが証明された。","水難事故が増えるとアイスクリームが売れるようになる因果関係がある。","相関があるのだから、アイスクリームの販売を規制すれば事故は減る。"],"a":0,"e":"暑い日はアイスも売れ、泳ぐ人も増えて事故も増える。「気温」という共通の要因（交絡因子）による見かけの相関を疑似相関という。「相関≠因果」の代表例として、ほぼすべての模試・参考書で扱われる最重要概念。"},{"id":"n47","f":"network","t":"時系列データ","d":3,"q":"日ごとの気温データのように時間の順に記録されたデータの変化の傾向を、細かい変動をならして見やすくする方法として最も適当なものを選べ。","c":["移動平均（連続する数日分の平均を順にとる）を計算してグラフにする。","月ごとのデータを値の大きい順に並べ替えてから折れ線グラフにする。","日付をすべて削除して集計する。","円グラフにして割合を見る。"],"a":0,"e":"移動平均は「直近n日間の平均」を毎日計算してつなぐ手法で、日々の細かい変動をならして長期的な傾向を見やすくする。時系列データを大きさ順に並べ替えると時間の情報が失われる点にも注意。"},{"id":"n48","f":"network","t":"誤解を招くグラフ","d":2,"q":"縦軸が90から100の範囲だけを表示した棒グラフで、95と97の差が非常に大きく見えた。この読み取りの注意点として最も適当なものを選べ。","c":["縦軸の一部だけを表示すると差が誇張されて見えるため、軸の目盛りや原点を確認して実際の差を判断する。","グラフで大きく見える差は、実際にも必ず大きな差である。","棒グラフから受ける見た目の印象がすべてであり、縦軸の目盛りの数値まで確認する必要はない。","縦軸を省略したグラフを作ることは法律で禁止されている。"],"a":0,"e":"軸の省略・3D表現・目盛り間隔の操作などで、グラフは実際以上の差があるような印象を与えられる。グラフを読むときは必ず軸の範囲と目盛りを確認する。広告や報道のグラフを批判的に読む力もデータリテラシーの一部。"},{"id":"n49","f":"network","t":"標本調査","d":2,"q":"全校生徒1000人の意識を調べるために100人を選んで調査したい。標本の選び方として最も適当なものを選べ。","c":["全校生徒から無作為（ランダム）に100人を選ぶ。","調査がしやすい自分のクラスの友人100人を選ぶ。","図書室にいた読書好きの生徒100人を選ぶ。","回答したい人だけがSNSで自由に回答する形式にする。"],"a":0,"e":"標本が母集団の縮図になるよう無作為抽出するのが原則。友人・特定の場所・自発的回答者に偏った標本では、結果が母集団の傾向からずれる（標本の偏り・選択バイアス）。調査結果を見るときも「誰にどう聞いたか」の確認が重要。"},{"id":"n50","f":"network","t":"アンケート設計","d":2,"q":"アンケートの質問文として最も適当なものを選べ。","c":["「学校の昼休みの長さについてどう思いますか」と中立的に尋ねる。","「昼休みが短すぎて困っている人が多いですが、あなたも延長に賛成ですよね？」と尋ねる。","「常識のある人なら賛成するはずの昼休み延長に、あなたは賛成ですか」と尋ねる。","1つの質問文の中で「昼休みの長さと部活動と宿題の量」についてまとめて尋ねる。"],"a":0,"e":"回答を特定の方向に誘導する質問（誘導質問）や、複数の論点を1問に詰め込む質問（ダブルバーレル質問）は正確なデータを得られない。中立的で1問1論点の質問文が原則。データの質は収集段階で決まる。"},{"id":"n51","f":"network","t":"全数調査と標本調査","d":2,"q":"全数調査と標本調査に関する説明として最も適当なものを選べ。","c":["国勢調査のように全員を調べるのが全数調査、視聴率調査のように一部を調べて全体を推定するのが標本調査である。","視聴率は全世帯のテレビをすべて調べた全数調査である。","標本調査の結果は、標本の選び方や人数によらず、常に母集団の値と完全に一致する。誤差は生じないからである。","全数調査は標本調査より常に手軽で低コストである。"],"a":0,"e":"全数調査は正確だが費用・時間が膨大（国勢調査は5年に1度）。標本調査は一部から全体を推定する方法で、無作為抽出が前提。標本調査には誤差が伴うが、適切に設計すれば実用上十分な精度が得られる。"},{"id":"n52","f":"network","t":"オープンデータ","d":1,"q":"オープンデータに関する説明として最も適当なものを選べ。","c":["国や自治体などが公開する、誰でも利用・再配布できるデータのことで、アプリ開発や地域課題の分析などに活用されている。","特定の企業に所属する社員だけが閲覧を許可されている社外秘のデータのことである。誰でも使えるものではない。","有料で購入しなければ利用できないデータのことである。","個人のスマートフォンの中にある写真データのことである。"],"a":0,"e":"オープンデータは機械判読しやすい形式（CSVなど）で公開され、二次利用が認められたデータ。人口統計・気象・防災・交通などのデータが公開されており、探究活動のデータソースとしても有用。"},{"id":"n53","f":"network","t":"テキストマイニング","d":2,"q":"アンケートの自由記述回答を分析する「テキストマイニング」の説明として最も適当なものを選べ。","c":["文章を単語に分割して出現頻度や単語どうしの関係を分析し、大量のテキストから傾向や特徴を見つけ出す手法。","紙の文章をすべて人の手作業でデジタルデータに書き写す作業のことである。機械による読み取りは含まれない。","文章を暗号化して読めなくする技術のこと。","画像から鉱物を発見する技術のこと。"],"a":0,"e":"テキストマイニングでは、頻出語の集計やワードクラウドによる可視化、共起（一緒に使われる語）の分析などを行う。数値化しにくい自由記述から傾向を引き出せる。探究活動やレビュー分析の文脈で出題される。"},{"id":"n54","f":"network","t":"散布図の読み取り","d":2,"q":"散布図で、点が全体として右下がりに直線的に分布しているとき、相関係数の値として最も適当なものを選べ。","c":["−0.8","0.8","0","1.2"],"a":0,"e":"右下がり＝負の相関なので相関係数は負。直線的にはっきり分布していれば絶対値は大きく、−0.8程度が妥当。相関係数は−1から1の範囲しかとらないため1.2はあり得ない。散布図の形と相関係数の対応は毎年のように問われる。"},{"id":"n55","f":"network","t":"回帰直線による予測","d":2,"q":"回帰直線「y = 2x + 10」が得られた。x = 15 のときの y の予測値として正しいものを選べ。","c":["40","32","25","300"],"a":0,"e":"y = 2 × 15 + 10 = 40。回帰直線は散布図の傾向を直線で近似したもので、xからyを予測できる。ただし予測はデータの範囲内での傾向に基づくものであり、範囲外への外挿や因果関係の断定には注意が必要。"},{"id":"n56","f":"network","t":"欠損値の扱い","d":3,"q":"アンケートデータの一部の項目が未回答（欠損値）だった場合の扱いとして最も適当なものを選べ。","c":["欠損のある行を除外する、他の値から補完するなどの方針を決め、どう処理したかを分析結果とともに明記する。","欠損値には気づかなかったことにして、そのまま計算する。","欠損値はすべて0として集計すれば、必ず正しい結果になる。","回答に欠損が1件でも含まれていれば、調査全体が無効になるため、集めた全データを必ず破棄しなければならない。"],"a":0,"e":"欠損値を0として扱うと平均などが大きく歪む。除外か補完かは目的とデータの性質から判断し、処理方法を明記して分析の再現性・透明性を保つ。欠損の扱いを問う問題は共通テスト系のデータ分析問題で頻出。"},{"id":"n57","f":"network","t":"中央値の計算","d":2,"q":"データ [2, 3, 5, 7, 100] の中央値として正しいものを選べ。","c":["5","23.4","7","3"],"a":0,"e":"小さい順に並べた真ん中（5個中3番目）は5。ちなみに平均値は117÷5 = 23.4で、外れ値100に大きく引っ張られている。中央値と平均値の違いを実感できる典型例。データの個数が偶数のときは中央2つの平均をとる。"},{"id":"n58","f":"network","t":"IPアドレスの表記","d":2,"q":"IPv4アドレスの表記として正しいものを選べ。","c":["192.168.1.1","192.168.1.256","300.168.1.1","192.168.1"],"a":0,"e":"IPv4は32ビットを8ビットずつ4つに区切り、それぞれを0〜255の10進数で表しピリオドでつなぐ。8ビットの最大値は255なので、256や300を含む表記はあり得ない。4組そろっていない表記も誤り。"},{"id":"n59","f":"network","t":"情報システム","d":1,"q":"コンビニエンスストアのPOSシステムに関する説明として最も適当なものを選べ。","c":["商品が売れた時点で「何が・いつ・いくつ売れたか」を記録し、そのデータを在庫管理や品ぞろえの改善に活用する仕組みである。","商品の値段を自動的に毎日2倍にするシステムである。","レジの現金の合計金額を数えるためだけのシステムであり、商品や売上のデータは一切記録されない。分析には使えない仕組みである。","POSシステムのデータは収集されるだけで、経営には活用されない。"],"a":0,"e":"POS（販売時点情報管理）システムは、販売データを収集・分析して発注・在庫管理・商品開発に生かす情報システムの代表例。天気や時間帯と売上の関係分析など、データ活用の文脈でよく出題される。"},{"id":"n60","f":"network","t":"分析結果の伝え方","d":2,"q":"探究活動でデータ分析の結果を発表するときの姿勢として最も適当なものを選べ。","c":["データの出典・収集方法・分析手順を示し、分かったことと言えないこと（限界）を区別して報告する。","自分の仮説に有利なデータだけを選んで見せる。","出典や調査方法は示さず、結論だけを断定的に述べる。","グラフの縦軸の目盛りを操作して、実際よりも差が大きく見えるように加工して見せる。それが適切な強調である。"],"a":0,"e":"信頼される分析報告の条件は、再現可能性（出典・方法の明示）と誠実さ（限界の明示、チェリーピッキングをしない）。「このデータから言えるのはここまで」という限界の認識は、共通テストの会話文形式の問題でもよく問われる観点。"},{"id":"g1","f":"graph","t":"棒グラフの読み取り","d":1,"q":"次の棒グラフは、文化祭の模擬店A〜Dの1日の来客数を表している。来客数が最も多い店舗として正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1e2a3a\">模擬店別 来客数（人）</text>\n<line x1=\"50\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<rect x=\"70\" y=\"70\" width=\"50\" height=\"120\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"95\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">120</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"95\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">A店</text>\n<rect x=\"150\" y=\"95\" width=\"50\" height=\"95\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"175\" y=\"87\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">95</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"175\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">B店</text>\n<rect x=\"230\" y=\"40\" width=\"50\" height=\"150\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"255\" y=\"32\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">150</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"255\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">C店</text>\n<rect x=\"310\" y=\"110\" width=\"50\" height=\"80\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"335\" y=\"102\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">80</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"335\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">D店</text>\n</svg>","c":["A店","B店","C店","D店"],"a":2,"e":"グラフに示された値を比較すると、C店が150人で最も多い。棒グラフは項目ごとの大小を比較するのに適したグラフである。"},{"id":"g2","f":"graph","t":"複数系列の棒グラフ比較","d":2,"q":"次のグラフは、2023年と2025年における生徒の「放課後の過ごし方」（1日あたりの平均時間・分）を項目別に比較したものである。2023年から2025年にかけて最も増加した項目として正しいものを選べ。","chart":"<svg viewBox=\"0 0 420 240\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">放課後の過ごし方（平均分/日）の変化</text>\n<rect x=\"300\" y=\"26\" width=\"12\" height=\"12\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"316\" y=\"36\" font-size=\"11\" fill=\"#1e2a3a\">2023年</text>\n<rect x=\"300\" y=\"42\" width=\"12\" height=\"12\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"316\" y=\"52\" font-size=\"11\" fill=\"#1e2a3a\">2025年</text>\n<line x1=\"50\" y1=\"200\" x2=\"410\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<rect x=\"68\" y=\"128\" width=\"18\" height=\"72\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"77\" y=\"122\" text-anchor=\"middle\" font-size=\"11\">40</text>\n<rect x=\"92\" y=\"155\" width=\"18\" height=\"45\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"101\" y=\"149\" text-anchor=\"middle\" font-size=\"11\">25</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"90\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">読書</text>\n<rect x=\"168\" y=\"110\" width=\"18\" height=\"90\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"177\" y=\"104\" text-anchor=\"middle\" font-size=\"11\">50</text>\n<rect x=\"192\" y=\"74\" width=\"18\" height=\"126\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"201\" y=\"68\" text-anchor=\"middle\" font-size=\"11\">70</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">ゲーム</text>\n<rect x=\"268\" y=\"92\" width=\"18\" height=\"108\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"277\" y=\"86\" text-anchor=\"middle\" font-size=\"11\">60</text>\n<rect x=\"292\" y=\"38\" width=\"18\" height=\"162\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"301\" y=\"32\" text-anchor=\"middle\" font-size=\"11\">90</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"290\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">SNS</text>\n<rect x=\"368\" y=\"119\" width=\"18\" height=\"81\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"377\" y=\"113\" text-anchor=\"middle\" font-size=\"11\">45</text>\n<rect x=\"392\" y=\"128\" width=\"18\" height=\"72\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"401\" y=\"122\" text-anchor=\"middle\" font-size=\"11\">40</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"390\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">勉強</text>\n</svg>","c":["SNS","ゲーム","読書","勉強"],"a":0,"e":"増加量を計算すると、SNSは60→90で+30、ゲームは50→70で+20、読書は40→25で−15（減少）、勉強は45→40で−5（減少）。最も増加したのはSNSの+30分。"},{"id":"g3","f":"graph","t":"折れ線グラフの読み取り","d":2,"q":"次の折れ線グラフは、1月から6月までのある地点の平均気温の推移を表している。前月からの上昇幅が最も大きい月として正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1e2a3a\">月別 平均気温（℃）の推移</text>\n<line x1=\"50\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<polyline points=\"60,165 110,155 160,130 210,100 260,75 310,55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/>\n<circle cx=\"60\" cy=\"165\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"60\" y=\"155\" text-anchor=\"middle\" font-size=\"11\">5</text>\n<circle cx=\"110\" cy=\"155\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"110\" y=\"145\" text-anchor=\"middle\" font-size=\"11\">7</text>\n<circle cx=\"160\" cy=\"130\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"160\" y=\"120\" text-anchor=\"middle\" font-size=\"11\">12</text>\n<circle cx=\"210\" cy=\"100\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"90\" text-anchor=\"middle\" font-size=\"11\">18</text>\n<circle cx=\"260\" cy=\"75\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"260\" y=\"65\" text-anchor=\"middle\" font-size=\"11\">23</text>\n<circle cx=\"310\" cy=\"55\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"310\" y=\"45\" text-anchor=\"middle\" font-size=\"11\">27</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"60\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">1月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"110\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">2月</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"160\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">3月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">4月</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"260\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">5月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"310\" y=\"205\" text-anchor=\"middle\" font-size=\"11\">6月</text>\n</svg>","c":["4月","2月","3月","5月"],"a":0,"e":"各月の前月からの上昇幅を計算すると、2月+2、3月+5、4月+6、5月+5、6月+4。最も大きいのは4月の+6℃。折れ線グラフでは線の傾き（急な部分）が変化の大きさを表す。"},{"id":"g4","f":"graph","t":"複数系列の折れ線グラフ","d":3,"q":"次のグラフは、5試合にわたるAチームとBチームの得点の推移を表している。Aチームの得点がBチームを初めて上回るのは何試合目か、正しいものを選べ。","chart":"<svg viewBox=\"0 0 420 240\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">A・Bチームの得点推移</text>\n<rect x=\"300\" y=\"24\" width=\"12\" height=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"316\" y=\"30\" font-size=\"11\">Aチーム</text>\n<rect x=\"300\" y=\"40\" width=\"12\" height=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"316\" y=\"46\" font-size=\"11\">Bチーム</text>\n<line x1=\"50\" y1=\"200\" x2=\"400\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<polyline points=\"70,150 135,130 200,110 265,100 330,75\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/>\n<polyline points=\"70,90 135,100 200,115 265,125 330,130\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\"/>\n<circle cx=\"70\" cy=\"150\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"70\" y=\"163\" text-anchor=\"middle\" font-size=\"10\">10</text>\n<circle cx=\"135\" cy=\"130\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"135\" y=\"143\" text-anchor=\"middle\" font-size=\"10\">14</text>\n<circle cx=\"200\" cy=\"110\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"123\" text-anchor=\"middle\" font-size=\"10\">18</text>\n<circle cx=\"265\" cy=\"100\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"265\" y=\"113\" text-anchor=\"middle\" font-size=\"10\">20</text>\n<circle cx=\"330\" cy=\"75\" r=\"4\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"330\" y=\"65\" text-anchor=\"middle\" font-size=\"10\">25</text>\n<circle cx=\"70\" cy=\"90\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"70\" y=\"80\" text-anchor=\"middle\" font-size=\"10\">22</text>\n<circle cx=\"135\" cy=\"100\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"135\" y=\"90\" text-anchor=\"middle\" font-size=\"10\">20</text>\n<circle cx=\"200\" cy=\"115\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"105\" text-anchor=\"middle\" font-size=\"10\">17</text>\n<circle cx=\"265\" cy=\"125\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"265\" y=\"140\" text-anchor=\"middle\" font-size=\"10\">15</text>\n<circle cx=\"330\" cy=\"130\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"330\" y=\"145\" text-anchor=\"middle\" font-size=\"10\">14</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"70\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">1試合目</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"135\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">2試合目</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">3試合目</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"265\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">4試合目</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"330\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">5試合目</text>\n</svg>","c":["3試合目","1試合目","2試合目","4試合目"],"a":0,"e":"各試合の得点を比較すると、1試合目はA10<B22、2試合目はA14<B20、3試合目はA18>B17で初めて逆転する。折れ線グラフの交点（クロスする点）を探すことで読み取れる。"},{"id":"g5","f":"graph","t":"散布図と相関","d":2,"q":"次の散布図は、8人の生徒の「1日あたりの学習時間」と「小テストの得点」の関係を表している。この散布図から読み取れる関係として最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">学習時間と小テストの得点</text>\n<line x1=\"50\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--sub)\">学習時間（時間）</text>\n<circle cx=\"82\" cy=\"130\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"114\" cy=\"123\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"146\" cy=\"108\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"178\" cy=\"100\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"210\" cy=\"85\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"242\" cy=\"78\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"274\" cy=\"63\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"306\" cy=\"55\" r=\"4.5\" fill=\"#2563eb\"/>\n</svg>","c":["学習時間が長い生徒ほど得点が高い傾向があり、正の相関が見られる。","学習時間と得点には全く関係が見られない。","学習時間が長い生徒ほど得点が低い傾向があり、負の相関が見られる。","この散布図からは相関の有無を判断できない。"],"a":0,"e":"点が右上がりに分布しており、学習時間が長いほど得点が高い傾向、すなわち正の相関が見られる。散布図で点が右上がりなら正の相関、右下がりなら負の相関、ばらばらなら相関なしと判断する。"},{"id":"g6","f":"graph","t":"外れ値を含む散布図","d":3,"q":"次の散布図は、8人の生徒の「1日あたりの学習時間」と「小テストの得点」の関係を表している。1人だけ他の生徒と異なる傾向を示す点（赤い点、外れ値）が見られる。この外れ値を除いて相関係数を計算し直すと、除く前と比べてどうなると考えられるか、最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">学習時間と小テストの得点（外れ値あり）</text>\n<line x1=\"50\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--sub)\">学習時間（時間）</text>\n<circle cx=\"82\" cy=\"70\" r=\"5.5\" fill=\"#dc2626\"/>\n<circle cx=\"114\" cy=\"160\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"146\" cy=\"153\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"178\" cy=\"138\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"210\" cy=\"130\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"242\" cy=\"115\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"274\" cy=\"108\" r=\"4.5\" fill=\"#2563eb\"/>\n<circle cx=\"306\" cy=\"93\" r=\"4.5\" fill=\"#2563eb\"/>\n</svg>","c":["正の相関がより強くなり、相関係数の値（絶対値）は大きくなると考えられる。","相関係数の符号が正から負に変わると考えられる。","相関係数は外れ値が含まれているかどうかにかかわらず、必ず同じ値のまま変化しない。","負の相関がより強くなると考えられる。"],"a":0,"e":"学習時間が短いのに得点が高い外れ値（左上の赤い点）は、全体の右上がりの傾向を弱める方向に働いている。この点を除くと残りの点はよりきれいな右上がりの分布になるため、正の相関はより強く（相関係数の絶対値は大きく）なると考えられる。外れ値は分析結果に大きな影響を与えるため、機械的に除外せず原因を確認する姿勢も重要。"},{"id":"g7","f":"graph","t":"箱ひげ図の比較","d":2,"q":"次の箱ひげ図は、A組とB組の小テストの得点分布を表している。四分位範囲（IQR）が大きいのはどちらの組か、正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">A組・B組の得点分布（箱ひげ図）</text>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"180\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"79\" y=\"60\" text-anchor=\"middle\" font-size=\"10\">10</text>\n<line x1=\"79\" y1=\"80\" x2=\"79\" y2=\"80\" />\n<line x1=\"79\" y1=\"68\" x2=\"79\" y2=\"92\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"79\" y1=\"80\" x2=\"137\" y2=\"80\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<rect x=\"137\" y=\"68\" width=\"87\" height=\"24\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/>\n<line x1=\"181\" y1=\"68\" x2=\"181\" y2=\"92\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n<line x1=\"224\" y1=\"80\" x2=\"311\" y2=\"80\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"311\" y1=\"68\" x2=\"311\" y2=\"92\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"180\" y=\"55\" text-anchor=\"middle\" font-size=\"11\">A組</text>\n<line x1=\"108\" y1=\"140\" x2=\"108\" y2=\"140\" />\n<line x1=\"108\" y1=\"128\" x2=\"108\" y2=\"152\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"108\" y1=\"140\" x2=\"189\" y2=\"140\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<rect x=\"189\" y=\"128\" width=\"12\" height=\"24\" fill=\"#fed7aa\" stroke=\"#f97316\" stroke-width=\"1.5\"/>\n<line x1=\"195\" y1=\"128\" x2=\"195\" y2=\"152\" stroke=\"#f97316\" stroke-width=\"2\"/>\n<line x1=\"201\" y1=\"140\" x2=\"282\" y2=\"140\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"282\" y1=\"128\" x2=\"282\" y2=\"152\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"115\" text-anchor=\"middle\" font-size=\"11\">B組</text>\n<line x1=\"50\" y1=\"180\" x2=\"340\" y2=\"180\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"50\" y=\"195\" text-anchor=\"middle\" font-size=\"10\">0</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"340\" y=\"195\" text-anchor=\"middle\" font-size=\"10\">100点</text>\n</svg>","c":["A組","B組","どちらも同じ","この図からは判断できない"],"a":0,"e":"四分位範囲はQ3−Q1で求める。A組は60−30=30、B組は52−48=4。A組の方が箱の長さ（四分位範囲）が大きく、得点のばらつきが大きいことが分かる。"},{"id":"g8","f":"graph","t":"箱ひげ図の読み取り","d":2,"q":"次の箱ひげ図（最小値15、第1四分位数35、中央値50、第3四分位数70、最大値95）から求められる四分位範囲（IQR）として正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 160\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">得点の分布（箱ひげ図）</text>\n<line x1=\"94\" y1=\"90\" x2=\"94\" y2=\"90\"/>\n<line x1=\"94\" y1=\"78\" x2=\"94\" y2=\"102\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"94\" y=\"70\" text-anchor=\"middle\" font-size=\"10\">最小15</text>\n<line x1=\"94\" y1=\"90\" x2=\"152\" y2=\"90\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<rect x=\"152\" y=\"78\" width=\"101\" height=\"24\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"152\" y=\"70\" text-anchor=\"middle\" font-size=\"10\">Q1 35</text>\n<line x1=\"195\" y1=\"78\" x2=\"195\" y2=\"102\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"120\" text-anchor=\"middle\" font-size=\"10\">中央値50</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"253\" y=\"70\" text-anchor=\"middle\" font-size=\"10\">Q3 70</text>\n<line x1=\"253\" y1=\"90\" x2=\"326\" y2=\"90\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"326\" y1=\"78\" x2=\"326\" y2=\"102\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"326\" y=\"70\" text-anchor=\"middle\" font-size=\"10\">最大95</text>\n</svg>","c":["35","55","80","15"],"a":0,"e":"四分位範囲は第3四分位数から第1四分位数を引いた値。70−35=35。最大値から最小値を引いた「範囲」（95−15=80）と混同しないよう注意。"},{"id":"g9","f":"graph","t":"ヒストグラムの読み取り","d":2,"q":"次のヒストグラムは、あるクラスの小テストの得点分布を表している（階級：0〜59点、60〜69点、70〜79点、80〜89点、90〜100点）。度数が最も多い階級として正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">得点分布（ヒストグラム）</text>\n<line x1=\"40\" y1=\"190\" x2=\"360\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<rect x=\"45\" y=\"166\" width=\"50\" height=\"24\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"70\" y=\"160\" text-anchor=\"middle\" font-size=\"12\">3</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"70\" y=\"205\" text-anchor=\"middle\" font-size=\"10\">0〜59</text>\n<rect x=\"115\" y=\"126\" width=\"50\" height=\"64\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"140\" y=\"120\" text-anchor=\"middle\" font-size=\"12\">8</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"140\" y=\"205\" text-anchor=\"middle\" font-size=\"10\">60〜69</text>\n<rect x=\"185\" y=\"70\" width=\"50\" height=\"120\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"64\" text-anchor=\"middle\" font-size=\"12\">15</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"205\" text-anchor=\"middle\" font-size=\"10\">70〜79</text>\n<rect x=\"255\" y=\"110\" width=\"50\" height=\"80\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"280\" y=\"104\" text-anchor=\"middle\" font-size=\"12\">10</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"280\" y=\"205\" text-anchor=\"middle\" font-size=\"10\">80〜89</text>\n<rect x=\"325\" y=\"158\" width=\"30\" height=\"32\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"340\" y=\"152\" text-anchor=\"middle\" font-size=\"12\">4</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"340\" y=\"205\" text-anchor=\"middle\" font-size=\"10\">90〜100</text>\n</svg>","c":["70〜79点","60〜69点","80〜89点","0〜59点"],"a":0,"e":"各階級の度数を比較すると、70〜79点が15人で最多。度数が最も多い階級を最頻値の階級と呼ぶこともある。ヒストグラムでは山の一番高い柱の階級を確認する。"},{"id":"g10","f":"graph","t":"円グラフの読み取り","d":1,"q":"次の円グラフは、ある高校生100人への「好きな学習方法」についてのアンケート結果を表している。「動画視聴」と「参考書」を合わせた割合として正しいものを選べ。","chart":"<svg viewBox=\"0 0 380 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">好きな学習方法（アンケート結果）</text>\n<path d=\"M150,130 L150,50 A80,80 0 0 1 175,206 Z\" fill=\"#2563eb\"/>\n<path d=\"M150,130 L175,206 A80,80 0 0 1 70,130 Z\" fill=\"#f97316\"/>\n<path d=\"M150,130 L70,130 A80,80 0 0 1 103,65 Z\" fill=\"#059669\"/>\n<path d=\"M150,130 L103,65 A80,80 0 0 1 150,50 Z\" fill=\"#9333ea\"/>\n<rect x=\"270\" y=\"80\" width=\"14\" height=\"14\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"290\" y=\"92\" font-size=\"12\">動画視聴 45%</text>\n<rect x=\"270\" y=\"102\" width=\"14\" height=\"14\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"290\" y=\"114\" font-size=\"12\">参考書 30%</text>\n<rect x=\"270\" y=\"124\" width=\"14\" height=\"14\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"290\" y=\"136\" font-size=\"12\">友人と学習 15%</text>\n<rect x=\"270\" y=\"146\" width=\"14\" height=\"14\" fill=\"#9333ea\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"290\" y=\"158\" font-size=\"12\">その他 10%</text>\n</svg>","c":["75%","60%","45%","90%"],"a":0,"e":"45%+30%=75%。円グラフは全体に占める各項目の割合を視覚的に表すのに適しており、複数項目の割合を合算して読むことも求められる。"},{"id":"g11","f":"graph","t":"クロス集計表の読み取り","d":2,"q":"次の表は、ある高校の生徒80人を対象に、性別と運動部への所属状況を調べたクロス集計表である。男子の中で運動部に所属している生徒の割合として正しいものを選べ。","chart":"<table>\n<tr><th></th><th>運動部所属</th><th>未所属</th><th>計</th></tr>\n<tr><th>男子</th><td>24</td><td>16</td><td>40</td></tr>\n<tr><th>女子</th><td>18</td><td>22</td><td>40</td></tr>\n<tr><th>計</th><td>42</td><td>38</td><td>80</td></tr>\n</table>","c":["60%","30%","24%","48%"],"a":0,"e":"男子の合計は40人、そのうち運動部所属は24人なので、24÷40=0.6で60%。母数を「全体80人」ではなく「男子40人」に正しく取ることがポイント（80分の24＝30%は誤り）。"},{"id":"g12","f":"graph","t":"複合グラフの読み取り","d":3,"q":"次のグラフは、ある地域の4月から8月までの月別降水量（棒グラフ）と平均気温（折れ線グラフ）を表している。降水量が最も多い月と、気温が最も高い月の組合せとして正しいものを選べ。","chart":"<svg viewBox=\"0 0 420 240\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">月別 降水量（棒）と平均気温（折れ線）</text>\n<rect x=\"140\" y=\"26\" width=\"12\" height=\"12\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"156\" y=\"36\" font-size=\"11\">降水量(mm)</text>\n<rect x=\"260\" y=\"28\" width=\"14\" height=\"3\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"278\" y=\"36\" font-size=\"11\">気温(℃)</text>\n<line x1=\"50\" y1=\"200\" x2=\"410\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<rect x=\"60\" y=\"136\" width=\"40\" height=\"64\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"80\" y=\"130\" text-anchor=\"middle\" font-size=\"11\">60</text>\n<rect x=\"135\" y=\"114\" width=\"40\" height=\"86\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"155\" y=\"108\" text-anchor=\"middle\" font-size=\"11\">80</text>\n<rect x=\"210\" y=\"40\" width=\"40\" height=\"160\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"230\" y=\"34\" text-anchor=\"middle\" font-size=\"11\">150</text>\n<rect x=\"285\" y=\"72\" width=\"40\" height=\"128\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"305\" y=\"66\" text-anchor=\"middle\" font-size=\"11\">120</text>\n<rect x=\"360\" y=\"146\" width=\"40\" height=\"54\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"380\" y=\"140\" text-anchor=\"middle\" font-size=\"11\">50</text>\n<polyline points=\"80,170 155,143 230,122 305,88 380,60\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\"/>\n<circle cx=\"80\" cy=\"170\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"80\" y=\"184\" text-anchor=\"middle\" font-size=\"10\">15℃</text>\n<circle cx=\"155\" cy=\"143\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"155\" y=\"185\" text-anchor=\"middle\" font-size=\"10\">19℃</text>\n<circle cx=\"230\" cy=\"122\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"230\" y=\"185\" text-anchor=\"middle\" font-size=\"10\">22℃</text>\n<circle cx=\"305\" cy=\"88\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"305\" y=\"82\" text-anchor=\"middle\" font-size=\"10\">27℃</text>\n<circle cx=\"380\" cy=\"60\" r=\"4\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"380\" y=\"54\" text-anchor=\"middle\" font-size=\"10\">31℃</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"80\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">4月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"155\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">5月</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"230\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">6月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"305\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">7月</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"380\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">8月</text>\n</svg>","c":["降水量：6月、気温：8月","降水量：6月、気温：7月","降水量：7月、気温：8月","降水量：8月、気温：6月"],"a":0,"e":"棒グラフから降水量が最も多いのは6月（150mm）、折れ線グラフから気温が最も高いのは8月（31℃）と読み取れる。2種類のグラフが重ねて描かれている場合は、それぞれの系列を独立して読み取ることが必要。"},{"id":"g13","f":"graph","t":"帯グラフの比較","d":2,"q":"次の帯グラフは、2020年と2025年における、ある高校生の「主に使う情報端末」の割合を比較したものである。この5年間の変化の説明として最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 420 190\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"210\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">主に使う情報端末の割合</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"20\" y=\"62\" font-size=\"12\" fill=\"#1e2a3a\">2020</text>\n<rect x=\"60\" y=\"45\" width=\"126\" height=\"30\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"123\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">スマホ35%</text>\n<rect x=\"186\" y=\"45\" width=\"144\" height=\"30\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"258\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">PC 40%</text>\n<rect x=\"330\" y=\"45\" width=\"90\" height=\"30\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"375\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">その他25%</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"20\" y=\"127\" font-size=\"12\" fill=\"#1e2a3a\">2025</text>\n<rect x=\"60\" y=\"110\" width=\"234\" height=\"30\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"177\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">スマホ65%</text>\n<rect x=\"294\" y=\"110\" width=\"72\" height=\"30\" fill=\"#f97316\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"330\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">PC 20%</text>\n<rect x=\"366\" y=\"110\" width=\"54\" height=\"30\" fill=\"#059669\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"393\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\">15%</text>\n</svg>","c":["スマートフォンの割合が35%から65%へと大きく増加し、主に使う端末の中心がPCからスマートフォンへ移った。","PCの利用割合が年々増加し、逆にスマートフォンの利用割合は減少し続けている。従来の傾向が逆転している。","3種類の端末の割合は5年間で変化していない。","その他の割合が最も大きく増加した。"],"a":0,"e":"帯グラフは構成比（割合）の変化を比較するのに適する。スマホは35%→65%で増加、PCは40%→20%で減少、その他は25%→15%で減少。中心的な端末がPCからスマホへ移ったことが読み取れる。実数ではなく割合を表している点に注意。"},{"id":"g14","f":"graph","t":"レーダーチャートの読み取り","d":2,"q":"次のレーダーチャートは、ある生徒の5教科の得点（各100点満点）を表している。最も得点が高い教科と低い教科の組合せとして正しいものを選べ。","chart":"<svg viewBox=\"0 0 320 300\" xmlns=\"http://www.w3.org/2000/svg\"><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"160\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">5教科の得点（レーダーチャート）</text><polygon points=\"160.0,128.3 182.6,144.7 174.0,171.2 146.0,171.2 137.4,144.7\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><polygon points=\"160.0,104.5 205.2,137.3 187.9,190.4 132.1,190.4 114.8,137.3\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><polygon points=\"160.0,80.8 227.8,130.0 201.9,209.6 118.1,209.6 92.2,130.0\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><polygon points=\"160.0,57.0 250.4,122.6 215.8,228.9 104.2,228.9 69.6,122.6\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"160\" y1=\"152\" x2=\"160.0\" y2=\"57.0\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"160\" y1=\"152\" x2=\"250.4\" y2=\"122.6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"160\" y1=\"152\" x2=\"215.8\" y2=\"228.9\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"160\" y1=\"152\" x2=\"104.2\" y2=\"228.9\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"160\" y1=\"152\" x2=\"69.6\" y2=\"122.6\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><polygon points=\"160.0,66.5 227.8,130.0 193.5,198.1 129.3,194.3 96.8,131.5\" fill=\"#93c5fd\" fill-opacity=\"0.5\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"160.0\" cy=\"66.5\" r=\"3.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"160\" y=\"32\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">国語 90</text><circle cx=\"227.8\" cy=\"130.0\" r=\"3.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"281\" y=\"116\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">数学 75</text><circle cx=\"193.5\" cy=\"198.1\" r=\"3.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"236\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">英語 60</text><circle cx=\"129.3\" cy=\"194.3\" r=\"3.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"84\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">理科 55</text><circle cx=\"96.8\" cy=\"131.5\" r=\"3.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"39\" y=\"116\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">社会 70</text></svg>","c":["最も高い：国語、最も低い：理科","最も高い：数学、最も低い：英語","最も高い：英語、最も低い：国語","最も高い：社会、最も低い：数学"],"a":0,"e":"各頂点の値を比較すると、国語90が最高、理科55が最低。レーダーチャートは複数の項目のバランスを一目で把握するのに適し、外側に大きく張り出している項目ほど値が大きい。"},{"id":"g15","f":"graph","t":"散布図の外れ値","d":2,"q":"次の散布図は、ある商品の「気温」と「1日の売上個数」の関係を表している。全体の傾向から外れている点（外れ値）はおよそどの気温の点か、最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">気温と売上個数</text>\n<line x1=\"50\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"190\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"208\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b7d\">気温（℃）</text>\n<circle cx=\"80\" cy=\"160\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"80\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">10</text>\n<circle cx=\"120\" cy=\"150\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"120\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">15</text>\n<circle cx=\"160\" cy=\"130\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"160\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">20</text>\n<circle cx=\"200\" cy=\"70\" r=\"5.5\" fill=\"#dc2626\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">25</text>\n<circle cx=\"240\" cy=\"95\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"240\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">30</text>\n<circle cx=\"280\" cy=\"80\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"280\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">33</text>\n<circle cx=\"310\" cy=\"65\" r=\"4.5\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"310\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">35</text>\n</svg>","c":["25℃の点（他の点が描く右上がりの傾向に対し、売上が急に多い）","10℃の点","35℃の点","他から大きく離れた外れ値は1つも存在しないことが読み取れる。"],"a":0,"e":"全体は右上がり（気温が高いほど売上が多い）の傾向だが、25℃の赤い点だけが周囲の傾向から大きく上に離れており外れ値と考えられる。特売やイベントなど特別な要因があった可能性があり、原因を確認して扱いを判断する。"},{"id":"g16","f":"graph","t":"ヒストグラムの分布の形","d":3,"q":"次の2つのヒストグラムは、A組とB組の同じテストの得点分布を表している。2つの分布の比較として最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 420 200\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"105\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">A組</text>\n<line x1=\"20\" y1=\"170\" x2=\"200\" y2=\"170\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<rect x=\"30\" y=\"150\" width=\"28\" height=\"20\" fill=\"#2563eb\"/>\n<rect x=\"62\" y=\"120\" width=\"28\" height=\"50\" fill=\"#2563eb\"/>\n<rect x=\"94\" y=\"95\" width=\"28\" height=\"75\" fill=\"#2563eb\"/>\n<rect x=\"126\" y=\"120\" width=\"28\" height=\"50\" fill=\"#2563eb\"/>\n<rect x=\"158\" y=\"150\" width=\"28\" height=\"20\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"315\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">B組</text>\n<line x1=\"230\" y1=\"170\" x2=\"410\" y2=\"170\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<rect x=\"240\" y=\"100\" width=\"28\" height=\"70\" fill=\"#f97316\"/>\n<rect x=\"272\" y=\"110\" width=\"28\" height=\"60\" fill=\"#f97316\"/>\n<rect x=\"304\" y=\"130\" width=\"28\" height=\"40\" fill=\"#f97316\"/>\n<rect x=\"336\" y=\"140\" width=\"28\" height=\"30\" fill=\"#f97316\"/>\n<rect x=\"368\" y=\"150\" width=\"28\" height=\"20\" fill=\"#f97316\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"30\" y=\"188\" font-size=\"9\">低</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"180\" y=\"188\" font-size=\"9\">高</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"240\" y=\"188\" font-size=\"9\">低</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"390\" y=\"188\" font-size=\"9\">高</text>\n</svg>","c":["A組は中央付近に山がある左右対称に近い分布、B組は低い得点側に偏った（右に裾を引く）分布である。","A組もB組も、まったく同じ形の分布である。","A組の分布は低い得点側に偏っており、B組の分布はほぼ左右対称の山型である、という逆の関係が読み取れる。","どちらの分布も、山が2つある分布である。"],"a":0,"e":"A組は中央の階級が最も高く左右対称に近い分布（山型）。B組は低い得点側の階級ほど度数が高く、高得点側に裾を引く非対称な分布。ヒストグラムの形（対称性・偏り・山の数）を読み取ることで、集団の特徴を捉えられる。"},{"id":"g17","f":"graph","t":"折れ線グラフの傾向","d":2,"q":"次の折れ線グラフは、あるWebサイトの1週間の1日あたりアクセス数の推移を表している。この期間の傾向の説明として最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">1日あたりアクセス数の推移</text>\n<line x1=\"40\" y1=\"185\" x2=\"380\" y2=\"185\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<line x1=\"40\" y1=\"40\" x2=\"40\" y2=\"185\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<polyline points=\"60,150 105,140 150,155 195,90 240,100 285,60 330,55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/>\n<circle cx=\"60\" cy=\"150\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"105\" cy=\"140\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"150\" cy=\"155\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"195\" cy=\"90\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"240\" cy=\"100\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"285\" cy=\"60\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"330\" cy=\"55\" r=\"3.5\" fill=\"#2563eb\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"60\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">月</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"105\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">火</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"150\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">水</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"195\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">木</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"240\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">金</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"285\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">土</text><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"330\" y=\"200\" text-anchor=\"middle\" font-size=\"10\">日</text>\n</svg>","c":["日々の増減はあるものの、週の後半（木曜以降）にかけて全体としてアクセス数が増加する傾向が見られる。","1週間を通してアクセス数はほぼ一定の水準を保ち、曜日による変化はまったく見られない。平日も休日も同じである。","週の前半が最も多く、後半にかけて一貫して減少している。","週末（土日）のアクセス数が週の中で最も少ない。"],"a":0,"e":"グラフの縦位置が高いほどアクセス数が多い（縦軸は上ほど大）。前半は上下しつつ、木曜以降は高い水準が続いており、週後半にかけて増加する傾向が読み取れる。個々の日の変動と全体の傾向を区別して読むことが重要。"},{"id":"g18","f":"graph","t":"2つのクロス集計表の比較","d":3,"q":"次の表は、あるイベントの参加者について、性別ごとの「満足」「不満」の人数を集計したものである。満足した人の割合が高いのはどちらの性別か、正しいものを選べ。","chart":"<table>\n<tr><th></th><th>満足</th><th>不満</th><th>計</th></tr>\n<tr><th>男性</th><td>36</td><td>24</td><td>60</td></tr>\n<tr><th>女性</th><td>63</td><td>27</td><td>90</td></tr>\n</table>","c":["女性（70%で、男性の60%より高い）","男性（60%で、女性の70%より高い）","男性（満足者数が女性より多いため）","どちらも同じ割合である"],"a":0,"e":"満足の割合は、男性36÷60=60%、女性63÷90=70%。女性の方が満足の割合が高い。満足した人数だけを見ると女性63人＞男性36人だが、人数（実数）ではなく各性別内での割合で比較することがポイント。"},{"id":"g19","f":"graph","t":"箱ひげ図とヒストグラムの対応","d":3,"q":"次の箱ひげ図は、あるデータの分布を表しており、中央値が箱の中で左寄り（第1四分位数の近く）に位置している。このデータのヒストグラムの形として最も適当なものを選べ。","chart":"<svg viewBox=\"0 0 380 130\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"60\" y1=\"70\" x2=\"60\" y2=\"70\"/>\n<line x1=\"60\" y1=\"58\" x2=\"60\" y2=\"82\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"60\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<rect x=\"120\" y=\"58\" width=\"140\" height=\"24\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/>\n<line x1=\"145\" y1=\"58\" x2=\"145\" y2=\"82\" stroke=\"#2563eb\" stroke-width=\"2.5\"/>\n<line x1=\"260\" y1=\"70\" x2=\"340\" y2=\"70\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<line x1=\"340\" y1=\"58\" x2=\"340\" y2=\"82\" stroke=\"#1e2a3a\" stroke-width=\"1.5\"/>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"145\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2563eb\">中央値</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1e2a3a\">箱ひげ図</text>\n</svg>","c":["小さい値の側にデータが集中し、大きい値の側に長く裾を引く（右に裾を引く）分布。","大きい値の側にデータの山が集中し、小さい値の側に向かって長く裾を引いている分布。","左右対称の山型の分布。","すべての値が同じ度数の一様な分布。"],"a":0,"e":"中央値が箱の左寄り（小さい値側）にあり、右のひげが長いことは、データが小さい値の側に集中し、大きい値の側に少数の大きな値が散らばっている（右に裾を引く）ことを意味する。箱ひげ図の中央値の位置とひげの長さから分布の偏りを推測できる。"},{"id":"g20","f":"graph","t":"複数系列の棒グラフと割合","d":3,"q":"次のグラフは、3つの部活動A・B・Cの部員数を学年別に表している。1年生の部員数が部員全体に占める割合が最も高い部活動として正しいものを選べ。","chart":"<svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\">\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1e2a3a\">部活動別・学年別の部員数（人）</text>\n<rect x=\"250\" y=\"24\" width=\"11\" height=\"11\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"265\" y=\"33\" font-size=\"10\">1年</text>\n<rect x=\"295\" y=\"24\" width=\"11\" height=\"11\" fill=\"#60a5fa\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"310\" y=\"33\" font-size=\"10\">2年</text>\n<rect x=\"340\" y=\"24\" width=\"11\" height=\"11\" fill=\"#bfdbfe\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"355\" y=\"33\" font-size=\"10\">3年</text>\n<line x1=\"40\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n<rect x=\"70\" y=\"140\" width=\"30\" height=\"60\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"134\" text-anchor=\"middle\" font-size=\"10\">12</text>\n<rect x=\"70\" y=\"100\" width=\"30\" height=\"40\" fill=\"#60a5fa\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"123\" text-anchor=\"middle\" font-size=\"10\">8</text>\n<rect x=\"70\" y=\"60\" width=\"30\" height=\"40\" fill=\"#bfdbfe\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"83\" text-anchor=\"middle\" font-size=\"10\">8</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"85\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">A部</text>\n<rect x=\"185\" y=\"150\" width=\"30\" height=\"50\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"144\" text-anchor=\"middle\" font-size=\"10\">10</text>\n<rect x=\"185\" y=\"125\" width=\"30\" height=\"25\" fill=\"#60a5fa\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"143\" text-anchor=\"middle\" font-size=\"10\">5</text>\n<rect x=\"185\" y=\"100\" width=\"30\" height=\"25\" fill=\"#bfdbfe\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"118\" text-anchor=\"middle\" font-size=\"10\">5</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"200\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">B部</text>\n<rect x=\"300\" y=\"160\" width=\"30\" height=\"40\" fill=\"#2563eb\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"315\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">8</text>\n<rect x=\"300\" y=\"100\" width=\"30\" height=\"60\" fill=\"#60a5fa\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"315\" y=\"133\" text-anchor=\"middle\" font-size=\"10\">12</text>\n<rect x=\"300\" y=\"40\" width=\"30\" height=\"60\" fill=\"#bfdbfe\"/><text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"315\" y=\"73\" text-anchor=\"middle\" font-size=\"10\">12</text>\n<text font-family=\"Hiragino Sans,Yu Gothic UI,Meiryo,sans-serif\" x=\"315\" y=\"215\" text-anchor=\"middle\" font-size=\"11\">C部</text>\n</svg>","c":["B部（1年10人／全体20人＝50%）","A部（1年12人／全体28人）","C部（1年8人／全体32人）","3つとも同じ割合である"],"a":0,"e":"各部の1年生の割合を計算すると、A部12÷28≒43%、B部10÷20=50%、C部8÷32=25%。最も高いのはB部の50%。積み上げ棒グラフでは各学年の値を足して全体を求め、割合を計算する。1年生の人数だけ（A部12人が最多）で判断しない点が要注意。"},{"id":"psg1-1","f":"passage","t":"総合問題：お化け屋敷の待ち時間予測","d":2,"setId":"psg1","passageTitle":"文化祭のお化け屋敷 待ち時間シミュレーション","passage":"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、当日の来場者の待ち時間を減らす方法を検討している。\n\nA：去年は行列が長くなりすぎて、途中で帰ってしまう人もいたらしいよ。\nB：入場の間隔を変えたらどうなるか、実際に試すわけにはいかないから、シミュレーションで確かめてみよう。\nA：お客さんの来るタイミングはばらばらだから、乱数を使えばいいね。\n\n2人は次のようにモデル化した。時間を1分単位で区切り、各1分間に確率0.4で1人のお客が行列に加わる。また、お化け屋敷には5分に1人の割合で入場でき、入場すると行列から1人減る。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。開場から60分間の行列の変化を、次のプログラムで調べることにした。","q":"このシミュレーションのように、偶然の要素（お客の到着間隔のばらつき）を乱数によって再現するモデルを何というか。","c":["確率的モデル","確定的モデル","物理モデル","静的モデル"],"a":0,"e":"偶然の要素を乱数で表現するモデルは確率的モデル。対して、式や規則だけで結果が一意に決まるモデルは確定的モデルという。待ち行列や到着間隔のようにばらつきがある現象は確率的モデルで扱うのが適切。","code":"(01) gyoretu = 0\n(02) jikan を 1 から 60 まで 1 ずつ増やしながら繰り返す：\n(03) 　　もし 乱数() < 0.4 ならば：\n(04) 　　　　gyoretu = gyoretu + 1\n(05) 　　もし jikan % 5 == 0 かつ gyoretu > 0 ならば：\n(06) 　　　　gyoretu = gyoretu - 1\n(07) 表示する(\"60分後の行列：\", gyoretu, \"人\")"},{"id":"psg1-2","f":"passage","t":"総合問題：お化け屋敷の待ち時間予測","d":2,"setId":"psg1","passageTitle":"文化祭のお化け屋敷 待ち時間シミュレーション","passage":"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、当日の来場者の待ち時間を減らす方法を検討している。\n\nA：去年は行列が長くなりすぎて、途中で帰ってしまう人もいたらしいよ。\nB：入場の間隔を変えたらどうなるか、実際に試すわけにはいかないから、シミュレーションで確かめてみよう。\nA：お客さんの来るタイミングはばらばらだから、乱数を使えばいいね。\n\n2人は次のようにモデル化した。時間を1分単位で区切り、各1分間に確率0.4で1人のお客が行列に加わる。また、お化け屋敷には5分に1人の割合で入場でき、入場すると行列から1人減る。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。開場から60分間の行列の変化を、次のプログラムで調べることにした。","q":"2人は次に、お客の到着間隔（分）を「整数(乱数()*5)+1」という式で表すことにした。この式が返す値の範囲として正しいものを選べ。","c":["1以上5以下の整数","0以上5以下の整数","1以上6以下の整数","0以上4以下の整数"],"a":0,"e":"乱数()は0以上1未満なので、乱数()*5は0以上5未満。整数()で切り捨てると0〜4の整数になり、+1して1〜5の整数となる。サイコロの目のシミュレーション（1〜6を作る式）と同じ考え方。","code":"(01) gyoretu = 0\n(02) jikan を 1 から 60 まで 1 ずつ増やしながら繰り返す：\n(03) 　　もし 乱数() < 0.4 ならば：\n(04) 　　　　gyoretu = gyoretu + 1\n(05) 　　もし jikan % 5 == 0 かつ gyoretu > 0 ならば：\n(06) 　　　　gyoretu = gyoretu - 1\n(07) 表示する(\"60分後の行列：\", gyoretu, \"人\")"},{"id":"psg1-3","f":"passage","t":"総合問題：お化け屋敷の待ち時間予測","d":3,"setId":"psg1","passageTitle":"文化祭のお化け屋敷 待ち時間シミュレーション","passage":"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、当日の来場者の待ち時間を減らす方法を検討している。\n\nA：去年は行列が長くなりすぎて、途中で帰ってしまう人もいたらしいよ。\nB：入場の間隔を変えたらどうなるか、実際に試すわけにはいかないから、シミュレーションで確かめてみよう。\nA：お客さんの来るタイミングはばらばらだから、乱数を使えばいいね。\n\n2人は次のようにモデル化した。時間を1分単位で区切り、各1分間に確率0.4で1人のお客が行列に加わる。また、お化け屋敷には5分に1人の割合で入場でき、入場すると行列から1人減る。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。開場から60分間の行列の変化を、次のプログラムで調べることにした。","q":"シミュレーションを1回だけでなく、条件を変えずに1000回繰り返して待ち時間の平均を求めた場合の利点として最も適当なものを選べ。","c":["乱数を使った試行のばらつきの影響が小さくなり、より安定した（信頼できる）平均的な傾向を推定できる。","1000回繰り返せば、待ち時間は毎回必ず完全に同じ値になる。","繰り返す回数を増やすほど、実際の待ち時間そのものが短くなる。","乱数を使っている以上、繰り返し回数をいくら増やしても、結果の信頼性は1回だけの試行とまったく変わらない。"],"a":0,"e":"乱数を使うシミュレーションは1回ごとの結果にばらつきがあるが、試行回数を増やすほど平均的な傾向（大数の法則）に近づき、結果の信頼性が高まる。回数を増やしても現実の待ち時間そのものが変化するわけではない点に注意。","code":"(01) gyoretu = 0\n(02) jikan を 1 から 60 まで 1 ずつ増やしながら繰り返す：\n(03) 　　もし 乱数() < 0.4 ならば：\n(04) 　　　　gyoretu = gyoretu + 1\n(05) 　　もし jikan % 5 == 0 かつ gyoretu > 0 ならば：\n(06) 　　　　gyoretu = gyoretu - 1\n(07) 表示する(\"60分後の行列：\", gyoretu, \"人\")"},{"id":"psg1-4","f":"passage","t":"総合問題：お化け屋敷の待ち時間予測","d":2,"setId":"psg1","passageTitle":"総合問題：お化け屋敷の待ち時間予測","passage":"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、当日の来場者の待ち時間を減らす方法を検討している。\n\nA：去年は行列が長くなりすぎて、途中で帰ってしまう人もいたらしいよ。\nB：入場の間隔を変えたらどうなるか、実際に試すわけにはいかないから、シミュレーションで確かめてみよう。\nA：お客さんの来るタイミングはばらばらだから、乱数を使えばいいね。\n\n2人は次のようにモデル化した。時間を1分単位で区切り、各1分間に確率0.4で1人のお客が行列に加わる。また、お化け屋敷には5分に1人の割合で入場でき、入場すると行列から1人減る。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。開場から60分間の行列の変化を、次のプログラムで調べることにした。","code":"(01) gyoretu = 0\n(02) jikan を 1 から 60 まで 1 ずつ増やしながら繰り返す：\n(03) 　　もし 乱数() < 0.4 ならば：\n(04) 　　　　gyoretu = gyoretu + 1\n(05) 　　もし jikan % 5 == 0 かつ gyoretu > 0 ならば：\n(06) 　　　　gyoretu = gyoretu - 1\n(07) 表示する(\"60分後の行列：\", gyoretu, \"人\")","q":"このモデルで、60分間に行列へ加わる人数の期待値（平均的な人数）はおよそ何人か。","c":["約24人","約12人","約40人","約60人"],"a":0,"e":"各1分間に確率0.4で1人加わるので、期待値は 0.4×60 = 24人。一方、退場（入場処理）は5分に1人で60分間に12人。平均的には行列が 24−12 = 12人ほど伸びていく計算になり、去年行列が長くなった理由がモデルからも説明できる。"},{"id":"psg1-5","f":"passage","t":"総合問題：お化け屋敷の待ち時間予測","d":3,"setId":"psg1","passageTitle":"総合問題：お化け屋敷の待ち時間予測","passage":"文化祭でお化け屋敷の出し物を担当する実行委員のAさんとBさんは、当日の来場者の待ち時間を減らす方法を検討している。\n\nA：去年は行列が長くなりすぎて、途中で帰ってしまう人もいたらしいよ。\nB：入場の間隔を変えたらどうなるか、実際に試すわけにはいかないから、シミュレーションで確かめてみよう。\nA：お客さんの来るタイミングはばらばらだから、乱数を使えばいいね。\n\n2人は次のようにモデル化した。時間を1分単位で区切り、各1分間に確率0.4で1人のお客が行列に加わる。また、お化け屋敷には5分に1人の割合で入場でき、入場すると行列から1人減る。「乱数()」は0以上1未満の小数をランダムに返す関数、「整数(x)」はxの小数点以下を切り捨てる関数である。開場から60分間の行列の変化を、次のプログラムで調べることにした。","code":"(01) gyoretu = 0\n(02) jikan を 1 から 60 まで 1 ずつ増やしながら繰り返す：\n(03) 　　もし 乱数() < 0.4 ならば：\n(04) 　　　　gyoretu = gyoretu + 1\n(05) 　　もし jikan % 5 == 0 かつ gyoretu > 0 ならば：\n(06) 　　　　gyoretu = gyoretu - 1\n(07) 表示する(\"60分後の行列：\", gyoretu, \"人\")","q":"Bさんは(05)の条件を「jikan % 3 == 0」に変えて、入場間隔を3分に1人へ短縮する案を試すことにした。この変更の効果の説明として最も適当なものを選べ。","c":["60分間の退場は約20人となり到着の期待値24人になお届かないため、行列が伸びる傾向は残るが、伸びる速さは大きく緩和される。","退場の処理数が到着の期待値を大きく上回るようになるため、行列は開始直後から必ず0人のままとなり、待ちは一度も発生しなくなる。","入場間隔を変えてもプログラム上の到着人数が自動的に増えるので、行列の長さにはまったく変化が生じない。","この変更を行うとプログラムが無限ループに陥ってしまい、シミュレーション自体が終了しなくなる。"],"a":0,"e":"3分間隔なら60分で約20人が入場できる。到着の期待値24人には届かないので平均的には行列は伸び続けるが、伸びは毎時約12人から約4人へと大きく緩和される。パラメータを変えて効果を比較検討する、シミュレーションの本来の使い方を問う問題。"},{"id":"psg2-1","f":"passage","t":"総合問題：リサイクル量のデータ分析","d":2,"setId":"psg2","passageTitle":"クラス対抗ペットボトル回収コンテストのデータ分析","passage":"環境委員のCさんとDさんは、校内のペットボトル回収を増やす取り組みを検討している。\n\nC：先月から、回収を呼びかけるポスターをクラスごとに掲示してもらっているよね。\nD：ポスターの掲示時間が長いクラスほど、回収本数も多い気がする。データで確かめてみよう。\n\n2人は7つのクラスについて、1週間あたりのポスター掲示時間（時間）と回収本数（本）を調べた。回収本数は少ない順に並べると 9, 12, 15, 18, 22, 25, 31 であった。散布図を作って相関係数を計算すると 0.82 となり、また回収本数の分布を箱ひげ図にもまとめた。Dさんは「掲示時間を増やせば回収本数も増えるはずだ」と提案しようとしている。","q":"「ポスター掲示時間」と「1人あたりの回収本数」の相関係数が0.82であったことの解釈として最も適当なものを選べ。","c":["強い正の相関があり、ポスター掲示時間が長いクラスほど回収本数が多い傾向が見られるが、この結果だけでポスター掲示が回収本数増加の直接の原因であるとは断定できない。","相関係数が1ではないため、両者にはまったく関係がないといえる。","ポスター掲示時間を増やせば、回収本数が増えることが実験的に証明された。","相関係数が0.82とプラスの値なので、ポスター掲示時間と回収本数はきれいな反比例の関係にあることが分かる。プラスの相関係数は反比例を意味するからである。"],"a":0,"e":"0.82は1に近く強い正の相関を示すが、相関は因果を意味しない。クラスの環境意識の高さなど別の要因が両方に影響している可能性（疑似相関）も排除できないため、断定は避けるべき。"},{"id":"psg2-2","f":"passage","t":"総合問題：リサイクル量のデータ分析","d":2,"setId":"psg2","passageTitle":"クラス対抗ペットボトル回収コンテストのデータ分析","passage":"環境委員のCさんとDさんは、校内のペットボトル回収を増やす取り組みを検討している。\n\nC：先月から、回収を呼びかけるポスターをクラスごとに掲示してもらっているよね。\nD：ポスターの掲示時間が長いクラスほど、回収本数も多い気がする。データで確かめてみよう。\n\n2人は7つのクラスについて、1週間あたりのポスター掲示時間（時間）と回収本数（本）を調べた。回収本数は少ない順に並べると 9, 12, 15, 18, 22, 25, 31 であった。散布図を作って相関係数を計算すると 0.82 となり、また回収本数の分布を箱ひげ図にもまとめた。Dさんは「掲示時間を増やせば回収本数も増えるはずだ」と提案しようとしている。","q":"2組の箱ひげ図で「ひげと箱の長さが明らかに長い」ことから読み取れることとして最も適当なものを選べ。","c":["2組は生徒間で回収本数のばらつきが大きく、一部の生徒が非常に多く（または少なく）回収した可能性がある。","2組は全員がほぼ同じ本数を回収した。","2組の中央値は他のクラスより大幅に高い。","箱ひげ図は代表値を示す図なので、そこからデータのばらつきの大きさを読み取ることはできない。中央値しか分からない。"],"a":0,"e":"箱ひげ図の箱（四分位範囲）とひげ（最小値〜最大値の範囲）が長いほど、データの散らばりが大きいことを示す。中央値が同程度でも散らばりが違えば、クラス内の取り組みに差がある可能性が読み取れる。"},{"id":"psg2-3","f":"passage","t":"総合問題：リサイクル量のデータ分析","d":3,"setId":"psg2","passageTitle":"クラス対抗ペットボトル回収コンテストのデータ分析","passage":"環境委員のCさんとDさんは、校内のペットボトル回収を増やす取り組みを検討している。\n\nC：先月から、回収を呼びかけるポスターをクラスごとに掲示してもらっているよね。\nD：ポスターの掲示時間が長いクラスほど、回収本数も多い気がする。データで確かめてみよう。\n\n2人は7つのクラスについて、1週間あたりのポスター掲示時間（時間）と回収本数（本）を調べた。回収本数は少ない順に並べると 9, 12, 15, 18, 22, 25, 31 であった。散布図を作って相関係数を計算すると 0.82 となり、また回収本数の分布を箱ひげ図にもまとめた。Dさんは「掲示時間を増やせば回収本数も増えるはずだ」と提案しようとしている。","q":"この分析結果をもとに来年のコンテストで「全クラスにポスター掲示の時間を長く取るよう義務付ける」という施策を決定した。この判断に対する指摘として最も適当なものを選べ。","c":["相関関係から直接因果関係を断定しており、ポスター掲示以外の要因（呼びかけの内容や委員の人数など）の影響を検証しないまま施策化するのは早計である。","相関係数が0.82もの高い値を示しているので、この施策決定は完全に正しく、今後再検討する余地はまったくない。数値が高ければ検証は不要だからである。","散布図と箱ひげ図の両方を使っているので、分析手法に問題はまったくない。","データに基づいているので、この施策に反対する意見は科学的に誤りである。"],"a":0,"e":"相関が高くても因果関係とは限らない（疑似相関の可能性）。データに基づく判断は重要だが、他の要因の検証や小規模な試行を経てから本格導入するなど、慎重な検証プロセスが望ましい。データ活用における「相関と因果の混同」への注意は頻出の論点。"},{"id":"psg2-4","f":"passage","t":"総合問題：リサイクル量のデータ分析","d":2,"setId":"psg2","passageTitle":"総合問題：リサイクル量のデータ分析","passage":"環境委員のCさんとDさんは、校内のペットボトル回収を増やす取り組みを検討している。\n\nC：先月から、回収を呼びかけるポスターをクラスごとに掲示してもらっているよね。\nD：ポスターの掲示時間が長いクラスほど、回収本数も多い気がする。データで確かめてみよう。\n\n2人は7つのクラスについて、1週間あたりのポスター掲示時間（時間）と回収本数（本）を調べた。回収本数は少ない順に並べると 9, 12, 15, 18, 22, 25, 31 であった。散布図を作って相関係数を計算すると 0.82 となり、また回収本数の分布を箱ひげ図にもまとめた。Dさんは「掲示時間を増やせば回収本数も増えるはずだ」と提案しようとしている。","q":"7クラスの回収本数 9, 12, 15, 18, 22, 25, 31（本）の中央値として正しいものを選べ。","c":["18本","15本","18.9本","22本"],"a":0,"e":"データは既に小さい順に並んでおり、7個の中央（4番目）の値は18。平均値は132÷7≒18.9で中央値とは異なる値になる。データの個数が奇数のときの中央値は「真ん中の1つ」、偶数のときは「中央2つの平均」。"},{"id":"psg2-5","f":"passage","t":"総合問題：リサイクル量のデータ分析","d":3,"setId":"psg2","passageTitle":"総合問題：リサイクル量のデータ分析","passage":"環境委員のCさんとDさんは、校内のペットボトル回収を増やす取り組みを検討している。\n\nC：先月から、回収を呼びかけるポスターをクラスごとに掲示してもらっているよね。\nD：ポスターの掲示時間が長いクラスほど、回収本数も多い気がする。データで確かめてみよう。\n\n2人は7つのクラスについて、1週間あたりのポスター掲示時間（時間）と回収本数（本）を調べた。回収本数は少ない順に並べると 9, 12, 15, 18, 22, 25, 31 であった。散布図を作って相関係数を計算すると 0.82 となり、また回収本数の分布を箱ひげ図にもまとめた。Dさんは「掲示時間を増やせば回収本数も増えるはずだ」と提案しようとしている。","q":"Dさんの提案を提出する前に行うべき検討として最も適当なものを選べ。","c":["クラスの人数や教室の場所など掲示時間以外の要因の影響がないかを確かめ、可能なら条件をそろえた比較や追加の調査を行う。","相関係数0.82は十分に高い値なので、追加の検討は一切行わず、直ちに全クラスの掲示時間を2倍にする提案を提出する。","相関がある以上は因果関係も証明されているので、掲示時間が回収本数の唯一の原因であると報告書に明記する。","7クラスでは足りないので、仮説に合う結果が出たクラスのデータだけを選び直して相関係数を計算し直す。"],"a":0,"e":"相関は因果の証明ではない。人数の多いクラスほど掲示にも回収にも熱心、といった第3の要因がありうる。条件をそろえた比較（例：掲示時間だけ変えて他をそろえる）や追加調査で因果への確からしさを高めるのが適切。仮説に合うデータだけを選ぶのは分析のゆがみ（チェリーピッキング）。"},{"id":"psg3-1","f":"passage","t":"総合問題：SNSでの情報拡散とその対応","d":1,"setId":"psg3","passageTitle":"体育祭の練習中の動画がSNSで拡散された","passage":"体育祭の応援団の練習の様子を友人が動画で撮影し、悪ふざけの場面を含んだままSNSに投稿した。動画には練習に参加していない他クラスの生徒も背景に映り込んでおり、投稿から数時間で学年内に拡散し、一部から心ない批判のコメントが付き始めた。生徒会執行部のCさんとDさんは、この状況にどう対応すべきか話し合っている。","q":"この投稿によって生じている問題点として、最も適当なものを選べ。","c":["投稿には撮影された生徒本人だけでなく、練習に無関係な生徒の肖像権や、本人の同意のない公開によるプライバシー侵害の問題が含まれている。","動画は誰でも見られるSNSに投稿された時点で著作権が消滅し、誰でも自由に使ってよい著作物になる。投稿は権利放棄と同じだからである。","背景に映り込んだだけの生徒には、何の権利も関係しない。","投稿者が友人であれば、肖像権の侵害は成立しない。"],"a":0,"e":"本人の許可なく容姿を撮影・公開することは肖像権の侵害になりうる。撮影者と被写体が友人であることは権利侵害の有無に関係しない。背景に映り込んだだけの人にも同様にプライバシー・肖像権が及ぶ。"},{"id":"psg3-2","f":"passage","t":"総合問題：SNSでの情報拡散とその対応","d":2,"setId":"psg3","passageTitle":"体育祭の練習中の動画がSNSで拡散された","passage":"体育祭の応援団の練習の様子を友人が動画で撮影し、悪ふざけの場面を含んだままSNSに投稿した。動画には練習に参加していない他クラスの生徒も背景に映り込んでおり、投稿から数時間で学年内に拡散し、一部から心ない批判のコメントが付き始めた。生徒会執行部のCさんとDさんは、この状況にどう対応すべきか話し合っている。","q":"CさんとDさんが最初に取るべき対応として最も適当なものを選べ。","c":["投稿のスクリーンショットなど証拠を保存した上で、担任や生徒指導の教員に相談し、投稿者本人に任意での削除を依頼する。","炎上をこれ以上広げないよう、何もせず自然に収まるのを待つ。","批判を続けているアカウントに対して、生徒会の公式アカウントから反論を投稿し、正面から応戦する。強く反論すれば批判は収まる。","動画を見た生徒全員に、口止めをして回る。"],"a":0,"e":"対応の基本は、証拠保存→信頼できる大人（教員等）への相談→当事者への削除依頼、という順序。反論の応戦は炎上を拡大させ、口止めは事態を余計にこじれさせる。放置も被害が拡大するリスクがある。"},{"id":"psg3-3","f":"passage","t":"総合問題：SNSでの情報拡散とその対応","d":2,"setId":"psg3","passageTitle":"体育祭の練習中の動画がSNSで拡散された","passage":"体育祭の応援団の練習の様子を友人が動画で撮影し、悪ふざけの場面を含んだままSNSに投稿した。動画には練習に参加していない他クラスの生徒も背景に映り込んでおり、投稿から数時間で学年内に拡散し、一部から心ない批判のコメントが付き始めた。生徒会執行部のCさんとDさんは、この状況にどう対応すべきか話し合っている。","q":"今後同様のトラブルを防ぐために生徒会が行う啓発として、最も適当なものを選べ。","c":["投稿前に「映っている人全員の同意を得たか」「公開範囲は適切か」を確認する習慣づけを呼びかける。","動画や写真は自分自身が撮影したものでありさえすれば、写っている誰の同意もなく公開してよいと周知する。","炎上に対しては投稿者個人の責任なので、生徒会は関与しないと周知する。","SNSでの拡散は止められないので、対策をとる意味はないと伝える。"],"a":0,"e":"再発防止には「撮影者の権利」だけでなく「写っている人全員の同意」「公開範囲」の事前確認を習慣づけることが有効。トラブルは個人の問題であると同時に、学校全体の情報モラル教育の課題でもある。"},{"id":"psg4-1","f":"passage","t":"総合問題：ポスターのデータ量と圧縮","d":2,"setId":"psg4","passageTitle":"文化祭の広報用ポスター画像の制作","passage":"広報係のEさんは、文化祭の宣伝用にA1サイズの大きな出力用ポスターと、SNS投稿用の画像を1つの元データから作ろうとしている。元データは横4000ピクセル×縦3000ピクセル、24ビットフルカラーで作成した非圧縮画像であり、そのままではファイルサイズが大きく、SNSには適さないことが分かった。","q":"この非圧縮画像のデータ量として最も近いものを選べ。","c":["約 34.3 MB","約 12 MB","約 96 MB","約 3.4 MB"],"a":0,"e":"画素数は4000×3000=12,000,000画素。24ビット＝3バイトなので、12,000,000×3=36,000,000バイト。1MB=1,048,576バイトとして計算すると約34.3MBとなり、選択肢のうち最も近い。"},{"id":"psg4-2","f":"passage","t":"総合問題：ポスターのデータ量と圧縮","d":2,"setId":"psg4","passageTitle":"文化祭の広報用ポスター画像の制作","passage":"広報係のEさんは、文化祭の宣伝用にA1サイズの大きな出力用ポスターと、SNS投稿用の画像を1つの元データから作ろうとしている。元データは横4000ピクセル×縦3000ピクセル、24ビットフルカラーで作成した非圧縮画像であり、そのままではファイルサイズが大きく、SNSには適さないことが分かった。","q":"SNS投稿用に、この画像をJPEG形式で圧縮することにした。JPEGを選ぶ理由として最も適当なものを選べ。","c":["写真のような自然画像に対して高い圧縮率が得られる非可逆圧縮形式であり、多少の画質低下と引き換えにファイルサイズを大幅に小さくできるから。","JPEGは完全な可逆圧縮方式なので、何度編集して保存し直しても画質がまったく劣化しないから。圧縮方式の選択に注意は不要である。","JPEGは文字情報を圧縮するのに特化した形式だから。","JPEGを使うと、色の階調が実際より増えるから。"],"a":0,"e":"JPEGは人間の目に感知されにくい情報を削る非可逆圧縮形式で、写真など自然画像の圧縮率を高めるのに適する。ただし保存を繰り返すと画質が徐々に劣化する。文字やロゴなど輪郭がはっきりした画像は可逆圧縮のPNGの方が適する。"},{"id":"psg4-3","f":"passage","t":"総合問題：ポスターのデータ量と圧縮","d":2,"setId":"psg4","passageTitle":"文化祭の広報用ポスター画像の制作","passage":"広報係のEさんは、文化祭の宣伝用にA1サイズの大きな出力用ポスターと、SNS投稿用の画像を1つの元データから作ろうとしている。元データは横4000ピクセル×縦3000ピクセル、24ビットフルカラーで作成した非圧縮画像であり、そのままではファイルサイズが大きく、SNSには適さないことが分かった。","q":"一方、出力用のA1ポスターの元データはできるだけ画質を保ちたい。この場合の画像形式の選び方として最も適当なものを選べ。","c":["印刷時の画質劣化を避けるため、非可逆圧縮を行わない、あるいは可逆圧縮の形式で保存する。","データ量を最優先し、圧縮率の高い非可逆圧縮を強くかけてから印刷用データとして提出する。","印刷用データは解像度を落とすほど、大きなポスターできれいに印刷できる。","出力用と投稿用で画像形式を変える必要はなく、常に同じ設定を使うべきである。"],"a":0,"e":"大きく引き伸ばして印刷するポスターでは画質の劣化が目立ちやすいため、非可逆圧縮を避けるか可逆圧縮を使う。用途（精細な印刷か、手軽な共有か）に応じて解像度や圧縮方式を使い分けることが情報デザインの実践では重要。"},{"id":"psg5-1","f":"passage","t":"総合問題：蔵書検索システムの設計","d":2,"setId":"psg5","passageTitle":"図書委員会の蔵書検索プログラム","passage":"図書委員会のFさんは、蔵書番号の一覧から目的の本を探すプログラムを作ることになった。蔵書は既に番号順に整列されたデータとして管理されている。Fさんは、探索の方法として「先頭から順番に比較する方法」と「範囲を半分ずつに絞り込む方法」のどちらを使うか、先生に相談している。","q":"整列済みの蔵書データを対象にする場合、先生が勧めるべき探索方法として最も適当なものを選べ。","c":["整列済みであることを活かして範囲を半分ずつ絞り込める二分探索を使うと、線形探索より少ない比較回数で済む。","蔵書データが整列されているかどうかにかかわらず、探索は常に線形探索を使うのが最も速い方法である。","二分探索は整列されていないデータに対してのみ有効である。","データが整列されている場合、探索方法によって比較回数に差は出ない。"],"a":0,"e":"二分探索は整列済みデータに対して有効で、データ数が多いほど線形探索との比較回数の差が大きくなる。整列されていないデータには使えないため、まず整列されているかどうかを確認することが前提条件になる。"},{"id":"psg5-2","f":"passage","t":"総合問題：蔵書検索システムの設計","d":3,"setId":"psg5","passageTitle":"図書委員会の蔵書検索プログラム","passage":"図書委員会のFさんは、蔵書番号の一覧から目的の本を探すプログラムを作ることになった。蔵書は既に番号順に整列されたデータとして管理されている。Fさんは、探索の方法として「先頭から順番に比較する方法」と「範囲を半分ずつに絞り込む方法」のどちらを使うか、先生に相談している。","q":"蔵書番号が [12, 25, 38, 41, 56, 67, 79, 90]（添字0〜7）の配列に対して、二分探索で番号67を探す。最初に比較される要素の添字と、探索が終了するまでの比較回数の組合せとして正しいものを選べ。（探索範囲の中央は両端の添字の平均を切り捨てて求めるものとする）","c":["最初の比較：添字3（値41）、比較回数は2回で発見できる。","最初の比較：添字0（値12）、比較回数は8回かかる。","最初の比較：添字7（値90）、比較回数は1回で発見できる。","最初の比較：添字3（値41）、比較回数は4回かかる。"],"a":0,"e":"添字0〜7の中央は(0+7)を2で割って切り捨てた3で、値は41。67＞41なので探索範囲を右半分（添字4〜7）に絞る。次の中央は(4+7)を2で割って切り捨てた5で、値67と一致し発見。比較は添字3→添字5の合計2回で見つかる。データ数8に対しlog₂8=3なので最大でも3回で済み、実際は2回で発見できた。"},{"id":"psg5-3","f":"passage","t":"総合問題：蔵書検索システムの設計","d":2,"setId":"psg5","passageTitle":"図書委員会の蔵書検索プログラム","passage":"図書委員会のFさんは、蔵書番号の一覧から目的の本を探すプログラムを作ることになった。蔵書は既に番号順に整列されたデータとして管理されている。Fさんは、探索の方法として「先頭から順番に比較する方法」と「範囲を半分ずつに絞り込む方法」のどちらを使うか、先生に相談している。","q":"Fさんが「新刊を蔵書リストに追加した直後に、整列された状態を保ったまま二分探索を使いたい」と考えている。このとき注意すべき点として最も適当なものを選べ。","c":["新刊を末尾に追加しただけでは番号順が崩れる可能性があるため、追加後に整列し直すか、正しい位置に挿入する必要がある。","二分探索は配列の整列状態にかかわらず常に正しく動作するので、新しい蔵書を追加する位置を気にする必要はない。","配列に新しいデータを追加すると、自動的に整列された状態が保たれる。","二分探索を使う限り、データの追加や整列の心配は一切不要である。"],"a":0,"e":"二分探索は整列済みであることが前提の手法であり、新しいデータを単純に末尾へ追加すると整列が崩れ、正しく探索できなくなる可能性がある。追加のたびに正しい位置に挿入する、またはまとめて再整列するなどの処理が必要になる。"},{"id":"psg6-1","f":"passage","t":"総合問題：学校紹介動画の配信","d":2,"setId":"psg6","passageTitle":"文化祭の学校紹介動画をネット配信する","passage":"広報班のGさんは、文化祭で流す3分間の学校紹介動画を制作し、卒業生や地域の人にも見てもらえるよう動画共有サイトで公開することにした。動画にはBGMとして市販の楽曲を使い、在校生へのインタビューや校舎の映像を含めている。公開にあたり、Gさんは著作権や個人情報の観点で問題がないか、顧問の先生と確認している。","q":"動画のBGMに市販の楽曲を使うことについての説明として最も適当なものを選べ。","c":["市販楽曲には著作権（および著作隣接権）があり、インターネットでの公開には原則として権利者の許諾（または利用許諾サービスの利用）が必要である。","市販の楽曲であっても、営利目的ではない文化祭の紹介動画に使うだけなら、権利者の許諾はまったく必要ない。非営利なら例外なく自由である。","CDを購入していれば、その楽曲をどんな形で公開しても自由である。","楽曲は数秒だけ使えば、長さにかかわらず必ず著作権の問題は生じない。"],"a":0,"e":"市販楽曲には作詞・作曲者の著作権や、演奏者・レコード会社の著作隣接権がある。ネット上での公開（公衆送信）には原則として
